# ═══════════════════════════════════════════════════════════
# WINDI Landing Page P/M/G — nginx snippet for windi-domain.com
# ═══════════════════════════════════════════════════════════
#
# IMPORTANT: This replaces the root location (/) of windi-domain.com
#
# BEFORE applying:
# 1. Find the current `location / { ... }` block in the windi-domain.com nginx config
# 2. NOTE what it currently proxies/serves (backup this info!)
# 3. REPLACE it with the block below
# 4. All other location blocks (/governance, /static/, /records/) stay UNTOUCHED
#
# PROCEDURE:
#   grep -n "location / " /etc/nginx/sites-enabled/windi-domain*
#   # Note the line numbers of the current location / block
#   # Replace ONLY that block
#
# ═══════════════════════════════════════════════════════════

    # ── LANDING PAGE P/M/G (:8107) ───────────────────────
    # NEW ROOT — Tier selection landing
    location = / {
        proxy_pass http://127.0.0.1:8107/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /index.html {
        proxy_pass http://127.0.0.1:8107/index.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # ── END LANDING PAGE ─────────────────────────────────

    # ── FORENSIC VAULT (:8106) ───────────────────────────
    location /vault/ {
        proxy_pass http://127.0.0.1:8106/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    # ── END FORENSIC VAULT ───────────────────────────────

# ═══════════════════════════════════════════════════════════
# PRESERVE EXISTING (do NOT modify these):
#   location /governance { ... }   → stays as-is
#   location /static/    { ... }   → stays as-is  
#   location /records/   { ... }   → stays as-is
# ═══════════════════════════════════════════════════════════
