# ═══════════════════════════════════════════════════════════════
# WINDI Communiqué Engine — nginx proxy configuration
# Port: 8105
# Add this block to /etc/nginx/sites-enabled/admin.windia4desk.tech
# ═══════════════════════════════════════════════════════════════

    # === Communiqué Engine (Public + API) ===
    location /communique/ {
        proxy_pass http://127.0.0.1:8105/communique/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Communiqué health check (for Sentinel LAW)
    location = /communique/health {
        proxy_pass http://127.0.0.1:8105/health;
        proxy_set_header Host $host;
    }
