<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <!-- =========================================================
       WINDI FORENSIC LEDGER · UI INSERT · S15 (INTEGRITY 100%) v2
       Full-frame insert (not overlay). Title-safe compliant.
       §296-bis: Insert limpo, prova em primazia.
       RECEIPT_ID and HASH are REAL values from Ledger.
       ========================================================= -->
  <title>WINDI Forensic Ledger S15 integrity verified 100 percent insert</title>
  <desc>Full-frame Ledger insert showing INTEGRITAET VERIFIZIERT 100 percent with real receipt and SHA-256 hash.</desc>

  <!-- Background -->
  <rect x="0" y="0" width="1920" height="1080" fill="#0a0f16"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1920" height="64" fill="#0d1420"/>
  <circle cx="45" cy="32" r="7" fill="#ef4444"/>
  <text x="72" y="40" fill="#e5edf5" font-size="26" font-weight="bold">WINDI</text>
  <text x="168" y="40" fill="#9fb3c8" font-size="26">Forensic Ledger</text>

  <!-- Shield icon -->
  <g transform="translate(960,280)">
    <path d="M0,-90 L75,-57 L75,22 C75,75 40,108 0,125 C-40,108 -75,75 -75,22 L-75,-57 Z" fill="none" stroke="#16a34a" stroke-width="6"/>
    <path d="M-32,10 l22,22 l42,-54" stroke="#16a34a" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main headline -->
  <text x="960" y="480" text-anchor="middle" fill="#ffffff" font-size="56" font-weight="bold">INTEGRITÄT VERIFIZIERT</text>
  <text x="960" y="580" text-anchor="middle" fill="#16a34a" font-size="96" font-weight="bold">100%</text>
  <text x="960" y="640" text-anchor="middle" fill="#9fb3c8" font-size="24">WINDI FORENSIC LEDGER · INTEGRITY VERIFIED</text>

  <!-- Receipt box with REAL values (injected at composition time) -->
  <rect x="280" y="720" width="1360" height="160" rx="8" fill="#0b121b" stroke="#16a34a" stroke-width="1.5"/>
  <text x="320" y="770" fill="#5c7388" font-size="20" font-family="monospace">RECEIPT</text>
  <text x="320" y="805" fill="#e5edf5" font-size="22" font-family="monospace" id="receipt_id">{{RECEIPT_ID}}</text>
  <text x="320" y="845" fill="#5c7388" font-size="20" font-family="monospace">SHA-256</text>
  <text x="320" y="875" fill="#9fe0b4" font-size="18" font-family="monospace" id="hash">{{HASH}}</text>
  <text x="1600" y="770" text-anchor="end" fill="#16a34a" font-size="22" font-weight="bold" font-family="monospace">ANCHORED</text>
</svg>
