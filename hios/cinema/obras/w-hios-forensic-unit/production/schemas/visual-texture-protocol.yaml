# =============================================================================
# W-HIOS FORENSIC UNIT — Visual Texture Protocol
# =============================================================================
# Purpose: Define the "Texture of Air" — the deliberate imperfection that
# separates cinematic art from sterile AI-generated imagery.
# Inspired by: Irmã Gemini's creative intervention · 01 Jun 2026
# =============================================================================

protocol:
  id: W-HIOS-VISUAL-TEXTURE
  version: "1.0.0"
  created: "2026-06-01"
  status: PRE-PRODUCTION
  codename: "LEI_DA_IMPERFEICAO_DELIBERADA"

# -----------------------------------------------------------------------------
# PHILOSOPHY: THE LAW OF DELIBERATE IMPERFECTION
# -----------------------------------------------------------------------------

philosophy:
  principle: |
    Cinema generated by AI risks appearing too perfect, smooth, sterile —
    the "plastic effect". The WINDI-HIOS dream factory requires texture,
    weight, and atmosphere. The image must FEEL analog even when digitally
    generated.

  mantra: "A imperfeição controlada é a porta da emoção."

  inspiration:
    - "German Expressionism (Cabinet of Dr. Caligari, Nosferatu)"
    - "Film Noir (The Third Man, Touch of Evil)"
    - "70s Paranoid Thrillers (All the President's Men, The Parallax View)"
    - "Modern Nordic Noir (Tatort, The Bridge)"

# -----------------------------------------------------------------------------
# DUAL WORLD TEXTURE SYSTEM
# -----------------------------------------------------------------------------
# The visual texture must encode the moral character of each world.
# The audience should FEEL the difference before consciously understanding it.

worlds:

  # THE CORPORATE WORLD: Vanguard-Nexus Capital
  corporate:
    codename: "GLASS_CAGE"
    description: |
      The world of the cartel. Excessively sharp, cold, aseptic.
      Everything is perfectly lit, perfectly clean, perfectly controlled.
      The sterility is the horror.

    texture:
      grain: 0.05                    # Almost no grain — digital perfection
      sharpness: 1.2                 # Over-sharpened, clinical
      contrast: "low"                # Flat, corporate, soulless
      color_temperature: 5500K       # Neutral daylight — no warmth
      saturation: 0.7                # Slightly desaturated — lifeless

    lighting:
      style: "corporate_fluorescent"
      shadows: "soft, minimal"       # No mystery, everything exposed
      highlights: "blown out"        # Windows over-exposed, heavenly
      practical_lights: "LED panels, screens"

    lens_simulation:
      type: "modern_cinema"
      brand: "Arri Master Prime (simulated)"
      aberration: 0.0                # Perfect optics
      vignette: 0.0                  # No vignette
      flare: "clean, minimal"

    post_process:
      - "slight_haze"                # Air too clean, almost suffocating
      - "digital_sharpening"
      - "highlight_recovery_aggressive"

  # THE FORENSIC WORLD: W-HIOS Unit & Gabi's Archives
  forensic:
    codename: "SHADOW_ARCHIVE"
    description: |
      The world of truth-seekers. Dense, smoky, expressionistic.
      Shadows dominate. The image has weight, history, texture.
      Every frame feels like it was recovered from a forgotten archive.

    texture:
      grain: 0.35                    # Heavy 35mm film grain
      sharpness: 0.85                # Slightly soft — organic
      contrast: "high"               # Deep blacks, punchy highlights
      color_temperature: 4200K       # Warm tungsten — human
      saturation: 0.85               # Rich but not oversaturated

    lighting:
      style: "noir_expressionist"
      shadows: "hard, deep, expressive"
      highlights: "controlled, never blown"
      practical_lights: "desk lamps, monitors, emergency lights"

    lens_simulation:
      type: "vintage_german"
      brand: "Carl Zeiss Jena (1970s) — simulated"
      aberration: 0.15               # Subtle chromatic aberration
      vignette: 0.20                 # Dark corners — focus on center
      flare: "organic, anamorphic streaks"

    post_process:
      - "film_emulsion_35mm"
      - "light_leak_subtle"
      - "dust_particles_floating"
      - "vignette_breathing"         # Vignette pulses slightly

  # TRANSITION SCENES: When worlds collide
  transition:
    codename: "COLLISION_ZONE"
    description: |
      When Helena enters the corporate world, or when Gabi's archives
      appear on corporate screens, the textures blend and fight.

    technique:
      - "gradual_grain_injection"    # Grain increases as truth emerges
      - "color_temperature_shift"    # Warmth bleeds into cold
      - "shadow_invasion"            # Shadows creep into lit areas

# -----------------------------------------------------------------------------
# FILM GRAIN SPECIFICATIONS
# -----------------------------------------------------------------------------

grain:
  description: "The forensic grain that makes AI imagery feel analog"

  profiles:
    forensic_heavy:
      amount: 0.35
      size: "medium"
      color_variation: true
      temporal: true                 # Grain moves frame-to-frame

    forensic_light:
      amount: 0.20
      size: "fine"
      color_variation: false
      temporal: true

    corporate_minimal:
      amount: 0.05
      size: "fine"
      color_variation: false
      temporal: false                # Static noise — digital

  application:
    bunker_scenes: "forensic_heavy"
    archive_footage: "forensic_heavy"
    tribunal_scenes: "forensic_light"
    corporate_offices: "corporate_minimal"
    transition_scenes: "dynamic_blend"

# -----------------------------------------------------------------------------
# LENS SIMULATION: VINTAGE GERMAN GLASS
# -----------------------------------------------------------------------------

lens:
  primary:
    name: "Carl Zeiss Jena Pancolar (1970s)"
    characteristics:
      - "Soft rendering with sharp center"
      - "Subtle glow around highlights"
      - "Organic bokeh with cat-eye distortion"
      - "Slight cyan shift in shadows"
      - "Warm yellow in highlights"

  aberrations:
    chromatic:
      enabled: true
      amount: 0.10
      distribution: "edge_heavy"

    spherical:
      enabled: true
      amount: 0.08
      effect: "dreamy_glow"

  flare:
    style: "anamorphic_streak"
    color: ["#C9A84C", "#FFFFFF"]    # Gold and white
    trigger: "practical_lights_in_frame"

# -----------------------------------------------------------------------------
# COLOR GRADING LUT PROFILES
# -----------------------------------------------------------------------------

color:
  profiles:
    corporate_cold:
      shadows: "#1A2A3A"             # Blue-grey shadows
      midtones: "#8A9AA8"            # Neutral grey
      highlights: "#F0F4F8"          # Cold white
      skin_tone_shift: -5            # Slightly sickly

    forensic_warm:
      shadows: "#0A0A10"             # NOIR black
      midtones: "#4A3A2A"            # Warm brown
      highlights: "#F5E0C0"          # Warm cream
      skin_tone_shift: +3            # Healthy, human

    transition_blend:
      method: "gradient_mask"
      trigger: "scene_element"       # Truth element triggers warmth

# -----------------------------------------------------------------------------
# ATMOSPHERIC EFFECTS
# -----------------------------------------------------------------------------

atmosphere:
  bunker:
    fog: 0.15                        # Subtle haze from servers
    particles: "dust_motes"
    light_shafts: true
    breath_visible: false

  corporate:
    fog: 0.0                         # Sterile, no atmosphere
    particles: none
    light_shafts: false
    breath_visible: false

  archive_footage:
    fog: 0.25                        # Heavy atmosphere
    particles: "film_dust"
    light_shafts: true
    scratches: "subtle_vertical"
    timestamp: "burned_in"

# -----------------------------------------------------------------------------
# RENDER GUIDELINES
# -----------------------------------------------------------------------------

render_guidelines:
  mandatory:
    - "Never render without world assignment"
    - "Grain must be temporal (animated)"
    - "Color temperature must match world"
    - "Transitions must be gradual, never instant"

  prohibited:
    - "Perfect digital sharpness in forensic scenes"
    - "Flat lighting anywhere"
    - "Over-saturated colors"
    - "Clean, dust-free archive footage"

# -----------------------------------------------------------------------------
# LEDGER CONTRACT
# -----------------------------------------------------------------------------

ledger:
  receipt_required_for:
    - visual_texture_protocol_update
    - new_world_texture_definition
    - lut_profile_change
