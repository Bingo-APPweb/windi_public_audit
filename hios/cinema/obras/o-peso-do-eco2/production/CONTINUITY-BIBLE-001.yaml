  technicians: "lab coats / smart-casual, modern forensic lab"
  prohibition: "No background element may contradict WORLD-STATE-001 jurisdiction (no foreign police liveries, no wrong-region courtroom architecture)."

# -----------------------------------------------------------------------------
# HARTMANN metrics — carried INTACT and SEPARATE from §293. Do NOT average.
