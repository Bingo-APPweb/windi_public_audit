# field MUST match the §293 sealed identity. Continuity tier per trait.
# -----------------------------------------------------------------------------

characters:

  - name: HELENA
    anchor_ref: "HELENA-§293"          # detective — protagonist investigator
    continuity_tier: FORENSIC          # face/identity already FORENSIC in SPINE
    age: 45                            # CANONICAL (§139 31 Mai 2026) — sealed with S07
    wardrobe:
      coat: "dark navy wool coat"
      base: "muted dark layers, professional"
    hair: "blonde, shoulder-length, pulled back on duty"
    props:
      vehicle: "unmarked dark police sedan"
      badge: "Kriminalpolizei badge"
    speech:
      register: "calm, precise, low"
      language: de

  - name: THOMAS
    anchor_ref: "THOMAS-§293"          # bereaved father (Elisa's father)
    continuity_tier: FORENSIC
    wardrobe:
      outer: "worn work jackets"
      base: "modest, practical, slightly faded"
    props:
      wedding_ring: "always present — NON-NEGOTIABLE continuity anchor"
      home: "modest house, lived-in"
    speech:
      register: "quiet, restrained grief"
      language: de

  - name: MARCUS
    anchor_ref: "MARCUS-§293"          # the killer / defendant
    continuity_tier: FORENSIC
    wardrobe:
      style: "expensive, understated"
    props:
      vehicle: |
        CANONICAL PERMANENCE (§139 31 Mai 2026): Dark sedan — NON-NEGOTIABLE.
        Same car appears in: S01 (parked behind Elisa), S02 (the killing), S16 (Helena identifies).
        Model: German luxury sedan (BMW/Audi/Mercedes), dark colour (black or dark grey).
        This vehicle is the PROOF CHAIN anchor — must be visually identifiable across all scenes.
        Continuity tier: FORENSIC (same as Thomas's wedding ring).
      watch: "silver wristwatch"
    speech:
      register: "controlled, entitled"
      language: de

  - name: HARTMANN
    anchor_ref: "HARTMANN-v2b-§293"    # defense attorney
    continuity_tier: FORENSIC          # anchor 0.9298 FORENSIC (see metrics block)
    wardrobe:
      glasses: "rectangular frames"
      tie: "burgundy"
      court_outfit_id: "HARTMANN-COURT-001"
    hair: "silver, wavy"
    props:
      office: "green desk lamp, dark interior"
    speech:
      register: "sharp, adversarial, formal"
      language: de

  - name: ELISA
    anchor_ref: "ELISA-v2-§293"        # the victim — content creator (appears in S01 recording)
    continuity_tier: FORENSIC
    version_note: |
      v2 PERMANENCE (§139 31 Mai 2026): Content creator estabelecida, início dos 30,
      registo desenvolto e íntimo com a audiência; linguagem corporal de quem conhece
      a câmara (fala ao público mesmo sozinha). Mais madura que v1, mas mesma energia
      vibrante. Smartphone como artefacto central — grava com WINDI Ledger activo.
    wardrobe:
      base: "casual autumn clothing, practical but stylish for outdoor filming"
      setting: "Allgäu Alps, golden hour, autumn"
    props:
      device: "smartphone with WINDI Ledger indicator visible (diegetic light — pays off in S15)"
    speech:
      register: "warm, confident content-creator voice; speaks to audience like friends"
      language: de
      canonical_line: "Hallo meine Lieben! Ich zeige euch heute einen atemberaubenden Blick auf die Alpen — hier in meiner Lieblingsregion, dem Allgäu."

