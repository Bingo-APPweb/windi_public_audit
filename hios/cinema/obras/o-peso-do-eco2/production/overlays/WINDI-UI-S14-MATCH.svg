<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <!-- =========================================================
       WINDI FORENSIC LEDGER · UI OVERLAY · S14 (MATCH FOUND)
       Composited in post over Veo environment plate.
       Text is VECTOR — never generator-rendered. §296 invariant.
       Transparent background; align to monitor quad in plate.
       ========================================================= -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f16"/>
      <stop offset="1" stop-color="#070b11"/>
    </linearGradient>
    <linearGradient id="okbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#16a34a"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>

  <!-- Ledger window frame -->
  <rect x="300" y="150" width="1320" height="780" rx="10" fill="url(#panel)" stroke="#1f2a37" stroke-width="2"/>

  <!-- Title bar -->
  <rect x="300" y="150" width="1320" height="64" rx="10" fill="#0d1420"/>
  <circle cx="345" cy="182" r="7" fill="#ef4444"/>
  <text x="372" y="190" fill="#e5edf5" font-size="26" font-weight="600">WINDI</text>
  <text x="468" y="190" fill="#9fb3c8" font-size="26" font-weight="400">Forensic Ledger</text>

  <!-- Left index rail -->
  <rect x="320" y="232" width="300" height="676" rx="6" fill="#0b121b"/>
  <g fill="#33445a">
    <rect x="344" y="262" width="252" height="10" rx="5"/>
    <rect x="344" y="292" width="210" height="10" rx="5"/>
    <rect x="344" y="322" width="240" height="10" rx="5"/>
    <rect x="344" y="352" width="180" height="10" rx="5"/>
    <rect x="344" y="382" width="228" height="10" rx="5"/>
    <rect x="344" y="412" width="196" height="10" rx="5"/>
  </g>

  <!-- Main panel accent -->
  <rect x="648" y="232" width="6" height="676" fill="#16a34a"/>

  <!-- HEADLINE — the thesis, legible -->
  <text x="690" y="320" fill="#ffffff" font-size="56" font-weight="700" letter-spacing="1">ÜBEREINSTIMMUNG GEFUNDEN</text>
  <text x="690" y="372" fill="#16a34a" font-size="34" font-weight="600">MATCH FOUND</text>

  <!-- Subject name -->
  <text x="690" y="470" fill="#cfe0f0" font-size="30" font-weight="400">Subjekt / Subject:</text>
  <text x="690" y="516" fill="#ffffff" font-size="44" font-weight="700">Elisa Weber</text>

  <!-- Verification rows -->
  <g font-size="26">
    <rect x="690" y="566" width="34" height="34" rx="6" fill="url(#okbar)"/>
    <path d="M698 583 l8 8 l14 -16" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="742" y="591" fill="#9fb3c8">Biometrische Übereinstimmung verifiziert</text>

    <rect x="690" y="616" width="34" height="34" rx="6" fill="url(#okbar)"/>
    <path d="M698 633 l8 8 l14 -16" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="742" y="641" fill="#9fb3c8">Quelle: Aufnahme · Gerät E. Weber</text>

    <rect x="690" y="666" width="34" height="34" rx="6" fill="url(#okbar)"/>
    <path d="M698 683 l8 8 l14 -16" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="742" y="691" fill="#9fb3c8">Ledger-Eintrag vorbereitet</text>
  </g>

  <!-- Portrait frame (Veo plate provides the face; overlay frames it green) -->
  <rect x="1240" y="300" width="320" height="380" rx="8" fill="none" stroke="#16a34a" stroke-width="3"/>
  <text x="1240" y="710" fill="#5c7388" font-size="20">PORTRÄT · MATCH</text>

  <!-- Footer: receipt placeholder (S14 = match only; full receipt is S15) -->
  <rect x="320" y="858" width="1280" height="50" rx="6" fill="#0b121b"/>
  <text x="344" y="890" fill="#5c7388" font-size="22" font-family="'JetBrains Mono',monospace">STATUS: MATCH · Receipt &amp; Integrity → next stage (S15)</text>
</svg>
