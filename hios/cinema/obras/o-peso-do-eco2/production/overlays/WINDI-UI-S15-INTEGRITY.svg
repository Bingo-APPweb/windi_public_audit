<svg viewBox="0 0 1320 780" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Arial, Helvetica, sans-serif">
  <!-- =========================================================
       WINDI FORENSIC LEDGER · UI OVERLAY · S15 (INTEGRITY 100%)
       Composited in post over Veo environment plate.
       Text is VECTOR — never generator-rendered. §296 invariant.
       RECEIPT_ID and HASH are REAL values from Ledger.
       ========================================================= -->
  <title>WINDI Forensic Ledger UI overlay, S15 integrity verified 100 percent</title>
  <desc>Dark forensic ledger panel showing INTEGRITAET VERIFIZIERT 100 percent with a real receipt id and SHA-256 hash slot and ANCHORED status.</desc>

  <!-- Background panel -->
  <rect x="0" y="0" width="1320" height="780" rx="10" fill="#0a0f16" stroke="#1f2a37" stroke-width="2"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="1320" height="64" rx="10" fill="#0d1420"/>
  <circle cx="45" cy="32" r="7" fill="#ef4444"/>
  <text x="72" y="40" fill="#e5edf5" font-size="26" font-weight="bold">WINDI</text>
  <text x="168" y="40" fill="#9fb3c8" font-size="26">Forensic Ledger</text>

  <!-- Shield icon -->
  <g transform="translate(660,180)">
    <path d="M0,-70 L60,-44 L60,18 C60,60 32,86 0,100 C-32,86 -60,60 -60,18 L-60,-44 Z" fill="none" stroke="#16a34a" stroke-width="6"/>
    <path d="M-26,8 l18,18 l34,-44" stroke="#16a34a" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main headline -->
  <text x="660" y="350" text-anchor="middle" fill="#ffffff" font-size="52" font-weight="bold">INTEGRITÄT VERIFIZIERT</text>
  <text x="660" y="430" text-anchor="middle" fill="#16a34a" font-size="84" font-weight="bold">100%</text>
  <text x="660" y="474" text-anchor="middle" fill="#9fb3c8" font-size="24">WINDI FORENSIC LEDGER · INTEGRITY VERIFIED</text>

  <!-- Receipt box with REAL values (injected at composition time) -->
  <rect x="130" y="540" width="1060" height="150" rx="8" fill="#0b121b" stroke="#16a34a" stroke-width="1.5"/>
  <text x="160" y="580" fill="#5c7388" font-size="20" font-family="monospace">RECEIPT</text>
  <text x="160" y="614" fill="#e5edf5" font-size="22" font-family="monospace" id="receipt_id">{{RECEIPT_ID}}</text>
  <text x="160" y="652" fill="#5c7388" font-size="20" font-family="monospace">SHA-256</text>
  <text x="160" y="680" fill="#9fe0b4" font-size="20" font-family="monospace" id="hash">{{HASH}}</text>
  <text x="1160" y="580" text-anchor="end" fill="#16a34a" font-size="22" font-weight="bold" font-family="monospace">ANCHORED</text>
</svg>
