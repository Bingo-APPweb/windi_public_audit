<style>
/* ═══════════════════════════════════════════════════════════════════════
   WINDI PALETTE PERSONAL — KLAR THEME
   "Dignidade do acesso. Humanamente completo."
   v1.0.0-P
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  /* KLAR — Pergaminho (DEFAULT) */
  --bg: #F5F0E0;
  --card: #FDFBF5;
  --hover: #EDE8D8;
  --input: #FDFBF5;
  --border: #DDD6C2;
  --gold: #8B6914;
  --text: #2C2924;
  --dim: #6B6560;
  --success: #2D5016;
  --accent: #8B6914;
  --paper: #FFFFFF;
  --paper-shadow: rgba(0,0,0,0.08);
}

[data-theme="noir"] {
  --bg: #0E0E14;
  --card: #16161F;
  --hover: #1C1C28;
  --input: #1A1A24;
  --border: #26263A;
  --gold: #D4A843;
  --text: #E2E2EA;
  --dim: #7A7A96;
  --success: #4A7C32;
  --accent: #D4A843;
  --paper: #1E1E28;
  --paper-shadow: rgba(0,0,0,0.3);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

h1, h2, h3, h4 {
  font-family: 'Bricolage Grotesque', sans-serif;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px;
}

/* ── HEADER ─────────────────────────────────────────────────────────── */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 0;
  border-bottom: 3px solid var(--gold);
  margin-bottom: 30px;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.header h1 {
  font-size: 1.8em;
  font-weight: 700;
  color: var(--gold);
  display: flex;
  align-items: center;
  gap: 10px;
}

.tier-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  color: var(--gold);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.85em;
  font-weight: 600;
  border: 2px solid var(--gold);
}

.header-subtitle {
  font-size: 0.95em;
  color: var(--dim);
  margin-top: 4px;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.lang-selector {
  display: flex;
  gap: 8px;
}

.lang-btn {
  padding: 6px 10px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--dim);
  cursor: pointer;
  font-size: 0.8em;
  transition: all 0.2s;
}

.lang-btn.active {
  background: var(--gold);
  color: white;
  border-color: var(--gold);
}

.theme-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.8em;
  color: var(--dim);
  transition: all 0.2s;
}

.theme-toggle:hover {
  border-color: var(--gold);
}

/* ── WORKSPACE ──────────────────────────────────────────────────────── */
.workspace-title {
  text-align: center;
  margin-bottom: 24px;
}

.workspace-title h2 {
  font-size: 1.5em;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 8px;
}

.workspace-title p {
  color: var(--dim);
  font-size: 0.95em;
}

.doc-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}

@media (max-width: 900px) {
  .doc-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 500px) {
  .doc-grid { grid-template-columns: 1fr; }
}

.doc-card {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}

.doc-card:hover {
  border-color: var(--gold);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px var(--paper-shadow);
}

.doc-card.active {
  border-color: var(--gold);
  background: var(--hover);
}

.doc-card .icon {
  font-size: 2.5em;
  margin-bottom: 12px;
}

.doc-card .name {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 1.1em;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.doc-card .desc {
  font-size: 0.8em;
  color: var(--dim);
  line-height: 1.4;
}

/* ── TEMPLATES PRONTOS ──────────────────────────────────────────────── */
.templates-section {
  background: var(--card);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 30px;
}

.templates-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.templates-header h3 {
  font-size: 1.1em;
  font-weight: 600;
  color: var(--gold);
}

.templates-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

@media (max-width: 700px) {
  .templates-grid { grid-template-columns: repeat(2, 1fr); }
}

.template-chip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 0.85em;
}

.template-chip:hover {
  border-color: var(--gold);
  background: var(--hover);
}

.template-chip .lang-flag {
  font-size: 1.1em;
}

/* ── FORM WORKSPACE ─────────────────────────────────────────────────── */
.form-workspace {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 24px;
  margin-bottom: 30px;
}

@media (max-width: 800px) {
  .form-workspace { grid-template-columns: 1fr; }
}

.form-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
}

.form-panel h3 {
  font-size: 1.1em;
  font-weight: 600;
  color: var(--gold);
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.form-group {
  margin-bottom: 16px;
}

.form-group label {
  display: block;
  font-size: 0.85em;
  font-weight: 500;
  color: var(--dim);
  margin-bottom: 6px;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 12px 14px;
  background: var(--input);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.95em;
  color: var(--text);
  transition: border-color 0.2s;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  outline: none;
  border-color: var(--gold);
}

.form-group textarea {
  min-height: 100px;
  resize: vertical;
}

/* ── PREVIEW PANEL ──────────────────────────────────────────────────── */
.preview-panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  display: flex;
  flex-direction: column;
}

.preview-panel h3 {
  font-size: 1.1em;
  font-weight: 600;
  color: var(--gold);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.preview-paper {
  flex: 1;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 24px;
  min-height: 300px;
  box-shadow: 0 2px 8px var(--paper-shadow);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85em;
  line-height: 1.6;
  white-space: pre-wrap;
  color: var(--text);
  overflow-y: auto;
}

.download-btn {
  margin-top: 16px;
  padding: 14px 24px;
  background: var(--gold);
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s;
}

.download-btn:hover {
  transform: scale(1.02);
  box-shadow: 0 4px 12px rgba(139, 105, 20, 0.3);
}

.download-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

/* ── ASSISTANT ──────────────────────────────────────────────────────── */
.assistant-section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  margin-bottom: 30px;
}

.assistant-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.assistant-header h3 {
  font-size: 1.1em;
  font-weight: 600;
  color: var(--success);
}

.faq-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

@media (max-width: 600px) {
  .faq-grid { grid-template-columns: 1fr; }
}

.faq-btn {
  padding: 12px 16px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  text-align: left;
  cursor: pointer;
  font-size: 0.85em;
  color: var(--text);
  transition: all 0.2s;
}

.faq-btn:hover {
  border-color: var(--success);
  background: var(--hover);
}

.assistant-answer {
  padding: 16px;
  background: var(--bg);
  border-radius: 8px;
  border-left: 3px solid var(--success);
  font-size: 0.9em;
  line-height: 1.6;
  color: var(--text);
}

.assistant-tip {
  margin-top: 16px;
  padding: 12px 16px;
  background: linear-gradient(135deg, rgba(139,105,20,0.1), rgba(139,105,20,0.05));
  border: 1px solid var(--gold);
  border-radius: 8px;
  font-size: 0.85em;
  color: var(--dim);
}

.assistant-tip strong {
  color: var(--gold);
}

/* ── FOOTER ─────────────────────────────────────────────────────────── */
.footer {
  text-align: center;
  padding: 30px 0;
  border-top: 1px solid var(--border);
}

.footer-motto {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 1.1em;
  font-weight: 600;
  color: var(--gold);
  margin-bottom: 24px;
}

.tiers-compare {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-bottom: 24px;
}

.tier-card-mini {
  padding: 16px 20px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  text-align: center;
  min-width: 140px;
  transition: all 0.2s;
  text-decoration: none;
  color: inherit;
}

.tier-card-mini:hover {
  border-color: var(--gold);
  transform: translateY(-2px);
}

.tier-card-mini .icon {
  font-size: 1.5em;
  margin-bottom: 8px;
}

.tier-card-mini .name {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 600;
  font-size: 0.95em;
  margin-bottom: 8px;
}

.tier-card-mini .features {
  font-size: 0.75em;
  color: var(--dim);
  line-height: 1.5;
}

.footer-brand {
  font-size: 0.8em;
  color: var(--dim);
}

.footer-dragons {
  margin-top: 8px;
  font-size: 0.85em;
  color: var(--dim);
}

/* ── UTILITIES ──────────────────────────────────────────────────────── */
.hidden { display: none !important; }
</style>
</head>

      { id: 'greeting', label: { de: 'Anrede', en: 'Greeting', pt: 'Saudação' }, type: 'select',
        options: {
          de: ['Sehr geehrte Damen und Herren,', 'Sehr geehrter Herr/Frau,', 'Hallo,', 'Guten Tag,'],
          en: ['Dear Sir or Madam,', 'Dear Mr./Ms.,', 'Hello,', 'Hi,'],

      },
      { id: 'body', label: { de: 'Nachricht', en: 'Message', pt: 'Mensagem' }, type: 'textarea' },
      { id: 'signature', label: { de: 'Signatur', en: 'Signature', pt: 'Assinatura' }, type: 'text' }
    ],
    template: {
      de: 'An: {to}\nCC: {cc}\nBetreff: {subject}\n\n──────────────────────────────\n\n{greeting}\n\n{body}\n\nMit freundlichen Grüßen\n{signature}',
      en: 'To: {to}\nCC: {cc}\nSubject: {subject}\n\n──────────────────────────────\n\n{greeting}\n\n{body}\n\nBest regards,\n{signature}',
      pt: 'Para: {to}\nCC: {cc}\nAssunto: {subject}\n\n──────────────────────────────\n\n{greeting}\n\n{body}\n\nAtenciosamente,\n{signature}'

  }
};

// ── MAIN APP ───────────────────────────────────────────────────────────
function App() {
  const [lang, setLang] = useState(() => {
    const nav = navigator.language?.substring(0, 2);
    return ['de', 'en', 'pt'].includes(nav) ? nav : 'de';
  });
  const [theme, setTheme] = useState(() => localStorage.getItem('windi_theme') || 'klar');
  const [selectedType, setSelectedType] = useState(null);
  const [formData, setFormData] = useState({});
  const [assistantAnswer, setAssistantAnswer] = useState(null);

  // Apply theme
  useEffect(() => {
    document.body.setAttribute('data-theme', theme === 'noir' ? 'noir' : '');
    localStorage.setItem('windi_theme', theme);
  }, [theme]);

  const t = T[lang] || T.de;

  // Generate preview text
  const previewText = useMemo(() => {
    if (!selectedType) return '';
    const docType = DOC_TYPES[selectedType];
    let text = docType.template[lang] || docType.template.de;
    Object.keys(formData).forEach(key => {
      text = text.replace(new RegExp(`\\{${key}\\}`, 'g'), formData[key] || `[${key}]`);
    });
    return text;
  }, [selectedType, formData, lang]);

  // Check if form is complete
  const isFormComplete = useMemo(() => {
    if (!selectedType) return false;
    const docType = DOC_TYPES[selectedType];
    return docType.fields.every(f => formData[f.id]?.trim());
  }, [selectedType, formData]);

  // Handle doc type selection
  const selectDocType = (type) => {
    setSelectedType(type);
    setFormData({});
  };

  // Handle ready template selection
  const loadTemplate = (template) => {
    setSelectedType(template.type);
    setFormData(template.data);
    setLang(template.lang);
  };

  // Handle form field change
  const handleFieldChange = (fieldId, value) => {
    setFormData(prev => ({ ...prev, [fieldId]: value }));
  };

  // Handle FAQ click
  const handleFaqClick = (kb) => {
    setAssistantAnswer(kb.answer[lang] || kb.answer.de);
  };

  // Download DOCX
  const downloadDocx = async () => {
    if (!isFormComplete || !previewText) return;

    const { Document, Packer, Paragraph, TextRun } = docx;

    const doc = new Document({
      sections: [{
        properties: {},
        children: previewText.split('\n').map(line =>
          new Paragraph({
            children: [new TextRun({ text: line, font: 'Arial', size: 24 })]
          })
        )
      }]
    });

    const blob = await Packer.toBlob(doc);
    const docType = DOC_TYPES[selectedType];
    const filename = `WINDI_${docType.name[lang] || docType.name.de}_${new Date().toISOString().split('T')[0]}.docx`;
    saveAs(blob, filename);
  };

  return (
    <>
      {/* ── HEADER ─────────────────────────────────────────────────────── */}
      <header className="header">
        <div className="header-left">
          <div>
            <h1>🐉 {t.title}</h1>
            <div className="header-subtitle">{t.subtitle}</div>
          </div>
          <div className="tier-badge">✦ {t.badge}</div>
        </div>
        <div className="header-right">
          <div className="lang-selector">
            {['de', 'en', 'pt'].map(l => (
              <button key={l} className={`lang-btn ${lang === l ? 'active' : ''}`} onClick={() => setLang(l)}>
                {l.toUpperCase()}
              </button>
            ))}
          </div>
          <button className="theme-toggle" onClick={() => setTheme(theme === 'klar' ? 'noir' : 'klar')}>
            {theme === 'klar' ? '🌙' : '☀️'} {theme === 'klar' ? t.themeNoir : t.themeKlar}
          </button>
        </div>
      </header>

      {/* ── WORKSPACE TITLE ────────────────────────────────────────────── */}
      <div className="workspace-title">
        <h2>{t.workspaceTitle}</h2>
        <p>{t.workspaceDesc}</p>
      </div>

      {/* ── DOC TYPE CARDS ─────────────────────────────────────────────── */}
      <div className="doc-grid">
        {Object.entries(DOC_TYPES).map(([key, doc]) => (
          <div key={key} className={`doc-card ${selectedType === key ? 'active' : ''}`} onClick={() => selectDocType(key)}>
            <div className="icon">{doc.icon}</div>
            <div className="name">{doc.name[lang] || doc.name.de}</div>
            <div className="desc">{doc.desc[lang] || doc.desc.de}</div>
          </div>
        ))}
      </div>

      {/* ── READY TEMPLATES ────────────────────────────────────────────── */}
      <div className="templates-section">
        <div className="templates-header">
          <span>🎁</span>
          <h3>{t.templatesTitle}</h3>
        </div>
        <div className="templates-grid">
          {READY_TEMPLATES.map(tpl => (
            <div key={tpl.id} className="template-chip" onClick={() => loadTemplate(tpl)}>
              <span className="lang-flag">{tpl.flag}</span>
              <span>{tpl.name}</span>
            </div>
          ))}
        </div>
      </div>

      {/* ── FORM + PREVIEW ─────────────────────────────────────────────── */}
      {selectedType && (
        <div className="form-workspace">
          {/* Form Panel */}
          <div className="form-panel">
            <h3>🏗️ {t.formTitle}: {DOC_TYPES[selectedType].name[lang]}</h3>
            {DOC_TYPES[selectedType].fields.map(field => (
              <div key={field.id} className="form-group">
                <label>{field.label[lang] || field.label.de}</label>
                {field.type === 'textarea' ? (
                  <textarea value={formData[field.id] || ''} onChange={e => handleFieldChange(field.id, e.target.value)} />
                ) : field.type === 'select' ? (
                  <select value={formData[field.id] || ''} onChange={e => handleFieldChange(field.id, e.target.value)}>
                    <option value="">--</option>
                    {(field.options[lang] || field.options.de).map(opt => (
                      <option key={opt} value={opt}>{opt}</option>
                    ))}
                  </select>
                ) : (
                  <input type={field.type} value={formData[field.id] || ''} onChange={e => handleFieldChange(field.id, e.target.value)} />
                )}
              </div>
            ))}
          </div>

          {/* Preview Panel */}
          <div className="preview-panel">
            <h3>👁️ {t.previewTitle}</h3>
            <div className="preview-paper">{previewText || '...'}</div>
            <button className="download-btn" onClick={downloadDocx} disabled={!isFormComplete}>
              📥 {isFormComplete ? t.downloadBtn : t.downloadEmpty}
            </button>
          </div>
        </div>
      )}

      {/* ── ASSISTANT ──────────────────────────────────────────────────── */}
      <div className="assistant-section">
        <div className="assistant-header">
          <span>🛡️</span>
          <h3>{t.assistantTitle}</h3>
        </div>
        <div className="faq-grid">
          {KNOWLEDGE_BASE.map((kb, i) => (
            <button key={i} className="faq-btn" onClick={() => handleFaqClick(kb)}>
              {kb.question[lang] || kb.question.de}
            </button>
          ))}
        </div>
        {assistantAnswer && (
          <div className="assistant-answer">{assistantAnswer}</div>
        )}
        <div className="assistant-tip">
          💡 <strong>Tip:</strong> {t.assistantTip}
        </div>
      </div>

      {/* ── FOOTER ─────────────────────────────────────────────────────── */}
      <footer className="footer">
        <div className="footer-motto">"{t.motto}"</div>
        <div className="tiers-compare">
          <a href="palette-org.html" className="tier-card-mini">
            <div className="icon">🏢</div>
            <div className="name">{t.orgTier}</div>
            <div className="features">{t.orgFeatures}</div>
          </a>
          <a href="palette-gov.html" className="tier-card-mini">
            <div className="icon">🏛️</div>
            <div className="name">{t.govTier}</div>
            <div className="features">{t.govFeatures}</div>
          </a>
        </div>
        <div className="footer-brand">{t.brand}</div>
        <div className="footer-dragons">{t.dragons}</div>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>

</body>
</html>
