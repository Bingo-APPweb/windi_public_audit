/* ═══════════════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════════════ */

:root {
  --bg: #F5F0E0;
  --card: #FDFBF5;
  --hover: #EDE8D8;
  --input: #FDFBF5;
  --border: #DDD6C2;
  --gold: #8B6914;
  --text: #2C2924;
  --dim: #6B6560;
  --success: #2D5016;
  --witness: #1E3A5F;
  --architect: #4A3728;
  --paper: #FFFFFF;
}

[data-theme="noir"] {
  --bg: #0E0E14;
  --card: #16161F;
  --hover: #1C1C28;
  --input: #1A1A24;
  --border: #26263A;
  --gold: #D4A843;
  --text: #E2E2EA;
  --dim: #7A7A96;
  --success: #4A7C32;
  --witness: #4A6B8A;
  --architect: #8A7A68;
  --paper: #1E1E28;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

h1, h2, h3, h4 { font-family: 'Bricolage Grotesque', sans-serif; }

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 16px;
  flex: 1;
  display: flex;
  flex-direction: column;
}

/* ── HEADER ─────────────────────────────────────────────────────────── */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 2px solid var(--gold);
  margin-bottom: 16px;
}

.header-left { display: flex; align-items: center; gap: 12px; }

.header h1 {
  font-size: 1.4em;
  font-weight: 700;
  color: var(--gold);
}

.tier-badge {
  padding: 4px 12px;
  border: 2px solid var(--gold);
  border-radius: 16px;
  font-size: 0.75em;
  font-weight: 600;
  color: var(--gold);
}

.header-right { display: flex; align-items: center; gap: 12px; }

.did-badge, .anon-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  font-size: 0.8em;
}

.did-badge { border-color: var(--success); color: var(--success); }
.did-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }

.lang-btn {
  padding: 4px 8px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--dim);
  cursor: pointer;
  font-size: 0.75em;
}
.lang-btn.active { background: var(--gold); color: white; border-color: var(--gold); }

.theme-toggle {
  padding: 6px 10px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  cursor: pointer;
  font-size: 0.75em;
  color: var(--dim);
}

/* ── CHAT AREA ──────────────────────────────────────────────────────── */
.chat-container {
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}

.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  min-height: 300px;
  max-height: 55vh;
}

.message {
  margin-bottom: 16px;
  max-width: 88%;
}

.message.user {
  margin-left: auto;
  background: var(--hover);
  padding: 12px 16px;
  border-radius: 16px 16px 4px 16px;
}

.message.agent {
  background: var(--bg);
  padding: 14px 18px;
  border-radius: 16px 16px 16px 4px;
  border-left: 3px solid var(--success);
}

.message.agent.architect { border-left-color: var(--architect); }
.message.agent.witness { border-left-color: var(--witness); }

.dragon-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.8em;
  font-weight: 600;
  margin-bottom: 8px;
}
.dragon-badge.guardian { color: var(--success); }
.dragon-badge.architect { color: var(--architect); }
.dragon-badge.witness { color: var(--witness); }

.message-text { line-height: 1.5; }
.message-text strong { font-weight: 600; }

/* ── QUICK ACTIONS ──────────────────────────────────────────────────── */
.quick-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.quick-action-btn {
  padding: 8px 14px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  cursor: pointer;
  font-size: 0.85em;
  transition: all 0.2s;
}
.quick-action-btn:hover {
  border-color: var(--gold);
  background: var(--hover);
}

/* ── INLINE FORM ────────────────────────────────────────────────────── */
.inline-form {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 16px;
  margin-top: 12px;
}

.form-row {
  margin-bottom: 12px;
}

.form-row label {
  display: block;
  font-size: 0.8em;
  color: var(--dim);
  margin-bottom: 4px;
  font-weight: 500;
}

.form-row input,
.form-row textarea,
.form-row select {
  width: 100%;
  padding: 10px 12px;
  background: var(--input);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 0.9em;
  color: var(--text);
}
.form-row input:focus,
.form-row textarea:focus,
.form-row select:focus {
  outline: none;
  border-color: var(--gold);
}
.form-row textarea { min-height: 80px; resize: vertical; font-family: inherit; }

.form-actions {
  display: flex;
  gap: 10px;
  margin-top: 14px;
}

.btn-preview {
  padding: 10px 18px;
  background: transparent;
  border: 1px solid var(--gold);
  border-radius: 8px;
  color: var(--gold);
  cursor: pointer;
  font-weight: 500;
}

.btn-download {
  padding: 10px 18px;
  background: var(--gold);
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
  font-weight: 600;
}

/* ── PREVIEW ────────────────────────────────────────────────────────── */
.preview-box {
  margin-top: 12px;
  padding: 16px;
  background: var(--paper);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.85em;
  white-space: pre-wrap;
  max-height: 200px;
  overflow-y: auto;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

/* ── INPUT BAR ──────────────────────────────────────────────────────── */
.input-bar {
  display: flex;
  gap: 10px;
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  background: var(--bg);
}

.input-bar input {
  flex: 1;
  padding: 12px 16px;
  background: var(--input);
  border: 1px solid var(--border);
  border-radius: 24px;
  font-size: 0.95em;
  color: var(--text);
}
.input-bar input:focus { outline: none; border-color: var(--gold); }

.input-bar button {
  padding: 12px 24px;
  background: var(--gold);
  border: none;
  border-radius: 24px;
  color: white;
  font-weight: 600;
  cursor: pointer;
}
.input-bar button:disabled { opacity: 0.5; cursor: not-allowed; }

/* ── QUICK ACCESS BAR ───────────────────────────────────────────────── */
.quick-access {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  padding: 12px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  margin-top: 12px;
  font-size: 0.8em;
}

.qa-label { color: var(--dim); margin-right: 4px; }

.qa-chip {
  padding: 6px 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  cursor: pointer;
}
.qa-chip:hover { border-color: var(--gold); }

/* ── FOOTER ─────────────────────────────────────────────────────────── */
.footer {
  text-align: center;
  padding: 20px 0;
  border-top: 1px solid var(--border);
  margin-top: 16px;
}

.footer-motto {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 0.95em;
  color: var(--gold);
  margin-bottom: 12px;
}

.tier-links {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin-bottom: 12px;
}

.tier-link {
  padding: 10px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  text-decoration: none;
  color: var(--text);
  font-size: 0.8em;
}
.tier-link:hover { border-color: var(--gold); }

.footer-brand {
  font-size: 0.75em;
  color: var(--dim);
}

/* ── WALLET BANNER ──────────────────────────────────────────────────── */
.wallet-banner-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.3);
  z-index: 999;
}

.wallet-banner {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 1000;
  animation: slideUp 0.5s ease-out;
}

.wallet-banner-content {
  max-width: 640px;
  margin: 0 auto;
  padding: 24px 28px;
  background: var(--card);
  border-top: 3px solid var(--gold);
  border-radius: 16px 16px 0 0;
  box-shadow: 0 -8px 32px rgba(0,0,0,0.15);
}

.wallet-close {
  position: absolute;
  top: 12px; right: 16px;
  background: none;
  border: none;
  font-size: 18px;
  color: var(--dim);
  cursor: pointer;
}

@keyframes slideUp {
  from { transform: translateY(100%); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* ── SEAL CONFIRMATION ──────────────────────────────────────────────── */
.seal-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: rgba(45, 80, 22, 0.1);
  border: 1px solid var(--success);
  border-radius: 6px;
  font-size: 0.8em;
  color: var(--success);
  margin-top: 8px;
}
</style>

// ── DOC TYPES ──────────────────────────────────────────────────────────

// ── INTENT PARSER (93% LOCAL BRAIN) ────────────────────────────────────
const IntentParser = {
  patterns: {
    create: {
      de: /erstell|schreib|mach|brauch|möchte.*(?:brief|memo|notiz|mail|dokument)/i,
      en: /create|write|make|need|want.*(?:letter|memo|note|mail|document)/i,
      pt: /cri[ea]|escrev|fa[çz]|preciso|quero.*(?:carta|memo|nota|mail|documento)/i
    },
    question: {
      de: /was ist|wie |warum|unterschied|erklär/i,
      en: /what is|how |why|difference|explain/i,
      pt: /o que é|como |por que|diferença|explic/i
    },
    greeting: {
      de: /hallo|guten|hey|moin|servus/i,
      en: /hello|hi |hey|good morning/i,
      pt: /olá|oi |hey|bom dia/i
    },
    thanks: {
      de: /danke|vielen dank/i,
      en: /thank|thanks/i,
      pt: /obrigad|valeu/i
    }
  },
  docTypePatterns: {
    brief: /brief|letter|carta|schreiben|korrespondenz/i,
    memo: /memo|memorand|intern/i,
    notiz: /notiz|note|nota|protokoll|ata/i,
    email: /e-?mail|nachricht|message|mensagem/i
  },
  contextPatterns: {
    formal: /formell|formal|offiziell|professionell/i,
    boss: /chef|boss|vorgesetzt|supervisor|chefe/i,
    landlord: /vermieter|landlord|proprietário/i,
    meeting: /meeting|besprechung|reunião/i
  },

  parse(message) {
    const lang = this.detectLang(message);
    let intent = 'unknown', docType = null, context = [], tone = 'neutral';

    for (const [key, patterns] of Object.entries(this.patterns)) {
      if (Object.values(patterns).some(p => p.test(message))) {
        intent = key;
        break;
      }
    }

    for (const [type, pattern] of Object.entries(this.docTypePatterns)) {
      if (pattern.test(message)) { docType = type; break; }
    }

    for (const [ctx, pattern] of Object.entries(this.contextPatterns)) {
      if (pattern.test(message)) context.push(ctx);
    }

    if (context.includes('formal') || context.includes('boss') || context.includes('landlord')) {
      tone = 'formal';
    }

    if (intent === 'create' && !docType) docType = 'brief';

    return { intent, docType, context, tone, lang };
  },

  detectLang(text) {
    const t = text.toLowerCase();
    if (/\b(der|die|das|und|ist|für|ein|bitte|schreib|erstell)\b/.test(t)) return 'de';
    if (/\b(the|is|are|for|please|write|create|need)\b/.test(t)) return 'en';
    if (/\b(o|a|para|por|preciso|cria|escreve)\b/.test(t)) return 'pt';
    return 'de';
  }
};

// ── DRAGON ROUTER ──────────────────────────────────────────────────────
const DragonRouter = {
  route(parsed) {
    if (parsed.context.some(c => ['landlord', 'boss', 'formal'].includes(c))) return 'guardian';
    if (parsed.intent === 'create') return 'architect';
    if (parsed.intent === 'question') return 'witness';
    return 'guardian';

};

    en: 'The Three Dragons protect your documents: 🛡️ Guardian (Ethics & Protection), 🏗️ Architect (Structure & Build), 👁️ Witness (Observation & Validation).',
    pt: 'Os Três Dragões protegem seus documentos: 🛡️ Guardião (Ética & Proteção), 🏗️ Arquiteto (Estrutura & Construção), 👁️ Testemunha (Observação & Validação).'
  },
  memo_vs_notiz: {
    de: 'Memo = Aufforderung zum Handeln (geht an andere). Notiz = Aufzeichnung (für sich selbst). Das Memo fordert Aktion, die Notiz dokumentiert.',
    en: 'Memo = call to action (goes to others). Note = record (for yourself). A memo requests action, a note documents.',

// ── RESPONSE GENERATOR ─────────────────────────────────────────────────
const ResponseGenerator = {
  generate(message) {
    const parsed = IntentParser.parse(message);
    const dragon = DragonRouter.route(parsed);
    const lang = parsed.lang;

    if (parsed.intent === 'greeting') {
      return {
        dragon,
        text: {
          de: 'Willkommen! Was möchten Sie erstellen?',
          en: 'Welcome! What would you like to create?',
          pt: 'Bem-vindo! O que deseja criar?'
        }[lang],
        showQuickActions: true
      };
    }

    if (parsed.intent === 'thanks') {
      return {
        dragon: 'guardian',
        text: { de: 'Gern geschehen! 🐉', en: 'You\'re welcome! 🐉', pt: 'De nada! 🐉' }[lang]
      };
    }

    if (parsed.intent === 'create' && parsed.docType) {
      const doc = DOC_TYPES[parsed.docType];
      return {
        dragon,
        text: {
          de: `Ich erstelle einen ${doc.name.de}. Bitte füllen Sie die Felder aus:`,
          en: `Creating a ${doc.name.en}. Please fill in the fields:`,
          pt: `Criando um(a) ${doc.name.pt}. Preencha os campos:`
        }[lang],
        showForm: true,
        formType: parsed.docType,
        presets: { tone: parsed.tone }
      };
    }

    if (parsed.intent === 'question') {
      const t = message.toLowerCase();
      if (t.includes('windi')) return { dragon: 'witness', text: KNOWLEDGE.windi[lang] };
      if (t.includes('dragon') || t.includes('drachen') || t.includes('dragão')) return { dragon: 'witness', text: KNOWLEDGE.dragons[lang] };
      if (t.includes('memo') && (t.includes('notiz') || t.includes('note') || t.includes('nota'))) {
        return { dragon: 'witness', text: KNOWLEDGE.memo_vs_notiz[lang] };
      }
      return { dragon: 'witness', text: { de: 'Fragen Sie mich zu WINDI, den Drachen, oder Dokumenttypen!', en: 'Ask me about WINDI, the Dragons, or document types!', pt: 'Pergunte sobre o WINDI, os Dragões, ou tipos de documentos!' }[lang] };
    }

    // Default: offer help
    return {
      dragon: 'guardian',
      text: {
        de: 'Ich kann Ihnen helfen:\n• **Dokumente erstellen** — Brief, Memo, Notiz, E-Mail\n• **Fragen beantworten** — über WINDI und Governance\n\nWas möchten Sie tun?',
        en: 'I can help you:\n• **Create documents** — Letter, Memo, Note, Email\n• **Answer questions** — about WINDI and governance\n\nWhat would you like to do?',
        pt: 'Posso te ajudar:\n• **Criar documentos** — Carta, Memo, Nota, E-Mail\n• **Responder perguntas** — sobre WINDI e governança\n\nO que deseja fazer?'
      }[lang],
      showQuickActions: true
    };
  }
};

// ── SESSION TIMER (5 min → Banner) ─────────────────────────────────────
const SessionTimer = {
  TRIGGER_MS: 5 * 60 * 1000,
  activeTime: 0,
  lastActivity: null,
  triggered: false,

  init(callback) {
    if (this.hasWallet()) return;
    if (sessionStorage.getItem('windi_banner_shown') === 'true') return;

    this.callback = callback;
    this.lastActivity = Date.now();

    ['keydown', 'click', 'scroll'].forEach(evt => {
      document.addEventListener(evt, () => this.recordActivity(), { passive: true });
    });

    setInterval(() => this.tick(), 1000);
  },

  recordActivity() {
    const now = Date.now();
    if (this.lastActivity && (now - this.lastActivity) < 10000) {
      this.activeTime += (now - this.lastActivity);
    }
    this.lastActivity = now;
  },

  tick() {
    if (this.triggered) return;
    if (this.activeTime >= this.TRIGGER_MS) {
      this.triggered = true;
      sessionStorage.setItem('windi_banner_shown', 'true');
      this.callback?.();
    }
  },

  hasWallet() {
    return !!localStorage.getItem('windi_wallet_id');
  }
};

// ── INLINE FORM COMPONENT ──────────────────────────────────────────────
function InlineForm({ formType, lang, presets, onGenerate }) {
  const doc = DOC_TYPES[formType];
  const [fields, setFields] = useState(() => {
    const init = {};
    doc.fields.forEach(f => {
      init[f.id] = f.type === 'date' ? new Date().toISOString().split('T')[0] : (presets?.[f.id] || '');
    });
    return init;
  });
  const [showPreview, setShowPreview] = useState(false);

  const getPreview = () => {
    let out = doc.template[lang] || doc.template.de;
    Object.entries(fields).forEach(([k, v]) => {
      out = out.replace(new RegExp(`\\{${k}\\}`, 'g'), v || `[${k}]`);
    });
    return out;
  };

  const t = T[lang] || T.de;

  return (
    <div className="inline-form">
      {doc.fields.map(f => (
        <div key={f.id} className="form-row">
          <label>{f.label[lang] || f.label.de}</label>
          {f.type === 'textarea' ? (
            <textarea value={fields[f.id]} onChange={e => setFields({...fields, [f.id]: e.target.value})} />
          ) : f.type === 'select' ? (
            <select value={fields[f.id]} onChange={e => setFields({...fields, [f.id]: e.target.value})}>
              <option value="">--</option>
              {(f.options[lang] || f.options.de).map(o => <option key={o} value={o}>{o}</option>)}
            </select>
          ) : (
            <input type={f.type} value={fields[f.id]} onChange={e => setFields({...fields, [f.id]: e.target.value})} />
          )}
        </div>
      ))}
      <div className="form-actions">
        <button className="btn-preview" onClick={() => setShowPreview(!showPreview)}>
          👁️ {t.preview}
        </button>
        <button className="btn-download" onClick={() => onGenerate(formType, fields, getPreview())}>
          📥 {t.download}
        </button>
      </div>
      {showPreview && <div className="preview-box">{getPreview()}</div>}
    </div>
  );
}

// ── MAIN APP ───────────────────────────────────────────────────────────
function App() {
  const [lang, setLang] = useState(() => {
    const nav = navigator.language?.substring(0, 2);
    return ['de', 'en', 'pt'].includes(nav) ? nav : 'de';
  });
  const [theme, setTheme] = useState(() => localStorage.getItem('windi_theme') || 'klar');
  const [messages, setMessages] = useState([]);
  const [input, setInput] = useState('');
  const [showBanner, setShowBanner] = useState(false);
  const [walletId, setWalletId] = useState(() => localStorage.getItem('windi_wallet_id'));
  const [didName, setDidName] = useState(() => localStorage.getItem('windi_did_name'));
  const chatRef = useRef(null);

  const t = T[lang] || T.de;

  // Theme
  useEffect(() => {
    document.body.setAttribute('data-theme', theme === 'noir' ? 'noir' : '');
    localStorage.setItem('windi_theme', theme);
  }, [theme]);

  // Welcome message
  useEffect(() => {
    setMessages([{
      id: Date.now(),
      role: 'agent',
      dragon: 'guardian',
      text: t.welcome,
      showQuickActions: true
    }]);
    SessionTimer.init(() => setShowBanner(true));
  }, []);

  // Scroll to bottom
  useEffect(() => {
    if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
  }, [messages]);

  // Send message
  const send = useCallback(() => {
    if (!input.trim()) return;

    const userMsg = { id: Date.now(), role: 'user', text: input.trim() };
    setMessages(prev => [...prev, userMsg]);
    setInput('');

    setTimeout(() => {
      const response = ResponseGenerator.generate(userMsg.text);
      setLang(IntentParser.parse(userMsg.text).lang);
      setMessages(prev => [...prev, { id: Date.now(), role: 'agent', ...response }]);
    }, 200);
  }, [input]);

  // Quick action
  const handleQuickAction = (type) => {
    const doc = DOC_TYPES[type];
    const dragon = 'architect';
    setMessages(prev => [...prev, {
      id: Date.now(),
      role: 'agent',
      dragon,
      text: { de: `Ich erstelle einen ${doc.name.de}:`, en: `Creating a ${doc.name.en}:`, pt: `Criando um(a) ${doc.name.pt}:` }[lang],
      showForm: true,
      formType: type
    }]);
  };

  // Generate DOCX
  const handleGenerate = async (type, fields, preview) => {
    const { Document, Packer, Paragraph, TextRun } = docx;
    const doc = new Document({
      sections: [{ children: preview.split('\n').map(line => new Paragraph({ children: [new TextRun({ text: line, font: 'Arial', size: 24 })] })) }]
    });
    const blob = await Packer.toBlob(doc);
    const filename = `WINDI_${DOC_TYPES[type].name[lang]}_${new Date().toISOString().split('T')[0]}.docx`;
    saveAs(blob, filename);

    // Confirmation message
    const sealed = walletId;
    setMessages(prev => [...prev, {
      id: Date.now(),
      role: 'agent',
      dragon: 'guardian',
      text: sealed
        ? { de: '✅ Dokument erstellt und versiegelt!', en: '✅ Document created and sealed!', pt: '✅ Documento criado e selado!' }[lang]
        : { de: '✅ Dokument erstellt! Download gestartet.', en: '✅ Document created! Download started.', pt: '✅ Documento criado! Download iniciado.' }[lang],
      sealed
    }]);
  };

  // Handle register (simplified for now)
  const handleRegister = () => {
    const id = 'WALLET-' + Date.now();
    localStorage.setItem('windi_wallet_id', id);
    localStorage.setItem('windi_did_name', 'User');
    setWalletId(id);
    setDidName('User');
    setShowBanner(false);
    setMessages(prev => [...prev, {
      id: Date.now(),
      role: 'agent',
      dragon: 'guardian',
      text: { de: '🪞 Willkommen! Ihre Identität ist aktiv. Alle Dokumente werden jetzt versiegelt.', en: '🪞 Welcome! Your identity is active. All documents will now be sealed.', pt: '🪞 Bem-vindo! Sua identidade está ativa. Todos os documentos serão selados.' }[lang]
    }]);
  };

  return (
    <>
      {/* Header */}
      <header className="header">
        <div className="header-left">
          <h1>🐉 WINDI Palette</h1>
          <span className="tier-badge">Personal</span>
        </div>
        <div className="header-right">
          {walletId ? (
            <div className="did-badge">🪞 {didName?.split(' ')[0] || 'ID'} <span className="did-dot" /></div>
          ) : (
            <div className="anon-badge">👤 {t.anon}</div>
          )}
          <div style={{ display: 'flex', gap: 4 }}>
            {['de', 'en', 'pt'].map(l => (
              <button key={l} className={`lang-btn ${lang === l ? 'active' : ''}`} onClick={() => setLang(l)}>{l.toUpperCase()}</button>
            ))}
          </div>
          <button className="theme-toggle" onClick={() => setTheme(theme === 'klar' ? 'noir' : 'klar')}>
            {theme === 'klar' ? '🌙' : '☀️'}
          </button>
        </div>
      </header>

      {/* Chat Container */}
      <div className="chat-container">
        <div className="chat-messages" ref={chatRef}>
          {messages.map(msg => (
            <div key={msg.id} className={`message ${msg.role} ${msg.dragon || ''}`}>
              {msg.role === 'agent' && (
                <div className={`dragon-badge ${msg.dragon}`}>
                  {msg.dragon === 'guardian' && '🛡️ Guardian'}
                  {msg.dragon === 'architect' && '🏗️ Architect'}
                  {msg.dragon === 'witness' && '👁️ Witness'}
                </div>
              )}
              <div className="message-text" dangerouslySetInnerHTML={{ __html: msg.text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br/>') }} />
              {msg.showQuickActions && (
                <div className="quick-actions">
                  {Object.entries(DOC_TYPES).map(([k, d]) => (
                    <button key={k} className="quick-action-btn" onClick={() => handleQuickAction(k)}>
                      {d.icon} {d.name[lang] || d.name.de}
                    </button>
                  ))}
                </div>
              )}
              {msg.showForm && <InlineForm formType={msg.formType} lang={lang} presets={msg.presets} onGenerate={handleGenerate} />}
              {msg.sealed && <div className="seal-badge">🔏 {t.sealed}</div>}
            </div>
          ))}
        </div>

        {/* Input Bar */}
        <div className="input-bar">
          <input
            value={input}
            onChange={e => setInput(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && send()}
            placeholder={t.inputPlaceholder}
          />
          <button onClick={send} disabled={!input.trim()}>{t.send}</button>
        </div>
      </div>

      {/* Quick Access */}
      <div className="quick-access">
        <span className="qa-label">📋 {t.templates}:</span>
        {['brief', 'memo', 'notiz', 'email'].map(k => (
          <span key={k} className="qa-chip" onClick={() => handleQuickAction(k)}>
            {DOC_TYPES[k].icon} {DOC_TYPES[k].name[lang]}
          </span>
        ))}
        <span className="qa-label" style={{ marginLeft: 12 }}>❓ {t.faq}:</span>
        <span className="qa-chip" onClick={() => { setInput('Was ist WINDI?'); setTimeout(send, 100); }}>WINDI</span>
        <span className="qa-chip" onClick={() => { setInput('Die drei Drachen'); setTimeout(send, 100); }}>Dragons</span>
      </div>

      {/* Footer */}
      <footer className="footer">
        <div className="footer-motto">{t.motto}</div>
        <div className="tier-links">
          <a href="palette-org.html" className="tier-link">🏢 Organization</a>
          <a href="palette-gov.html" className="tier-link">🏛️ Governance</a>
        </div>
        <div className="footer-brand">WINDI Governance Institute · v1.0.0-P<br/>🛡️ Guardian · 🏗️ Architect · 👁️ Witness</div>
      </footer>

      {/* Wallet Banner */}
      {showBanner && <WalletBanner lang={lang} onClose={() => setShowBanner(false)} onRegister={handleRegister} />}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
