<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WINDI Palette — Governance</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="shared/core.js"></script>
<script src="shared/dragons.js"></script>
<script src="TenantAuditCollector.js"></script>
<script src="TenantStamp.js"></script>
<style>
:root {
  --bg: #F8F6F2;
  --card: #FFFFFF;
  --text: #1A1A1A;
  --accent: #8B2500;
  --accent-light: #8B250015;
  --accent-gold: #B8860B;
  --border: #E0DCD5;
  --success: #2D5016;
  --witness: #1E3A5F;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}
.container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 20px;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 0;
  border-bottom: 3px solid var(--accent);
  margin-bottom: 16px;
}
.header h1 {
  font-size: 1.5em;
  font-weight: 700;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 10px;
}
.tier-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: linear-gradient(135deg, var(--accent), #5C1A00);
  color: white;
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 0.9em;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(139, 37, 0, 0.3);
}
.dragon-bar {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
  padding: 10px 16px;
  background: var(--card);
  border-radius: 10px;
  border: 1px solid var(--border);
}
.dragon-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 0.8em;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.dragon-chip.guardian { background: #2D501622; color: #2D5016; border: 1px solid #2D501644; }
.dragon-chip.architect { background: #4A372822; color: #4A3728; border: 1px solid #4A372844; }
.dragon-chip.witness { background: #1E3A5F22; color: #1E3A5F; border: 1px solid #1E3A5F44; }
.dragon-chip.active { box-shadow: 0 0 0 2px currentColor; }
.status-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.status-cell {
  padding: 10px;
  background: var(--card);
  border-radius: 8px;
  border: 1px solid var(--border);
  text-align: center;
  font-size: 0.8em;
}
.status-cell .value {
  font-size: 1.2em;
  font-weight: 700;
  color: var(--accent);
}
.status-cell .label {
  color: #666;
  font-size: 0.75em;
}
.chat-area {
  background: var(--card);
  border-radius: 12px;
  border: 1px solid var(--border);
  min-height: 400px;
  max-height: 50vh;
  overflow-y: auto;
  padding: 16px;
  margin-bottom: 16px;
}
.message {
  margin-bottom: 14px;
  padding: 14px 18px;
  border-radius: 12px;
  max-width: 88%;
}
.message.human {
  background: #F0EDE8;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}
.message.agent {
  background: linear-gradient(135deg, #FDFCFA, #F8F6F2);
  border-left: 4px solid var(--accent);
  border-bottom-left-radius: 4px;
}
.message.agent.guardian { border-left-color: #2D5016; }
.message.agent.architect { border-left-color: #4A3728; }
.message.agent.witness { border-left-color: #1E3A5F; }
.message .dragon-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  font-size: 0.85em;
  font-weight: 500;
}
.message .meta-row {
  display: flex;
  gap: 12px;
  margin-top: 10px;
  padding-top: 8px;
  border-top: 1px solid #E0DCD5;
  font-size: 0.7em;
  color: #888;
}
.message .meta-row span {
  display: flex;
  align-items: center;
  gap: 4px;
}
.governance-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 0.7em;
  font-weight: 600;
}
.governance-badge.high { background: #8B250022; color: #8B2500; }
.governance-badge.medium { background: #B8860B22; color: #B8860B; }
.governance-badge.low { background: #2D501622; color: #2D5016; }
.input-area {
  display: flex;
  gap: 12px;
}
.input-area input {
  flex: 1;
  padding: 16px 20px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 1em;
  outline: none;
  transition: all 0.2s;
}
.input-area input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-light);
}
.input-area button {
  padding: 16px 32px;
  background: linear-gradient(135deg, var(--accent), #5C1A00);
  color: white;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-weight: 700;
  transition: transform 0.1s;
}
.input-area button:hover {
  transform: scale(1.02);
}
.input-area button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}
.features-panel {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 16px;
}
.feature-box {
  padding: 14px;
  background: var(--card);
  border-radius: 10px;
  border: 1px solid var(--border);
}
.feature-box h4 {
  font-size: 0.85em;
  color: var(--accent);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.feature-box ul {
  list-style: none;
  font-size: 0.8em;
}
.feature-box li {
  padding: 3px 0;
  display: flex;
  align-items: center;
  gap: 6px;
}
.loading-bar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 16px;
  background: var(--accent-light);
  border-radius: 8px;
  color: var(--accent);
}
.loading-bar .spinner {
  width: 18px;
  height: 18px;
  border: 2px solid var(--accent-light);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.tenant-stamp {
  font-size: 0.7em;
  padding: 4px 8px;
  background: #1E3A5F22;
  border-radius: 4px;
  color: #1E3A5F;
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>🐉 WINDI Palette</h1>
    <div class="tier-badge">🏛️ Governance</div>
  </div>

  <div id="app"></div>
</div>

<script type="text/babel">
const { useState, useRef, useEffect } = React;

// ═══════════════════════════════════════════════════════════════════════
// WINDI PALETTE GOVERNANCE — HIGH Tier (Enterprise)
// Full features: LLM, Ledger, Vault, 14 doc types, Audit, Multi-tenant
// ═══════════════════════════════════════════════════════════════════════

const TIER = 'HIGH';
const TIER_CONFIG = {
  label: 'Governance',
  llm: true,
  llmBudget: 8000,
  ledger: true,
  vault: true,
  maxDocs: 500,
  types: ['letter', 'memo', 'note', 'email', 'report', 'contract', 'invoice',
          'protocol', 'analysis', 'presentation', 'security_advisory',
          'governance_decision', 'communique', 'certificate'],
  formats: ['docx', 'pdf', 'xlsx', 'pptx', 'jmpg']
};

const DOC_TYPES = {
  letter: { icon: '✉️', de: 'Brief' },
  memo: { icon: '📋', de: 'Memo' },
  report: { icon: '📊', de: 'Bericht' },
  contract: { icon: '📜', de: 'Vertrag' },
  invoice: { icon: '🧾', de: 'Rechnung' },
  protocol: { icon: '📑', de: 'Protokoll' },
  analysis: { icon: '🔍', de: 'Analyse' },
  presentation: { icon: '📽️', de: 'Präsentation' },
  security_advisory: { icon: '🛡️', de: 'Sicherheitshinweis' },
  governance_decision: { icon: '⚖️', de: 'Governance-Entscheidung' },
  communique: { icon: '📡', de: 'Communiqué' },
  certificate: { icon: '🏆', de: 'Zertifikat' }
};

function App() {
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState('');
  const [isLoading, setIsLoading] = useState(false);
  const [lang, setLang] = useState('de');
  const [activeDragon, setActiveDragon] = useState(null);
  const [dragonStatus, setDragonStatus] = useState({ connected: null, llm: false, model: null });
  const [stats, setStats] = useState({ docs: 0, sealed: 0, tokens: 0 });
  const [tenant, setTenant] = useState(WINDI_Core.Tenant.profile);
  const chatRef = useRef(null);

  useEffect(() => {
    // Initialize tenant audit
    if (window.WINDI_TenantAudit) {
      window.WINDI_TenantAudit.init(tenant.tenant_id);
    }

    // Check Dragon Server health
    WINDI_Core.dragonHealth().then(health => {
      setDragonStatus({
        connected: health.status === 'alive',
        llm: health.api_key_configured,
        model: health.model,
        budget: health.budget
      });
    });

    // Welcome message
    const welcomeMsg = {
      role: 'agent',
      dragon: 'guardian',
      text: `🐉 **WINDI Governance** — Institutional Grade\n\n_"KI verarbeitet. Mensch entscheidet. WINDI garantiert."_\n\nAlle **14 Dokumenttypen** verfügbar. Volle KI-Analyse, Forensic Ledger, Vault und Multi-Tenant-Isolation aktiv.\n\n**Three Dragons Protocol:**\n🛡️ Guardian — Schutz & Compliance\n🏗️ Architect — Struktur & Erstellung\n👁️ Witness — Audit & Verifizierung`,
      governance: { level: 'HIGH', risk: 'R0' },
      ts: new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})
    };
    setMsgs([welcomeMsg]);
  }, []);

  useEffect(() => {
    if (chatRef.current) {
      chatRef.current.scrollTop = chatRef.current.scrollHeight;
    }
  }, [msgs]);

  const send = async () => {
    if (!input.trim() || isLoading) return;

    const userMsg = {
      role: 'human',
      text: input.trim(),
      ts: new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})
    };
    setMsgs(prev => [...prev, userMsg]);
    setInput('');
    setIsLoading(true);

    const detectedLang = WINDI_Core.detectLang(userMsg.text) || lang;
    setLang(detectedLang);

    // Track in tenant audit
    if (window.WINDI_TenantAudit) {
      window.WINDI_TenantAudit.trackMessage({
        tenantId: tenant.tenant_id,
        role: 'user',
        risk: 'R0'
      });
    }

    try {
      const dragon = await WINDI_Core.dragonChat(userMsg.text, {
        tier: 'HIGH',
        language: detectedLang,
        history: msgs.slice(-8).map(m => ({ role: m.role, text: m.text }))
      });

      if (dragon && dragon.message) {
        const dragonName = dragon.dragon || WINDI_Dragons.routeDragon(userMsg.text);
        setActiveDragon(dragonName);

        // Determine governance level from response
        let govLevel = 'medium';
        if (dragon.metadata?.governance_level) {
          govLevel = dragon.metadata.governance_level.toLowerCase();
        } else if (userMsg.text.match(/compliance|audit|governance|risk|security/i)) {
          govLevel = 'high';
        }

        setMsgs(prev => [...prev, {
          role: 'agent',
          dragon: dragonName,
          text: dragon.message,
          source: dragon.source,
          metadata: dragon.metadata,
          governance: {
            level: govLevel.toUpperCase(),
            risk: dragon.metadata?.risk || 'R2'
          },
          ts: new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})
        }]);

        // Update stats
        if (dragon.metadata) {
          setStats(prev => ({
            docs: prev.docs + 1,
            sealed: dragon.metadata.ledger_receipt ? prev.sealed + 1 : prev.sealed,
            tokens: prev.tokens + (dragon.metadata.input_tokens || 0) + (dragon.metadata.output_tokens || 0)
          }));
        }
      } else {
        // Fallback
        setMsgs(prev => [...prev, {
          role: 'agent',
          dragon: 'guardian',
          text: `⚠️ Sovereign mode active. ${WINDI_Core.chatRespond('greeting', detectedLang)}`,
          source: 'sovereign',
          governance: { level: 'LOW', risk: 'R0' },
          ts: new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})
        }]);
      }
    } catch (err) {
      console.error('Chat error:', err);
      setMsgs(prev => [...prev, {
        role: 'agent',
        dragon: 'guardian',
        text: '⚠️ Connection issue. Governance controls remain active.',
        source: 'error',
        governance: { level: 'HIGH', risk: 'R4' },
        ts: new Date().toLocaleTimeString('de-DE', {hour:'2-digit', minute:'2-digit'})
      }]);
    }

    setIsLoading(false);
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  };

  return (
    <>
      {/* Dragon Selection Bar */}
      <div className="dragon-bar">
        <div className={`dragon-chip guardian ${activeDragon === 'guardian' ? 'active' : ''}`}>
          🛡️ Guardian
        </div>
        <div className={`dragon-chip architect ${activeDragon === 'architect' ? 'active' : ''}`}>
          🏗️ Architect
        </div>
        <div className={`dragon-chip witness ${activeDragon === 'witness' ? 'active' : ''}`}>
          👁️ Witness
        </div>
        <div style={{ marginLeft: 'auto' }}>
          <span className="tenant-stamp">🏛️ {tenant.tenant_id}</span>
        </div>
      </div>

      {/* Status Grid */}
      <div className="status-grid">
        <div className="status-cell">
          <div className="value" style={{ color: dragonStatus.connected ? '#2D5016' : '#888' }}>
            {dragonStatus.connected ? '●' : '○'}
          </div>
          <div className="label">Dragon Server</div>
        </div>
        <div className="status-cell">
          <div className="value">{dragonStatus.llm ? '●' : '○'}</div>
          <div className="label">LLM Active</div>
        </div>
        <div className="status-cell">
          <div className="value">{stats.docs}</div>
          <div className="label">Documents</div>
        </div>
        <div className="status-cell">
          <div className="value">{stats.sealed}</div>
          <div className="label">Sealed</div>
        </div>
        <div className="status-cell">
          <div className="value">{stats.tokens.toLocaleString()}</div>
          <div className="label">Tokens</div>
        </div>
      </div>

      {/* Chat Area */}
      <div className="chat-area" ref={chatRef}>
        {msgs.map((msg, i) => (
          <div key={i} className={`message ${msg.role} ${msg.dragon || ''}`}>
            {msg.role === 'agent' && (
              <div className="dragon-header">
                {WINDI_Dragons.dragonBadge(msg.dragon, lang)}
                {msg.governance && (
                  <span className={`governance-badge ${msg.governance.level.toLowerCase()}`}>
                    {msg.governance.level} / {msg.governance.risk}
                  </span>
                )}
                {msg.source && <span style={{ opacity: 0.5, fontSize: '0.9em' }}>({msg.source})</span>}
              </div>
            )}
            <div dangerouslySetInnerHTML={{ __html: msg.text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/_(.*?)_/g, '<em>$1</em>').replace(/\n/g, '<br/>') }} />
            {msg.metadata && (
              <div className="meta-row">
                {msg.metadata.input_tokens && (
                  <span>📊 {msg.metadata.input_tokens + msg.metadata.output_tokens} tokens</span>
                )}
                {msg.metadata.model && (
                  <span>🤖 {msg.metadata.model.split('-').slice(-2).join('-')}</span>
                )}
                {msg.metadata.ledger_receipt && (
                  <span>🔏 Sealed</span>
                )}
              </div>
            )}
          </div>
        ))}
        {isLoading && (
          <div className="loading-bar">
            <div className="spinner" />
            <span>🐉 Dragon Council analyzing... Governance checks active.</span>
          </div>
        )}
      </div>

      {/* Input Area */}
      <div className="input-area">
        <input
          type="text"
          value={input}
          onChange={e => setInput(e.target.value)}
          onKeyDown={handleKeyDown}
          placeholder="Governance-Anfrage eingeben..."
          disabled={isLoading}
        />
        <button onClick={send} disabled={isLoading || !input.trim()}>
          {isLoading ? '⏳' : '🐉 Send'}
        </button>
      </div>

      {/* Features Panel */}
      <div className="features-panel">
        <div className="feature-box">
          <h4>📄 Dokumente</h4>
          <ul>
            {Object.entries(DOC_TYPES).slice(0, 4).map(([k, v]) => (
              <li key={k}>{v.icon} {v.de}</li>
            ))}
          </ul>
        </div>
        <div className="feature-box">
          <h4>📊 Business</h4>
          <ul>
            {Object.entries(DOC_TYPES).slice(4, 8).map(([k, v]) => (
              <li key={k}>{v.icon} {v.de}</li>
            ))}
          </ul>
        </div>
        <div className="feature-box">
          <h4>🏛️ Governance</h4>
          <ul>
            {Object.entries(DOC_TYPES).slice(8).map(([k, v]) => (
              <li key={k}>{v.icon} {v.de}</li>
            ))}
          </ul>
        </div>
        <div className="feature-box">
          <h4>🔧 Enterprise</h4>
          <ul>
            <li>🤖 Full LLM</li>
            <li>📜 Forensic Ledger</li>
            <li>🏛️ Vault Storage</li>
            <li>🔐 Multi-Tenant</li>
            <li>📡 Communiqué</li>
          </ul>
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>

</body>
</html>
