// ── HELPER FUNCTIONS ────────────────────────────────────────
const typeColors = { enforcement:"red", gate:"gold", receipt:"blue", observability:"green" };
const typeIcons = { enforcement:"🔒", gate:"🚪", receipt:"📋", observability:"📊" };
const priorityLabels = { P0:"SUPREME", P1:"HIGH", P2:"STANDARD" };
const statusLabels = { new:"NEW", partial:"PARTIAL", existing:"EXISTS" };

function getStats(data) {
  const services = Object.values(data);
  let total=0, newG=0, partialG=0, existingG=0;
  services.forEach(svc => svc.endpoints.forEach(ep => ep.gates.forEach(g => {
    total++; if(g.status==="new") newG++; else if(g.status==="partial") partialG++; else existingG++;
  })));
  return { total, new:newG, partial:partialG, existing:existingG, services:services.length };
}

function StatCard({ label, value, color, T }) {

    </div>
  );
}

function GateRow({ gate, T }) {

          <span style={{ fontSize:9, fontFamily:"'JetBrains Mono'",
            color:gate.status==="new"?T.red:gate.status==="partial"?T.orange:T.green,
            background:(gate.status==="new"?T.red:gate.status==="partial"?T.orange:T.green)+"18",

    </div>
  );
}

function ServiceCard({ svcKey, svc, T, expanded, onToggle, expandedEp, onToggleEp }) {
  const gateCount = svc.endpoints.reduce((s,ep) => s + ep.gates.length, 0);
  const newCount = svc.endpoints.reduce((s,ep) => s + ep.gates.filter(g=>g.status==="new").length, 0);
  return (
    <div className="fade-in" style={{ background:T.card, border:`1px solid ${expanded?T.gold:T.border}`,
      borderRadius:10, overflow:"hidden" }}>
      <div onClick={onToggle} style={{ padding:"14px 18px", display:"flex", justifyContent:"space-between",
        alignItems:"center", cursor:"pointer", background:expanded?T.gold+"10":"transparent" }}>
        <div>
          <span style={{ fontSize:18, marginRight:8 }}>{svc.icon}</span>
          <span style={{ fontSize:15, fontWeight:600, color:T.text }}>{svc.name}</span>
          <span style={{ fontSize:11, color:T.dim, marginLeft:10, fontFamily:"'JetBrains Mono'" }}>:{svc.port}</span>
        </div>
        <div style={{ display:"flex", gap:8, alignItems:"center" }}>
          {newCount > 0 && <span style={{ fontSize:10, fontFamily:"'JetBrains Mono'", color:T.red,
            background:T.red+"18", padding:"2px 8px", borderRadius:10 }}>{newCount} new</span>}
          <span style={{ fontSize:11, fontFamily:"'JetBrains Mono'", color:T.dim }}>{gateCount} gates</span>
          <span style={{ fontSize:11, color:T.gold }}>{expanded?"▼":"▶"}</span>
        </div>
      </div>
      {expanded && (
        <div style={{ padding:"0 18px 14px" }}>
          {svc.endpoints.map((ep, ei) => {
            const epKey = `${svcKey}-${ei}`;
            return (
              <div key={ei} style={{ marginTop:10 }}>
                <div onClick={(e)=>{e.stopPropagation();onToggleEp(epKey);}}
                  style={{ display:"flex", alignItems:"center", gap:8, padding:"8px 12px",
                    background:T.hover, borderRadius:6, cursor:"pointer" }}>
                  <span style={{ fontSize:10, fontFamily:"'JetBrains Mono'", color:T.green, fontWeight:600,
                    background:T.green+"18", padding:"2px 8px", borderRadius:3 }}>{ep.method}</span>
                  <span style={{ fontSize:13, fontFamily:"'JetBrains Mono'", color:T.text }}>{ep.path}</span>
                  <span style={{ fontSize:10, color:T.dim, marginLeft:"auto" }}>{ep.gates.length} gates</span>
                  <span style={{ fontSize:10, color:T.gold }}>{expandedEp===epKey?"▾":"▸"}</span>

    </div>
  );

    </div>

}

                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                  <span style={{ fontSize:14, fontWeight:700, color:hsg.color,
                    fontFamily:"'JetBrains Mono'" }}>{hsg.type}</span>
                  <span style={{ fontSize:10, color:T.dim, fontFamily:"'JetBrains Mono'",
                    background:T.hover, padding:"2px 8px", borderRadius:3 }}>{hsg.timeout}</span>
                </div>
                <div style={{ fontSize:12, color:T.dim, marginTop:6 }}>{hsg.trigger}</div>
              </div>
            ))}
            <div style={{ marginTop:12, padding:"12px 16px", background:T.gold+"10",
              border:`1px solid ${T.gold}30`, borderRadius:8, fontSize:12, color:T.gold }}>
              <strong>Inviolability Principle:</strong> No automated process may simulate, bypass, or pre-authorize a Human Sovereignty Gate.
              Gates exist in the execution path, not in configuration.
            </div>
          </div>
        )}

        {/* SGE VIEW */}
        {view==="sge" && (
          <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
            <div style={{ fontSize:14, fontWeight:600, color:T.gold, marginBottom:8 }}>
              SGE Risk Escalation Matrix (R0–R5)
            </div>
            {SGE_LEVELS.map(sge => (
              <div key={sge.level} style={{ display:"flex", alignItems:"center", gap:12,
                padding:"10px 14px", background:T.card, border:`1px solid ${T.border}`, borderRadius:6 }}>
                <span style={{ fontSize:16, fontWeight:800, color:sge.color,
                  fontFamily:"'JetBrains Mono'", minWidth:32 }}>{sge.level}</span>
                <span style={{ fontSize:12, color:T.text, minWidth:80 }}>{sge.name}</span>
                <span style={{ fontSize:11, color:T.dim, flex:1 }}>{sge.response}</span>
                <span style={{ fontSize:10, fontFamily:"'JetBrains Mono'",
                  color:sge.gate==="None"?T.muted:sge.color,
                  background:sge.gate==="None"?"transparent":sge.color+"18",
                  padding:"2px 8px", borderRadius:3 }}>{sge.gate}</span>
              </div>
            ))}
            <div style={{ marginTop:12, padding:"12px 16px", background:T.blue+"10",
              border:`1px solid ${T.blue}30`, borderRadius:8, fontSize:12, color:T.blue }}>
              <strong>Triple Checkpoint:</strong> SGE checks at pre-processing, mid-processing, and final output.
              Inter-agent communication also scanned — R2+ triggers HSG-REVIEW.
            </div>
          </div>
        )}

        {/* PHASES VIEW */}
        {view==="phases" && (
          <div style={{ display:"flex", flexDirection:"column", gap:14 }}>
            {PHASES.map(phase => (
              <div key={phase.phase} style={{ background:T.card, border:`1px solid ${T.border}`,
                borderRadius:10, padding:18 }}>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
                  <div>
                    <span style={{ fontSize:16, fontWeight:700, color:T.gold }}>Phase {phase.phase}: </span>
                    <span style={{ fontSize:16, fontWeight:600, color:T.text }}>{phase.name}</span>
                  </div>
                  <span style={{ fontSize:11, fontFamily:"'JetBrains Mono'", color:T.dim,
                    background:T.hover, padding:"4px 10px", borderRadius:4 }}>Weeks {phase.weeks}</span>
                </div>
                {phase.items.map((item, i) => (
                  <div key={i} style={{ display:"flex", gap:8, alignItems:"center", fontSize:13,
                    color:T.dim, marginBottom:4 }}>
                    <span style={{ color:T.gold, fontSize:10 }}>▸</span> {item}
                  </div>
                ))}
                <div style={{ marginTop:12, padding:"8px 12px", background:T.gold+"10", borderRadius:6,
                  border:`1px solid ${T.gold}30`, fontSize:12, color:T.gold }}>
                  <strong>Entrega:</strong> {phase.delivers}
                </div>
              </div>
            ))}
          </div>
        )}

        {/* MATRIX VIEW */}
        {view==="matrix" && (
          <div style={{ overflowX:"auto" }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:11,
              fontFamily:"'JetBrains Mono'" }}>
              <thead>
                <tr>
                  {["Service","Endpoint","Gate","Type","§","Priority","Status"].map(h => (
                    <th key={h} style={{ padding:"10px 6px", textAlign:"left", color:T.gold,
                      borderBottom:`2px solid ${T.gold}30`, fontSize:9, letterSpacing:1 }}>{h.toUpperCase()}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {Object.entries(GATES_DATA).flatMap(([key, svc]) =>
                  svc.endpoints.flatMap((ep, ei) =>
                    ep.gates.map((gate, gi) => (
                      <tr key={`${key}-${ei}-${gi}`} style={{ borderBottom:`1px solid ${T.border}` }}>
                        <td style={{ padding:"6px", color:T.dim, fontSize:10 }}>{gi===0&&ei===0?svc.name:""}</td>
                        <td style={{ padding:"6px", color:T.text, fontSize:9 }}>{gi===0?`${ep.method} ${ep.path}`:""}</td>
                        <td style={{ padding:"6px", color:T[typeColors[gate.type]], fontWeight:600, fontSize:10 }}>{gate.gate}</td>
                        <td style={{ padding:"6px" }}>
                          <span style={{ color:T[typeColors[gate.type]],
                            background:T[typeColors[gate.type]]+"15",
                            padding:"1px 5px", borderRadius:3, fontSize:8 }}>{gate.type}</span>
                        </td>
                        <td style={{ padding:"6px", color:T.dim, fontSize:9 }}>{gate.section}</td>
                        <td style={{ padding:"6px", color:gate.priority==="P0"?T.red:gate.priority==="P1"?T.orange:T.blue,
                          fontWeight:600, fontSize:9 }}>{gate.priority}</td>
                        <td style={{ padding:"6px" }}>
                          <span style={{ color:gate.status==="new"?T.red:gate.status==="partial"?T.orange:T.green,
                            background:(gate.status==="new"?T.red:gate.status==="partial"?T.orange:T.green)+"18",
                            padding:"1px 5px", borderRadius:3, fontSize:8 }}>{statusLabels[gate.status]}</span>
                        </td>
                      </tr>
                    ))
                  )
                )}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {/* ── FOOTER ── */}
      <div style={{ textAlign:"center", padding:"16px 24px 24px", borderTop:`1px solid ${T.border}` }}>
        <div style={{ fontSize:10, color:T.dim, fontFamily:"'JetBrains Mono'" }}>
          Constitutional Gates v0.1 SEALED — 24 February 2026 — Kempten, Bavaria
        </div>
        <div style={{ fontSize:12, color:T.gold, fontStyle:"italic", marginTop:6 }}>
          "Governance is enforced in architecture, not policy."
        </div>
        <div style={{ fontSize:10, color:T.muted, marginTop:4 }}>
          🐉 Guardian — 🏗️ Architect — 👁️ Witness — 👑 Human Dragon
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
