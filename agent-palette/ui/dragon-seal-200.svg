<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" fill="none" class="windi-dragon-signature">

  <!-- ═══ OUTER RINGS ═══ -->
  <circle cx="100" cy="100" r="92" stroke="currentColor" stroke-width="1.2" opacity="0.9"/>
  <circle cx="100" cy="100" r="86" stroke="currentColor" stroke-width="0.5" opacity="0.35"/>

  <!-- ═══ TEXT RING — TOP: WINDI · PUBLISHING · HOUSE ═══ -->
  <text font-size="7" font-family="'Courier New', monospace" fill="currentColor" opacity="0.75">
    <textPath href="#ring-top" startOffset="12%">WINDI · PUBLISHING · HOUSE</textPath>
  </text>
  <defs>
    <path id="ring-top" d="M 10,100 A 90,90 0 1,1 190,100"/>
    <path id="ring-bottom" d="M 10,100 A 90,90 0 0,0 190,100"/>
    <filter id="dragon-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ═══ TEXT RING — BOTTOM: AI PROCESSES · HUMAN DECIDES ═══ -->
  <text font-size="7" font-family="'Courier New', monospace" fill="currentColor" opacity="0.75">
    <textPath href="#ring-bottom" startOffset="14%">AI PROCESSES · HUMAN DECIDES</textPath>
  </text>

  <!-- ═══ RING DOTS ═══ -->
  <circle cx="100" cy="9"   r="1.5" fill="currentColor" opacity="0.5"/>
  <circle cx="100" cy="191" r="1.5" fill="currentColor" opacity="0.5"/>

  <!-- ═══ DRAGON ═══ -->
  <g filter="url(#dragon-glow)" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- CORPO — blob oval, posição fetal, -15° -->
    <ellipse cx="100" cy="108" rx="30" ry="26" transform="rotate(-15 100 108)" stroke-width="2.2"/>

    <!-- VENTRE — linha interna suave -->
    <path d="M82 118 C85 124 95 128 105 125 C110 122 112 118 110 114" stroke-width="1.2" opacity="0.6"/>

    <!-- CABEÇA — círculo pequeno, topo-esquerda -->
    <circle cx="80" cy="88" r="13" stroke-width="2"/>

    <!-- FOCINHO / BICO -->
    <path d="M68 90 C63 88 61 92 65 94 C67 95 70 93 70 91" stroke-width="1.8"/>

    <!-- OLHO -->
    <circle cx="77" cy="84" r="2.5" fill="currentColor" stroke="none"/>
    <circle cx="78.2" cy="83" r="0.8" stroke-width="0.5" opacity="0.4"/>

    <!-- CORNO -->
    <path d="M80 75 C79 70 82 66 83 64" stroke-width="1.8"/>
    <path d="M83 64 C84 62 86 63 85 65" stroke-width="1.4"/>

    <!-- CRISTA / ORELHA -->
    <path d="M86 78 C89 74 92 75 90 79" stroke-width="1.4"/>

    <!-- PESCOÇO -->
    <path d="M87 96 C90 100 92 103 94 106" stroke-width="2"/>

    <!-- ASA ESQUERDA -->
    <path d="M88 100 C78 92 68 88 62 90 C58 92 60 97 66 97 C72 97 78 96 84 102" stroke-width="1.8"/>
    <path d="M70 94 C72 98 76 100 80 101" stroke-width="0.8" opacity="0.5"/>
    <path d="M64 93 C67 97 72 99 76 101" stroke-width="0.8" opacity="0.4"/>

    <!-- ASA DIREITA -->
    <path d="M112 98 C120 88 132 84 138 88 C142 92 138 98 132 97 C126 96 118 98 114 106" stroke-width="1.8"/>
    <path d="M130 92 C127 96 122 99 118 101" stroke-width="0.8" opacity="0.5"/>
    <path d="M136 91 C132 95 127 98 122 101" stroke-width="0.8" opacity="0.4"/>

    <!-- PATA DIANTEIRA + GARRAS -->
    <path d="M84 118 C80 122 76 126 74 128" stroke-width="1.8"/>
    <path d="M74 128 L71 131 M74 128 L74 132 M74 128 L77 131" stroke-width="1.2"/>

    <!-- PATA TRASEIRA + GARRAS -->
    <path d="M112 120 C116 124 118 128 118 130" stroke-width="1.8"/>
    <path d="M118 130 L115 134 M118 130 L118 134 M118 130 L121 134" stroke-width="1.2"/>

    <!-- CAUDA — curva orgânica -->
    <path d="M116 116 C122 118 128 120 132 124 C136 128 136 132 132 134 C128 136 124 134 122 130 C120 126 124 122 128 126" stroke-width="2"/>

    <!-- ESCAMAS -->
    <path d="M96 106 C98 104 102 104 104 106" stroke-width="0.7" opacity="0.4"/>
    <path d="M94 112 C97 110 103 110 106 112" stroke-width="0.7" opacity="0.4"/>
    <path d="M93 118 C97 116 105 116 108 118" stroke-width="0.7" opacity="0.35"/>

  </g>

</svg>
