function classifyInput(text, intentHistory) {
  const t = text.toLowerCase().trim();
  const words = t.split(/\s+/);
  const isShort = words.length <= 4;
  let bestChat = null, bestChatScore = 0;
  for (const [type, cfg] of Object.entries(CHAT_PATTERNS)) {
    let score = 0;
    cfg.rx.forEach(rx => { if (rx.test(t)) score += cfg.weight; });
    if (score > bestChatScore) { bestChatScore = score; bestChat = type; }
  }
  let docScore = 0;
  for (const cfg of Object.values(DOCS)) {
    cfg.kw.forEach(k => { if (t.includes(k)) docScore += 0.3; });
    (cfg.rx || []).forEach(rx => { if (rx.test(text)) docScore += 0.5; });
  }
  if (bestChatScore > 0.5 && bestChatScore > docScore) return { mode: "chat", chatType: bestChat, chatScore: bestChatScore, docScore };
  if (docScore > 0.3) return { mode: "document", chatType: null, chatScore: bestChatScore, docScore };
  if (isShort && docScore === 0) return { mode: "chat", chatType: bestChat || "casual", chatScore: Math.max(bestChatScore, 0.3), docScore };
  if (bestChatScore > 0 && docScore === 0) return { mode: "chat", chatType: bestChat, chatScore: bestChatScore, docScore };
  return docScore > 0 ? { mode: "document", chatType: null, chatScore: bestChatScore, docScore } :
    { mode: "chat", chatType: "casual", chatScore: 0.2, docScore: 0 };
}

function detectLang(text) {
  const t = text.toLowerCase();
  const words = t.split(/\s+/).filter(w => w.length > 0);
  let scores = { de:0, en:0, pt:0 };
  const totalWords = words.length;
  words.forEach(w => {
    // Skip ambiguous single-char words (a, o, i) — they collide across languages
    if (LANG_AMBIGUOUS.includes(w)) return;
    for (const [l, markers] of Object.entries(LANG)) {
      if (markers.includes(w)) {
        const idx = markers.indexOf(w);
        scores[l] += (idx < 15 ? 1.5 : 1);
      }
    }
  });
  // Tiebreaker: if scores are very close, count matched words ratio
  const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
  if (sorted.length >= 2 && sorted[0][1] > 0 && sorted[1][1] > 0) {
    const diff = sorted[0][1] - sorted[1][1];
    if (diff < 1.0) {
      // Too close — add bonus for language with more unique matches
      const countMatches = (lang) => words.filter(w => !LANG_AMBIGUOUS.includes(w) && LANG[lang].includes(w)).length;
      const c0 = countMatches(sorted[0][0]);
      const c1 = countMatches(sorted[1][0]);
      if (c1 > c0) { sorted[0] = [sorted[1][0], sorted[1][1] + 0.5]; sorted[1] = [sorted[0][0], sorted[0][1]]; }
    }
  }
  return sorted[0][1] > 0 ? sorted[0][0] : null;
}

const LANG = {

  en:["the","and","for","with","please","create","write","draft","make","about","new","this","that","from","have","will","can","should","would","also","but","not","all","into","been","more","than","its","some","just","most","only","which","you","do","like","to","on","is","are","it","of","in","my","your","we","they","was","were","be","at","an","or","if","so","up","no","yes","how","what","when","where","who","why","does","did","get","got","go","going","want","need","could","may","might","let","help","any","each","every","very","much","here","there","then","now","still","too","out","over","after","before","based","generate","picture","document","image"],
  pt:["os","as","para","com","por","favor","cria","criar","fatura","gerar","escreve","faz","fazer","sobre","novo","nova","uma","que","não","mais","como","dos","das","esta","esse","isso","ser","ter","foi","são","tem","nos","sua","seu","ela","ele","mas","bem","também","muito","ainda","então","porque","quando","onde","quem","qual","tudo","nada","cada","outro","já","sempre","agora","depois","antes","entre","aqui"],
};
// Single-char words ambiguous across languages — scored separately with low weight
const LANG_AMBIGUOUS = ["a","o","i"];

// ── ENTITY EXTRACTION ─────────────────────────────────────────────────
const ENTITY_RX = {
  email:    /[\w.-]+@[\w.-]+\.\w{2,}/g,
  mention:  /@(\w+)/g,
  money:    /(?:€|EUR|USD|\$|R\$)\s*[\d.,]+|[\d.,]+\s*(?:€|Euro|Dollar|Reais)/gi,
  date:     /\b\d{1,2}[./-]\d{1,2}[./-]\d{2,4}\b|\b(?:morgen|tomorrow|amanhã|heute|today|hoje|montag|dienstag|mittwoch|donnerstag|freitag|monday|tuesday|wednesday|thursday|friday|segunda|terça|quarta|quinta|sexta)\b/gi,
  person:   /(?:(?:Herr|Frau|Hr\.|Fr\.|Mr\.|Mrs\.|Ms\.|Dr\.|Prof\.)\s+)?([A-ZÄÖÜ][a-zäöüß]+(?:\s+[A-ZÄÖÜ][a-zäöüß]+){0,2})/g,
  org:      /(?:Stadtwerke|GmbH|AG|e\.V\.|Ltd\.|Inc\.|Corp\.|SA|Ltda)\s*[A-ZÄÖÜa-zäöüß]*/g,
};

function extractEntities(text) {
  const e = {};
  for (const [type, rx] of Object.entries(ENTITY_RX)) {
    const matches = [...text.matchAll(new RegExp(rx.source, rx.flags))];
    if (matches.length > 0) e[type] = [...new Set(matches.map(m => m[0].trim()))];
  }
  return e;
}

// ── INTENT PARSER v2 ──────────────────────────────────────────────────
function parseIntent(text, history = []) {
  const t = text.toLowerCase();
  const words = t.split(/\s+/).filter(w => w.length > 0);
  let scores = {};
  for (const [dtype, cfg] of Object.entries(DOCS)) {
    let s = 0;
    (cfg.rx || []).forEach(rx => { if (rx.test(text)) s += 0.55; });
    let kwHits = 0;
    cfg.kw.forEach(k => { if (t.includes(k)) kwHits++; });
    s += Math.min(kwHits * 0.25, 0.6);
    if (kwHits > 0 && s > 0.55) s += 0.1;
    scores[dtype] = Math.min(s, 1.0);
  }
  const lastIntent = history.length > 0 ? history[history.length - 1] : null;
  if (lastIntent?.doc_type && scores[lastIntent.doc_type] > 0.1) {
    scores[lastIntent.doc_type] = Math.min(scores[lastIntent.doc_type] + 0.1, 1.0);
  }
  const sorted = Object.entries(scores).filter(([,s]) => s > 0).sort((a,b) => b[1] - a[1]);
  const bestType = sorted.length > 0 ? sorted[0][0] : "note";
  const confidence = sorted.length > 0 ? sorted[0][1] : 0.15;
  const ambiguous = sorted.length >= 2 && sorted[0][1] - sorted[1][1] < 0.15;
  let langScores = { de:0, en:0, pt:0 };
  words.forEach(w => { if (LANG_AMBIGUOUS.includes(w)) return; for (const [l, markers] of Object.entries(LANG)) { if (markers.includes(w)) langScores[l] += (markers.indexOf(w) < 15 ? 1.5 : 1); } });
  const langSorted = Object.entries(langScores).sort((a,b) => b[1] - a[1]);
  const lang = langSorted[0][1] > 0 ? langSorted[0][0] : "de";
  const urgencyMap = { critical:["asap","sofort","urgente","emergency","notfall","immediately","kritisch","crítico"], urgent:["urgent","dringend","schnell","rápido","soon","bald","logo"] };
  let urgency = "normal";
  for (const [lvl, markers] of Object.entries(urgencyMap)) if (markers.some(m => t.includes(m))) { urgency = lvl; break; }
  const formalityMap = { institutional:["official","offiziell","oficial","institutional","governance","behörde","amtlich"], formal:["formal","formell","professional","geschäftlich","profissional"], informal:["casual","quick","schnell","rápido","internal","intern","kurz","short"] };
  let formality = "formal";
  for (const [lvl, markers] of Object.entries(formalityMap)) if (markers.some(m => t.includes(m))) { formality = lvl; break; }
  const entities = extractEntities(text);
  const stop = new Set(["a","an","the","der","die","das","ein","eine","einen","o","os","as","and","und","e","for","für","para","with","mit","com","is","ist","é","to","zu","please","bitte","por","favor","create","write","make","draft","erstell","schreib","cria","escreve","i","me","my","ich","mein","eu","meu","need","want","brauche","preciso","sobre","über","von","from","de",...Object.values(DOCS).flatMap(d => d.kw)]);
  const keywords = words.filter(w => w.length > 2 && !stop.has(w)).slice(0, 10);
  const needsLlm = confidence < 0.5 || (keywords.length < 2 && !entities.person && !entities.org);
  let clarification = null;
  if (ambiguous && confidence < 0.7) {
    const alt = sorted[1];
    const d1 = DOCS[bestType], d2 = DOCS[alt[0]];
    clarification = { type: "ambiguous", options: [
      { type: bestType, label: d1[lang] || d1.en, score: Math.round(confidence * 100) },
      { type: alt[0], label: d2[lang] || d2.en, score: Math.round(alt[1] * 100) },
    ]};
  } else if (confidence < 0.3 && words.length > 3) {
    clarification = { type: "low_confidence", message: lang === "de" ? "Ich konnte den Dokumenttyp nicht sicher erkennen. Können Sie genauer beschreiben?" : lang === "pt" ? "Não consegui identificar o tipo de documento. Pode descrever melhor?" : "I couldn't confidently identify the document type. Could you describe more specifically?" };
  }
  return {
    doc_type: bestType, confidence: Math.round(confidence * 100) / 100, language: lang,
    urgency, formality, keywords, entities, needs_llm: needsLlm,
    ambiguous, clarification,
    alternatives: sorted.slice(1,4).map(([t,s]) => ({ type: t, score: Math.round(s*100)/100 })),
    _scores: scores,
  };
}

};

function resolveTemplate(intent) {
  let best = null, bestScore = 0, alts = [];
  for (const [tid, tpl] of Object.entries(TPL)) {
    let s = 0;
    if (tpl.types.includes(intent.doc_type)) s += 0.5;
    if (tpl.formality.includes(intent.formality)) s += 0.2;
    const fieldSet = new Set(tpl.fields);
    if (intent.entities?.person && (fieldSet.has("recipient") || fieldSet.has("to") || fieldSet.has("recipient_name"))) s += 0.1;
    if (intent.entities?.money && (fieldSet.has("total") || fieldSet.has("items"))) s += 0.1;
    if (intent.entities?.date && (fieldSet.has("date") || fieldSet.has("due_date") || fieldSet.has("effective_date"))) s += 0.1;
    if (intent.entities?.org && (fieldSet.has("client") || fieldSet.has("parties"))) s += 0.1;
    const kwOverlap = intent.keywords.filter(k => fieldSet.has(k)).length;
    s += (kwOverlap / Math.max(tpl.fields.length, 1)) * 0.2;
    if (s > bestScore) { if (best) alts.push({ id:best.id, score:bestScore, name:best.name }); bestScore = s; best = { id:tid, ...tpl, score:s }; }
    else if (s > 0) alts.push({ id:tid, score:s, name:tpl.name });
  }
  return { template: best || { id:"GEN-LETTER", ...TPL["GEN-LETTER"], score:0.1 }, alternatives: alts.sort((a,b) => b.score - a.score).slice(0,3) };
}

// ── SGE v2 ────────────────────────────────────────────────────────────
const RISK_DB = {
  lexical:      { high:["geheim","secret","confidential","vertraulich","classified","sigiloso","streng geheim","top secret"], med:["intern","internal","draft","entwurf","rascunho","nicht veröffentlichen","do not publish"] },
  regulatory:   { high:["personenbezogen","personal data","dados pessoais","gdpr","dsgvo","lgpd","datenschutz","data protection","proteção de dados","biometric","biometrisch"], med:["compliance","regulation","verordnung","regulamento","eu ai act","ki-verordnung"] },
  institutional:{ high:["binding","verbindlich","vinculante","penalty","strafe","penalidade","sanktion","sanction","sanção","haftung","liability"], med:["policy","richtlinie","política","guideline","directive","anweisung"] },
  financial:    { high:["bankverbindung","bank account","conta bancária","kreditkarte","credit card","iban","swift","bic"], med:["budget","zahlung","payment","pagamento","preis","price","preço"] },
};

function runSGE(text, tier, intent, templateId) {
  const t = text.toLowerCase();
  const tierCfg = TIERS[tier];
  const template = TPL[templateId];
  const expectedRisk = template?.expectedRisk || [];
  const findings = {};
  let rawTotal = 0;
  for (const [layer, db] of Object.entries(RISK_DB)) {
    const highHits = db.high.filter(k => t.includes(k));
    const medHits = db.med.filter(k => t.includes(k));
    const unexpectedHigh = highHits.filter(k => !expectedRisk.some(er => er === `${layer}_high`));
    const baseRisk = unexpectedHigh.length > 0 ? 2 : highHits.length > 0 ? 1 : medHits.length > 0 ? 1 : 0;
    findings[layer] = { risk: baseRisk, high: highHits, med: medHits, unexpected: unexpectedHigh };
    rawTotal += baseRisk;
  }
  findings.semantic = { risk: intent.confidence < 0.3 ? 1 : 0, detail: intent.confidence < 0.3 ? "Low intent confidence" : "Clear intent", high:[], med:[], unexpected:[] };
  rawTotal += findings.semantic.risk;
  const pragRisk = intent.urgency === "critical" ? 1 : 0;
  const formalityMismatch = intent.formality === "informal" && (intent.doc_type === "governance_decision" || intent.doc_type === "contract") ? 1 : 0;
  findings.pragmatic = { risk: pragRisk + formalityMismatch, detail: pragRisk ? "Critical urgency" : formalityMismatch ? "Formality mismatch" : "Normal", high:[], med:[], unexpected:[] };
  rawTotal += findings.pragmatic.risk;
  findings.syntactic = { risk: 0, detail: "Structure pending", high:[], med:[], unexpected:[] };
  const crossAmplify = (findings.lexical?.risk >= 2 && findings.regulatory?.risk >= 1) ? 1 :
    (findings.institutional?.risk >= 2 && findings.financial?.risk >= 1) ? 1 : 0;
  rawTotal += crossAmplify;
  const crossNote = crossAmplify > 0 ? "Cross-layer correlation detected" : null;
  const clampedRisk = Math.min(rawTotal, 5);
  const effectiveRisk = Math.min(clampedRisk, tierCfg.sgeMax);
  const hash = "sha256:" + Array.from(text).reduce((h,c) => (((h<<5)-h)+c.charCodeAt(0))|0, 0).toString(16).replace("-","a").padStart(12,"0");
  return {
    risk: `R${effectiveRisk}`, riskRaw: clampedRisk, blocked: clampedRisk > tierCfg.sgeMax,
    findings, hash, humanRequired: clampedRisk >= 3, crossCorrelation: crossNote,
    explanation: buildSGEExplanation(findings, effectiveRisk, crossNote, intent.language),
  };
}

function buildSGEExplanation(findings, risk, crossNote, lang) {
  const layers = Object.entries(findings).filter(([,v]) => v.risk > 0);
  if (layers.length === 0) return lang === "de" ? "Keine Auffälligkeiten." : lang === "pt" ? "Nenhuma anomalia." : "No issues detected.";
  const parts = layers.map(([name, v]) => {
    const triggers = [...(v.high||[]), ...(v.med||[])].slice(0,3).join(", ");
    return `${name}: R${v.risk}${triggers ? ` (${triggers})` : ""}`;
  });
  if (crossNote) parts.push(crossNote);
  return parts.join(" · ");
}

// ── RECEIPT GENERATOR ─────────────────────────────────────────────────
function genReceipt(intent, tid, sge, tier, validation) {
  const now = new Date();
  const ds = now.toISOString().slice(0,10).replace(/-/g,"");
  const hash = "sha256:" + Array.from(JSON.stringify({intent:intent.doc_type,tid,r:sge.risk,tier,ts:now.getTime()}))
    .reduce((h,c) => (((h<<5)-h)+c.charCodeAt(0))|0, 0).toString(16).replace("-","a").padStart(12,"0");
  return {
    id:`WINDI-PAL-${ds}-${Math.random().toString(36).substr(2,6).toUpperCase()}`,
    ts:now.toISOString(), src:`palette-v${V}`, doc:intent.doc_type, tpl:tid, hash, risk:sge.risk, tier,
    constitutional: {
      invariants_checked: Object.keys(INVARIANTS).length,
      stability_layers: Object.keys(STABILITY_LAYERS).length,
      layer7_active: true,
      validation: validation?.valid ? "CLEAN" : `VIOLATIONS:${validation?.violations?.length||0}`,
    },
    status: validation?.hasFatal ? "BLOCKED" : !validation?.valid ? "FLAGGED" : "SEALED",
    closing: "Human decides. WINDI observes.",
  };
}

// ── FORMAT RESOLVER ───────────────────────────────────────────────────
function resolveFormat(intent, tierCfg) {
  const t = intent.doc_type;
  if (t === "invoice" && tierCfg.formats.includes("xlsx")) return "xlsx";
  if (t === "presentation" && tierCfg.formats.includes("pptx")) return "pptx";
  if ((t === "communique" || t === "governance_decision" || t === "certificate") && tierCfg.formats.includes("pdf")) return "pdf";
  if (intent.formality === "institutional" && tierCfg.formats.includes("pdf")) return "pdf";
  return "docx";
}

// ═══════════════════════════════════════════════════════════════════════
// AGENT BRAIN — v0.6.0-K: Clean responses, silent governance
// ═══════════════════════════════════════════════════════════════════════
function agentThink(userInput, tier, intentHistory, stats) {
  const t0 = performance.now();
  const classification = classifyInput(userInput, intentHistory);
  const detectedLang = detectLang(userInput);
  
  if (classification.mode === "chat") {
    const lang = detectedLang || "de";
    const response = applyLayer7(chatRespond(classification.chatType, lang, stats || {docs:0,sealed:0,avgMs:0}, tier));
    return {
      type: "chat", chatType: classification.chatType, message: response,
      intent: { language: lang, doc_type: null, confidence: 0 },
      sge: null, receipt: null, template: null, alternatives: null,
      constitutional: { active: true, invariants: Object.keys(INVARIANTS).length, layers: Object.keys(STABILITY_LAYERS).length },
      ms: Math.round(performance.now() - t0),
    };
  }
  
  const intent = parseIntent(userInput, intentHistory);
  const tierCfg = TIERS[tier];
  const doc = DOCS[intent.doc_type] || DOCS.note;
  const L = intent.language;
  const label = doc[L] || doc.en;

  if (intent.clarification) {
    if (intent.clarification.type === "ambiguous") {
      const opts = intent.clarification.options;
      return {
        type:"clarification", intent,
        message: L === "de" ? `Ich erkenne zwei mögliche Typen:\n• ${DOCS[opts[0].type]?.icon} **${opts[0].label}**\n• ${DOCS[opts[1].type]?.icon} **${opts[1].label}**\nWelchen meinst du?` :
          L === "pt" ? `Detectei dois tipos possíveis:\n• ${DOCS[opts[0].type]?.icon} **${opts[0].label}**\n• ${DOCS[opts[1].type]?.icon} **${opts[1].label}**\nQual preferes?` :
          `I detected two possible types:\n• ${DOCS[opts[0].type]?.icon} **${opts[0].label}**\n• ${DOCS[opts[1].type]?.icon} **${opts[1].label}**\nWhich one did you mean?`,
        sge:null, receipt:null, template:null, ms:Math.round(performance.now()-t0),
      };
    }
    if (intent.clarification.type === "low_confidence") {
      return { type:"clarification", intent, message:intent.clarification.message, sge:null, receipt:null, template:null, ms:Math.round(performance.now()-t0) };
    }
  }

  if (!tierCfg.types.includes(intent.doc_type)) {
    const avail = tierCfg.types.map(t => `${DOCS[t]?.icon} ${DOCS[t]?.[L]||DOCS[t]?.en}`).join(", ");
    return { type:"blocked_tier", intent,
      message: L === "de" ? `${doc.icon} **${label}** ist im ${tierCfg.label}-Tier nicht verfügbar.\nVerfügbar: ${avail}` :
        L === "pt" ? `${doc.icon} **${label}** não está disponível no tier ${tierCfg.label}.\nDisponíveis: ${avail}` :
        `${doc.icon} **${label}** is not available in ${tierCfg.label} tier.\nAvailable: ${avail}`,
      sge:null, receipt:null, template:null, ms:Math.round(performance.now()-t0) };
  }

  const { template, alternatives } = resolveTemplate(intent);
  const format = resolveFormat(intent, tierCfg);
  const sge = runSGE(userInput, tier, intent, template.id);

  if (sge.blocked) {
    return { type:"blocked_sge", intent, sge, template, alternatives,
      message: L === "de" ? `⚠️ **Governance-Prüfung**: Dieses Dokument benötigt eine höhere Berechtigungsstufe.\nMenschliche Entscheidung erforderlich.` :
        L === "pt" ? `⚠️ **Verificação de governança**: Este documento requer um nível superior.\nDecisão humana necessária.` :
        `⚠️ **Governance check**: This document requires a higher permission level.\nHuman decision required.`,
      receipt:null, ms:Math.round(performance.now()-t0) };
  }

  const needsConfirm = sge.humanRequired && !sge.blocked;

  // ── CLEAN RESPONSE (no technical jargon for humans) ──
  const entityParts = [];
  if (intent.entities?.person) entityParts.push(`👤 ${intent.entities.person.join(", ")}`);
  if (intent.entities?.org) entityParts.push(`🏢 ${intent.entities.org.join(", ")}`);
  if (intent.entities?.money) entityParts.push(`💶 ${intent.entities.money.join(", ")}`);
  if (intent.entities?.date) entityParts.push(`📅 ${intent.entities.date.join(", ")}`);

  const langLabel = {de:"Deutsch",en:"English",pt:"Português"}[L] || "DE";
  const fmtLabel = {docx:"Word",pdf:"PDF",xlsx:"Excel",pptx:"PowerPoint",jmpg:"JMPG"}[format] || format;

  const lines = [];
  lines.push(`${doc.icon} **${template.name}**`);
  lines.push(`${langLabel} · ${fmtLabel}${intent.urgency !== "normal" ? " · ⚡ " + intent.urgency.toUpperCase() : ""}`);
  if (entityParts.length > 0) lines.push(entityParts.join(" · "));
  
  // Only show risk warning if risk > 0
  if (sge.riskRaw > 0) {
    const riskLabel = L === "de" ? "Governance-Hinweis" : L === "pt" ? "Aviso de governança" : "Governance note";
    lines.push(`🛡️ ${riskLabel}: ${L === "de" ? "Prüfung erkannt" : L === "pt" ? "Verificação detectada" : "Check detected"}`);
  }

  const message = lines.join("\n");
  const filteredMessage = applyLayer7(message);
  const validation = validateInvariants(filteredMessage);
  let receipt = null;
  if (tierCfg.ledger) receipt = genReceipt(intent, template.id, sge, tier, validation);

  return {
    type: validation.hasFatal ? "blocked_constitutional" : "success",
    intent, sge, receipt, template, alternatives, format,
    method: intent.needs_llm && tierCfg.llm ? "hybrid" : "local",
    message: validation.hasFatal

    const st = STATUS_THEME[status] || STATUS_THEME.DRAFT;

    if (mins < 60) return `${mins}m`;

        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: base64, language: "deu+eng+por" })

        const updatedImages = [...images];
        updatedImages[imgIndex] = { ...img, ocrText: result.text || '' };

        // Optionally append to body
        if (result.text) {

// ── LivingOrb: Canvas 60fps breathing orb (Design Reference) ──────────
function LivingOrb({ score, T, size, onClick, active }) {
  const canvasRef = useRef(null);
  const frameRef = useRef(0);
  const pct = (score || 0) / 100;
  const sz = size || 28;

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    canvas.width = sz * dpr;
    canvas.height = sz * dpr;
    ctx.scale(dpr, dpr);
    let running = true;

    function draw(time) {
      if (!running) return;
      ctx.clearRect(0, 0, sz, sz);
      const cx = sz / 2, cy = sz / 2;
      const breathRate = 0.001 + (1 - pct) * 0.001;
      const breath = Math.sin(time * breathRate) * 0.5 + 0.5;
      const breathScale = 0.7 + breath * 0.3 * pct;

      // Outer glow
      const glowR = (sz / 2 - 2) * breathScale;
      const glow = ctx.createRadialGradient(cx, cy, glowR * 0.3, cx, cy, glowR);
      glow.addColorStop(0, T.gold + "60");
      glow.addColorStop(0.5, T.green + "20");
      glow.addColorStop(1, "transparent");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
      ctx.fill();

      // Core orb
      const coreR = (sz / 2 - 6) * (0.6 + breathScale * 0.4);
      const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
      core.addColorStop(0, T.gold + "FF");
      core.addColorStop(0.6, T.green + "AA");
      core.addColorStop(1, T.goldDim + "40");
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
      ctx.fill();

      // Pupil highlight
      const pupilR = coreR * 0.3 * (0.8 + breath * 0.2);
      const pupil = ctx.createRadialGradient(cx, cy, 0, cx, cy, pupilR);
      pupil.addColorStop(0, "#FFFFFF" + (pct > 0.8 ? "CC" : "66"));
      pupil.addColorStop(1, "transparent");
      ctx.fillStyle = pupil;
      ctx.beginPath();
      ctx.arc(cx, cy, pupilR, 0, Math.PI * 2);
      ctx.fill();

      // Progress ring
      const ringR = sz / 2 - 2;
      ctx.strokeStyle = T.gold + "30";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = T.gold + (active ? "CC" : "66");
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(cx, cy, ringR, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct);
      ctx.stroke();

      frameRef.current = requestAnimationFrame(draw);
    }
    frameRef.current = requestAnimationFrame(draw);
    return () => { running = false; cancelAnimationFrame(frameRef.current); };
  }, [score, T, sz, pct, active]);

  return React.createElement("canvas", { ref: canvasRef, onClick: onClick,
    style: { width: sz, height: sz, cursor: "pointer", transition: "transform 0.2s ease",
      transform: active ? "scale(1.1)" : "scale(1)" } });
}

// ── NerveStrand: Particle system for service health (Design Reference) ─
function NerveStrand({ services, T, width, onClick, active }) {
  const canvasRef = useRef(null);
  const frameRef = useRef(0);
  const w = width || 180;
  const h = 24;

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.scale(dpr, dpr);
    let running = true;

    const particles = (services || []).slice(0, 20).map((s, i) => ({
      x: (i / Math.max(services.length, 1)) * w,
      baseY: h / 2,
      speed: s.up !== false ? 0.3 + Math.random() * 0.4 : 0,
      amplitude: s.up !== false ? 2 + Math.random() * 3 : 0,
      phase: Math.random() * Math.PI * 2,
      up: s.up !== false, radius: s.up !== false ? 2 : 1.5,
    }));

    function draw(time) {
      if (!running) return;
      ctx.clearRect(0, 0, w, h);

      // Baseline
      ctx.strokeStyle = T.border + "40";
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(0, h / 2);
      ctx.lineTo(w, h / 2);
      ctx.stroke();

      particles.forEach((p, i) => {
        const t = time * 0.001;
        const waveX = p.x + Math.sin(t * p.speed + p.phase) * 8;
        const waveY = p.baseY + Math.sin(t * p.speed * 2 + p.phase) * p.amplitude;
        const displayX = ((waveX % w) + w) % w;

        // Glow
        const glowColor = p.up ? T.green : T.red;
        const glow = ctx.createRadialGradient(displayX, waveY, 0, displayX, waveY, p.radius * 4);
        glow.addColorStop(0, glowColor + "40");
        glow.addColorStop(1, "transparent");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(displayX, waveY, p.radius * 4, 0, Math.PI * 2);
        ctx.fill();

        // Particle
        ctx.fillStyle = p.up ? T.green + "DD" : T.red + "AA";
        ctx.beginPath();
        ctx.arc(displayX, waveY, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      frameRef.current = requestAnimationFrame(draw);
    }
    frameRef.current = requestAnimationFrame(draw);
    return () => { running = false; cancelAnimationFrame(frameRef.current); };
  }, [services, T, w]);

  return React.createElement("canvas", { ref: canvasRef, onClick: onClick,
    style: { width: w, height: h, cursor: "pointer", borderRadius: 12,
      background: active ? T.gold + "10" : "transparent", transition: "background 0.3s ease" } });
}

function WisdomBtn({ download, docData, T, lang }) {
  const [status, setStatus] = useState(null);

  const [insight, setInsight] = useState("");

  };
  const L = labels[lang] || labels.en;

  const submitWisdom = async () => {
    if (!insight.trim()) return;
    setStatus("submitting");

        method: "POST",
        headers: { "Content-Type": "application/json" },

        setStatus("success");

// ── Invoice Field Extraction from userInput — mirrors server-side parser ──
function extractInvoiceFields(userInput, intent) {
  if (!userInput) return {};
  const text = userInput;
  const t = text.toLowerCase();
  const lang = intent?.language || "de";

  // ── Parse German-format prices: €2.500,00 or 2.500 € ──
  function parsePrice(s) {
    if (!s) return 0;
    let clean = s.replace(/[€$EURUSD\s]/gi, "").trim();
    // German format: 2.500,00 → 2500.00
    if (/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(clean)) {
      clean = clean.replace(/\./g, "").replace(",", ".");
    } else if (/,\d{1,2}$/.test(clean)) {
      clean = clean.replace(",", ".");
    }
    return parseFloat(clean) || 0;
  }

  function fmtPrice(num) {
    return num.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  }

  // ── Extract client (EMPFÄNGER) from entities or text ──
  const orgs = intent?.entities?.org || [];
  // Also try to find "Company Name + suffix" pattern directly in text
  const orgFullRx = /(?:^|[\s,;(])([A-ZÄÖÜ][a-zäöüß]+(?:\s+[A-ZÄÖÜ][A-Za-zäöüß]*){0,3})\s+(GmbH|AG|SE|KG|OHG|UG|e\.V\.|Ltd\.|Inc\.|Corp\.|SA|Ltda|Co\.|GbR)/g;
  let orgFull = null;
  const orgMatch = orgFullRx.exec(text);
  if (orgMatch) orgFull = (orgMatch[1].trim() + " " + orgMatch[2]).trim();
  // Also check "für/for/para CompanyName"
  if (!orgFull) {
    const fuerMatch = text.match(/(?:für|for|para|an|to|cliente|client|empfänger|recipient)\s+([A-ZÄÖÜ][A-Za-zÄÖÜäöüß&\-.\s]{2,40}?)(?:\s*[,.]|\s+\d|\s*$)/i);
    if (fuerMatch) orgFull = fuerMatch[1].trim();
  }
  const client = orgFull || (orgs[0] && orgs[0].length > 3 ? orgs[0] : null);

  // ── Extract items: "3x Widget zu €2.500" or "Widget, Menge 3, €2.500" ──
  const items = [];
  const itemPatterns = [
    // "3x Widget zu €2.500" / "3 Widget à €2.500"
    /(\d+)\s*[x×]\s*(.+?)\s*(?:zu|à|at|@|por)\s*((?:€|EUR|\$|R\$)\s*[\d.,]+|[\d.,]+\s*(?:€|Euro))/gi,
    // "Widget, Menge 3, Einzelpreis €2.500"
    /(.+?),?\s*(?:Menge|qty|qtd|quantity)\s*:?\s*(\d+),?\s*(?:Einzelpreis|Preis|price|preço|unit price)?\s*:?\s*((?:€|EUR|\$|R\$)\s*[\d.,]+|[\d.,]+\s*(?:€|Euro))/gi,
    // "Widget, 3, €2.500" (simple CSV-like)
    /(.+?),\s*(\d+)\s*,\s*((?:€|EUR|\$|R\$)\s*[\d.,]+|[\d.,]+\s*(?:€|Euro))/gi,
  ];

  for (const rx of itemPatterns) {
    let m;
    while ((m = rx.exec(text)) !== null) {
      const isQtyFirst = /^\d+$/.test(m[1].trim());
      const desc = isQtyFirst ? m[2].trim() : m[1].trim();
      const qty = isQtyFirst ? parseInt(m[1]) : parseInt(m[2]);
      const priceRaw = m[3].trim();
      const unitPrice = parsePrice(priceRaw);
      const lineTotal = unitPrice * qty;
      items.push({
        description: desc.replace(/^[,;.\s]+|[,;.\s]+$/g, ""),
        quantity: qty,
        unit_price: fmtPrice(unitPrice),
        total: fmtPrice(lineTotal),
        _unitNum: unitPrice,
        _totalNum: lineTotal,
      });
    }
    if (items.length > 0) break;
  }

  // ── If no structured items found, try to use money entities ──
  if (items.length === 0 && intent?.entities?.money?.length > 0) {
    const moneyStr = intent.entities.money[0];
    const price = parsePrice(moneyStr);
    if (price > 0) {
      items.push({
        description: lang === "de" ? "Position 1" : lang === "pt" ? "Item 1" : "Item 1",
        quantity: 1,
        unit_price: fmtPrice(price),
        total: fmtPrice(price),
        _unitNum: price,
        _totalNum: price,
      });
    }
  }

  // ── Calculate totals ──
  const subtotalNum = items.reduce((s, it) => s + (it._totalNum || 0), 0);
  const vatRate = t.includes("7%") ? 7 : t.includes("0%") ? 0 : 19;
  const vatNum = subtotalNum * (vatRate / 100);
  const grandNum = subtotalNum + vatNum;

  // ── Payment terms ──
  let payTerms = "";
  const termMatch = text.match(/(\d+)\s*(?:Tage|days|dias)\s*(?:netto|net|líquido)?/i);
  if (termMatch) payTerms = termMatch[0];
  else if (t.includes("sofort") || t.includes("immediately")) payTerms = lang === "de" ? "Sofort fällig" : "Due immediately";
  else payTerms = "30 " + (lang === "de" ? "Tage netto" : lang === "pt" ? "dias líquido" : "days net");

  // ── Build fields object matching DOC_TEMPLATES.invoice expectations ──
  const fields = {};
  if (client) fields.client_name = client;
  if (items.length > 0) {
    fields.items = items.map(it => ({
      description: it.description,
      quantity: it.quantity,
      unit_price: it.unit_price,
      total: it.total,
    }));
    fields.subtotal = fmtPrice(subtotalNum);
    fields.vat_rate = String(vatRate);
    fields.vat_amount = fmtPrice(vatNum);
    fields.total_amount = fmtPrice(grandNum);
  }
  fields.payment_terms = payTerms;

  return fields;
}

function renderDocTemplate(text, intent, lang, userInput) {
  // Extract JSON fields from LLM response
  let fields = {};
  const bt3 = String.fromCharCode(96,96,96);
  const jsonStart = text.indexOf(bt3 + "json");
  if (jsonStart >= 0) {
    const jsonEnd = text.indexOf(bt3, jsonStart + 6);
    if (jsonEnd > jsonStart) {
      try {
        const raw = text.substring(jsonStart + 7, jsonEnd).trim();
        const parsed = JSON.parse(raw);
        fields = parsed?.document?.fields || parsed?.fields || parsed || {};
      } catch(e) {}
    }
  }

  // ── Fallback: extract fields from userInput + intent entities ──
  const docType = intent?.doc_type || "note";
  if (docType === "invoice" && (!fields.client_name && !fields.nome_cliente && !fields.items)) {
    const extracted = extractInvoiceFields(userInput, intent);
    fields = { ...extracted, ...fields }; // JSON fields override extracted
  }

  if (DOC_TEMPLATES[docType]) {
    return { html: DOC_TEMPLATES[docType](fields, lang), hasTemplate: true };
  }
  return { html: null, hasTemplate: false };
}

    if (!text) return [];

function calcDragonEnergy(turnCount, tier) {
  const lim = SESSION_LIMITS[tier] || SESSION_LIMITS.P;
  const ratio = turnCount / lim.hard;
  if (ratio < 0.4) return { level: 5, bars: '⚡⚡⚡⚡⚡', idx: 0 };
  if (ratio < 0.6) return { level: 4, bars: '⚡⚡⚡⚡○', idx: 1 };
  if (ratio < 0.75) return { level: 3, bars: '⚡⚡⚡○○', idx: 2 };
  if (ratio < 0.9) return { level: 2, bars: '⚡⚡○○○', idx: 3 };
  return { level: 1, bars: '⚡○○○○', idx: 4 };
}

          });

          if (dragon?.message) {
            const ats = new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
            setActiveDragon(dragon.dragon);
            setLang(detectedLang);
            setMsgs(prev => [...prev, { role:"agent", text:dragon.message, ts:ats, dragon:dragon.dragon, source:dragon.source,
              result: { type:"chat", chatType:classification.chatType, message:dragon.message, dragon:dragon.dragon,
                intent:{language:detectedLang}, sge:null, receipt:null, template:null,
                constitutional:{active:true, invariants:9, layers:8}, ms:0 }
            }]);
            setIsLoading(false);
            return;
          }
        }

        if (classification.mode === "document") {
          // Document mode → try Dragon Generate + local governance
          const intent = parseIntent(msg, intentHistory);
          const tierCfg = TIERS[tier];
          if (tierCfg.llm) {
            const { template, alternatives } = resolveTemplate(intent);
            const dragon = await window.DragonBrain.generate(msg, {
              tier, intent, templateId: template?.id, language: detectedLang,
            });
            if (dragon?.message) {
              const sge = runSGE(dragon.message, tier, intent, template?.id);
              const format = resolveFormat(intent, tierCfg);
              const validation = validateInvariants(dragon.message);
              let receipt = null;
              if (tierCfg.ledger) receipt = genReceipt(intent, template?.id, sge, tier, validation);
              const ats = new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
              setActiveDragon("architect");
              setLang(detectedLang);
              setIntentHistory(prev => [...prev, intent].slice(-10));
              const result = {
                type: validation.hasFatal ? "blocked_constitutional" : "success",
                intent, sge, receipt, template, alternatives, format,
                method:"hybrid", message:dragon.message, dragon:"architect",
                needsConfirm: sge.humanRequired && !sge.blocked,
                constitutional:{validation, invariants:9, layers:8}, ms:0
              };
              (() => {
                const isDoc = result.type === "success" && intent.doc_type !== "note";
                let chatText = dragon.message;
                if (isDoc) {
                  const BT3 = String.fromCharCode(96,96,96);
                  const jsonIdx = dragon.message.indexOf(BT3 + "json");
                  if (jsonIdx > 0) chatText = dragon.message.substring(0, jsonIdx).trim();
                  const dashIdx = chatText.indexOf("\n---\n");
                  if (dashIdx > 50) chatText = chatText.substring(0, dashIdx).trim();
                  const hints = {de:"\n\n\u27A1\uFE0F Dokument im Panel rechts.",en:"\n\n\u27A1\uFE0F Document in the panel.",pt:"\n\n\u27A1\uFE0F Documento no painel ao lado."};
                  chatText += hints[detectedLang] || hints.en;
                }
                setMsgs(prev => [...prev, { role:"agent", text:chatText, result, ts:ats, dragon:"architect", source:dragon.source, download:null }]);
                // Auto-Render + DocumentPanel
                if (isDoc) {
                  const docPayload = { text:dragon.message, userInput:msg, intent, sge, receipt, template, download:null, forensic:{ hash:receipt?.hash||null, timestamp:new Date().toISOString(), tier, invariants:validation, sge_risk:sge?.risk||"R0", sge_score:sge?.score||0, constitutional:{i1_i9:!validation.hasFatal, s1_s8:true, l7:true} } };
                  setActiveDoc(docPayload);
                  fetch("/palette/api/dragon/render", {
                    method:"POST", headers:{"Content-Type":"application/json"},
                    body: JSON.stringify({ text:dragon.message, userInput:msg, intent, tier, sge, receipt })
                  }).then(r=>r.json()).then(rd => {
                    if (rd.success) {
                      setMsgs(prev => prev.map((m,i) => i===prev.length-1 ? {...m, download:rd} : m));
                      setActiveDoc(prev => prev ? {...prev, download:rd} : null);
                    }
                  }).catch(e => console.warn("[Render]", e));
                }
              })();
              if (result.type === "success") setStats(prev => ({ docs:prev.docs+1, sealed:prev.sealed+(receipt?1:0), avgMs:prev.avgMs }));
              setIsLoading(false);
              return;
            }
          }
        }
      }

      // Fallback: local agentThink (original behavior)
      const result = agentThink(msg, tier, intentHistory, stats);
      const ats = new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
      if (result.intent) { setLang(result.intent.language); setIntentHistory(prev => [...prev, result.intent].slice(-10)); }
      setMsgs(prev => [...prev, { role:"agent", text:result.message, result, ts:ats, download:null }]);
      if (result.type === "success") setStats(prev => ({ docs:prev.docs+1, sealed:prev.sealed+(result.receipt?1:0), avgMs:Math.round((prev.avgMs*prev.docs+result.ms)/(prev.docs+1)) }));
      // ── Auto-Render for local agentThink documents ──
      if (result.type === "success" && result.intent?.doc_type && result.intent.doc_type !== "note") {
        const renderPayload = {
          text: result.message || "",
          userInput: msg,
          intent: result.intent,
          tier,
          sge: result.sge || null,
          receipt: result.receipt || null,
        };
        setActiveDoc({ text:result.message, userInput:msg, intent:result.intent, sge:result.sge, receipt:result.receipt, template:result.template, download:null,
          forensic:{ hash:result.receipt?.hash||null, timestamp:new Date().toISOString(), tier, sge_risk:result.sge?.risk||"R0" } });
        fetch("/palette/api/dragon/render", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify(renderPayload)
        }).then(r=>r.json()).then(rd => {
          if (rd.success) {
            setMsgs(prev => prev.map((m,i) => i===prev.length-1 ? {...m, download:rd} : m));
            setActiveDoc(prev => prev ? {...prev, download:rd} : null);
          } else { console.warn("[Render] Failed:", rd.error); }
        }).catch(e => console.warn("[Render fallback]", e));
      }
    } catch (err) {
      console.error("[DragonBrain] Send error:", err);
      // Graceful error — NO agentThink reset (fixes TILT bug)
      const ats = new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
      const errorMsgs = {
        pt: "⚠️ Houve uma falha temporária na comunicação. Por favor, tenta novamente a tua pergunta.",
        de: "⚠️ Vorübergehender Kommunikationsfehler. Bitte stelle deine Frage erneut.",
        en: "⚠️ Temporary communication error. Please try your question again."
      };
      const errorText = errorMsgs[detectedLang] || errorMsgs.en;
      setMsgs(prev => [...prev, { role:"agent", text:errorText, ts:ats, source:"local_fallback" }]);
    }
    setIsLoading(false);
  }, [input, tier, intentHistory, isLoading, msgs]);

  // ── OCR Image Upload Handler ──
  const handleOcrUpload = useCallback(async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setOcrLoading(true);
    setShowOcrModal(true);
    setOcrResult(null);

    const reader = new FileReader();
    reader.onload = async () => {
      try {
        const base64 = reader.result.split(',')[1];
        const res = await fetch("/palette/api/multimodal/ocr", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ image: base64, language: "deu+eng+por" })
        });
        if (!res.ok) {
          throw new Error(`HTTP ${res.status}: ${res.statusText}`);
        }
        const data = await res.json();
        setOcrResult(data);
      } catch (err) {
        setOcrResult({ error: err.message || "OCR processing failed" });
      } finally {
        setOcrLoading(false);
      }
    };
    reader.onerror = () => {
      setOcrResult({ error: "Failed to read file" });
      setOcrLoading(false);
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  }, []);

  // ── Insert OCR text into chat ──
  const insertOcrText = useCallback(() => {
    if (ocrResult?.text) {
      setInput(prev => prev + (prev ? "\n" : "") + ocrResult.text);
      setShowOcrModal(false);
      inputRef.current?.focus();
    }
  }, [ocrResult]);

  // ── URL Verification Handler ──
  const handleUrlVerify = useCallback(async () => {
    if (!urlInput.trim()) return;
    setUrlLoading(true);
    setUrlResult(null);
    try {
      const res = await fetch("/palette/api/multimodal/verify-url", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: urlInput.trim() })
      });
      const data = await res.json();
      setUrlResult(data);
    } catch (err) {
      setUrlResult({ error: err.message });
    }
    setUrlLoading(false);
  }, [urlInput]);

  // ── Document Generation Handler (Sprint 1) ──
  const handleDocGenerate = useCallback(async () => {
    if (!docGenTitle.trim() || !docGenContent.trim()) return;
    setDocGenLoading(true);
    try {
      const res = await fetch(`/palette/api/dragon/generate/${docGenModal.format}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title: docGenTitle, content: docGenContent })
      });
      const data = await res.json();
      if (data.status === "generated") {
        setLastGeneratedFile(data);
        // Auto-download
        const link = document.createElement("a");
        link.href = `/palette${data.download_url}`;
        link.download = data.file_id;
        link.click();
        // Add to chat
        const ts = new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
        setMsgs(prev => [...prev, { role:"agent", text:`📄 **${data.title}** generiert (${docGenModal.format.toUpperCase()}, ${data.size} bytes)\n\n[Download ${data.file_id}](/palette${data.download_url})\n\n💡 Klicke ⚡ zum Versiegeln.`, ts, dragon:"architect" }]);
        setDocGenModal(null);
        setDocGenTitle("");
        setDocGenContent("");
      } else {
        alert(data.message || "Generation failed");
      }
    } catch (err) {
      alert("Error: " + err.message);
    }
    setDocGenLoading(false);
  }, [docGenModal, docGenTitle, docGenContent]);

  // ── Seal Handler (Sprint 2) ──
  const handleSeal = useCallback(async () => {
    if (!lastGeneratedFile?.file_id) return;
    try {
      const res = await fetch("/palette/api/dragon/seal", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ file_id: lastGeneratedFile.file_id })
      });
      const data = await res.json();
      setSealResult(data);
      if (data.status === "SEALED") {
        const ts = new Date().toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
        setMsgs(prev => [...prev, {
          role:"agent",
          text:`🔏 **WINDI SEAL RECEIPT**\n\n**Serial:** ${data.serial}\n**Hash:** ${data.receipt_hash.slice(0,16)}...\n**Ledger:** ✅ Registered\n**Vault:** ${data.vault_id === "pending" ? "⏳ Pending" : "✅ Stored"}\n\n[Verify](${data.verify_url})`,
          ts,
          dragon:"guardian",
          seal: data
        }]);
        setLastGeneratedFile(null);
      }
    } catch (err) {
      alert("Seal error: " + err.message);
    }
  }, [lastGeneratedFile]);

  // Sprint 1: Doc action handler
  const handleDocAction = useCallback(async (doc, action) => {
    const baseUrl = '/palette/api/communique';
    const viewUrl = '/palette/communique';

    switch(action) {
      case 'open':
        window.open(`${viewUrl}/${doc.id}`, '_blank');
        break;
      case 'download':
        window.open(`${viewUrl}/${doc.id}/pdf`, '_blank');
        break;
      case 'verify':
        window.open(`${viewUrl}/${doc.id}/verify`, '_blank');
        break;
      case 'review':
        try {
          const res = await fetch(`${baseUrl}/${doc.id}/review`, { method: 'POST' });
          if (res.ok) {
            setComDocs(prev => prev.map(d => d.id === doc.id ? {...d, status: 'REVIEW'} : d));
          }
        } catch (e) { console.error('Review failed:', e); }
        break;
      case 'publish':
        try {
          const res = await fetch(`${baseUrl}/${doc.id}/publish`, { method: 'POST' });
          if (res.ok) {
            setComDocs(prev => prev.map(d => d.id === doc.id ? {...d, status: 'PUBLISHED'} : d));
          }
        } catch (e) { console.error('Publish failed:', e); }
        break;
      case 'archive':
        try {
          const res = await fetch(`${baseUrl}/${doc.id}/archive`, { method: 'POST' });
          if (res.ok) {
            setComDocs(prev => prev.map(d => d.id === doc.id ? {...d, status: 'ARCHIVED'} : d));
          }
        } catch (e) { console.error('Archive failed:', e); }
        break;
    }
  }, []);

  // Sprint J2: Jornaline submit handler with multimedia evidence
  const handleJornalineSubmit = useCallback(async (jornalinePayload, action) => {
    setJornalineLoading(true);
    try {
      // Build rich body with embedded media references
      let richBody = jornalinePayload.body || '';

      // Append video embeds
      if (jornalinePayload.videos?.length > 0) {
        richBody += '\n\n---\n\n**🎬 Vídeos:**\n';
        jornalinePayload.videos.forEach(v => {
          richBody += `\n- ${v.icon} [${v.name}](${v.url})`;
        });
      }

      // Append social links
      if (jornalinePayload.links?.length > 0) {
        richBody += '\n\n**🔗 Referências:**\n';
        jornalinePayload.links.forEach(l => {
          richBody += `\n- ${l.icon} [${l.name}](${l.url})`;
        });
      }

      // Build the payload for Communiqué API
      const payload = {
        title_de: jornalinePayload.title,
        title_en: jornalinePayload.title,
        title_pt: jornalinePayload.title,
        body_de: `<p>${richBody.replace(/\n/g, '</p><p>')}</p>`,
        body_en: `<p>${richBody.replace(/\n/g, '</p><p>')}</p>`,
        body_pt: `<p>${richBody.replace(/\n/g, '</p><p>')}</p>`,
        category: jornalinePayload.category || "REPORT",
        impact_level: jornalinePayload.impact || "MED",
        isp_template: jornalinePayload.template || "ISP-COM-02",
        governance_level: "CITIZEN",
        author_name: "Cidadão",
        author_role: "citizen",
        // Multimedia evidence metadata
        evidence: {
          images: (jornalinePayload.images || []).map(img => ({
            name: img.name,
            size: img.size,
            timestamp: img.timestamp,
            ocrText: img.ocrText,
          })),
          videos: jornalinePayload.videos || [],
          links: jornalinePayload.links || [],
        },
        forensic: {
          device: navigator.userAgent.slice(0, 100),
          timestamp: new Date().toISOString(),
          browser: navigator.userAgent.match(/Chrome|Firefox|Safari|Edge/)?.[0] || 'Browser',
          evidence_count: {
            images: (jornalinePayload.images || []).length,
            videos: (jornalinePayload.videos || []).length,
            links: (jornalinePayload.links || []).length,
          },
        },
      };

      const res = await fetch('/palette/api/communique/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      if (res.ok) {
        const data = await res.json();

        // TODO: Upload images to evidence endpoint
        // for (const img of jornalinePayload.images || []) {
        //   await uploadEvidence(data.id, img);
        // }

        // Success - close modal and reset form
        setJornalineOpen(false);
        setJornalineData({
          template: "ISP-COM-02", category: "REPORT", impact: "MED",
          title: "", body: "", images: [], videos: [], links: []
        });

        // Build evidence summary for chat message
        const evCount = (jornalinePayload.images?.length || 0) + (jornalinePayload.videos?.length || 0) + (jornalinePayload.links?.length || 0);
        const evSummary = evCount > 0 ? `\n📎 Evidence: ${jornalinePayload.images?.length || 0}📷 ${jornalinePayload.videos?.length || 0}🎬 ${jornalinePayload.links?.length || 0}🔗` : '';

        // Add success message to chat
        const ts = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
        const successMsg = {
          de: `🗞️ **Jornaline erstellt!**\n\n**${jornalinePayload.title}**\nStatus: ${action === 'review' ? '🔍 In Prüfung' : '⏳ Entwurf'}\nID: ${data.id || 'pending'}${evSummary}\n\n_${action === 'review' ? 'Wird nach Prüfung veröffentlicht.' : 'Entwurf gespeichert.'}_`,
          en: `🗞️ **Jornaline created!**\n\n**${jornalinePayload.title}**\nStatus: ${action === 'review' ? '🔍 In Review' : '⏳ Draft'}\nID: ${data.id || 'pending'}${evSummary}\n\n_${action === 'review' ? 'Will be published after review.' : 'Draft saved.'}_`,
          pt: `🗞️ **Jornaline criada!**\n\n**${jornalinePayload.title}**\nStatus: ${action === 'review' ? '🔍 Em Revisão' : '⏳ Rascunho'}\nID: ${data.id || 'pending'}${evSummary}\n\n_${action === 'review' ? 'Será publicada após revisão.' : 'Rascunho guardado.'}_`,
        };
        setMsgs(prev => [...prev, { role: "agent", text: successMsg[lang] || successMsg.de, ts, dragon: "architect" }]);

        // Switch to docs tab to show the new document
        setActiveTab('docs');

        // If submitting for review, trigger the review endpoint
        if (action === 'review' && data.id) {
          await fetch(`/palette/api/communique/${data.id}/review`, { method: 'POST' });
        }
      } else {
        const error = await res.json();
        console.error('Jornaline create failed:', error);
        alert('Error: ' + (error.message || 'Failed to create Jornaline'));
      }
    } catch (e) {
      console.error('Jornaline submit error:', e);
      alert('Error: ' + e.message);
    }
    setJornalineLoading(false);
  }, [lang]);

  // Badge count: drafts + reviews (action needed)
  const docBadgeCount = comStats?.counts ? (comStats.counts.draft || 0) + (comStats.counts.review || 0) : 0;

  return (
    <div style={{ height:"100vh", display:"flex", background:T.bg, color:T.text, fontFamily:T.font, overflow:"hidden", transition:"background 0.3s, color 0.3s" }}>
      {/* v1.0.0-W Side Rail Navigation */}
      <SideRail activeTab={activeTab} setActiveTab={setActiveTab} expanded={sideRailExpanded} setExpanded={setSideRailExpanded} T={T} lang={lang} docCount={docBadgeCount} />

      {/* Main Content Area — shifts with rail */}
      <div style={{ flex:1, display:"flex", flexDirection:"column", marginLeft:sideRailExpanded ? 220 : 48, transition:"margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1)", overflow:"hidden" }}>
      {/* Header — Clean, professional */}
      <header style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"8px 16px", borderBottom:`1px solid ${T.border}`, background:T.card, flexShrink:0, minHeight:48, boxShadow:T.shadow }}>
        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
          <div>
            <span style={{ fontWeight:700, fontSize:14, color:T.gold }}>WINDI</span>
            <span style={{ fontWeight:400, fontSize:14, marginLeft:5, color:T.text }}>Agent Suite</span>
            <span style={{ marginLeft:6, padding:"2px 6px", borderRadius:4, fontSize:9, fontFamily:T.mono, background:T.gold+"15", color:T.gold, fontWeight:500 }}>v{V}</span>
          </div>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
          <TierSwitch tier={tier} set={setTier} T={T} />
          <div style={{ display:"flex", gap:2 }}>
            {["de","en","pt"].map(l => (
              <button key={l} onClick={()=>setLang(l)} style={{ padding:"3px 7px", borderRadius:4, fontSize:9, fontFamily:T.mono, background:lang===l?T.gold+"15":"transparent", border:`1px solid ${lang===l?T.gold+"30":"transparent"}`, color:lang===l?T.gold:T.muted, cursor:"pointer" }}>{l.toUpperCase()}</button>
            ))}
          </div>
          {/* Constitutional Gates */}
          <a href="/palette/governance/" title="Constitutional Gates Dashboard"
            style={{ padding:"3px 8px", borderRadius:4, fontSize:9, fontFamily:T.mono, background:"transparent", border:`1px solid ${T.gold}30`, color:T.gold, cursor:"pointer", textDecoration:"none", display:"flex", alignItems:"center", gap:3, transition:"all 0.2s" }}
            onMouseEnter={e=>{e.target.style.background=T.gold+"18";e.target.style.borderColor=T.gold}}
            onMouseLeave={e=>{e.target.style.background="transparent";e.target.style.borderColor=T.gold+"30"}}>
            ⚖️
          </a>
          {/* Theme toggle — KLAR/NOIR */}
          <button onClick={()=>setThemeName(t=>t==="KLAR"?"NOIR":"KLAR")} title={themeName==="KLAR"?"Switch to Noir":"Switch to Klar"}
            style={{ padding:"3px 10px", borderRadius:6, fontSize:9, fontFamily:T.mono, background:T.gold+"10", border:`1px solid ${T.gold}30`, color:T.gold, cursor:"pointer", display:"flex", alignItems:"center", gap:4, transition:"all 0.3s" }}>
            {themeName==="KLAR"?"☀️ KLAR":"🌙 NOIR"}
          </button>
        </div>
      </header>

      {/* Respiradouro Bar — Ambient Intelligence (Architect Dragon Design) */}
      {(() => { window._cogData = cogData; return null; })()}
      <RespiradouroBar
        cogScore={cogData?.score}
        services={pulseServices}
        T={T}
        lang={lang}
      />

      <div style={{ flex:1, display:"flex", overflow:"hidden", position:"relative" }}>
        {/* Tab Views — conditional rendering */}

        {/* DOCS TAB */}
        {activeTab === 'docs' && (
          <DocsView
            docs={comDocs}
            stats={comStats}
            loading={comLoading}
            T={T}
            lang={lang}
            onAction={handleDocAction}
          />
        )}

        {/* CHAT TAB (default) */}
        {activeTab === 'chat' && (
        <div style={{ flex:1, display:"flex", flexDirection:"column", minWidth:0 }}>
          <div ref={chatRef} style={{ flex:1, overflowY:"auto", padding:"14px 18px" }}>
            {msgs.length === 0 && (
              <div style={{ textAlign:"center", paddingTop:40, paddingBottom:20 }}>
                <div style={{ fontSize:56, marginBottom:16, animation:"breathe 4s ease-in-out infinite" }}>🐉</div>
                <div style={{ fontSize:20, fontWeight:700, color:T.gold, marginBottom:10, letterSpacing:"-0.5px" }}>
                  {lang==="de"?"Willkommen! Wie kann ich helfen?":lang==="pt"?"Bem-vindo! No que posso ajudar?":"Welcome! How can I help?"}
                </div>
                <div style={{ fontSize:13, color:T.dim, maxWidth:460, margin:"0 auto 14px", lineHeight:1.7 }}>
                  {lang==="de"?"Dokumente erstellen, Fragen beantworten — einfach losschreiben.":
                   lang==="pt"?"Criar documentos, responder perguntas — só escrever.":
                   "Create documents, answer questions — just start writing."}
                </div>
                {/* Ambient governance status */}
                {cogData && (
                  <div style={{ display:"inline-flex", alignItems:"center", gap:8, padding:"6px 14px", borderRadius:20, background:T.gold+"08", border:`1px solid ${T.gold}20`, marginBottom:16 }}>
                    <span style={{ width:8, height:8, borderRadius:"50%", background:T.green, animation:"sovereignPulse 2s ease-in-out infinite" }} />
                    <span style={{ fontSize:10, color:T.dim, fontFamily:T.mono }}>
                      {lang==="de"?"System bereit":lang==="pt"?"Sistema pronto":"System ready"} • {Math.round(cogData.score)}/100
                    </span>
                  </div>
                )}
                <div style={{ display:"flex", flexWrap:"wrap", justifyContent:"center", gap:4, margin:"8px auto 16px", maxWidth:480 }}>
                  {Object.entries(DOCS).slice(0,8).map(([k,d]) => (
                    <span key={k} style={{ padding:"3px 8px", borderRadius:12, fontSize:10, background:T.card, border:`1px solid ${T.border}`, color:T.dim, fontFamily:T.mono, boxShadow:T.shadow }}>{d.icon} {d[lang]||d.en}</span>
                  ))}

            setSessionDocs([]);
          }}
          onDismiss={() => setVitalityBannerDismissed(true)}
        />
      )}

      </div>{/* End Main Content Area */}

      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
        @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
        @keyframes breatheIn{from{opacity:0;transform:translateY(-6px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
        @keyframes softPulse{0%,100%{opacity:1}50%{opacity:0.5}}
        @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
        @keyframes slideUp{from{transform:translateY(40px);opacity:0}to{transform:translateY(0);opacity:1}}
        *{box-sizing:border-box;margin:0;padding:0}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:${T.border};border-radius:2px}
        textarea::placeholder{color:${T.muted}}
        button:hover{filter:brightness(1.05)}
        .dragon-breathe{animation:breathe 4s ease-in-out infinite}
      `}</style>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(WINDIAgentSuite));
</script>
</body>
