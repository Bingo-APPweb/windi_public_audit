<script>
// ═══════════════════════════════════════════════════════════════════════════════════
// WINDI MODULES BUNDLE v1.0 — P1-P7 Integration Layer
// Graceful degradation: if any module fails, Editor v6.0 works standalone
// ═══════════════════════════════════════════════════════════════════════════════════
(function() {
  'use strict';
  
  window.WINDI = window.WINDI || {};

  // ─── EVENT BUS — Sistema Nervoso Central ────────────────────────────────────
  // "O Palette respira quando os órgãos se comunicam."
  // ─────────────────────────────────────────────────────────────────────────────
  var EventBus = (function() {
    var listeners = {};

    // Event Types — o vocabulário do sistema nervoso
    var EVENTS = {

      if (listeners[eventType]) {

      if (!listeners[eventType]) listeners[eventType] = [];

      // Also add window listener for CustomEvents
      var windowHandler = function(e) { callback(e.detail); };
      window.addEventListener(eventType, windowHandler);

      // Return unsubscribe function
      return function off() {
        listeners[eventType] = listeners[eventType].filter(function(cb) { return cb !== callback; });
        window.removeEventListener(eventType, windowHandler);
      };
    }

    function once(eventType, callback) {
      var unsub = on(eventType, function(payload) {

// ─── MERKLE UTILITIES: Field-level hashing with Merkle root ──────────────────────
const merkleHash = async (value) => {
  const normalized = String(value || '').trim().toLowerCase();
  return await CryptoProvider.hash(normalized);
};

const merkleRoot = async (hashes) => {
  if (!hashes || hashes.length === 0) return await CryptoProvider.hash('empty');
  if (hashes.length === 1) return hashes[0];

  // Build Merkle tree bottom-up
  let level = [...hashes];
  while (level.length > 1) {
    const nextLevel = [];
    for (let i = 0; i < level.length; i += 2) {
      const left = level[i];
      const right = level[i + 1] || left; // Duplicate if odd
      nextLevel.push(await CryptoProvider.hash(left + right));
    }
    level = nextLevel;
  }
  return level[0];
};

// ─── DRAGON MENTOR: Get contextual whisper based on state ──────────────────────────
const getDragonWhisper = (context) => {
  const { field, value, docType, docFields, docStatus, sealPolicy, lang = 'en' } = context;

  // If we have a specific field being edited
  if (field && FIELD_NARRATIVES[field]) {
    const narrative = FIELD_NARRATIVES[field];

    // Check for value-specific narratives (like priority levels)
    if (narrative.values && value && narrative.values[value]) {
      return {
        text: narrative.values[value][lang] || narrative.values[value].en,
        weight: 'critical',
        governance: narrative.governance,
      };
    }

    // Return general field narrative
    return {
      text: narrative[lang] || narrative.en,
      weight: narrative.weight,
      governance: narrative.governance,
    };
  }

  // Document state-based whispers
  if (docStatus === 'sealed') {
    return { text: STATE_NARRATIVES.sealed[lang] || STATE_NARRATIVES.sealed.en, weight: 'info' };
  }

  // Check for special document policies
  if (sealPolicy) {
    if (sealPolicy.legalDocument) {
      return { text: STATE_NARRATIVES.legalNotice[lang] || STATE_NARRATIVES.legalNotice.en, weight: 'high' };
    }
    if (sealPolicy.financialDocument) {
      return { text: STATE_NARRATIVES.financialNotice[lang] || STATE_NARRATIVES.financialNotice.en, weight: 'high' };
    }
  }

  // Check if confidential
  if (docFields?.priority === 'confidential' || docFields?.classification === 'confidential') {
    return { text: STATE_NARRATIVES.confidentialWarning[lang] || STATE_NARRATIVES.confidentialWarning.en, weight: 'critical' };
  }

  // Check if ready to seal
  const docDNA = DOCS?.[docType];
  if (docDNA && docStatus === 'draft') {
    const requiredFields = docDNA.requiredFields || [];
    const allFilled = requiredFields.every(f => docFields?.[f]);
    if (allFilled && requiredFields.length > 0) {
      return { text: STATE_NARRATIVES.readyToSeal[lang] || STATE_NARRATIVES.readyToSeal.en, weight: 'info' };
    }
  }

  return null;
};

// ─── DRAGON MENTOR: Format whisper for display ─────────────────────────────────────
const formatDragonWhisper = (whisper, theme) => {
  if (!whisper) return null;

  const weightStyles = {
    critical: { color: theme?.warning || '#E6A23C', fontWeight: 600 },
    high: { color: theme?.gold || '#C9A84C', fontWeight: 500 },
    medium: { color: theme?.dim || '#888', fontWeight: 400 },
    info: { color: theme?.success || '#67C23A', fontWeight: 400 },
  };

  return {
    text: whisper.text,
    style: weightStyles[whisper.weight] || weightStyles.medium,
    governance: whisper.governance,
  };
};

// ─── SEAL BUILDER: Merkle root + GDPR compliance ─────────────────────────────────
const buildSealPayload = async (doc, wallet, sealPolicy) => {
  const { type, fields } = doc;
  const policy = sealPolicy || {};
  const isConfidential = fields.priority === 'confidential' || fields.classification === 'confidential';

  // Build field hashes
  const fieldHashes = {};
  const hashOrder = [];
  for (const fieldName of (policy.hashFields || Object.keys(fields))) {
    if (fields[fieldName] !== undefined && fields[fieldName] !== '') {
      const isPII = GDPR_PII_FIELDS.includes(fieldName);
      fieldHashes[fieldName] = await merkleHash(fields[fieldName]);
      hashOrder.push(fieldHashes[fieldName]);
    }
  }

  // Compute Merkle root
  const fieldsRoot = await merkleRoot(hashOrder);

  // Build seal payload (GDPR compliant - no PII in clear)
  const seal = {
    doc_type: policy.type || type.toUpperCase(),
    doc_id: CryptoProvider.receiptId(),
    created_at: new Date().toISOString(),
    signer_did: wallet?.id || null,
    anonymous: !wallet,

    // Merkle structure
    field_hashes: fieldHashes,
    fields_root: fieldsRoot,
    hash_algorithm: 'sha256-merkle',

    // GDPR: redacted hints (optional, for UX only)
    redacted_hints: {},

    // Policy flags
    confidential: isConfidential,
    legal_document: policy.legalDocument || false,
    financial_document: policy.financialDocument || false,
    governance_document: policy.governanceDocument || false,
    recipient_tracked: policy.recipientTracked || false,

    // AI Act compliance
    ai_assisted: true,
    ai_role: 'structural_guidance',
    human_authored: true,
  };

  // Add redacted hints for PII fields (not stored in ledger, just for local UX)
  for (const fieldName of GDPR_PII_FIELDS) {
    if (fields[fieldName]) {
      seal.redacted_hints[fieldName] = redactForLedger(fields[fieldName]);
    }
  }

  // Confidential policy enforcement
  if (isConfidential) {
    seal.subject_redacted = true;
    seal.body_redacted = true;
    seal.distribution_restricted = true;
  }

  return seal;
};

// ─── SEAL BUILDER v2.1: With Progress Callbacks ─────────────────────────────────
// "O usuário sente a prova matemática sendo construída."
const buildSealPayloadWithProgress = async (doc, wallet, sealPolicy, onProgress) => {
  const { type, fields } = doc;
  const policy = sealPolicy || {};
  const isConfidential = fields.priority === 'confidential' || fields.classification === 'confidential';
  const fieldNames = policy.hashFields || Object.keys(fields);
  const totalFields = fieldNames.filter(f => fields[f] !== undefined && fields[f] !== '').length;

  // ═══ STAGE 1: Field-level SHA-256 hashing ═══
  onProgress?.({ stage: 1, message: 'Hashing fields...', field: '', hash: '', progress: 0 });
  await new Promise(r => setTimeout(r, 200)); // Visual pause

  const fieldHashes = {};
  const hashOrder = [];
  let fieldIdx = 0;

  for (const fieldName of fieldNames) {
    if (fields[fieldName] !== undefined && fields[fieldName] !== '') {
      const hash = await merkleHash(fields[fieldName]);
      fieldHashes[fieldName] = hash;
      hashOrder.push(hash);
      fieldIdx++;

      // Report each field being hashed
      onProgress?.({
        stage: 1,
        message: `Hashing: ${fieldName}`,
        field: fieldName,
        hash: hash.substring(0, 16) + '...',
        progress: Math.round((fieldIdx / totalFields) * 25) // 0-25%
      });

      // Emit EventBus for each field
      if (window.WINDI?.EventBus) {
        window.WINDI.EventBus.emitSealProgress('field_hashed', { field: fieldName, hash: hash.substring(0, 16) });
      }

      await new Promise(r => setTimeout(r, 150)); // Visual pause per field
    }
  }

  // ═══ STAGE 2: Merkle tree building ═══
  onProgress?.({ stage: 2, message: 'Building Merkle tree...', field: '', hash: '', progress: 50 });
  if (window.WINDI?.EventBus) {
    window.WINDI.EventBus.emitSealProgress('merkle_building', { fields: totalFields });
  }
  await new Promise(r => setTimeout(r, 400)); // Visual pause

  // ═══ STAGE 3: Root computation ═══
  onProgress?.({ stage: 3, message: 'Computing Merkle root...', field: '', hash: '', progress: 75 });
  const fieldsRoot = await merkleRoot(hashOrder);

  onProgress?.({
    stage: 3,
    message: 'Root computed!',
    field: '',
    hash: fieldsRoot.substring(0, 24) + '...',
    progress: 80
  });

  if (window.WINDI?.EventBus) {
    window.WINDI.EventBus.emitSealProgress('root_computed', { root: fieldsRoot.substring(0, 16) });
  }
  await new Promise(r => setTimeout(r, 300)); // Visual pause

  // ═══ STAGE 4: Build final payload ═══
  onProgress?.({ stage: 4, message: 'Registering in Ledger...', field: '', hash: '', progress: 90 });

  const seal = {
    doc_type: policy.type || type.toUpperCase(),
    doc_id: CryptoProvider.receiptId(),
    created_at: new Date().toISOString(),
    signer_did: wallet?.id || null,
    anonymous: !wallet,
    field_hashes: fieldHashes,
    fields_root: fieldsRoot,
    hash_algorithm: 'sha256-merkle',
    redacted_hints: {},
    confidential: isConfidential,
    legal_document: policy.legalDocument || false,
    financial_document: policy.financialDocument || false,
    governance_document: policy.governanceDocument || false,
    recipient_tracked: policy.recipientTracked || false,
    ai_assisted: true,
    ai_role: 'structural_guidance',
    human_authored: true,
  };

  // GDPR redaction
  for (const fieldName of GDPR_PII_FIELDS) {
    if (fields[fieldName]) {
      seal.redacted_hints[fieldName] = redactForLedger(fields[fieldName]);
    }
  }

  if (isConfidential) {
    seal.subject_redacted = true;
    seal.body_redacted = true;
    seal.distribution_restricted = true;
  }

  await new Promise(r => setTimeout(r, 200)); // Final pause
  onProgress?.({ stage: 4, message: 'Sealed!', field: '', hash: seal.doc_id, progress: 100 });

  if (window.WINDI?.EventBus) {
    window.WINDI.EventBus.emitSealProgress('complete', { doc_id: seal.doc_id, root: fieldsRoot.substring(0, 16) });
  }

  return seal;
};

          [{ text: label('from'), bold: true }, { text: fields.from || '' }],
          [{ text: label('date'), bold: true }, { text: fields.date || new Date().toLocaleDateString() }],

      type: 'table',
      id: 'invoice-header',
      data: {
        rows: [
          [{ text: label('invoiceNo'), bold: true }, { text: fields.invoiceNo || '' }],
          [{ text: label('date'), bold: true }, { text: fields.date || new Date().toLocaleDateString() }],
          [{ text: label('billTo'), bold: true }, { text: fields.billTo || '' }],

        type: 'paragraph',
        id: 'invoice-items',

    blocks.push({
      type: 'paragraph',
      id: 'signature',
      data: { text: fields.signature || fields.signedBy, style: 'signature' }
    });
  }

  return blocks;
};

// Export document as JMPG package
const exportDocument = async (docType, docTitle, docFields, wallet, lang = 'en') => {
  const docDNA = DOCS[docType];
  if (!docDNA) {
    throw new Error(`Unknown document type: ${docType}`);
  }

  // Build seal payload with Merkle root
  const seal = await buildSealPayload(
    { type: docType, fields: docFields },
    wallet,
    docDNA.sealPolicy
  );

  // Detect current tier
const detectTierFromUrl = () => { if (window.WINDI && window.WINDI.tier) { return { tier: window.WINDI.tier }; } const stored = localStorage.getItem("windi_tier"); if (stored) { return { tier: stored }; } const host = window.location.hostname; if (host.includes("admin") || host.includes("pro")) { return { tier: "HIGH" }; } return { tier: "FREE" }; }; // restored 2026-03-06
  const tierInfo = detectTierFromUrl();
  const tier = tierInfo.tier;

  // Transform fields to JMPG content_blocks
  const contentBlocks = transformFieldsToBlocks(docType, docFields, docDNA.schema, lang);

  // Build export request
  const exportPayload = {
    title: docTitle || docFields.subject || 'Untitled Document',
    author: wallet?.name || 'Anonymous',
    template: DOC_TYPE_TO_TEMPLATE[docType] || 'generic',
    content_blocks: contentBlocks,
    metadata: {
      // Document DNA
      doc_type: docType,
      doc_type_label: docDNA.sealPolicy?.type || docType.toUpperCase(),
      tier: tier,
      complexity: docDNA.complexity,

      // Seal data
      doc_id: seal.doc_id,
      fields_root: seal.fields_root,
      field_hashes: seal.field_hashes,
      created_at: seal.created_at,
      signer_did: seal.signer_did,
      anonymous: seal.anonymous,

      // Policy flags
      confidential: seal.confidential,
      legal_document: seal.legal_document,
      financial_document: seal.financial_document,
      governance_document: seal.governance_document,
      recipient_tracked: seal.recipient_tracked,

      // AI Act compliance
      ai_assisted: seal.ai_assisted,
      ai_role: seal.ai_role,
      human_authored: seal.human_authored,

      // WINDI identity
      wallet_id: wallet?.id || null,
      wallet_name: wallet?.name || null,
      trust_score: wallet?.trustScore || null,

      // Verification hint
      verify_url: `${window.location.origin}/verify/${seal.doc_id}`,
    },
    return_format: 'json'  // Get base64 for download
  };

  console.log('[WINDI Export] Sending to JMPG engine:', exportPayload.metadata.doc_id);

  // Call Export Engine
  const response = await fetch(`${EXPORT_URL}/api/export/jmpg`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(exportPayload),
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({ error: response.statusText }));
    throw new Error(err.error || 'Export failed');
  }

  const result = await response.json();

  // Download the file
  if (result.success && result.data_base64) {
    const byteChars = atob(result.data_base64);
    const byteArray = new Uint8Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) {
      byteArray[i] = byteChars.charCodeAt(i);
    }
    const blob = new Blob([byteArray], { type: 'application/vnd.windi.jmpg' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = result.filename || `${seal.doc_id}.jmpg`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  return {
    success: result.success,
    packageId: result.package_id,
    receiptId: result.receipt_id,
    ledgerRegistered: result.ledger_registered,
    filename: result.filename,
    contentHash: result.content_hash,
  };
};

const CryptoProvider = {
  async hash(content) {
    if (CONFIG.CRYPTO_MODE === "real" && window.crypto?.subtle) {
      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(content);
        const hashBuffer = await window.crypto.subtle.digest("SHA-256", data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, "0")).join("");
      } catch (e) { /* fallback to sim */ }
    }
    // Sim mode: deterministic hash (good enough for demo)
    let h1 = 0x811c9dc5, h2 = 0x6a09e667;
    for (let i = 0; i < content.length; i++) {
      h1 = Math.imul(h1 ^ content.charCodeAt(i), 0x01000193);
      h2 = ((h2 << 5) - h2 + content.charCodeAt(i)) | 0;
    }
    const a = Math.abs(h1).toString(16).padStart(16, "0");
    const b = Math.abs(h2).toString(16).padStart(16, "0");
    return (a + b + a.split("").reverse().join("") + b.split("").reverse().join("")).slice(0, 64);
  },

  generateFingerprint() {
    if (CONFIG.CRYPTO_MODE === "real" && window.crypto?.getRandomValues) {
      const bytes = new Uint8Array(32);
      window.crypto.getRandomValues(bytes);
      return Array.from(bytes).map(b => b.toString(16).padStart(2, "0")).join("");
    }
    return Array.from({length:32}, () => Math.floor(Math.random()*256).toString(16).padStart(2,"0")).join("");
  },

  generateUUID() {
    if (CONFIG.CRYPTO_MODE === "real" && window.crypto?.randomUUID) {
      try { return crypto.randomUUID(); } catch(e) {}
    }
    const t = Date.now().toString(16).padStart(12,"0");
    const r = Array.from({length:4}, () => Math.floor(Math.random()*65536).toString(16).padStart(4,"0")).join("");
    return `${t.slice(0,8)}-${t.slice(8,12)}-7${r.slice(0,3)}-${(0x80|Math.random()*0x3f|0).toString(16)}${r.slice(3,6)}-${r.slice(6)}${Math.random().toString(16).slice(2,14)}`;
  },

  walletId() {
    const d = new Date();
    return `WALLET-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}-${String(Math.floor(Math.random()*9999)).padStart(4,"0")}`;
  },

  receiptId() {
    return `VR-${Date.now().toString(36)}-${Math.random().toString(36).slice(2,6)}`.toUpperCase();
  },
};

// ─── TrustRadar SVG ───
const TrustRadar=({score,max=50,size=64,theme})=>{
  const r=(size-6)/2,c=2*Math.PI*r,p=score/max;
  const col=p>=.8?theme.success:p>=.5?theme.warning:theme.gold;
  return(<svg width={size} height={size}><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={theme.border} strokeWidth="3"/>
    <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={col} strokeWidth="3" strokeDasharray={c}
      strokeDashoffset={c*(1-p)} strokeLinecap="round" transform={`rotate(-90 ${size/2} ${size/2})`}
      style={{transition:"stroke-dashoffset 1.5s cubic-bezier(0.34,1.56,0.64,1)"}}/>
    <text x={size/2} y={size/2-2} textAnchor="middle" fontSize="13" fontWeight="800" fill={theme.text} fontFamily="'Bricolage Grotesque',sans-serif">T{score}</text>
    <text x={size/2} y={size/2+10} textAnchor="middle" fontSize="8" fill={theme.dim} fontFamily="'JetBrains Mono',monospace">/{max}</text></svg>);
};

// COGNITIVE INSIGHT CARD — Renders a single insight with formatting
// ═══════════════════════════════════════════════════════════════════════════════════
function CognitiveInsightCard({ insight, lang = 'en', theme, onAction, compact = false }) {
  const [isHovered, setIsHovered] = useState(false);
  const [showExplain, setShowExplain] = useState(false);

  const style = COGNITIVE_IMPACT_STYLES[insight.impact] || COGNITIVE_IMPACT_STYLES.medium;

  const formatText = (text) => {
    if (!text) return '';
    return text.split('\n').map((line, i) => {
      const parts = line.split(/\*\*(.*?)\*\*/g);
      return (
        <div key={i} style={{ marginBottom: line === '' ? 8 : 2 }}>
          {parts.map((part, j) =>
            j % 2 === 1
              ? <strong key={j} style={{ color: style.accent, fontWeight: 700 }}>{part}</strong>
              : <span key={j}>{part}</span>
          )}
        </div>
      );
    });
  };

  const typeIcons = {
    momentum_score: '📈', daily_delta: '🔔', audience_core: '🧠',
    channel_dominance: '📡', optimal_timing: '⏰', viral_amplifiers: '🚀',
    frequency_warning: '⚠️'
  };

  const actionLabels = { de: 'Aktion', en: 'Action', pt: 'Acção' };
  const whyLabels = { de: 'Warum?', en: 'Why?', pt: 'Porquê?' };
  const whyExplain = { de: 'Warum dieser Einblick?', en: 'Why this insight?', pt: 'Porquê este insight?' };
  const dataSrc = { de: 'Datenquellen', en: 'Data sources', pt: 'Fontes de dados' };
  const conf = { de: 'Konfidenz', en: 'Confidence', pt: 'Confiança' };
  const impact = { de: 'Erwarteter Einfluss', en: 'Expected impact', pt: 'Impacto esperado' };

  return (
    <div
      onMouseEnter={() => setIsHovered(true)}
      onMouseLeave={() => setIsHovered(false)}
      style={{
        background: style.gradient,
        border: `1px solid ${isHovered ? style.accent : style.border}`,
        borderRadius: 14,
        padding: compact ? '12px 14px' : '16px 20px',
        marginBottom: 10,
        boxShadow: isHovered ? style.glow : 'none',
        transition: 'all 0.3s ease',
      }}>
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 10, marginBottom: compact ? 8 : 12 }}>
        <div style={{
          width: compact ? 32 : 40, height: compact ? 32 : 40, borderRadius: 10,
          background: `${style.accent}15`, border: `1px solid ${style.accent}33`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: compact ? 16 : 20, flexShrink: 0
        }}>
          {typeIcons[insight.type] || '💡'}
        </div>
        <div style={{ flex: 1 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 2 }}>
            <span style={{
              fontSize: 9, fontFamily: "'JetBrains Mono', monospace",
              padding: '2px 6px', borderRadius: 4,
              background: style.badge.bg, color: style.badge.color, fontWeight: 600
            }}>{style.badge.label}</span>
          </div>
        </div>
      </div>
      <div style={{ fontSize: compact ? 12 : 13, lineHeight: 1.6, color: theme.text, marginBottom: insight.action ? 12 : 0 }}>
        {formatText(insight.text)}
      </div>
      {insight.action && (
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <button onClick={() => onAction?.(insight)} style={{
            padding: '7px 14px', borderRadius: 7, background: style.accent, border: 'none',
            color: '#000', fontSize: 11, fontWeight: 700, cursor: 'pointer',
            display: 'flex', alignItems: 'center', gap: 5
          }}>
            {insight.action === 'invite_core_to_did' && '👥'}
            {insight.action === 'view_momentum_details' && '📊'}
            {insight.action === 'schedule_optimal' && '📅'}
            {insight.action === 'prioritize_channel' && '📡'}
            {actionLabels[lang] || actionLabels.en}
          </button>
          <button onClick={() => setShowExplain(!showExplain)} style={{
            padding: '7px 10px', borderRadius: 7, background: 'transparent',
            border: `1px solid ${theme.border}`, color: theme.dim, fontSize: 11, cursor: 'pointer'
          }}>
            🧠 {whyLabels[lang] || whyLabels.en}
          </button>
        </div>
      )}
      {showExplain && (
        <div style={{
          marginTop: 10, padding: '10px 12px', background: theme.bg, borderRadius: 8,
          border: `1px solid ${theme.border}`, fontSize: 11, color: theme.dim, lineHeight: 1.6
        }}>
          <div style={{ fontWeight: 600, color: theme.text, marginBottom: 5 }}>
            🧠 {whyExplain[lang] || whyExplain.en}
          </div>
          <div>📊 {dataSrc[lang] || dataSrc.en}: Ledger, Metrics, Engagement</div>
          <div>🎯 {conf[lang] || conf.en}: {Math.round((insight.confidence || 0.8) * 100)}%</div>
          <div>📈 {impact[lang] || impact.en}: {insight.impact}</div>
        </div>
      )}
    </div>
  );
}

      setInsights(DEMO_INSIGHTS[lang] || DEMO_INSIGHTS.en);
    }
    setLoading(false);
  }, [lang]);

  useEffect(() => { fetchInsights(); }, [fetchInsights]);

  const handleAction = (insight) => {

        display: 'flex', alignItems: 'center', justifyContent: 'space-between',

      }}>
        <div>
          <div style={{ fontSize: compact ? 15 : 18, fontWeight: 800, color: theme.gold, display: 'flex', alignItems: 'center', gap: 8 }}>
            <span style={{ fontSize: compact ? 18 : 24 }}>🧠</span>
            {titles[lang] || titles.en}
          </div>
          <div style={{ fontSize: 11, color: theme.dim, marginTop: 3 }}>{subtitles[lang] || subtitles.en}</div>
        </div>
        <button onClick={fetchInsights} disabled={loading} style={{
          padding: '5px 10px', borderRadius: 7, background: theme.bg,
          border: `1px solid ${theme.border}`, color: theme.dim, fontSize: 11,
          cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 5
        }}>
          {loading ? '⏳' : '🔄'} {refreshLabel[lang] || refreshLabel.en}
        </button>
      </div>
      {insights.map((insight, i) => (
        <CognitiveInsightCard key={`${insight.type}-${i}`} insight={insight} lang={lang} theme={theme} compact={compact} onAction={handleAction} />
      ))}
      {phrase && (
        <div style={{
          marginTop: 14, padding: '10px 14px', background: theme.bg, borderRadius: 10,
          textAlign: 'center', fontStyle: 'italic', fontSize: 12, color: theme.dim
        }}>
          "{phrase}"
        </div>
      )}
    </div>
  );
}

      {/* ═══ WALLET PANEL MODAL ═══ */}

          </div></div></div>}

      {/* ═══ FIX (J): FINALIZE 2-STEP MODAL + SEAL PROGRESSION ═══ */}
      {showFinalizeModal&&<div style={{position:"fixed",inset:0,background:"#000A",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={()=>{if(finalizeStep!==3)setShowFinalizeModal(false);}}>
        <div onClick={e=>e.stopPropagation()} style={{background:th.card,borderRadius:18,padding:"24px 20px",maxWidth:420,width:"100%",border:`1px solid ${th.gold}33`,maxHeight:"90vh",overflowY:"auto"}}>

              borderBottom:`2px solid ${finalizeStep>=s?th.gold:th.border}`,
              color:finalizeStep>=s?th.gold:th.dim}}>{s===1?t.finalize.step1:t.finalize.step2}</div>)}
          </div>

          {finalizeStep===1&&<>
            {/* Checklist */}
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:16}}>
              {checks.map((c,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 12px",borderRadius:8,
                background:c.ok?th.success+"08":th.danger+"08",border:`1px solid ${c.ok?th.success+"22":th.danger+"22"}`}}>

            </div>
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setShowFinalizeModal(false)} style={{flex:1,padding:"10px",borderRadius:10,background:th.card,border:`1px solid ${th.border}`,color:th.dim,fontSize:12,cursor:"pointer"}}>{t.finalize.cancel}</button>
              <button onClick={()=>setFinalizeStep(2)} disabled={!checks.every(c=>c.ok)} style={{flex:1,padding:"10px",borderRadius:10,background:checks.every(c=>c.ok)?th.gold:th.dim,border:"none",color:"#FFF",fontSize:12,fontWeight:700,cursor:"pointer",opacity:checks.every(c=>c.ok)?1:0.4}}>→ {t.finalize.step2}</button>

          {finalizeStep===2&&<>
            <div style={{textAlign:"center",padding:"20px 0"}}>

              <p style={{fontSize:13,color:th.text,lineHeight:1.5,marginBottom:16}}>
                {lang==="de"?"Dein Dokument wird kryptographisch versiegelt. Dieser Vorgang ist unwiderruflich.":
                 lang==="pt"?"O teu documento será selado criptograficamente. Esta acção é irreversível.":

            </div>

              <button onClick={()=>setFinalizeStep(1)} style={{flex:1,padding:"10px",borderRadius:10,background:th.card,border:`1px solid ${th.border}`,color:th.dim,fontSize:12,cursor:"pointer"}}>← {t.finalize.step1}</button>

            </div>

          {/* ═══ STEP 3: SEALING PROGRESSION (4 Stages) ═══ */}
          {finalizeStep===3&&<>
            <div style={{textAlign:"center",padding:"16px 0"}}>
              {/* Animated seal icon */}
              <div style={{fontSize:56,marginBottom:12,animation:"pulse 1s ease-in-out infinite"}}>
                {sealProgress.stage===4&&sealProgress.progress===100?"✅":"🔐"}
              </div>

              {/* Progress ring */}
              <div style={{position:"relative",width:120,height:120,margin:"0 auto 16px"}}>
                <svg width="120" height="120" style={{transform:"rotate(-90deg)"}}>
                  <circle cx="60" cy="60" r="54" fill="none" stroke={th.border} strokeWidth="8"/>
                  <circle cx="60" cy="60" r="54" fill="none" stroke={th.gold} strokeWidth="8"
                    strokeDasharray={`${(sealProgress.progress||0)*3.39} 339`}
                    strokeLinecap="round" style={{transition:"stroke-dasharray 0.3s ease"}}/>
                </svg>
                <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",
                  fontSize:24,fontWeight:800,color:th.gold}}>{sealProgress.progress||0}%</div>
              </div>

              {/* Stage indicators */}
              <div style={{display:"flex",justifyContent:"center",gap:6,marginBottom:16}}>
                {[1,2,3,4].map(s=>(
                  <div key={s} style={{
                    width:28,height:28,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",
                    background:sealProgress.stage>=s?th.gold:th.border,color:sealProgress.stage>=s?"#FFF":th.dim,
                    fontSize:11,fontWeight:700,transition:"all 0.3s"
                  }}>{s}</div>
                ))}
              </div>

              {/* Stage labels */}
              <div style={{fontSize:11,color:th.dim,marginBottom:8}}>
                {sealProgress.stage===1&&(lang==="de"?"1/4 — Feld-Hashing (SHA-256)":lang==="pt"?"1/4 — Hashing de campos (SHA-256)":"1/4 — Field Hashing (SHA-256)")}
                {sealProgress.stage===2&&(lang==="de"?"2/4 — Merkle-Baum wird erstellt":lang==="pt"?"2/4 — Construindo árvore Merkle":"2/4 — Building Merkle Tree")}
                {sealProgress.stage===3&&(lang==="de"?"3/4 — Merkle-Wurzel berechnet":lang==="pt"?"3/4 — Raiz Merkle calculada":"3/4 — Merkle Root Computed")}
                {sealProgress.stage===4&&(lang==="de"?"4/4 — Im Ledger registriert":lang==="pt"?"4/4 — Registrado no Ledger":"4/4 — Registered in Ledger")}
              </div>

              {/* Current operation message */}
              <div style={{fontSize:13,fontWeight:600,color:th.text,marginBottom:8}}>
                {sealProgress.message}
              </div>

              {/* Field being hashed (stage 1 only) */}
              {sealProgress.stage===1&&sealProgress.field&&(
                <div style={{padding:"8px 12px",borderRadius:8,background:th.hover,border:`1px solid ${th.border}`,marginBottom:8}}>
                  <div style={{fontSize:10,color:th.dim,marginBottom:2}}>
                    {lang==="de"?"Aktuelles Feld:":lang==="pt"?"Campo actual:":"Current field:"}
                  </div>
                  <div style={{fontSize:12,fontWeight:600,color:th.gold,fontFamily:"'JetBrains Mono',monospace"}}>
                    {sealProgress.field}
                  </div>
                </div>
              )}

              {/* Hash preview (stages 1,3,4) */}
              {sealProgress.hash&&(
                <div style={{padding:"8px 12px",borderRadius:8,background:"#0002",border:`1px solid ${th.gold}22`}}>
                  <div style={{fontSize:10,color:th.dim,marginBottom:2}}>
                    {sealProgress.stage===3?"Merkle Root:":sealProgress.stage===4?"Document ID:":"Hash:"}
                  </div>
                  <div style={{fontSize:11,fontWeight:500,color:th.gold,fontFamily:"'JetBrains Mono',monospace",wordBreak:"break-all"}}>
                    {sealProgress.hash}
                  </div>
                </div>
              )}

              {/* Educational text */}
              <div style={{fontSize:10,color:th.dim,marginTop:12,lineHeight:1.5,maxWidth:280,margin:"12px auto 0"}}>
                {sealProgress.stage===1&&(lang==="de"?"Jedes Feld wird einzeln gehasht für Integrität.":lang==="pt"?"Cada campo é hasheado individualmente para integridade.":"Each field is individually hashed for integrity.")}
                {sealProgress.stage===2&&(lang==="de"?"Die Hashes werden zu einem Merkle-Baum kombiniert.":lang==="pt"?"Os hashes são combinados numa árvore Merkle.":"Hashes are combined into a Merkle tree.")}
                {sealProgress.stage===3&&(lang==="de"?"Die Wurzel beweist mathematisch die Integrität aller Felder.":lang==="pt"?"A raiz prova matematicamente a integridade de todos os campos.":"The root mathematically proves integrity of all fields.")}
                {sealProgress.stage===4&&(lang==="de"?"Dein Dokument existiert jetzt als unveränderliche Wahrheit.":lang==="pt"?"O teu documento existe agora como verdade imutável.":"Your document now exists as immutable truth.")}
              </div>
            </div>
          </>}
        </div></div>}

      {/* ═══ FIX (I): VOICE PASTE MODAL ═══ */}
      {showVoiceModal&&<div style={{position:"fixed",inset:0,background:"#000A",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={()=>setShowVoiceModal(false)}>
        <div onClick={e=>e.stopPropagation()} style={{background:th.card,borderRadius:18,padding:"24px 20px",maxWidth:400,width:"100%",border:`1px solid ${th.gold}33`}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12}}>
            <span style={{fontSize:24}}>🎙️</span>
            <h2 style={{fontSize:16,fontWeight:800,margin:0}}>{t.doc.addVoice}</h2></div>
          <p style={{fontSize:12,color:th.dim,marginBottom:12,lineHeight:1.5}}>
            {lang==="de"?"Sprich dein Transkript oder kopiere es von einer Sprach-App hier rein.":
             lang==="pt"?"Cola a tua transcrição de uma app de voz aqui.":
             "Paste your voice transcript from a speech app here."}</p>
          <textarea value={voiceText} onChange={e=>setVoiceText(e.target.value)}
            placeholder={lang==="de"?"Transkript hier einfügen...":lang==="pt"?"Colar transcrição aqui...":"Paste transcript here..."}
            style={{width:"100%",minHeight:100,padding:"10px 12px",borderRadius:10,border:`1px solid ${th.border}`,
              background:th.input,color:th.text,fontSize:13,outline:"none",resize:"vertical",boxSizing:"border-box",
              fontFamily:"'Bricolage Grotesque',sans-serif"}}/>
          <div style={{display:"flex",gap:8,marginTop:12}}>
            <button onClick={()=>setShowVoiceModal(false)} style={{flex:1,padding:"10px",borderRadius:10,background:th.card,border:`1px solid ${th.border}`,color:th.dim,fontSize:12,cursor:"pointer"}}>{t.did.close}</button>
            <button onClick={()=>{if(voiceText.trim()){send(voiceText.trim());setVoiceText("");setShowVoiceModal(false);}}} disabled={!voiceText.trim()}
              style={{flex:1,padding:"10px",borderRadius:10,background:voiceText.trim()?th.gold:th.dim,border:"none",color:"#FFF",fontSize:12,fontWeight:700,cursor:"pointer",opacity:voiceText.trim()?1:0.4}}>→ {t.sidebar.chat}</button>
          </div>
        </div></div>}

      {/* ═══ DISTRIBUTION MODAL — Send sealed documents ═══ */}
      {showDistributeModal&&<div style={{position:"fixed",inset:0,background:"#000A",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={()=>setShowDistributeModal(false)}>
        <div onClick={e=>e.stopPropagation()} style={{background:th.card,borderRadius:18,padding:"24px 20px",maxWidth:480,width:"100%",border:`1px solid ${th.gold}33`,maxHeight:"90vh",overflowY:"auto"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
            <span style={{fontSize:24}}>📤</span>
            <h2 style={{fontSize:16,fontWeight:800,margin:0}}>{t.distribute.title}</h2>
            <span style={{marginLeft:"auto",cursor:"pointer",fontSize:18,color:th.dim}} onClick={()=>setShowDistributeModal(false)}>×</span>
          </div>
          <p style={{fontSize:11,color:th.dim,marginBottom:16}}>{t.distribute.subtitle}</p>

          {/* Document info */}
          <div style={{padding:"10px 12px",borderRadius:10,background:th.hover,border:`1px solid ${th.border}`,marginBottom:16}}>
            <div style={{fontSize:13,fontWeight:700,marginBottom:2}}>{docTitle}</div>
            <div style={{fontSize:10,color:th.dim}}>🛡️ {receipt?.id} · {wordCount}w</div>
          </div>

          {/* Channels */}
          <div style={{marginBottom:16}}>
            <div style={{fontSize:12,fontWeight:700,marginBottom:8,color:th.gold}}>{t.distribute.channels}</div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {[
                {key:"email",icon:"email",label:t.distribute.email},
                {key:"whatsapp",icon:"chat",label:t.distribute.whatsapp},
                {key:"sms",icon:"broadcast",label:t.distribute.sms},
                {key:"linkedin",icon:"user",label:t.distribute.linkedin},
                {key:"twitter",icon:"globe",label:t.distribute.twitter},
              ].map(ch=>(
                <div key={ch.key} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",borderRadius:10,
                  background:distributeChannels[ch.key]?.enabled?`${th.gold}12`:th.hover,
                  border:`1px solid ${distributeChannels[ch.key]?.enabled?th.gold+"44":th.border}`}}>
                  <span className="w-icon" style={{width:18,height:18,color:distributeChannels[ch.key]?.enabled?th.gold:th.dim}} dangerouslySetInnerHTML={{__html: getWindiIcon(ch.icon)}} />
                  <span style={{fontSize:12,fontWeight:600,flex:1}}>{ch.label}</span>
                  {distributeChannels[ch.key]?.configured?(
                    <button onClick={()=>setDistributeChannels(p=>({...p,[ch.key]:{...p[ch.key],enabled:!p[ch.key].enabled}}))}
                      style={{padding:"4px 10px",borderRadius:6,fontSize:10,fontWeight:600,cursor:"pointer",
                        background:distributeChannels[ch.key].enabled?th.gold:"transparent",
                        border:`1px solid ${distributeChannels[ch.key].enabled?th.gold:th.border}`,
                        color:distributeChannels[ch.key].enabled?"#FFF":th.dim}}>
                      {distributeChannels[ch.key].enabled?"✓":"○"}
                    </button>
                  ):(
                    <button onClick={()=>setShowChannelSettings(true)} style={{padding:"4px 10px",borderRadius:6,background:"transparent",border:`1px solid ${th.border}`,color:th.dim,fontSize:9,cursor:"pointer"}}>
                      {t.distribute.configureFirst}
                    </button>
                  )}
                </div>
              ))}
            </div>
          </div>

          {/* Recipients */}
          <div style={{marginBottom:16}}>
            <div style={{fontSize:12,fontWeight:700,marginBottom:8,color:th.gold}}>{t.distribute.recipients}</div>
            {distributeRecipients.length===0?(
              <div style={{padding:"12px",borderRadius:10,background:th.hover,border:`1px dashed ${th.border}`,textAlign:"center"}}>
                <span style={{fontSize:11,color:th.dim}}>{t.distribute.noChannels}</span>
              </div>
            ):(
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {distributeRecipients.map((r,i)=>(
                  <div key={i} style={{padding:"4px 10px",borderRadius:14,background:`${th.gold}12`,border:`1px solid ${th.gold}33`,fontSize:10,display:"flex",alignItems:"center",gap:4}}>
                    <span>{r.channel==="email"?"📧":r.channel==="whatsapp"?"💬":"📱"}</span>
                    <span>{r.value}</span>
                    <span style={{cursor:"pointer",color:th.dim}} onClick={()=>setDistributeRecipients(p=>p.filter((_,j)=>j!==i))}>×</span>

              </div>
            )}
            <div style={{display:"flex",gap:6,marginTop:8}}>
              <input id="newRecipient" placeholder={t.distribute.emailPH} style={{flex:1,padding:"8px 10px",borderRadius:8,border:`1px solid ${th.border}`,background:th.input,color:th.text,fontSize:11}}/>
              <button onClick={()=>{
                const inp=document.getElementById("newRecipient");
                if(inp?.value?.trim()){
                  const channel=inp.value.includes("@")?"email":inp.value.startsWith("+")?"whatsapp":"sms";
                  setDistributeRecipients(p=>[...p,{channel,value:inp.value.trim()}]);
                  inp.value="";
                }
              }} style={{padding:"8px 12px",borderRadius:8,background:th.gold,border:"none",color:"#FFF",fontSize:11,fontWeight:700,cursor:"pointer"}}>+</button>
            </div>
          </div>

          {/* Optimal timing hint */}
          <div style={{padding:"8px 12px",borderRadius:8,background:`${th.success}12`,border:`1px solid ${th.success}33`,marginBottom:16,fontSize:10,color:th.success,display:"flex",alignItems:"center",gap:6}}>
            <span>⏰</span>
            <span>{t.distribute.optimalTime}</span>
          </div>

          {/* Actions */}
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>setShowDistributeModal(false)} style={{flex:1,padding:"10px",borderRadius:10,background:th.card,border:`1px solid ${th.border}`,color:th.dim,fontSize:12,cursor:"pointer"}}>{t.distribute.close}</button>
            <button onClick={()=>setShowDistributeModal(false)} style={{padding:"10px 16px",borderRadius:10,background:th.card,border:`1px solid ${th.border}`,color:th.text,fontSize:12,cursor:"pointer"}}>📅 {t.distribute.schedule}</button>
            <button
              disabled={distributeSending&&distributeRecipients.length===0&&!document.getElementById("newRecipient")?.value?.trim()}
              onClick={async()=>{
                const inp=document.getElementById("newRecipient");if(inp&&inp.value&&inp.value.trim()){const ch=inp.value.includes("@")?"email":inp.value.startsWith("+")?"whatsapp":"sms";distributeRecipients.push({channel:ch,value:inp.value.trim()});inp.value="";}
                setDistributeSending(true);
                try {
                  // Call Dragon Chat distribute API
                  const res = await fetch(dragonUrl+'/distribute', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                      recipients: distributeRecipients,
                      doc_title: docTitle,
                      doc_content: docContent,
                      receipt_id: receipt?.id || '',
                      lang: lang,
                    }),
                  });
                  const data = await res.json();
                  if (data.success || data.total_sent > 0) {
                    setDistributeSent(data.sent?.map(s=>s.to) || []);
                    flash(`✅ ${t.distribute.sent} ${data.total_sent} ${t.distribute.recipients.toLowerCase()}`);
                    setShowDistributeModal(false);
                  } else {
                    flash(`❌ ${t.distribute.failed}: ${data.failed?.[0]?.error || 'Unknown error'}`);
                  }
                } catch(e) {
                  console.error('[WINDI] Distribute error:', e);
                  flash(`❌ ${t.distribute.failed}: ${e.message}`);
                }
                setDistributeSending(false);
              }}
              style={{flex:1,padding:"10px",borderRadius:10,background:distributeRecipients.length>0?th.gold:th.dim,border:"none",color:"#FFF",fontSize:12,fontWeight:700,cursor:"pointer",opacity:distributeRecipients.length>0?1:0.5}}>
              {distributeSending?t.distribute.sending:`📤 ${t.distribute.sendNow}`}
            </button>
          </div>
        </div>
      </div>}

      {/* ═══ WHATSAPP SUITE MODAL — Send images, videos, documents via WhatsApp ═══ */}
      {showWhatsAppSuite&&<div style={{position:"fixed",inset:0,background:"#000A",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={()=>setShowWhatsAppSuite(false)}>
        <div onClick={e=>e.stopPropagation()} style={{background:th.card,borderRadius:18,padding:"24px 20px",maxWidth:480,width:"100%",border:`1px solid ${th.gold}33`,maxHeight:"90vh",overflowY:"auto"}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
            <span style={{fontSize:24}}>📲</span>
            <h2 style={{fontSize:16,fontWeight:800,margin:0}}>WhatsApp Suite</h2>
            <span id="wa-seal-badge" style={{display:"none",marginLeft:8,fontSize:11,color:th.gold,background:`${th.gold}12`,border:`1px solid ${th.gold}33`,borderRadius:20,padding:"2px 10px"}}>✓ {lang==="de"?"Versiegelt":lang==="pt"?"Selado":"Sealed"}</span>
            <span style={{marginLeft:"auto",cursor:"pointer",fontSize:18,color:th.dim}} onClick={()=>setShowWhatsAppSuite(false)}>×</span>
          </div>
          <p style={{fontSize:11,color:th.dim,marginBottom:16}}>
            {lang==="de"?"Bilder, Videos und Dokumente via WhatsApp senden":
             lang==="pt"?"Enviar imagens, vídeos e documentos via WhatsApp":
             "Send images, videos and documents via WhatsApp"}
          </p>

          {/* Recipient */}
          <div style={{marginBottom:12}}>
            <label style={{fontSize:12,color:th.dim,display:"block",marginBottom:4}}>
              {lang==="de"?"Empfänger (WhatsApp)":lang==="pt"?"Destinatário (WhatsApp)":"Recipient (WhatsApp)"}
            </label>
            <input id="wa-to" type="tel" placeholder={lang==="de"?"+49 xxx xxx xxxx":lang==="pt"?"+351 xxx xxx xxx":"+49 xxx xxx xxxx"} style={{
              width:"100%",boxSizing:"border-box",
              background:th.input,border:`1px solid ${th.border}`,
              borderRadius:8,padding:"9px 12px",
              fontSize:14,color:th.text,outline:"none"
            }}/>
          </div>

          {/* Type Selector */}
          <div style={{marginBottom:14}}>
            <label style={{fontSize:12,color:th.dim,display:"block",marginBottom:6}}>
              {lang==="de"?"Nachrichtentyp":lang==="pt"?"Tipo de Mensagem":"Message Type"}
            </label>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {[
                {type:"text",icon:"chat",label:lang==="de"?"Text":lang==="pt"?"Texto":"Text"},
                {type:"image",icon:"creative",label:lang==="de"?"Bild":lang==="pt"?"Imagem":"Image"},
                {type:"video",icon:"slides",label:lang==="de"?"Video":lang==="pt"?"Vídeo":"Video"},
                {type:"document",icon:"docs",label:lang==="de"?"Dokument":lang==="pt"?"Documento":"Document"},
              ].map(item=>(
                <button key={item.type} className="wa-type-btn" data-type={item.type}
                  onClick={()=>{
                    document.querySelectorAll('.wa-type-btn').forEach(b=>{
                      const isActive=b.dataset.type===item.type;
                      b.style.background=isActive?th.gold:'transparent';
                      b.style.color=isActive?'#FFF':th.dim;
                      b.style.borderColor=isActive?th.gold:th.border;
                    });
                    ['text','image','video','document'].forEach(t=>{
                      const p=document.getElementById(`wa-panel-${t}`);
                      if(p)p.style.display=t===item.type?'block':'none';
                    });
                    const status=document.getElementById('wa-status');
                    if(status)status.style.display='none';
                  }}
                  style={{
                    background:item.type==='text'?th.gold:'transparent',
                    border:`1px solid ${item.type==='text'?th.gold:th.border}`,
                    borderRadius:20,padding:"5px 14px",fontSize:12,
                    color:item.type==='text'?'#FFF':th.dim,
                    cursor:"pointer",fontFamily:"'Bricolage Grotesque',sans-serif",display:"flex",alignItems:"center",gap:6
                  }}>
                  <span className="w-icon" style={{width:14,height:14}} dangerouslySetInnerHTML={{__html: getWindiIcon(item.icon)}} />{item.label}
                </button>
              ))}
            </div>
          </div>

          {/* Panel: Text */}
          <div id="wa-panel-text">
            <label style={{fontSize:12,color:th.dim,display:"block",marginBottom:4}}>
              {lang==="de"?"Nachricht":lang==="pt"?"Mensagem":"Message"}
            </label>
            <textarea id="wa-text-body" rows={4} placeholder={lang==="de"?"Nachricht eingeben...":lang==="pt"?"Escreve a tua mensagem...":"Type your message..."} style={{
              width:"100%",boxSizing:"border-box",
              background:th.input,border:`1px solid ${th.border}`,
              borderRadius:8,padding:"9px 12px",
              fontSize:14,color:th.text,resize:"vertical",outline:"none"
            }}/>
          </div>

          {/* Panel: Image */}
          <div id="wa-panel-image" style={{display:"none"}}>
            <label style={{fontSize:12,color:th.dim,display:"block",marginBottom:4}}>
              {lang==="de"?"Bild-URL":lang==="pt"?"URL da Imagem":"Image URL"}
              <span style={{opacity:0.6}}> (JPEG/PNG/WebP · max 5MB)</span>
            </label>
            <input id="wa-image-url" type="url" placeholder="https://example.com/image.jpg" style={{
              width:"100%",boxSizing:"border-box",
              background:th.input,border:`1px solid ${th.border}`,
              borderRadius:8,padding:"9px 12px",
              fontSize:14,color:th.text,outline:"none"
            }} onBlur={(e)=>{
              const url=e.target.value.trim();
              const preview=document.getElementById('wa-img-preview');
              const tag=document.getElementById('wa-img-preview-tag');
              if(url&&/\.(jpg|jpeg|png|webp|gif)(\?.*)?$/i.test(url)){
                if(tag)tag.src=url;
                if(preview)preview.style.display='block';
              }else{
                if(preview)preview.style.display='none';
              }
            }}/>
            <div id="wa-img-preview" style={{marginTop:8,display:"none",borderRadius:8,overflow:"hidden",maxHeight:160,textAlign:"center",background:th.hover}}>
              <img id="wa-img-preview-tag" style={{maxHeight:160,maxWidth:"100%",objectFit:"contain"}} alt="preview"/>
            </div>
            <div style={{marginTop:8}}>
              <input id="wa-image-caption" type="text" placeholder={lang==="de"?"Beschriftung (optional)":lang==="pt"?"Legenda (opcional)":"Caption (optional)"} style={{
                width:"100%",boxSizing:"border-box",
                background:th.input,border:`1px solid ${th.border}`,
                borderRadius:8,padding:"8px 12px",
                fontSize:13,color:th.text,outline:"none"
              }}/>
            </div>
          </div>

          {/* Panel: Video */}
          <div id="wa-panel-video" style={{display:"none"}}>
            <label style={{fontSize:12,color:th.dim,display:"block",marginBottom:4}}>
              {lang==="de"?"Video-URL":lang==="pt"?"URL do Vídeo":"Video URL"}
              <span style={{opacity:0.6}}> (MP4/3GPP · max 16MB)</span>
            </label>
            <input id="wa-video-url" type="url" placeholder="https://example.com/video.mp4" style={{
              width:"100%",boxSizing:"border-box",
              background:th.input,border:`1px solid ${th.border}`,
              borderRadius:8,padding:"9px 12px",
              fontSize:14,color:th.text,outline:"none"
            }}/>
            <div style={{marginTop:8}}>
              <input id="wa-video-caption" type="text" placeholder={lang==="de"?"Beschriftung (optional)":lang==="pt"?"Legenda (opcional)":"Caption (optional)"} style={{
                width:"100%",boxSizing:"border-box",
                background:th.input,border:`1px solid ${th.border}`,
                borderRadius:8,padding:"8px 12px",
                fontSize:13,color:th.text,outline:"none"
              }}/>
            </div>
          </div>

          {/* Panel: Document */}
          <div id="wa-panel-document" style={{display:"none"}}>
            <label style={{fontSize:12,color:th.dim,display:"block",marginBottom:4}}>
              {lang==="de"?"Dokument-URL":lang==="pt"?"URL do Documento":"Document URL"}
              <span style={{opacity:0.6}}> (PDF/DOCX/JMPG · max 100MB)</span>
            </label>
            <input id="wa-doc-url" type="url" placeholder="https://example.com/document.pdf" style={{
              width:"100%",boxSizing:"border-box",
              background:th.input,border:`1px solid ${th.border}`,
              borderRadius:8,padding:"9px 12px",
              fontSize:14,color:th.text,outline:"none"
            }}/>
            <div style={{marginTop:8,display:"flex",gap:8}}>
              <input id="wa-doc-filename" type="text" placeholder={lang==="de"?"Dateiname.pdf":lang==="pt"?"ficheiro.pdf":"filename.pdf"} style={{
                flex:1,
                background:th.input,border:`1px solid ${th.border}`,
                borderRadius:8,padding:"8px 12px",
                fontSize:13,color:th.text,outline:"none"
              }}/>
              <input id="wa-doc-caption" type="text" placeholder={lang==="de"?"Beschriftung":lang==="pt"?"Legenda":"Caption"} style={{
                flex:1,
                background:th.input,border:`1px solid ${th.border}`,
                borderRadius:8,padding:"8px 12px",
                fontSize:13,color:th.text,outline:"none"
              }}/>
            </div>
          </div>

          {/* Status */}
          <div id="wa-status" style={{display:"none",marginTop:12,fontSize:12,padding:"8px 12px",borderRadius:8,fontFamily:"'JetBrains Mono',monospace"}}></div>

          {/* Actions */}
          <div style={{display:"flex",gap:8,marginTop:14}}>
            <button onClick={()=>setShowWhatsAppSuite(false)} style={{flex:1,padding:"10px",borderRadius:10,background:th.card,border:`1px solid ${th.border}`,color:th.dim,fontSize:12,cursor:"pointer"}}>
              {lang==="de"?"Abbrechen":lang==="pt"?"Cancelar":"Cancel"}
            </button>
            <button id="wa-send-btn" onClick={async()=>{
              const to=(document.getElementById('wa-to')?.value||'').trim();
              const status=document.getElementById('wa-status');
              const btn=document.getElementById('wa-send-btn');
              const badge=document.getElementById('wa-seal-badge');

              const setStatus=(msg,type)=>{
                if(!status)return;
                const colors={success:{bg:'#E8F5E9',color:'#2E7D32',border:'#A5D6A7'},error:{bg:'#FFEBEE',color:'#C62828',border:'#EF9A9A'},warn:{bg:'#FFF8E1',color:'#E65100',border:'#FFE082'},info:{bg:'#E3F2FD',color:'#1565C0',border:'#90CAF9'}};
                const c=colors[type]||colors.info;
                status.style.display='block';
                status.style.background=c.bg;
                status.style.color=c.color;
                status.style.border=`1px solid ${c.border}`;
                status.textContent=msg;
              };

              if(!to){setStatus(`⚠️ ${lang==="de"?"Empfänger erforderlich":lang==="pt"?"Destinatário obrigatório":"Recipient required"}`,'warn');return;}
              if(!/^\+\d{7,15}$/.test(to)){setStatus(`⚠️ ${lang==="de"?"Format: +49xxxxxxxxx":lang==="pt"?"Formato: +351xxxxxxxxx":"Format: +49xxxxxxxxx"}`,'warn');return;}

              const activeType=[...document.querySelectorAll('.wa-type-btn')].find(b=>b.style.background.includes(th.gold.replace('#','')))?.dataset?.type||'text';

              if(btn){btn.disabled=true;btn.textContent=`⏳ ${lang==="de"?"Sende...":lang==="pt"?"A enviar...":"Sending..."}`;}
              setStatus(`🔄 ${lang==="de"?"Verarbeite...":lang==="pt"?"A processar...":"Processing..."}`,'info');

              try{
                let endpoint='',payload={to};
                switch(activeType){
                  case 'text':{
                    const body=document.getElementById('wa-text-body')?.value?.trim();
                    if(!body)throw new Error(lang==="de"?"Nachricht erforderlich":lang==="pt"?"Mensagem obrigatória":"Message required");
                    endpoint='/whatsapp/send';payload.message=body;break;
                  }
                  case 'image':{
                    const url=document.getElementById('wa-image-url')?.value?.trim();
                    const caption=document.getElementById('wa-image-caption')?.value?.trim();
                    if(!url)throw new Error(lang==="de"?"URL erforderlich":lang==="pt"?"URL obrigatório":"URL required");
                    endpoint='/whatsapp/send-image';payload.image_url=url;if(caption)payload.caption=caption;break;
                  }
                  case 'video':{
                    const url=document.getElementById('wa-video-url')?.value?.trim();
                    const caption=document.getElementById('wa-video-caption')?.value?.trim();
                    if(!url)throw new Error(lang==="de"?"URL erforderlich":lang==="pt"?"URL obrigatório":"URL required");
                    endpoint='/whatsapp/send-video';payload.video_url=url;if(caption)payload.caption=caption;break;
                  }
                  case 'document':{
                    const url=document.getElementById('wa-doc-url')?.value?.trim();
                    const caption=document.getElementById('wa-doc-caption')?.value?.trim();
                    const filename=document.getElementById('wa-doc-filename')?.value?.trim()||'documento.pdf';
                    if(!url)throw new Error(lang==="de"?"URL erforderlich":lang==="pt"?"URL obrigatório":"URL required");
                    endpoint='/whatsapp/send-document';payload.doc_url=url;payload.filename=filename;if(caption)payload.caption=caption;break;
                  }
                }

                const res=await fetch(dragonUrl+endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
                const data=await res.json();

                if(data.success){
                  const typeLabel={text:lang==="de"?"Text":lang==="pt"?"Texto":"Text",image:lang==="de"?"Bild":lang==="pt"?"Imagem":"Image",video:lang==="de"?"Video":lang==="pt"?"Vídeo":"Video",document:lang==="de"?"Dokument":lang==="pt"?"Documento":"Document"}[activeType];
                  const receiptInfo=data.receipt?.sealed?` · 🔒 ${data.receipt.receipt_id}`:'';
                  setStatus(`✅ ${typeLabel} ${lang==="de"?"gesendet":lang==="pt"?"enviado":"sent"}${receiptInfo}`,'success');
                  if(badge&&data.receipt?.sealed)badge.style.display='block';
                  flash(`✅ WhatsApp ${typeLabel} ${lang==="de"?"gesendet":lang==="pt"?"enviado":"sent"}`);
                  setTimeout(()=>{
                    ['wa-text-body','wa-image-url','wa-image-caption','wa-video-url','wa-video-caption','wa-doc-url','wa-doc-caption','wa-doc-filename'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
                    const preview=document.getElementById('wa-img-preview');if(preview)preview.style.display='none';
                    if(status)status.style.display='none';
                  },3000);
                }else{
                  throw new Error(data.error||'Unknown error');
                }
              }catch(err){
                setStatus(`❌ ${err.message||String(err)}`,'error');
              }finally{
                if(btn){btn.disabled=false;btn.textContent=`📤 ${lang==="de"?"Senden + Versiegeln":lang==="pt"?"Enviar + Selar":"Send + Seal"}`;}
              }
            }} style={{flex:1,padding:"10px",borderRadius:10,background:`linear-gradient(135deg, ${th.gold}, #A07820)`,border:"none",color:"#FFF",fontSize:12,fontWeight:700,cursor:"pointer"}}>
              📤 {lang==="de"?"Senden + Versiegeln":lang==="pt"?"Enviar + Selar":"Send + Seal"}
            </button>
          </div>
        </div>
      </div>}

      {/* ═══ W-WICKTHIS MODAL — Publish to Evidence Graph ═══ */}
      {showWickModal&&<div style={{position:"fixed",inset:0,background:"#000A",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={()=>setShowWickModal(false)}>
        <div onClick={e=>e.stopPropagation()} style={{background:th.card,borderRadius:18,padding:"24px 20px",maxWidth:420,width:"100%",border:`1px solid ${th.gold}33`}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
            <span style={{fontSize:24}}>📡</span>
            <h2 style={{fontSize:16,fontWeight:800,margin:0}}>W-WICKTHIS</h2>
            <span style={{marginLeft:"auto",cursor:"pointer",fontSize:18,color:th.dim}} onClick={()=>setShowWickModal(false)}>×</span>
          </div>
          <p style={{fontSize:11,color:th.dim,marginBottom:16}}>
            {lang==="de"?"Dokument im Evidence Graph veröffentlichen":
             lang==="pt"?"Publicar documento no Evidence Graph":
             "Publish document to Evidence Graph"}
          </p>

          {!wickPublished?<>
            {/* Document info — works from both Doc view and Arena */}
            <div style={{padding:"10px 12px",borderRadius:10,background:th.hover,border:`1px solid ${th.border}`,marginBottom:12}}>
              <div style={{fontSize:13,fontWeight:700,marginBottom:2}}>{docTitle||arenaTopic||"Document"}</div>
              <div style={{fontSize:10,color:th.dim,fontFamily:"monospace"}}>🔐 {(receipt?.combined_hash||receipt?.ch||receipt?.bh||arenaSealResult?.hash_sha256||"—")?.slice(0,24)}...</div>
              <div style={{fontSize:10,color:th.success,marginTop:4}}>🛡️ {receipt?.id||arenaSealResult?.receipt_id||"—"}</div>
            </div>

            {/* Visibility selection */}
            <div style={{marginBottom:16}}>
              <div style={{fontSize:12,fontWeight:700,marginBottom:8,color:th.gold}}>
                {lang==="de"?"Sichtbarkeit":lang==="pt"?"Visibilidade":"Visibility"}
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:8}}>
                {[
                  {key:"private",icon:"🔒",label:lang==="de"?"Privat (nur ich)":lang==="pt"?"Privado (só eu)":"Private (only me)"},
                  {key:"workspace",icon:"👥",label:lang==="de"?"Workspace (Team)":lang==="pt"?"Workspace (equipa)":"Workspace (team)"},
                  {key:"public",icon:"📡",label:lang==="de"?"Öffentlich (verifizierbar)":lang==="pt"?"Público (verificável)":"Public (verifiable)"},
                ].map(v=>(
                  <div key={v.key} onClick={()=>setWickVisibility(v.key)} style={{
                    display:"flex",alignItems:"center",gap:10,padding:"12px",borderRadius:10,cursor:"pointer",
                    background:wickVisibility===v.key?`${th.gold}12`:th.hover,
                    border:`1px solid ${wickVisibility===v.key?th.gold:th.border}`
                  }}>
                    <span style={{fontSize:16}}>{v.icon}</span>
                    <span style={{fontSize:12,fontWeight:wickVisibility===v.key?700:500,flex:1}}>{v.label}</span>
                    <div style={{width:16,height:16,borderRadius:"50%",border:`2px solid ${wickVisibility===v.key?th.gold:th.border}`,
                      background:wickVisibility===v.key?th.gold:"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}>
                      {wickVisibility===v.key&&<div style={{width:6,height:6,borderRadius:"50%",background:"#FFF"}}/>}
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Warning for public */}
            {wickVisibility==="public"&&<div style={{padding:"10px 12px",borderRadius:8,background:"#F59E0B12",border:"1px solid #F59E0B33",marginBottom:16,fontSize:10,color:"#F59E0B"}}>
              ⚠️ {lang==="de"?"Öffentlich ist unwiderruflich. Nur Versionierung oder Anfechtung möglich.":
                   lang==="pt"?"Público é irrevogável. Só versionamento ou contestação.":
                   "Public is irrevocable. Only versioning or contestation allowed."}
            </div>}

            {/* Actions */}
            <div style={{display:"flex",gap:8}}>
              <button onClick={()=>setShowWickModal(false)} style={{flex:1,padding:"10px",borderRadius:10,background:th.card,border:`1px solid ${th.border}`,color:th.dim,fontSize:12,cursor:"pointer"}}>
                {lang==="de"?"Abbrechen":lang==="pt"?"Cancelar":"Cancel"}
              </button>
              <button
                disabled={wickPublishing}
                onClick={async()=>{
                  setWickPublishing(true);
                  try {
                    const res = await fetch('/api/sandbox/wick/publish', {
                      method: 'POST',
                      headers: {'Content-Type': 'application/json'},
                      body: JSON.stringify({
                        artifact_id: receipt?.doc_id || receipt?.id || arenaSealResult?.receipt_id,
                        hash: receipt?.combined_hash || receipt?.ch || receipt?.bh || arenaSealResult?.hash_sha256,
                        title: docTitle || arenaTopic,
                        visibility: wickVisibility,
                        confirm: true,
                      }),
                    });
                    const data = await res.json();
                    if (res.ok && data.status === 'published') {
                      setWickResult(data);
                      setWickPublished(true);
                      flash(`✅ W-WICKTHIS: ${lang==="de"?"Veröffentlicht":lang==="pt"?"Publicado":"Published"} (${wickVisibility})`);
                    } else {
                      flash(`❌ ${data.error || 'Failed to publish'}`);
                    }
                  } catch(e) {
                    console.error('[WINDI] W-WICKTHIS error:', e);
                    flash(`❌ ${e.message}`);
                  }
                  setWickPublishing(false);
                }}
                style={{flex:1,padding:"10px",borderRadius:10,background:th.gold,border:"none",color:"#FFF",fontSize:12,fontWeight:700,cursor:"pointer",opacity:wickPublishing?0.7:1}}>
                {wickPublishing?"⏳":"📡"} W-WICKTHIS
              </button>
            </div>
          </>:<>
            {/* Success state */}
            <div style={{textAlign:"center",padding:"20px 0"}}>
              <div style={{fontSize:48,marginBottom:12}}>✅</div>
              <div style={{fontSize:14,fontWeight:700,marginBottom:8}}>
                {lang==="de"?"Im Evidence Graph veröffentlicht":
                 lang==="pt"?"Publicado no Evidence Graph":
                 "Published to Evidence Graph"}
              </div>
              <div style={{fontSize:11,color:th.dim,marginBottom:16}}>
                {wickResult?.visibility==="public"&&(lang==="de"?"Öffentlich und verifizierbar":lang==="pt"?"Público e verificável":"Public and verifiable")}
                {wickResult?.visibility==="workspace"&&(lang==="de"?"Workspace-Zugang":lang==="pt"?"Acesso workspace":"Workspace access")}
                {wickResult?.visibility==="private"&&(lang==="de"?"Nur für dich sichtbar":lang==="pt"?"Visível só para ti":"Visible only to you")}
              </div>
              <div style={{padding:"10px 12px",borderRadius:8,background:th.hover,border:`1px solid ${th.border}`,marginBottom:16,textAlign:"left"}}>
                <div style={{fontSize:10,color:th.dim,marginBottom:4}}>Artifact ID</div>
                <div style={{fontSize:11,fontFamily:"monospace",wordBreak:"break-all"}}>{wickResult?.artifact_id}</div>
              </div>
              {wickResult?.visibility==="public"&&<a href={wickResult?.urls?.verify} target="_blank" rel="noopener noreferrer"
                style={{display:"inline-flex",alignItems:"center",gap:6,padding:"8px 14px",borderRadius:8,background:`${th.gold}12`,border:`1px solid ${th.gold}33`,color:th.gold,fontSize:11,fontWeight:600,textDecoration:"none"}}>
                🔍 {lang==="de"?"Öffentlich verifizieren":lang==="pt"?"Verificar publicamente":"Verify publicly"}
              </a>}
            </div>
            <button onClick={()=>setShowWickModal(false)} style={{width:"100%",padding:"10px",borderRadius:10,background:th.card,border:`1px solid ${th.border}`,color:th.text,fontSize:12,cursor:"pointer"}}>
              {lang==="de"?"Schließen":lang==="pt"?"Fechar":"Close"}
            </button>
          </>}
        </div>
      </div>}

      {/* ═══ CHANNEL SETTINGS MODAL ═══ */}

                onChange={e=>setDistributeChannels(p=>({...p,sms:{...p.sms,number:e.target.value,configured:!!e.target.value}}))}

            {/* Three Dragons (HIGH only) */}

              </div>
            </section>}
            {/* Invariants (HIGH only) */}
            {windiTier==="HIGH"&&window.WINDI&&window.WINDI.INVARIANTS&&<section style={{marginBottom:20}}>
              <h3 style={{fontSize:12,fontWeight:700,color:th.text,marginBottom:10,display:"flex",alignItems:"center",gap:6}}><span>⚙️</span>{lang==="de"?"Invarianten":lang==="pt"?"Invariantes":"Invariants"}</h3>

                {window.WINDI.INVARIANTS.map(inv=><div key={inv.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",borderRadius:6,background:inv.ok?th.success+"08":th.danger+"08",border:"1px solid "+(inv.ok?th.success:th.danger)+"22",fontSize:10}}><span>{inv.ok?"✅":"❌"}</span><span style={{fontWeight:600,color:th.dim}}>{inv.id}</span><span style={{color:th.text}}>{inv.label}</span></div>)}
              </div>
              <div style={{marginTop:10,fontSize:9,color:th.dim,fontStyle:"italic",textAlign:"center"}}>{lang==="de"?"Governança silenciosa — der Schutz liegt in der Architektur":lang==="pt"?"Governança silenciosa — a protecção está na arquitectura":"Silent governance — protection is in the architecture"}</div>
            </section>}
            {/* Service Health */}
            {connectors&&<section>
              <h3 style={{fontSize:12,fontWeight:700,color:th.text,marginBottom:10,display:"flex",alignItems:"center",gap:6}}><span>🔗</span>{lang==="de"?"Service-Status":lang==="pt"?"Estado dos Serviços":"Service Health"}</h3>
              <div style={{display:"flex",flexDirection:"column",gap:4}}>
                {Object.entries(connectors.getStatus()).map(([name,conn])=><div key={name} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",borderRadius:6,background:th.border+"44",fontSize:10}}><div style={{width:8,height:8,borderRadius:"50%",background:conn.status==="online"?th.success:(conn.status==="offline"?th.danger:th.dim)}}/><span style={{color:th.text,fontWeight:600}}>{conn.name}</span><span style={{marginLeft:"auto",color:th.dim,fontFamily:"'JetBrains Mono',monospace"}}>{conn.status}</span></div>)}
              </div>
            </section>}
          </div>
        </div>
        <style>{"@keyframes govSlide{from{transform:translateX(100%)}to{transform:translateX(0)}}"}</style>
      </div>}

      {/* Toast */}
      <div style={{position:"fixed",bottom:16,left:"50%",transform:`translateX(-50%) translateY(${toast.v?0:16}px)`,background:th.card,color:th.text,padding:"8px 18px",borderRadius:10,border:`1px solid ${th.gold}44`,boxShadow:"0 6px 20px #0003",opacity:toast.v?1:0,transition:"all 0.4s cubic-bezier(0.34,1.56,0.64,1)",fontSize:12,zIndex:9999,pointerEvents:"none"}}>{toast.m}</div>
    </div>);
}

    <div class="bnav-tab-label">Palette</div>
  </button>
  <button class="bnav-tab" onclick="bnavGoMobile('vault',this)">
    <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2L4 6v6c0 5.5 3.5 10.7 8 12 4.5-1.3 8-6.5 8-12V6z"/>
    </svg>
    <div class="bnav-tab-label">Vault</div>
  </button>
  <button class="bnav-tab" onclick="bnavGoMobile('verify',this)">
    <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <div class="bnav-tab-label">Verify</div>
  </button>
  <button class="bnav-tab" onclick="bnavGoMobile('user',this)">
    <svg width="20" height="20" viewBox="0 0 24 24" stroke="currentColor" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
    </svg>
    <div class="bnav-tab-label">Conta</div>
  </button>
</div>

<!-- USER AREA MOBILE JS -->
<script>
// ═══ USER AREA MOBILE FUNCTIONS ═══

function openUserPanelMobile() {
  document.getElementById('userPanelMobile').classList.add('open');
  document.getElementById('userOverlayMobile').classList.add('open');
  document.body.style.overflow = 'hidden';
  upmLoadData();
}

function closeUserPanelMobile() {
  document.getElementById('userPanelMobile').classList.remove('open');
  document.getElementById('userOverlayMobile').classList.remove('open');
  document.body.style.overflow = '';
}

// Swipe down para fechar
(function() {
  let startY = 0;
  const p = document.getElementById('userPanelMobile');
  if (!p) return;
  p.addEventListener('touchstart', function(e) { startY = e.touches[0].clientY; }, { passive: true });
  p.addEventListener('touchend', function(e) { if (e.changedTouches[0].clientY - startY > 60) closeUserPanelMobile(); }, { passive: true });
})();

function upmSetLang(lang, btn) {
  document.querySelectorAll('.upm-lang-btn').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  // Integrar com setLanguage do React se existir
  if (typeof window.setLanguageGlobal === 'function') window.setLanguageGlobal(lang);
  console.log('[UserAreaMobile] Lang:', lang);
}

function upmAction(action) {
  closeUserPanelMobile();
  var routes = {
    wallet:   '#wallet',
    did:      '#did',
    docs:     '#documents',
    plan:     '/pioneer/',
    help:     '/verify-public/docs/',
    settings: '#settings',
    logout:   '#logout',
  };
  if (routes[action]) {
    if (routes[action].startsWith('/')) window.location.href = routes[action];
    else console.log('[UserAreaMobile] Navigate:', routes[action]);
  }
}

function bnavGoMobile(tab, btn) {
  document.querySelectorAll('.bnav-tab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  if (tab === 'user') {
    openUserPanelMobile();
    return;
  }
  if (tab === 'vault') window.location.href = '/vault/';
  if (tab === 'verify') window.location.href = '/verify-public/';
  console.log('[BottomNav]', tab);
}

// Carregar dados do utilizador
function upmLoadData() {
  try {
    // Tenta obter dados do React state via window
    var wallet = window.__windiWallet || null;
    // Fallback: tentar ler do localStorage
    if (!wallet) {
      try {
        var stored = localStorage.getItem('windi_storage_v4');
        if (stored) {
          var parsed = JSON.parse(stored);
          wallet = parsed.wallet || null;
        }
      } catch(e) {}
    }
    if (wallet) {
      var name = wallet.name || wallet.user_name || 'Utilizador';
      var initials = name.split(' ').map(function(w) { return w[0]; }).join('').substring(0,2).toUpperCase();
      document.getElementById('upmAvatar').textContent = initials;
      document.getElementById('upmName').textContent = name;
      document.getElementById('upmDid').textContent = (wallet.id || '') + ' / Pioneer #' + (wallet.pioneer_number || '?');
      document.getElementById('upmCredits').textContent = wallet.credits || '0';
      document.getElementById('upmWalletCredits').textContent = wallet.credits || '0';
      document.getElementById('upmWalletSub').textContent = (wallet.credits || '0') + ' creditos';
      document.getElementById('upmDocs').textContent = (wallet.receipts && wallet.receipts.length) || '0';
      document.getElementById('upmSeals').textContent = wallet.sealed_count || '0';
      document.getElementById('upmDidSub').textContent = wallet.id || '--';
      document.getElementById('upmDocsSub').textContent = ((wallet.receipts && wallet.receipts.length) || '0') + ' documentos';
      var tier = wallet.tier || 'FREE';
      var tierEl = document.getElementById('upmTier');
      tierEl.textContent = tier;
      tierEl.className = 'upm-tier-badge upm-tier-' + tier;
      document.getElementById('upmPlanTitle').textContent = 'Plano ' + tier;
      document.getElementById('upmPioneerLabel').textContent = 'Pioneer #' + (wallet.pioneer_number || '?');
    }
  } catch(e) {
    console.warn('[UserAreaMobile] upmLoadData:', e);
  }
}

// Expor wallet para o painel mobile quando React carrega
window.addEventListener('load', function() {
  setTimeout(function() {
    // Tentar sincronizar com React state
    if (window.__windiWallet) upmLoadData();
  }, 1000);
});
</script>

</body>
