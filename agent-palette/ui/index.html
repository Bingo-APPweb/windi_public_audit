<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WINDI Agent Suite v1.0.0-W — Workspace Edition</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>">
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<script src="genesis.js"></script>
<script src="DragonClient.js"></script>
<script src="TenantAuditCollector.js"></script>
<script src="TenantStamp.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════
// WINDI PATCH PACK v1.1 — UX + Compliance + Performance + Multi-Tenant
// Phase 5B+ → 71-110 | Drop-in Vanilla JS | Enterprise Ready
// ═══════════════════════════════════════════════════════════════════════

// ────────────────────────────────────────────────────────────────────────
// 71-85: UX — Trust Bar + Gov Chips + Enterprise Features
// 86-100: Compliance — Audit-ready + EU-friendly
// 101-108: Performance — Circuit breaker + History compression
// 109-110: Multi-Tenant — Institutional profiles
// ────────────────────────────────────────────────────────────────────────

(function() {
  'use strict';

  // ═══════════════════════════════════════════════════════════════════════
  // 109-110: TENANT PROFILE (Multi-tenant Foundation)
  // ═══════════════════════════════════════════════════════════════════════

  const DEFAULT_TENANT_PROFILE = {
    tenant_id: "windi",
    tenant_name: "WINDI",
    locale: (document.documentElement.lang || navigator.language || "en").replace("_", "-"),
    tone: "professional", // professional | formal | executive
    theme: "klar",        // klar | noir
    compliance_pack: ["GDPR", "EU_AI_ACT"],
    retention_policy: "30d", // 7d | 30d | hash_only | none
    regulatory_mode: false,  // Enables formal templates for banks/gov
    isp: {
      vocabulary: {},
      signature_block: {
        en: "AI processes. Human decides. WINDI guarantees.",
        de: "KI verarbeitet. Mensch entscheidet. WINDI garantiert.",
        pt: "IA processa. Humano decide. WINDI garante."
      },
      legal_safe_phrases: {
        certification: { avoid: "certified", prefer: "claims compliance" },
        guarantee: { avoid: "guaranteed", prefer: "designed to support" },
        compliant: { avoid: "fully compliant", prefer: "operates according to" }
      }
    }
  };

  function loadTenantProfile() {
    try {
      if (window.WINDI_TENANT_PROFILE) return { ...DEFAULT_TENANT_PROFILE, ...window.WINDI_TENANT_PROFILE };
      const raw = localStorage.getItem("windi_tenant_profile");
      if (raw) return { ...DEFAULT_TENANT_PROFILE, ...JSON.parse(raw) };
    } catch (e) { console.warn('[Tenant] Load error:', e); }
    return DEFAULT_TENANT_PROFILE;
  }

  function saveTenantProfile(profile) {
    try { localStorage.setItem("windi_tenant_profile", JSON.stringify(profile)); } catch (e) {}
  }

  const Tenant = {
    profile: loadTenantProfile(),
    setProfile(p) {
      this.profile = { ...DEFAULT_TENANT_PROFILE, ...p };
      saveTenantProfile(this.profile);
      if (window.WINDI_onTenantChange) window.WINDI_onTenantChange(this.profile);
    },
    getEnvelope() {
      const p = this.profile;
      return {
        tenant_id: p.tenant_id,
        locale: p.locale,
        tone: p.tone,
        theme: p.theme,
        compliance_pack: p.compliance_pack,
        regulatory_mode: p.regulatory_mode
      };
    }
  };

  // ═══════════════════════════════════════════════════════════════════════
  // 106: CIRCUIT BREAKER (Resilience + UX)
  // ═══════════════════════════════════════════════════════════════════════

  const CircuitBreaker = {
    failures: 0,
    openUntil: 0,
    lastError: null,
    THRESHOLD: 3,
    TIMEOUT: 60000, // 60s cooldown

    isOpen() {
      return Date.now() < this.openUntil;
    },
    recordSuccess() {
      this.failures = 0;
      this.openUntil = 0;
      this.lastError = null;
    },
    recordFailure(err) {
      this.failures += 1;
      this.lastError = (err && err.message) ? err.message : String(err || "error");
      if (this.failures >= this.THRESHOLD) {
        this.openUntil = Date.now() + this.TIMEOUT;
        console.warn('[CircuitBreaker] OPEN — resilient mode for 60s');
      }
    },
    modeLabel() {
      if (this.isOpen()) return "RESILIENT";
      return "ONLINE";
    },
    status() {
      return {
        mode: this.modeLabel(),
        failures: this.failures,
        lastError: this.lastError,
        openUntil: this.openUntil > 0 ? new Date(this.openUntil).toISOString() : null
      };
    }
  };

  // ═══════════════════════════════════════════════════════════════════════
  // 101: HISTORY COMPRESSION (Performance)
  // ═══════════════════════════════════════════════════════════════════════

  function summarizeHistoryLocally(history) {
    const lastUser = [...history].reverse().find(m => m.role === "user" || m.role === "human")?.content || "";
    const topics = [];
    const text = history.map(m => m.content || m.text || "").join("\n").toLowerCase();

    if (text.includes("gdpr") || text.includes("datenschutz") || text.includes("privacidade")) topics.push("GDPR");
    if (text.includes("audit") || text.includes("ledger") || text.includes("receipt") || text.includes("hash")) topics.push("Audit/Proof");
    if (text.includes("template") || text.includes("vorlage") || text.includes("modelo") || text.includes("document")) topics.push("Document/Template");
    if (text.includes("contract") || text.includes("vertrag") || text.includes("contrato")) topics.push("Contract");
    if (text.includes("legal") || text.includes("rechtlich") || text.includes("jurídico")) topics.push("Legal");

    const topicLine = topics.length ? `Topics: ${topics.join(", ")}` : "Topics: (general)";
    return `Session summary (compressed): ${topicLine}. Last user intent: "${lastUser.slice(0, 120)}"`;
  }

  function compressHistoryForBackend(history, maxLastMessages = 8) {
    if (!history || history.length <= maxLastMessages) return history;

    const trimmed = history.slice(-maxLastMessages);
    const older = history.slice(0, Math.max(0, history.length - maxLastMessages));
    const summary = older.length ? summarizeHistoryLocally(older) : null;

    const payload = [];
    if (summary) payload.push({ role: "system", content: summary });
    payload.push(...trimmed.map(m => ({
      role: m.role === "agent" ? "assistant" : m.role,
      content: m.content || m.text || ""
    })));
    return payload;
  }

  // ═══════════════════════════════════════════════════════════════════════
  // 102: RESPONSE CACHE (Idempotency)
  // ═══════════════════════════════════════════════════════════════════════

  const ResponseCache = {
    cache: new Map(),
    TTL: 300000, // 5 minutes

    hash(input) {
      let h = 0;
      for (let i = 0; i < input.length; i++) {
        h = ((h << 5) - h) + input.charCodeAt(i);
        h = h & h;
      }
      return h.toString(36);
    },
    get(input) {
      const key = this.hash(input);
      const entry = this.cache.get(key);
      if (entry && Date.now() - entry.ts < this.TTL) {
        return entry.response;
      }
      this.cache.delete(key);
      return null;
    },
    set(input, response) {
      const key = this.hash(input);
      this.cache.set(key, { response, ts: Date.now() });
      // Limit cache size
      if (this.cache.size > 100) {
        const oldest = this.cache.keys().next().value;
        this.cache.delete(oldest);
      }
    },
    clear() {
      this.cache.clear();
    }
  };

  // ═══════════════════════════════════════════════════════════════════════
  // 89: AUDIT-READY METADATA SCHEMA
  // ═══════════════════════════════════════════════════════════════════════

  function buildAuditMetadata(result, routeResult, latencyMs) {
    return {
      dragon: routeResult?.profile?.id || result?.dragon || "unknown",
      risk: routeResult?.sgeResult?.risk || result?.sge?.risk || "R0",
      invariants: {
        compliant: !result?.constitutional?.validation?.hasFatal,
        violations: result?.constitutional?.validation?.violations || [],
        total: 9
      },
      publishability: calculatePublishability(result, routeResult),
      policy: {
        rule_id: routeResult?.policyApplied || "DEFAULT",
        overridden: routeResult?.overridden || false,
        escalation: routeResult?.escalation?.level || null
      },
      hashes: {
        input: result?.inputHash || null,
        output: result?.outputHash || null,
        session: window.__WINDI_SESSION_HASH__ || null
      },
      latency_ms: latencyMs || 0,
      timestamp: new Date().toISOString(),
      tenant_id: Tenant.profile.tenant_id,
      compliance_pack: Tenant.profile.compliance_pack
    };
  }

  function calculatePublishability(result, routeResult) {
    let score = 0.9;
    const risk = routeResult?.sgeResult?.risk || result?.sge?.risk || "R0";
    const compliant = !result?.constitutional?.validation?.hasFatal;

    if (!compliant) return 0.2;
    if (risk === "R5") score = 0.3;
    else if (risk === "R4") score = 0.45;
    else if (risk === "R3") score = 0.65;
    else if (risk === "R2") score = 0.75;

    return score;
  }

  // ═══════════════════════════════════════════════════════════════════════
  // 87: CLAIMS DISCIPLINE (Anti-certification)
  // ═══════════════════════════════════════════════════════════════════════

  const CLAIMS_DISCIPLINE = [
    { pattern: /\bcertified\b/gi, replace: "claims compliance with" },
    { pattern: /\bfully compliant\b/gi, replace: "operates according to" },
    { pattern: /\bguaranteed\b/gi, replace: "designed to ensure" },
    { pattern: /\b100% secure\b/gi, replace: "security-focused" },
    { pattern: /\bwe ensure\b/gi, replace: "we aim to provide" },
    { pattern: /\bwe guarantee\b/gi, replace: "we are designed to support" }
  ];

  function applyClaimsDiscipline(text) {
    let result = text;
    for (const rule of CLAIMS_DISCIPLINE) {
      result = result.replace(rule.pattern, rule.replace);
    }
    return result;
  }

  // ═══════════════════════════════════════════════════════════════════════
  // 92: POLICY RULES IDs (Explainability)
  // ═══════════════════════════════════════════════════════════════════════

  const POLICY_RULES = {
    'ROUTE-001': 'Default routing based on message intent',
    'ROUTE-002': 'Guardian override for risk keywords',
    'ROUTE-003': 'Witness activation for verification request',
    'OVERRIDE-001': 'SGE risk escalation triggered',
    'OVERRIDE-002': 'Guardian safety override (R4+)',
    'OVERRIDE-003': 'Constitutional invariant protection',
    'COUNCIL-001': 'Dragon Council activated for critical decision',
    'COUNCIL-002': 'Multi-dragon consensus required',
    'FALLBACK-001': 'Backend unavailable — resilient mode',
    'FALLBACK-002': 'Circuit breaker open — local processing'
  };

  function getPolicyDescription(ruleId) {
    return POLICY_RULES[ruleId] || 'Standard processing';
  }

  // ═══════════════════════════════════════════════════════════════════════
  // 71: TRUST BAR STATE
  // ═══════════════════════════════════════════════════════════════════════

  const TrustState = {
    dragon: { id: "guardian", emoji: "🛡️", name: "Guardian" },
    risk: "R0",
    publishability: 0.9,
    mode: "ONLINE",
    invariantsOk: true,
    witnessVerified: false,
    policyRule: "ROUTE-001",

    update(patch) {
      Object.assign(this, patch);
      if (window.WINDI_onTrustStateChange) {
        window.WINDI_onTrustStateChange(this);
      }
    },
    getSnapshot() {
      return { ...this };
    }
  };

  // ═══════════════════════════════════════════════════════════════════════
  // 108: METRICS HOOK (Front-end Telemetry)
  // ═══════════════════════════════════════════════════════════════════════

  const Metrics = {
    data: {
      requests: 0,
      fallbacks: 0,
      avgLatency: 0,
      dragonDistribution: { guardian: 0, architect: 0, witness: 0 },
      riskDistribution: { R0: 0, R1: 0, R2: 0, R3: 0, R4: 0, R5: 0 },
      exports: 0,
      sessionStart: Date.now()
    },

    record(event) {
      this.data.requests++;

      if (event.fallback) this.data.fallbacks++;
      if (event.latency) {
        this.data.avgLatency = Math.round(
          (this.data.avgLatency * (this.data.requests - 1) + event.latency) / this.data.requests
        );
      }
      if (event.dragon && this.data.dragonDistribution[event.dragon] !== undefined) {
        this.data.dragonDistribution[event.dragon]++;
      }
      if (event.risk && this.data.riskDistribution[event.risk] !== undefined) {
        this.data.riskDistribution[event.risk]++;
      }
      if (event.exported) this.data.exports++;
    },

    getSummary() {
      const duration = Math.round((Date.now() - this.data.sessionStart) / 1000);
      return {
        ...this.data,
        sessionDuration: duration,
        fallbackRate: this.data.requests > 0
          ? Math.round((this.data.fallbacks / this.data.requests) * 100)
          : 0
      };
    }
  };

  // ═══════════════════════════════════════════════════════════════════════
  // 4️⃣ RISK METRICS PER TENANT (Observability)
  // ═══════════════════════════════════════════════════════════════════════

  const RiskMetrics = {
    log(risk, tenant = "default") {
      const key = `windi_risk_metrics_${tenant}`;
      try {
        const data = JSON.parse(localStorage.getItem(key) || "{}");
        data[risk] = (data[risk] || 0) + 1;
        data._lastUpdate = Date.now();
        data._total = (data._total || 0) + 1;
        localStorage.setItem(key, JSON.stringify(data));
      } catch (e) { /* silent */ }
    },

    get(tenant = "default") {
      try {
        return JSON.parse(localStorage.getItem(`windi_risk_metrics_${tenant}`) || "{}");
      } catch (e) { return {}; }
    },

    getSummary(tenant = "default") {
      const data = this.get(tenant);
      const total = data._total || 0;
      const distribution = { R0: data.R0 || 0, R1: data.R1 || 0, R2: data.R2 || 0, R3: data.R3 || 0, R4: data.R4 || 0, R5: data.R5 || 0 };
      const highRisk = (distribution.R4 || 0) + (distribution.R5 || 0);
      const highRiskRate = total > 0 ? Math.round((highRisk / total) * 100) : 0;
      // 113: Average risk calculation for tenant badge
      const avgRisk = total > 0 ? (
        (distribution.R0 * 0 + distribution.R1 * 1 + distribution.R2 * 2 + distribution.R3 * 3 + distribution.R4 * 4 + distribution.R5 * 5) / total
      ) : 0;
      return { tenant, total, distribution, highRisk, highRiskRate, avgRisk: Math.round(avgRisk * 10) / 10, lastUpdate: data._lastUpdate };
    },

    reset(tenant = "default") {
      try { localStorage.removeItem(`windi_risk_metrics_${tenant}`); } catch (e) {}
    }
  };

  // ═══════════════════════════════════════════════════════════════════════
  // 114: TENANT AUDIT — Isolation Score & Boundary Alerts
  // ═══════════════════════════════════════════════════════════════════════

  const TenantAudit = {
    activeTenant: null,
    boundaryAlerts: [],
    receipts: {},

    // Track tenant boundary crossing
    checkBoundary(newTenant) {
      if (!this.activeTenant) {
        this.activeTenant = newTenant;
        return { ok: true, tenant: newTenant };
      }
      if (this.activeTenant !== newTenant) {
        const alert = {
          from: this.activeTenant,
          to: newTenant,
          ts: Date.now(),
          action: "HUMAN_REVIEW_REQUIRED"
        };
        this.boundaryAlerts.push(alert);
        try { sessionStorage.setItem("windi_tenant_alerts", JSON.stringify(this.boundaryAlerts)); } catch (e) {}
        return {
          ok: false,
          reason: `Tenant changed from ${this.activeTenant} to ${newTenant}`,
          action: "HUMAN_REVIEW_REQUIRED",
          alert
        };
      }
      return { ok: true, tenant: newTenant };
    },

    // Reset for new conversation
    reset() {
      this.activeTenant = null;
      this.boundaryAlerts = [];
      try { sessionStorage.removeItem("windi_tenant_alerts"); } catch (e) {}
    },

    // Track receipt for tenant
    trackReceipt(tenant, receiptId, hasConflict = false) {
      if (!this.receipts[tenant]) {
        this.receipts[tenant] = { total: 0, withTenant: 0, conflicts: 0 };
      }
      this.receipts[tenant].total++;
      this.receipts[tenant].withTenant++;
      if (hasConflict) this.receipts[tenant].conflicts++;
    },

    // Calculate isolation score (0-100)
    isolationScore(tenant = "default") {
      const data = this.receipts[tenant] || { total: 0, withTenant: 0, conflicts: 0 };
      const tenantCoverage = data.total > 0 ? Math.round((data.withTenant / data.total) * 100) : 100;
      const conflicts = data.conflicts || 0;
      const alerts = this.boundaryAlerts.filter(a => a.from === tenant || a.to === tenant).length;

      let score = tenantCoverage;
      if (conflicts > 0) score -= 40;
      score -= Math.min(alerts * 5, 25);
      score = Math.max(0, Math.min(100, Math.round(score)));

      return {
        score,
        tenantCoverage,
        conflicts,
        boundaryAlerts: alerts,
        status: score >= 90 ? "excellent" : score >= 70 ? "good" : score >= 50 ? "warning" : "critical"
      };
    },

    // Get receipts summary for auditor
    receiptsSummary(tenant = "default") {
      const data = this.receipts[tenant] || { total: 0, withTenant: 0, conflicts: 0 };
      return {
        total: data.total,
        tenantCoveragePct: data.total > 0 ? Math.round((data.withTenant / data.total) * 100) : 100,
        conflicts: data.conflicts,
        boundaryAlerts: this.boundaryAlerts.filter(a => a.from === tenant || a.to === tenant).length
      };
    },

    // Restore from session
    restore() {
      try {
        const alerts = sessionStorage.getItem("windi_tenant_alerts");
        if (alerts) this.boundaryAlerts = JSON.parse(alerts);
      } catch (e) {}
    }
  };

  // Restore on load
  TenantAudit.restore();

  // ═══════════════════════════════════════════════════════════════════════
  // RISK TIMELINE — Visão temporal da sessão
  // ═══════════════════════════════════════════════════════════════════════

  const RiskTimeline = {
    events: [],

    add({ risk, dragon, ts, msgId, source }) {
      this.events.push({
        risk,
        dragon,
        ts,
        msgId,
        source: source || "unknown",
        time: Date.now()
      });
      // Persist to sessionStorage for audit
      try { sessionStorage.setItem("windi_risk_timeline", JSON.stringify(this.events)); } catch (e) {}
    },

    get() {
      return this.events;
    },

    clear() {
      this.events = [];
      try { sessionStorage.removeItem("windi_risk_timeline"); } catch (e) {}
    },

    restore() {
      try {
        const saved = sessionStorage.getItem("windi_risk_timeline");
        if (saved) this.events = JSON.parse(saved);
      } catch (e) {}
    }
  };

  // Restore on load
  RiskTimeline.restore();

  // Risk Insights — análise automática
  const RiskInsights = {
    riskToValue: (r) => Number(String(r || "R0").slice(1)),

    highest(timeline) {
      if (!timeline?.length) return null;
      return timeline.reduce((max, e) =>
        this.riskToValue(e.risk) > this.riskToValue(max?.risk || "R0") ? e : max
      , timeline[0]);
    },

    spikes(timeline) {
      if (!timeline?.length) return [];
      return timeline.filter((e, i) => {
        if (i === 0) return false;
        return this.riskToValue(e.risk) - this.riskToValue(timeline[i - 1].risk) >= 2;
      });
    },

    summarize(timeline) {
      if (!timeline?.length) return null;
      const highest = this.highest(timeline);
      const highCount = timeline.filter(e => this.riskToValue(e.risk) >= 4).length;
      const avgRisk = timeline.reduce((sum, e) => sum + this.riskToValue(e.risk), 0) / timeline.length;
      const spikes = this.spikes(timeline);

      return {
        total: timeline.length,
        highest: highest?.risk || "R0",
        highEvents: highCount,
        avgRisk: Math.round(avgRisk * 10) / 10,
        spikeCount: spikes.length,
        status: highCount > 0 ? "elevated" : avgRisk >= 2 ? "moderate" : "normal"
      };
    },

    getLabel(summary, lang = "en") {
      const labels = {
        en: { elevated: "Elevated", moderate: "Moderate", normal: "Normal" },
        de: { elevated: "Erhöht", moderate: "Moderat", normal: "Normal" },
        pt: { elevated: "Elevado", moderate: "Moderado", normal: "Normal" }
      };
      return labels[lang]?.[summary?.status] || labels.en[summary?.status] || "Unknown";
    }
  };

  // ═══════════════════════════════════════════════════════════════════════
  // DECISION TRACKER — Rastreabilidade de decisões de alto risco
  // ═══════════════════════════════════════════════════════════════════════

  const DecisionTracker = {
    decisions: [],

    // Track a decision after response
    track({ input, output, sge, dragon, msgId }) {
      const risk = sge?.risk || 'R0';
      const riskVal = Number(risk.slice(1));

      // Only track R2+ decisions
      if (riskVal < 2) return null;

      const record = {
        id: `DEC-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
        input: (input || '').slice(0, 300),
        output: (output || '').slice(0, 500),
        risk,
        score: sge?.score || 0,
        dragon: dragon || 'unknown',
        msgId,
        ts: new Date().toISOString(),
        humanReviewed: false
      };

      this.decisions.push(record);

      // Persist to sessionStorage
      try {
        sessionStorage.setItem('windi_decisions', JSON.stringify(this.decisions.slice(-100)));
      } catch (e) {}

      // Try to send to backend (silent fail if not available)
      this._sendToBackend(record);

      return record;
    },

    async _sendToBackend(record) {
      try {
        const resp = await fetch('/api/dragon/decisions', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(record)
        });
        if (resp.ok) {
          console.log('[DecisionTracker] Sent to backend:', record.id);
        }
      } catch (e) {
        // Silent fail - backend may not support this yet
      }
    },

    get() {
      return this.decisions;
    },

    getHighRisk() {
      return this.decisions.filter(d => Number(d.risk.slice(1)) >= 4);
    },

    stats() {
      const total = this.decisions.length;
      const byRisk = { R2: 0, R3: 0, R4: 0, R5: 0 };
      this.decisions.forEach(d => {
        if (byRisk[d.risk] !== undefined) byRisk[d.risk]++;
      });
      return { total, byRisk, highRisk: byRisk.R4 + byRisk.R5 };
    },

    clear() {
      this.decisions = [];
      try { sessionStorage.removeItem('windi_decisions'); } catch (e) {}
    },

    restore() {
      try {
        const saved = sessionStorage.getItem('windi_decisions');
        if (saved) this.decisions = JSON.parse(saved);
      } catch (e) {}
    }
  };

  // Restore on load
  DecisionTracker.restore();

  // Export globally
  window.WINDI_DecisionTracker = DecisionTracker;

  // ═══════════════════════════════════════════════════════════════════════
  // PALETTE DOCTOR — O Médico de Plantão que nunca dorme 🏥
  // Monitora saúde do Frontend e reporta ao Sentinel Bridge
  // ═══════════════════════════════════════════════════════════════════════

  const PaletteDoctor = {
    interval: 60000, // 60s entre checks
    timer: null,
    history: [],
    maxHistory: 30,
    lastCheck: null,

    // Estrutura de checks
    checks: {
      dragon: { status: 'unknown', latency: null, message: '' },
      sge: { status: 'unknown', failures: 0, avgLatency: null },
      llm: { status: 'unknown', source: null, timeouts: 0 },
      documents: { status: 'unknown', lastGen: null },
      voice: { status: 'unknown', available: false },
      javascript: { status: 'ok', errors: [] },
      fallback: { status: 'unknown', localPercent: 0 }
    },

    // Start monitoring
    start() {
      this.runDiagnostic();
      this.timer = setInterval(() => this.runDiagnostic(), this.interval);
      this._setupErrorCapture();
      console.log('[PaletteDoctor] 🏥 Started monitoring (60s interval)');
    },

    stop() {
      if (this.timer) clearInterval(this.timer);
      this.timer = null;
      console.log('[PaletteDoctor] Stopped');
    },

    // Run all diagnostic checks
    async runDiagnostic() {
      const start = performance.now();
      const results = await Promise.allSettled([
        this._checkDragon(),
        this._checkSGE(),
        this._checkLLM(),
        this._checkDocuments(),
        this._checkVoice()
      ]);

      this._checkFallback();
      this.lastCheck = new Date().toISOString();

      // Calculate overall health
      const health = this._calculateHealth();

      // Store in history
      this.history.push({
        ts: this.lastCheck,
        health,
        latency: Math.round(performance.now() - start),
        checks: JSON.parse(JSON.stringify(this.checks))
      });
      if (this.history.length > this.maxHistory) {
        this.history = this.history.slice(-this.maxHistory);
      }

      // Report to Sentinel Bridge
      this._reportToSentinel(health);

      // Notify UI
      window.dispatchEvent(new CustomEvent('palette-doctor-update', {
        detail: { health, checks: this.checks, lastCheck: this.lastCheck }
      }));

      return health;
    },

    // Check Dragon Server connection
    async _checkDragon() {
      try {
        const start = performance.now();
        const resp = await fetch('/api/dragon/health', { signal: AbortSignal.timeout(5000) });
        const latency = Math.round(performance.now() - start);

        if (resp.ok) {
          const data = await resp.json();
          this.checks.dragon = {
            status: 'ok',
            latency,
            version: data.version,
            message: `v${data.version} (${latency}ms)`
          };
        } else {
          this.checks.dragon = { status: 'error', latency, message: `HTTP ${resp.status}` };
        }
      } catch (e) {
        this.checks.dragon = { status: 'error', latency: null, message: e.message };
      }
    },

    // Check SGE 6-Layer
    async _checkSGE() {
      const timeline = window.WINDI_RiskTimeline?.get() || [];
      const recent = timeline.slice(-10);
      const failures = recent.filter(e => !e.risk || e.risk === 'ERROR').length;

      this.checks.sge = {
        status: failures > 3 ? 'warning' : 'ok',
        failures,
        total: recent.length,
        message: `${failures}/${recent.length} failures`
      };
    },

    // Check LLM responses
    async _checkLLM() {
      const timeline = window.WINDI_RiskTimeline?.get() || [];
      const recent = timeline.slice(-10);
      const semantic = recent.filter(e => e.source === 'semantic').length;
      const local = recent.filter(e => e.source === 'local' || e.source === 'template').length;
      const total = semantic + local || 1;

      this.checks.llm = {
        status: semantic > 0 ? 'ok' : 'warning',
        source: semantic > local ? 'semantic' : 'local',
        semanticPercent: Math.round((semantic / total) * 100),
        message: `${semantic}/${total} semantic`
      };
    },

    // Check document generation capability
    async _checkDocuments() {
      try {
        const resp = await fetch('/capabilities', { signal: AbortSignal.timeout(3000) });
        if (resp.ok) {
          const data = await resp.json();
          const docs = data.capabilities?.documents;
          this.checks.documents = {
            status: docs?.enabled ? 'ok' : 'warning',
            formats: docs?.formats || [],
            message: docs?.enabled ? `${docs.formats?.length || 0} formats` : 'disabled'
          };
        }
      } catch (e) {
        this.checks.documents = { status: 'unknown', message: 'check failed' };
      }
    },

    // Check voice engine
    async _checkVoice() {
      const voiceEnabled = typeof voiceEngine !== 'undefined' && voiceEngine.enabled;
      this.checks.voice = {
        status: voiceEnabled ? 'ok' : 'off',
        available: voiceEnabled,
        message: voiceEnabled ? 'ElevenLabs ready' : 'disabled'
      };
    },

    // Check fallback ratio
    _checkFallback() {
      const timeline = window.WINDI_RiskTimeline?.get() || [];
      const recent = timeline.slice(-20);
      const local = recent.filter(e => e.source === 'local' || e.source === 'template').length;
      const total = recent.length || 1;
      const localPercent = Math.round((local / total) * 100);

      this.checks.fallback = {
        status: localPercent > 50 ? 'warning' : 'ok',
        localPercent,
        message: `${localPercent}% local mode`
      };
    },

    // Setup global JS error capture
    _setupErrorCapture() {
      window.addEventListener('error', (e) => {
        this.checks.javascript.errors.push({
          message: e.message,
          ts: new Date().toISOString()
        });
        if (this.checks.javascript.errors.length > 10) {
          this.checks.javascript.errors = this.checks.javascript.errors.slice(-10);
        }
        this.checks.javascript.status = 'warning';
      });
    },

    // Calculate overall health score
    _calculateHealth() {
      const statuses = Object.values(this.checks).map(c => c.status);
      const errors = statuses.filter(s => s === 'error').length;
      const warnings = statuses.filter(s => s === 'warning').length;

      if (errors > 0) return { level: 'critical', color: '#e74c3c', emoji: '🔴' };
      if (warnings > 2) return { level: 'degraded', color: '#f39c12', emoji: '🟡' };
      if (warnings > 0) return { level: 'healthy', color: '#27ae60', emoji: '🟢' };
      return { level: 'optimal', color: '#2ecc71', emoji: '🟢' };
    },

    // Report to Sentinel Bridge
    async _reportToSentinel(health) {
      try {
        await fetch('http://localhost:8098/api/report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            source: 'palette-doctor',
            service: 'palette-frontend',
            port: 8108,
            health: health.level,
            checks: this.checks,
            ts: this.lastCheck
          }),
          signal: AbortSignal.timeout(2000)
        });
      } catch (e) {
        // Silent fail - Sentinel may not be available
      }
    },

    // Get current status summary
    getSummary() {
      return {
        health: this._calculateHealth(),
        checks: this.checks,
        lastCheck: this.lastCheck,
        history: this.history.slice(-10)
      };
    },

    // Export diagnostic report
    exportReport() {
      return JSON.stringify({
        palette_doctor_report: true,
        version: '1.0',
        generated: new Date().toISOString(),
        health: this._calculateHealth(),
        checks: this.checks,
        history: this.history,
        principle: 'The doctor never sleeps.'
      }, null, 2);
    }
  };

  PaletteDoctor.start();

  const ChatSearch = {
    search(messages, query, filters = {}) {
      const q = query.toLowerCase();
      return messages.filter(m => {
        // Text match
        const textMatch = (m.text || "").toLowerCase().includes(q);

        // Dragon filter
        if (filters.dragon && m.dragon !== filters.dragon) return false;

        // Risk filter
        if (filters.risk && m.result?.sge?.risk !== filters.risk) return false;

        // Exported filter
        if (filters.exported !== undefined && !!m.exported !== filters.exported) return false;

        return textMatch;
      });
    }
  };

  const KeyboardShortcuts = {
    handlers: {},

    register(combo, handler, description) {
      this.handlers[combo] = { handler, description };
    },

    init() {
      document.addEventListener('keydown', (e) => {
        const combo = this.getCombo(e);
        const entry = this.handlers[combo];
        if (entry) {
          e.preventDefault();
          entry.handler();
        }
      });
    },

    getCombo(e) {
      const parts = [];
      if (e.ctrlKey || e.metaKey) parts.push('Ctrl');
      if (e.shiftKey) parts.push('Shift');
      if (e.altKey) parts.push('Alt');
      parts.push(e.key.toUpperCase());
      return parts.join('+');
    },

    getHelp() {
      return Object.entries(this.handlers).map(([combo, entry]) => ({
        combo,
        description: entry.description
      }));
    }
  };

    const dragonCounts = {};
    const risks = [];
    const topics = new Set();
    let exports = 0;

    messages.forEach(m => {
      if (m.dragon) dragonCounts[m.dragon] = (dragonCounts[m.dragon] || 0) + 1;
      if (m.result?.sge?.risk) risks.push(m.result.sge.risk);
      if (m.exported) exports++;

      const text = (m.text || "").toLowerCase();
      if (text.includes("contract") || text.includes("vertrag")) topics.add("Contracts");
      if (text.includes("compliance") || text.includes("gdpr")) topics.add("Compliance");
      if (text.includes("document") || text.includes("dokument")) topics.add("Documents");
    });

    const maxRisk = risks.sort().reverse()[0] || "R0";
    const topDragon = Object.entries(dragonCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || "guardian";

    const labels = {
      en: { session: "Session Summary", msgs: "Messages", dragon: "Primary Dragon", risk: "Max Risk", exports: "Exports", topics: "Topics" },

    };
    const L = labels[lang] || labels.en;

    if (type === 'executive') {

    } else if (type === 'compliance') {
      return `📋 ${L.session} (Compliance)\n• ${L.msgs}: ${messages.length}\n• Risk Distribution: ${risks.join(", ") || "None"}\n• Dragons: ${Object.entries(dragonCounts).map(([k, v]) => `${k}:${v}`).join(", ")}\n• Tenant: ${Tenant.profile.tenant_id}\n• Compliance Pack: ${Tenant.profile.compliance_pack.join(", ")}`;
    } else {
      return `📋 ${L.session} (Technical)\n• Messages: ${messages.length}\n• Dragon Distribution: ${JSON.stringify(dragonCounts)}\n• Risk Levels: ${JSON.stringify(risks)}\n• Exports: ${exports}\n• Metrics: ${JSON.stringify(Metrics.getSummary())}`;
    }
  }

  // 80: COPY WITH GOVERNANCE
  // ═══════════════════════════════════════════════════════════════════════

  function copyWithGovernance(text, meta) {
    const timestamp = new Date().toISOString();
    const dragon = meta?.dragon || "agent";
    const risk = meta?.risk || "R0";
    const hash = meta?.hash || generateQuickHash(text);

    const governed = `${text}\n\n---\n🐉 ${dragon} | ${risk} | ${timestamp}\n#${hash}`;

    if (navigator.clipboard) {
      navigator.clipboard.writeText(governed);
    }
    return governed;
  }

  function generateQuickHash(text) {
    let h = 0;
    for (let i = 0; i < text.length; i++) {
      h = ((h << 5) - h) + text.charCodeAt(i);
      h = h & h;
    }
    return Math.abs(h).toString(36).toUpperCase().slice(0, 8);
  }

═══════════════════════════════════════════════════════════════

${L.purpose}: ${purpose || "General documentation"}
${L.scope}: ${Tenant.profile.compliance_pack.join(", ")}
${L.limitations}: AI-generated content requires human review
${L.verification}: WINDI Witness verification available
${L.generated}: ${new Date().toISOString()}
${L.tenant}: ${Tenant.profile.tenant_id.toUpperCase()}
${L.isolation}: forensic-metadata ${isoScore ? `(Score: ${isoScore.score}/100)` : ''}

═══════════════════════════════════════════════════════════════

${content}

═══════════════════════════════════════════════════════════════
${Tenant.profile.isp.signature_block[lang] || Tenant.profile.isp.signature_block.en}
═══════════════════════════════════════════════════════════════
`;
  }

  // ═══════════════════════════════════════════════════════════════════════
  // 116: TENANT STAMP — For JMPG Export Manifest
  // ═══════════════════════════════════════════════════════════════════════

  function buildTenantStamp(tenantId = null) {

  window.WINDI_buildComplianceEnvelope = buildComplianceEnvelope;
  window.WINDI_buildTenantStamp = buildTenantStamp;
  window.WINDI_calculatePublishability = calculatePublishability;

  console.log('[WINDI] UX/Compliance/Performance/Multi-Tenant Patch v1.2 loaded');
  console.log('[WINDI] Tenant:', Tenant.profile.tenant_id, '| Compliance:', Tenant.profile.compliance_pack.join(','));
})();

// "Guardian protects. Architect builds. Witness validates."
// ═══════════════════════════════════════════════════════════════════════

class DragonRouter {
  constructor() {
    this.lastDragon = null;
    this.lastTimestamp = null;
    this.responseCount = 0;
    this.telemetry = [];
    this.sessionBias = null;           // 12: Session intelligence
    this.sessionBiasStrength = 0;      // How many times same dragon chosen
    this.CONTEXT_MEMORY_MS = 60000;    // 1 minute context window
    this.CONFIDENCE_THRESHOLD = 2;     // 9: Min score to trust local routing
    this.learnedTerms = this._loadLearnedTerms(); // 18: Adaptive learning
  }

  /**
   * Route message to the appropriate Dragon
   * @param {string} message - User input
   * @param {object} options - { sgeResult, lang, forceRoute }
   * @returns {{ profile, confidence, confidenceScore, overridden, escalation, dualDragon, telemetry }}
   */
  route(message, options = {}) {
    const { sgeResult = null, lang = 'en', forceRoute = null } = options;
    const lower = message.toLowerCase();
    const scores = { guardian: 0, architect: 0, witness: 0 };
    const boosts = { keywords: {}, sge: {}, verbs: {}, context: {}, session: {}, learned: {} };

    // ═══ 1. KEYWORD SCORING ═══
    for (const [dragonId, profile] of Object.entries(DRAGON_PROFILES)) {
      let keywordScore = 0;
      for (const trigger of profile.triggers) {
        if (lower.includes(trigger)) keywordScore++;
      }
      scores[dragonId] += keywordScore;
      boosts.keywords[dragonId] = keywordScore;
    }

    // ═══ 2. SGE SEMANTIC BOOST ═══
    if (sgeResult) {
      const riskLevel = sgeResult.risk_level || sgeResult.risk || '';
      const layers = sgeResult.layers || [];

      if (['R3', 'R4', 'R5', 'high', 'critical'].includes(riskLevel)) {
        scores.guardian += 2;
        boosts.sge.guardian = (boosts.sge.guardian || 0) + 2;
      }
      if (layers.includes('governance') || layers.includes('constitutional')) {
        scores.guardian += 1;
        boosts.sge.guardian = (boosts.sge.guardian || 0) + 1;
      }
      if (layers.includes('structure') || layers.includes('template')) {
        scores.architect += 1;
        boosts.sge.architect = (boosts.sge.architect || 0) + 1;
      }
      if (layers.includes('forensic') || layers.includes('audit') || layers.includes('ledger')) {
        scores.witness += 2;
        boosts.sge.witness = (boosts.sge.witness || 0) + 2;
      }
    }

    // ═══ 3. INTENT VERBS BOOST ═══
    if (/create|build|generate|draft|design|template|criar|erstellen|bauen|entwerfen/.test(lower)) {
      scores.architect += 2;
      boosts.verbs.architect = 2;
      // 13: Auto-switch to Architect after creation request
      this._updateSessionBias('architect');
    }
    if (/verify|audit|check|validate|confirm|trace|validar|prüfen|überprüfen|nachweisen/.test(lower)) {
      scores.witness += 2;
      boosts.verbs.witness = 2;
    }
    if (/protect|secure|risk|safe|comply|compliance|schützen|sichern|risiko|proteger/.test(lower)) {
      scores.guardian += 2;
      boosts.verbs.guardian = 2;
    }

    // ═══ 4. CONTEXT MEMORY (short messages continue same dragon) ═══
    const now = Date.now();
    if (this.lastDragon && !forceRoute) {
      const withinContext = this.lastTimestamp && (now - this.lastTimestamp) < this.CONTEXT_MEMORY_MS;
      const isShortMessage = message.length < 50;
      if (withinContext && isShortMessage) {
        scores[this.lastDragon] += 3;
        boosts.context[this.lastDragon] = 3;
      }
    }

    // ═══ 12. SESSION BIAS (consistency across session) ═══
    if (this.sessionBias && this.sessionBiasStrength >= 2) {
      const biasBoost = Math.min(this.sessionBiasStrength, 4) * 0.5;
      scores[this.sessionBias] += biasBoost;
      boosts.session[this.sessionBias] = biasBoost;
    }

    // ═══ 18. LEARNED TERMS BOOST ═══
    for (const [term, dragonId] of Object.entries(this.learnedTerms)) {
      if (lower.includes(term)) {
        scores[dragonId] = (scores[dragonId] || 0) + 1;
        boosts.learned[dragonId] = (boosts.learned[dragonId] || 0) + 1;
      }
    }

    // ═══ 5. FIND WINNER WITH NUMERIC CONFIDENCE ═══
    const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);
    const [bestDragon, bestScore] = sorted[0];
    const [secondDragon, secondScore] = sorted[1] || [null, 0];

    // Confidence as label + numeric score
    let confidence = 'high';
    const confidenceScore = bestScore;
    if (bestScore === 0) confidence = 'default';
    else if (secondScore > 0 && bestScore - secondScore <= 1) confidence = 'medium';
    else if (bestScore === secondScore) confidence = 'low';

    let profile = DRAGON_PROFILES[bestDragon] || DRAGON_PROFILES.guardian;
    let overridden = false;
    let escalation = null;
    let dualDragon = null;

    // ═══ 10. GUARDIAN ESCALATION LADDER ═══
    if (sgeResult) {
      escalation = this.guardianEscalation(sgeResult);
      if (escalation) {
        if (escalation.level >= 4 && bestDragon !== 'guardian') {
          profile = DRAGON_PROFILES.guardian;
          overridden = true;
          confidence = 'override';
        }
      }
    }

    // ═══ 16. MULTI-DRAGON ASSIST (dual response) ═══
    dualDragon = this.checkDualDragon(message, profile.id);

    // Update state
    this.lastDragon = profile.id;
    this.lastTimestamp = now;
    this.responseCount++;
    this._updateSessionBias(profile.id);

    // ═══ 15. ENHANCED AUDITOR LOG ═══
    const telemetryEntry = {
      timestamp: now,
      input: message.slice(0, 60),
      dragon: profile.id,
      scores,
      boosts,
      confidence,
      confidenceScore,
      overridden,
      escalation: escalation?.level || null,
      dualDragon: dualDragon?.id || null,
      sessionBias: this.sessionBias,
      messageLength: message.length,
      hadSGE: !!sgeResult
    };
    this.telemetry.push(telemetryEntry);
    if (this.telemetry.length > 100) this.telemetry.shift();

    console.debug('[DragonDecision]', {
      input: message.slice(0, 50),
      dragon: profile.id,
      confidence,
      confidenceScore,
      override: overridden,
      escalation: escalation?.level,
      dual: dualDragon?.id
    });

    return { profile, confidence, confidenceScore, overridden, escalation, dualDragon, telemetry: telemetryEntry };
  }

  // ═══ 9. CONFIDENCE FALLBACK ═══
  shouldDeferToBackend(routeResult) {
    return routeResult.confidenceScore < this.CONFIDENCE_THRESHOLD;
  }

  resolveDragon(routeResult) {
    if (this.shouldDeferToBackend(routeResult)) {
      return null; // Let backend Sovereign Router decide
    }
    return routeResult.profile;
  }

  // ═══ 10. GUARDIAN ESCALATION LADDER ═══
  guardianEscalation(sge) {
    if (!sge) return null;
    const risk = sge.risk_level || sge.risk || '';

    if (risk === 'R5' || risk === 'blocked')
      return { level: 5, action: 'human_confirmation', label: '⛔ Human Required' };
    if (risk === 'R4' || risk === 'critical')
      return { level: 4, action: 'guardian_override', label: '🛡️ Guardian Override' };
    if (risk === 'R3' || risk === 'high')
      return { level: 3, action: 'warning', label: '⚠️ Review Recommended' };

    return null;
  }

  // ═══ 12-13. SESSION BIAS MANAGEMENT ═══
  _updateSessionBias(dragonId) {
    if (this.sessionBias === dragonId) {
      this.sessionBiasStrength++;
    } else {
      this.sessionBias = dragonId;
      this.sessionBiasStrength = 1;
    }
  }

  // ═══ 16. MULTI-DRAGON ASSIST ═══
  checkDualDragon(message, primaryDragonId) {
    const lower = message.toLowerCase();

    // Compliance + Creation → Architect + Guardian
    if (/gdpr|compliance|datenschutz|lgpd|policy|regulation/.test(lower) &&
        /create|template|document|draft|erstellen|criar/.test(lower)) {
      if (primaryDragonId === 'architect') {
        return { id: 'guardian', role: 'review', label: '🛡️ Guardian Review' };
      }
      if (primaryDragonId === 'guardian') {
        return { id: 'architect', role: 'structure', label: '🏗️ Architect Structure' };
      }
    }

    // Audit + Report → Witness + Architect
    if (/audit|verify|trace|nachweisen|verificar/.test(lower) &&
        /report|document|summary|bericht|relatório/.test(lower)) {
      if (primaryDragonId === 'witness') {
        return { id: 'architect', role: 'format', label: '🏗️ Architect Format' };
      }
    }

    return null;
  }

  // ═══ 11. WITNESS VERIFICATION ═══
  needsWitnessReview(text) {
    return /(hash|verification|audit|compliant|receipt|ledger|serial|WINDI-|sealed|certified|validated|immutable)/i.test(text);
  }

  // ═══ 7. ADAPTIVE CLOSING ═══
  shouldShowClosing() {
    return this.responseCount === 1 || this.responseCount % 2 === 0;
  }

  // ═══ 17. PROGRESSIVE TYPING ═══
  getTypingPhase(elapsedMs, dragonId) {
    const dragon = DRAGON_PROFILES[dragonId] || DRAGON_PROFILES.guardian;
    if (elapsedMs < 800) {
      return { text: 'Analyzing...', phase: 1 };
    } else if (elapsedMs < 1800) {
      return { text: `${dragon.emoji} Evaluating governance...`, phase: 2 };
    } else if (elapsedMs < 3000) {
      return { text: `${dragon.emoji} Structuring response...`, phase: 3 };
    } else {
      return { text: `${dragon.emoji} Finalizing...`, phase: 4 };
    }
  }

  // ═══ 18. ADAPTIVE TRIGGER LEARNING ═══
  _loadLearnedTerms() {
    try {
      const stored = localStorage.getItem('dragon_learned_terms');
      return stored ? JSON.parse(stored) : {};
    } catch { return {}; }
  }

  learnTerm(term, dragonId) {
    if (!term || term.length < 3) return;
    this.learnedTerms[term.toLowerCase()] = dragonId;
    try {
      localStorage.setItem('dragon_learned_terms', JSON.stringify(this.learnedTerms));
    } catch { /* quota exceeded */ }
  }

  recordOverride(message, correctDragonId) {
    // Extract significant words from message for learning
    const words = message.toLowerCase().match(/\b[a-z]{4,}\b/g) || [];
    const significantWord = words.find(w => !['this', 'that', 'with', 'from', 'have', 'been'].includes(w));
    if (significantWord) {
      this.learnTerm(significantWord, correctDragonId);
    }
  }

  // ═══ TELEMETRY & STATE ═══
  getTelemetrySummary() {
    const summary = { guardian: 0, architect: 0, witness: 0, overrides: 0, escalations: 0, dualResponses: 0 };
    for (const entry of this.telemetry) {
      summary[entry.dragon]++;
      if (entry.overridden) summary.overrides++;
      if (entry.escalation) summary.escalations++;
      if (entry.dualDragon) summary.dualResponses++;
    }
    return summary;
  }

  resetContext() {
    this.lastDragon = null;
    this.lastTimestamp = null;
    this.responseCount = 0;
    this.sessionBias = null;
    this.sessionBiasStrength = 0;
  }

  // ═══ 14. LOAD BALANCING HINT (for future multi-node) ═══
  getRoutingHint(routeResult) {
    return {
      dragon_hint: routeResult.profile.id,
      confidence: routeResult.confidenceScore,
      session_bias: this.sessionBias,
      deferred: this.shouldDeferToBackend(routeResult)
    };
  }

  // ═══════════════════════════════════════════════════════════════════════
  // PHASE 5B+++ INSTITUTIONAL GOVERNANCE LAYER
  // ═══════════════════════════════════════════════════════════════════════

  // ═══ 19. DRAGON CONSENSUS MODE ═══
  shouldUseConsensus(message, sgeResult = null) {
    if (!sgeResult) return false;
    const risk = sgeResult.risk_level || sgeResult.risk || '';
    // R5 always requires consensus
    if (risk === 'R5' || risk === 'blocked') return true;
    // Policy/contract/compliance triggers consensus
    if (/policy|contract|compliance|gdpr|datenschutz|lgpd|vertrag|política/i.test(message)) return true;
    return false;
  }

  getConsensusConfig(message) {
    // Guardian + Witness for compliance
    if (/gdpr|compliance|datenschutz|lgpd/i.test(message)) {
      return {
        primary: 'guardian',
        secondary: 'witness',
        mode: 'compliance_review',
        label: { en: 'Compliance Consensus', de: 'Compliance-Konsens', pt: 'Consenso de Conformidade' }
      };
    }
    // Guardian + Architect for contracts
    if (/contract|policy|vertrag|política/i.test(message)) {
      return {
        primary: 'guardian',
        secondary: 'architect',
        mode: 'policy_review',
        label: { en: 'Policy Consensus', de: 'Richtlinien-Konsens', pt: 'Consenso de Política' }
      };
    }
    // Default: Guardian + Witness
    return {
      primary: 'guardian',
      secondary: 'witness',
      mode: 'governance_review',
      label: { en: 'Governance Consensus', de: 'Governance-Konsens', pt: 'Consenso de Governança' }
    };
  }

  // ═══ 20. WITNESS AUTO AUDIT TRAIL ═══
  autoAuditTrail(message, result, latencyMs = 0) {
    if (!/audit|verify|hash|ledger|evidence|seal|receipt|nachweis|verificar/i.test(message)) return null;

    const trail = {
      timestamp: new Date().toISOString(),
      dragon: result?.dragon || 'unknown',
      summary: message.slice(0, 80),
      latencyMs,
      witnessActive: true,
      trailId: `TRAIL-${Date.now().toString(36).toUpperCase()}`
    };

    // Silent console log for future audit retrieval
    console.info('[AuditTrail]', trail);

    // Store in session for potential export
    try {
      const trails = JSON.parse(sessionStorage.getItem('dragon_audit_trails') || '[]');
      trails.push(trail);
      if (trails.length > 50) trails.shift();
      sessionStorage.setItem('dragon_audit_trails', JSON.stringify(trails));
    } catch { /* storage full */ }

    return trail;
  }

  getAuditTrails() {
    try {
      return JSON.parse(sessionStorage.getItem('dragon_audit_trails') || '[]');
    } catch { return []; }
  }

  // ═══ 21. HUMAN CONFIRMATION GATE ═══
  needsHumanConfirmation(sgeResult) {
    if (!sgeResult) return false;
    const risk = sgeResult.risk_level || sgeResult.risk || '';
    return risk === 'R5' || risk === 'blocked';
  }

  getConfirmationMessage(lang = 'en') {
    const msgs = {
      en: 'This action involves critical governance elements.\n\nProceed with human oversight?',
      de: 'Diese Aktion betrifft kritische Governance-Elemente.\n\nMit menschlicher Aufsicht fortfahren?',
      pt: 'Esta ação envolve elementos críticos de governança.\n\nProsseguir com supervisão humana?'
    };
    return msgs[lang] || msgs.en;
  }

  // ═══ 22. TASK CONTEXT MEMORY ═══
  taskContext = null;
  taskContextHistory = [];

  updateTaskContext(message) {
    const lower = message.toLowerCase();
    let newContext = null;

    if (/report|bericht|relatório/.test(lower)) newContext = 'report_creation';
    else if (/template|vorlage|modelo/.test(lower)) newContext = 'template_design';
    else if (/document|dokument|documento/.test(lower)) newContext = 'document_creation';
    else if (/audit|prüfung|auditoria/.test(lower)) newContext = 'audit_review';
    else if (/policy|richtlinie|política/.test(lower)) newContext = 'policy_work';
    else if (/contract|vertrag|contrato/.test(lower)) newContext = 'contract_review';

    if (newContext && newContext !== this.taskContext) {
      this.taskContextHistory.push({ context: this.taskContext, timestamp: Date.now() });
      this.taskContext = newContext;
    }

    return this.taskContext;
  }

  getTaskContextLabel(lang = 'en') {
    const labels = {
      report_creation: { en: 'Creating Report', de: 'Bericht erstellen', pt: 'Criando Relatório' },
      template_design: { en: 'Designing Template', de: 'Vorlage gestalten', pt: 'Projetando Modelo' },
      document_creation: { en: 'Creating Document', de: 'Dokument erstellen', pt: 'Criando Documento' },
      audit_review: { en: 'Audit Review', de: 'Prüfung durchführen', pt: 'Revisão de Auditoria' },
      policy_work: { en: 'Policy Work', de: 'Richtlinienarbeit', pt: 'Trabalho de Política' },
      contract_review: { en: 'Contract Review', de: 'Vertragsprüfung', pt: 'Revisão de Contrato' }
    };
    return labels[this.taskContext]?.[lang] || labels[this.taskContext]?.en || null;
  }

  // ═══ 24. LATENCY TRANSPARENCY BADGE ═══
  getLatencyBadge(latencyMs, lang = 'en') {
    if (latencyMs < 1500) return null; // Fast enough, no badge needed
    if (latencyMs < 3000) return {
      text: { en: 'Thorough analysis', de: 'Gründliche Analyse', pt: 'Análise detalhada' }[lang],
      level: 'normal'
    };
    return {
      text: { en: 'Deep analysis performed', de: 'Tiefenanalyse durchgeführt', pt: 'Análise profunda realizada' }[lang],
      level: 'deep',
      icon: '⏱'
    };
  }

  // ═══ 27. SMART FALLBACK MESSAGING ═══
  getFallbackMessage(lang = 'en') {
    // Transforms "offline" into positive resilience messaging
    const msgs = {
      en: 'Local processing for resilience',
      de: 'Lokale Verarbeitung für Ausfallsicherheit',
      pt: 'Processamento local para resiliência'
    };
    return msgs[lang] || msgs.en;
  }

  // ═══ 29. DRAGON ESCALATION VISUAL CUE ═══
  getEscalationCue(escalation, lang = 'en') {
    if (!escalation) return null;
    const cues = {
      5: { en: '🛡️ Guardian control — human confirmation required', de: '🛡️ Guardian-Kontrolle — menschliche Bestätigung erforderlich', pt: '🛡️ Controle Guardian — confirmação humana necessária' },
      4: { en: '🛡️ Guardian escalation active', de: '🛡️ Guardian-Eskalation aktiv', pt: '🛡️ Escalação Guardian ativa' },
      3: { en: '⚠️ Governance review recommended', de: '⚠️ Governance-Überprüfung empfohlen', pt: '⚠️ Revisão de governança recomendada' }
    };
    return cues[escalation.level]?.[lang] || cues[escalation.level]?.en || null;
  }

  // ═══ 30. ARCHITECT REFINEMENT LOOP DETECTION ═══
  refinementCount = 0;
  lastRefinementTime = null;

  detectRefinementLoop(message) {
    const lower = message.toLowerCase();
    const isRefinement = /adjust|change|modify|update|refine|improve|fix|correct|anpassen|ändern|verbessern|ajustar|melhorar/i.test(lower);

    const now = Date.now();
    const isRecentRefinement = this.lastRefinementTime && (now - this.lastRefinementTime) < 120000; // 2 min window

    if (isRefinement && isRecentRefinement) {
      this.refinementCount++;
      this.lastRefinementTime = now;
    } else if (isRefinement) {
      this.refinementCount = 1;
      this.lastRefinementTime = now;
    } else {
      this.refinementCount = 0;
    }

    return this.refinementCount;
  }

  getRefinementMessage(count, lang = 'en') {
    if (count < 2) return null;
    const msgs = {
      en: `Refining document structure (iteration ${count})...`,
      de: `Dokumentstruktur wird verfeinert (Iteration ${count})...`,
      pt: `Refinando estrutura do documento (iteração ${count})...`
    };
    return msgs[lang] || msgs.en;
  }

  // ═══ 26. WORKLOAD TELEMETRY ═══
  markPerformance(dragonId, phase) {
    if (typeof performance !== 'undefined' && performance.mark) {
      performance.mark(`dragon-${dragonId}-${phase}`);
    }
  }

  measurePerformance(dragonId) {
    if (typeof performance !== 'undefined' && performance.measure) {
      try {
        performance.measure(`dragon-${dragonId}-total`, `dragon-${dragonId}-start`, `dragon-${dragonId}-end`);
      } catch { /* marks not set */ }
    }
  }

  // ═══════════════════════════════════════════════════════════════════════
  // PHASE NEXT: INSTITUTIONAL TRUST INFRASTRUCTURE (31-50)
  // ═══════════════════════════════════════════════════════════════════════

  // ═══ 31. DRAGON COUNCIL MODE (3-way consensus) ═══
  shouldUseCouncil(message, sgeResult = null) {
    if (!sgeResult) return false;
    const risk = sgeResult.risk_level || sgeResult.risk || '';
    if (risk === 'R5' || risk === 'blocked') return true;
    if (/policy|governance|ethics|compliance|audit.*critical|datenschutz.*kritisch/i.test(message)) return true;
    return false;
  }

  getCouncilConfig(lang = 'en') {
    return {
      dragons: ['guardian', 'architect', 'witness'],
      mode: 'full_council',
      label: { en: 'Dragon Council Active', de: 'Drachenrat aktiv', pt: 'Conselho de Dragões ativo' }[lang],
      steps: [
        { dragon: 'guardian', role: { en: 'Assessment', de: 'Bewertung', pt: 'Avaliação' }[lang] },
        { dragon: 'architect', role: { en: 'Structuring', de: 'Strukturierung', pt: 'Estruturação' }[lang] },
        { dragon: 'witness', role: { en: 'Verification', de: 'Verifizierung', pt: 'Verificação' }[lang] }
      ]
    };
  }

  // ═══ 32. EXECUTIVE SUMMARY AUTO-GENERATION ═══
  generateExecutiveSummary(text, lang = 'en') {
    if (!text || text.length < 500) return null;
    const firstSentences = text.split(/[.!?]/).slice(0, 2).join('. ').trim();
    const summary = firstSentences.length > 200 ? firstSentences.slice(0, 200) + '...' : firstSentences + '.';
    const labels = { en: 'Executive Summary', de: 'Zusammenfassung', pt: 'Resumo Executivo' };
    return { label: labels[lang] || labels.en, text: summary };
  }

  // ═══ 33. DECISION IMPACT TAGGING ═══
  classifyImpact(text) {
    const lower = (text || '').toLowerCase();
    if (/policy|legal|gdpr|datenschutz|lgpd|contract|vertrag|contrato|law|gesetz|lei/i.test(lower))
      return { tag: 'Legal', color: '#E74C3C', icon: '⚖️' };
    if (/compliance|audit|regulation|vorschrift|conformidade/i.test(lower))
      return { tag: 'Compliance', color: '#9B59B6', icon: '🛡️' };
    if (/strategy|roadmap|vision|strategie|estratégia|planning/i.test(lower))
      return { tag: 'Strategic', color: '#3498DB', icon: '🎯' };
    if (/process|workflow|operation|prozess|processo|task/i.test(lower))
      return { tag: 'Operational', color: '#27AE60', icon: '⚙️' };
    return { tag: 'General', color: '#95A5A6', icon: '📋' };
  }

  // ═══ 34. GOVERNANCE CONFIDENCE SCORE ═══
  governanceConfidence(sgeResult) {
    if (!sgeResult) return { level: 'standard', score: 70, label: 'Standard', color: '#95A5A6' };
    const risk = sgeResult.risk_level || sgeResult.risk || 'R0';
    const scores = {
      'R0': { level: 'high', score: 95, label: 'HIGH', color: '#27AE60' },
      'R1': { level: 'high', score: 90, label: 'HIGH', color: '#27AE60' },
      'R2': { level: 'elevated', score: 80, label: 'ELEVATED', color: '#F39C12' },
      'R3': { level: 'moderate', score: 65, label: 'MODERATE', color: '#E67E22' },
      'R4': { level: 'review', score: 45, label: 'REVIEW REQUIRED', color: '#E74C3C' },
      'R5': { level: 'critical', score: 20, label: 'CRITICAL', color: '#C0392B' }
    };
    return scores[risk] || scores['R0'];
  }

  // ═══ 35. WITNESS TRACEABILITY INDICATOR ═══
  isTraceabilityReady(text) {
    return /(hash|serial|WINDI-|receipt|ledger|timestamp|signature|sealed|verified|immutable)/i.test(text);
  }

  getTraceabilityBadge(text, lang = 'en') {
    if (!this.isTraceabilityReady(text)) return null;
    const labels = { en: 'Traceability Ready', de: 'Nachverfolgbar', pt: 'Rastreável' };
    return { label: labels[lang] || labels.en, icon: '🔗' };
  }

  // ═══ 36. KNOWLEDGE BOUNDARY TRANSPARENCY ═══
  detectUncertainty(text) {
    const uncertainPhrases = /may|might|could|possibly|perhaps|uncertain|unclear|nicht sicher|möglicherweise|talvez|possivelmente/i;
    return uncertainPhrases.test(text);
  }

  getUncertaintyNote(lang = 'en') {
    const notes = {
      en: 'Further verification recommended.',
      de: 'Weitere Überprüfung empfohlen.',
      pt: 'Verificação adicional recomendada.'
    };
    return notes[lang] || notes.en;
  }

  // ═══ 37. ADAPTIVE RESPONSE DEPTH ═══
  userDepthPreference = 'balanced';
  messageHistory = [];

  adaptDepth(message) {
    this.messageHistory.push({ length: message.length, timestamp: Date.now() });
    if (this.messageHistory.length > 10) this.messageHistory.shift();

    const avgLength = this.messageHistory.reduce((a, m) => a + m.length, 0) / this.messageHistory.length;
    if (avgLength < 40) this.userDepthPreference = 'concise';
    else if (avgLength > 150) this.userDepthPreference = 'detailed';
    else this.userDepthPreference = 'balanced';

    return this.userDepthPreference;
  }

  getDepthHint() {
    return {
      concise: { maxLength: 300, style: 'brief' },
      balanced: { maxLength: 600, style: 'standard' },
      detailed: { maxLength: 1200, style: 'comprehensive' }
    }[this.userDepthPreference];
  }

  // ═══ 40. GUARDIAN RISK GRADIENT VISUALIZATION ═══
  getRiskGradient(sgeResult) {
    if (!sgeResult) return { level: 0, icon: '🟢', label: 'Safe', color: '#27AE60' };
    const risk = sgeResult.risk_level || sgeResult.risk || 'R0';
    const gradients = {
      'R0': { level: 0, icon: '🟢', label: 'Safe', color: '#27AE60' },
      'R1': { level: 1, icon: '🟢', label: 'Low', color: '#2ECC71' },
      'R2': { level: 2, icon: '🟡', label: 'Moderate', color: '#F1C40F' },
      'R3': { level: 3, icon: '🟠', label: 'Elevated', color: '#E67E22' },
      'R4': { level: 4, icon: '🔴', label: 'High', color: '#E74C3C' },
      'R5': { level: 5, icon: '⛔', label: 'Critical', color: '#C0392B' }
    };
    return gradients[risk] || gradients['R0'];
  }

  // ═══ 41. EXPLAINABILITY ON DEMAND ═══
  lastRouteExplanation = null;

  generateExplanation(routeResult, sgeResult, lang = 'en') {
    const explanation = {
      dragon: routeResult.profile?.id || 'unknown',
      confidence: routeResult.confidence,
      confidenceScore: routeResult.confidenceScore,
      reasons: [],
      governance: {}
    };

    // Build reasons
    if (routeResult.telemetry?.boosts?.keywords) {
      const kw = Object.entries(routeResult.telemetry.boosts.keywords).filter(([k,v]) => v > 0);
      if (kw.length) explanation.reasons.push({ en: 'Keyword match', de: 'Schlüsselwort-Match', pt: 'Correspondência de palavra-chave' }[lang]);
    }
    if (routeResult.telemetry?.boosts?.sge) {
      explanation.reasons.push({ en: 'SGE semantic analysis', de: 'SGE semantische Analyse', pt: 'Análise semântica SGE' }[lang]);
    }
    if (routeResult.overridden) {
      explanation.reasons.push({ en: 'Guardian safety override', de: 'Guardian-Sicherheitsüberschreibung', pt: 'Override de segurança Guardian' }[lang]);
    }

    // Governance details
    if (sgeResult) {
      explanation.governance = {
        risk: sgeResult.risk_level || sgeResult.risk,
        layers: sgeResult.layers || [],
        invariants: 9
      };
    }

    this.lastRouteExplanation = explanation;
    return explanation;
  }

  // ═══ 44. RESPONSE STABILITY ENGINE ═══
  responseCache = new Map();

  checkStability(message, newResponse) {
    const key = message.toLowerCase().slice(0, 50);
    const cached = this.responseCache.get(key);

    if (cached) {
      // Check for contradiction
      const similarity = this._calculateSimilarity(cached.response, newResponse);
      if (similarity < 0.3) {
        return { stable: false, warning: 'Response variation detected' };
      }
    }

    this.responseCache.set(key, { response: newResponse, timestamp: Date.now() });
    if (this.responseCache.size > 50) {
      const oldest = this.responseCache.keys().next().value;
      this.responseCache.delete(oldest);
    }

    return { stable: true };
  }

  _calculateSimilarity(a, b) {
    if (!a || !b) return 1;
    const wordsA = new Set(a.toLowerCase().split(/\s+/));
    const wordsB = new Set(b.toLowerCase().split(/\s+/));
    const intersection = [...wordsA].filter(x => wordsB.has(x)).length;
    return intersection / Math.max(wordsA.size, wordsB.size);
  }

  // ═══ 45. SEMANTIC DRIFT DETECTION ═══
  topicHistory = [];

  detectSemanticDrift(message) {
    const topics = this._extractTopics(message);
    const lastTopics = this.topicHistory.slice(-3).flat();

    const overlap = topics.filter(t => lastTopics.includes(t)).length;
    const driftDetected = lastTopics.length > 0 && overlap === 0 && topics.length > 0;

    this.topicHistory.push(topics);
    if (this.topicHistory.length > 10) this.topicHistory.shift();

    return driftDetected;
  }

  _extractTopics(text) {
    const topics = [];
    if (/document|report|template/i.test(text)) topics.push('document');
    if (/compliance|gdpr|legal/i.test(text)) topics.push('compliance');
    if (/audit|verify|check/i.test(text)) topics.push('audit');
    if (/risk|security|protect/i.test(text)) topics.push('security');
    if (/create|build|generate/i.test(text)) topics.push('creation');
    return topics;
  }

  getDriftMessage(lang = 'en') {
    const msgs = {
      en: 'Topic shift detected — starting fresh analysis.',
      de: 'Themenwechsel erkannt — neue Analyse gestartet.',
      pt: 'Mudança de tema detectada — iniciando nova análise.'
    };
    return msgs[lang] || msgs.en;
  }

  // ═══ 49. SESSION TRUST INDEX ═══
  sessionTrustScore = 50; // Start at 50, max 100

  updateTrustScore(factors = {}) {
    // Positive factors
    if (factors.successfulResponse) this.sessionTrustScore = Math.min(100, this.sessionTrustScore + 2);
    if (factors.governanceApplied) this.sessionTrustScore = Math.min(100, this.sessionTrustScore + 1);
    if (factors.witnessVerified) this.sessionTrustScore = Math.min(100, this.sessionTrustScore + 3);

    // Negative factors
    if (factors.error) this.sessionTrustScore = Math.max(0, this.sessionTrustScore - 5);
    if (factors.fallback) this.sessionTrustScore = Math.max(0, this.sessionTrustScore - 1);

    return this.sessionTrustScore;
  }

  getTrustLevel() {
    if (this.sessionTrustScore >= 80) return { level: 'elevated', label: 'Elevated', color: '#27AE60' };
    if (this.sessionTrustScore >= 60) return { level: 'established', label: 'Established', color: '#3498DB' };
    if (this.sessionTrustScore >= 40) return { level: 'building', label: 'Building', color: '#F39C12' };
    return { level: 'initial', label: 'Initial', color: '#95A5A6' };
  }

  // ═══ 50. INSTITUTIONAL RELIABILITY MESSAGING ═══
  getReliabilityMessage(context, lang = 'en') {
    const messages = {
      processing: {
        en: 'Resilient processing active',
        de: 'Ausfallsichere Verarbeitung aktiv',
        pt: 'Processamento resiliente ativo'
      },
      governance: {
        en: 'Governance safeguards applied',
        de: 'Governance-Schutzmaßnahmen angewendet',
        pt: 'Salvaguardas de governança aplicadas'
      },
      local: {
        en: 'Local sovereignty maintained',
        de: 'Lokale Souveränität gewährleistet',
        pt: 'Soberania local mantida'
      },
      verified: {
        en: 'Institutional verification complete',
        de: 'Institutionelle Verifizierung abgeschlossen',
        pt: 'Verificação institucional completa'
      }
    };
    return messages[context]?.[lang] || messages[context]?.en || '';
  }

  // ═══ 46. RESPONSE CACHING ═══
  queryCache = new Map();
  CACHE_TTL = 300000; // 5 minutes

  getCachedResponse(query) {
    const key = query.toLowerCase().trim().slice(0, 100);
    const cached = this.queryCache.get(key);
    if (cached && Date.now() - cached.timestamp < this.CACHE_TTL) {
      return cached.response;
    }
    return null;
  }

  cacheResponse(query, response) {
    const key = query.toLowerCase().trim().slice(0, 100);
    this.queryCache.set(key, { response, timestamp: Date.now() });
    if (this.queryCache.size > 100) {
      const oldest = this.queryCache.keys().next().value;
      this.queryCache.delete(oldest);
    }
  }

  // ═══════════════════════════════════════════════════════════════════════
  // ENTERPRISE READINESS LAYER (51-70)
  // ═══════════════════════════════════════════════════════════════════════

  // ═══ 51. DETERMINISTIC OUTPUT MODE ═══
  responseMode = 'standard'; // standard | institutional

  RESPONSE_MODES = {
    standard: { deterministic: false, temperature: 0.7, structured: false },
    institutional: { deterministic: true, temperature: 0.2, structured: true }
  };

  setResponseMode(mode) {
    if (this.RESPONSE_MODES[mode]) {
      this.responseMode = mode;
      return true;
    }
    return false;
  }

  getResponseModeConfig() {
    return this.RESPONSE_MODES[this.responseMode];
  }

  // ═══ 52. POLICY-BASED ROUTING ═══
  ROUTING_POLICY = [
    { if: { riskMin: 'R4' }, then: 'guardian', priority: 100 },
    { if: { riskMin: 'R5' }, then: 'guardian', priority: 110 },
    { if: { has: ['ledger', 'receipt', 'hash', 'seal', 'verify', 'audit'] }, then: 'witness', priority: 80 },
    { if: { has: ['template', 'draft', 'format', 'create', 'build', 'generate'] }, then: 'architect', priority: 70 },
    { if: { has: ['policy', 'compliance', 'gdpr', 'risk', 'protect'] }, then: 'guardian', priority: 90 }
  ];

  applyRoutingPolicy(message, sgeResult) {
    const lower = message.toLowerCase();
    const risk = sgeResult?.risk_level || sgeResult?.risk || 'R0';
    const riskNum = parseInt(risk.replace('R', '')) || 0;

    let matches = [];
    for (const rule of this.ROUTING_POLICY) {
      let match = false;
      if (rule.if.riskMin) {
        const minRisk = parseInt(rule.if.riskMin.replace('R', ''));
        match = riskNum >= minRisk;
      }
      if (rule.if.has) {
        match = rule.if.has.some(kw => lower.includes(kw));
      }
      if (match) {
        matches.push({ dragon: rule.then, priority: rule.priority || 50 });
      }
    }

    if (matches.length === 0) return null;
    matches.sort((a, b) => b.priority - a.priority);
    return matches[0].dragon;
  }

  // ═══ 53. SESSION ROLES ═══
  userRole = 'standard'; // standard | executive | compliance | engineer

  USER_ROLE_CONFIG = {
    standard: { depth: 'balanced', jargon: 'normal', summary: false },
    executive: { depth: 'concise', jargon: 'minimal', summary: true },
    compliance: { depth: 'detailed', jargon: 'technical', summary: false },
    engineer: { depth: 'detailed', jargon: 'technical', summary: false }
  };

  setUserRole(role) {
    if (this.USER_ROLE_CONFIG[role]) {
      this.userRole = role;
      return true;
    }
    return false;
  }

  getUserRoleConfig() {
    return this.USER_ROLE_CONFIG[this.userRole];
  }

  // ═══ 54. PUBLISHABILITY SCORE ═══
  publishabilityScore(sgeResult, invariantsValid = true) {
    let score = 0.6; // Base score

    if (!invariantsValid) return { score: 0.2, level: 'draft', label: 'Draft - Review Required' };

    if (sgeResult) {
      const risk = sgeResult.risk_level || sgeResult.risk || 'R0';
      const riskScores = { 'R0': 0.95, 'R1': 0.85, 'R2': 0.75, 'R3': 0.55, 'R4': 0.35, 'R5': 0.15 };
      score = riskScores[risk] || 0.6;
    }

    if (score >= 0.8) return { score, level: 'publish', label: 'Publish Ready', color: '#27AE60' };
    if (score >= 0.5) return { score, level: 'review', label: 'Review Recommended', color: '#F39C12' };
    return { score, level: 'draft', label: 'Draft Only', color: '#E74C3C' };
  }

  // ═══ 56. PROOF-FRIENDLY FORMATTING (Witness) ═══
  formatWitnessStyle(text, metadata = {}) {
    const timestamp = new Date().toISOString();
    const lines = [
      `━━━ WITNESS VERIFICATION RECORD ━━━`,
      `Timestamp: ${timestamp}`,
      `Session: ${metadata.sessionId || 'N/A'}`,
      ``,
      `OBSERVED:`,
      ...text.split('\n').map(l => `  • ${l}`),
      ``,
      `VERIFICATION STATUS: ${metadata.verified ? '✓ VERIFIED' : '○ PENDING'}`,
      `━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━`
    ];
    return lines.join('\n');
  }

  // ═══ 57. GUARDIAN RED TEAM MICRO-CHECK ═══
  redTeamCheck(text) {
    const concerns = [];
    if (/guarantee|versprechen|garantir/i.test(text)) {
      concerns.push({ type: 'claim', text: 'Contains guarantee language' });
    }
    if (/always|never|immer|niemals|sempre|nunca/i.test(text)) {
      concerns.push({ type: 'absolute', text: 'Contains absolute statements' });
    }
    if (/confidential|secret|geheim|confidencial/i.test(text) && text.length > 200) {
      concerns.push({ type: 'sensitive', text: 'May contain sensitive information' });
    }
    return concerns.length > 0 ? concerns : null;
  }

  // ═══ 58. ANTI-CONTRADICTION LEDGER ═══
  decisionLedger = [];

  recordDecision(message, decision, dragonId) {
    const entry = {
      id: this.decisionLedger.length + 1,
      timestamp: Date.now(),
      message: message.slice(0, 100),
      decision,
      dragon: dragonId
    };
    this.decisionLedger.push(entry);
    if (this.decisionLedger.length > 50) this.decisionLedger.shift();
    return entry;
  }

  checkContradiction(message) {
    const lower = message.toLowerCase();
    for (const entry of this.decisionLedger) {
      // Check for direct contradiction patterns
      if (entry.decision && lower.includes('not ' + entry.decision.slice(0, 20).toLowerCase())) {
        return { contradiction: true, conflictsWith: entry };
      }
    }
    return { contradiction: false };
  }

  // ═══ 59. TOPIC LOCK ═══
  topicLock = null;

  setTopicLock(topic) {
    this.topicLock = { topic, timestamp: Date.now() };
  }

  checkTopicLock(message) {
    if (!this.topicLock) return null;

    const topics = this._extractTopics(message);
    const lockedTopic = this.topicLock.topic;

    if (topics.length > 0 && !topics.includes(lockedTopic)) {
      return {
        locked: true,
        currentTopic: lockedTopic,
        newTopics: topics,
        message: `Topic lock: ${lockedTopic}. Switch topic?`
      };
    }
    return null;
  }

  unlockTopic() {
    this.topicLock = null;
  }

  // ═══ 60. RETRY STRATEGY ═══
  async withRetry(fn, options = {}) {
    const { maxRetries = 3, backoff = [500, 1500, 3000] } = options;
    let lastError;

    for (let i = 0; i < maxRetries; i++) {
      try {
        return await fn();
      } catch (error) {
        lastError = error;
        if (i < maxRetries - 1) {
          await new Promise(r => setTimeout(r, backoff[i] || backoff[backoff.length - 1]));
        }
      }
    }

    throw lastError;
  }

  // ═══ 63. SENSITIVE FIELD MASKER ═══
  maskSensitive(text) {
    return text
      .replace(/\b[A-Z]{2}\d{2}[A-Z0-9]{11,30}\b/g, '[IBAN]')
      .replace(/\b\d{3}[-.\s]?\d{3}[-.\s]?\d{4}\b/g, '[PHONE]')
      .replace(/\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b/g, '[EMAIL]')
      .replace(/\b\d{4}[-\s]?\d{4}[-\s]?\d{4}[-\s]?\d{4}\b/g, '[CARD]')
      .replace(/\b\d{2,3}[-.\s]?\d{6,8}\b/g, '[ID]');
  }

  // ═══ 64. ONE-CLICK EXPORT POLICY ═══
  getExportMetadata(result, routeResult) {
    return {
      exportedAt: new Date().toISOString(),
      governance: {
        dragon: routeResult?.profile?.id || 'unknown',
        confidence: routeResult?.confidence || 'N/A',
        invariantsStatus: result?.constitutional?.invariants || 9,
        sgeRisk: result?.sge?.risk || 'N/A'
      },
      publishability: this.publishabilityScore(result?.sge, true),
      sessionTrust: this.getTrustLevel(),
      responseMode: this.responseMode
    };
  }

  // ═══ 65. SHADOW RESPONSE COMPARISON ═══
  shadowResponses = [];

  recordShadowResponse(rawResponse, governedResponse) {
    const entry = {
      timestamp: Date.now(),
      raw: rawResponse?.slice(0, 500),
      governed: governedResponse?.slice(0, 500),
      modified: rawResponse !== governedResponse
    };
    this.shadowResponses.push(entry);
    if (this.shadowResponses.length > 20) this.shadowResponses.shift();
    return entry;
  }

  getShadowComparison() {
    const modified = this.shadowResponses.filter(s => s.modified).length;
    return {
      total: this.shadowResponses.length,
      modified,
      governanceRate: this.shadowResponses.length > 0
        ? ((modified / this.shadowResponses.length) * 100).toFixed(1) + '%'
        : '0%'
    };
  }

  // ═══ 66. MESSAGE SIGNING (Client-side hash) ═══
  async hashMessage(text) {
    if (typeof crypto === 'undefined' || !crypto.subtle) {
      return 'HASH_UNAVAILABLE';
    }
    const encoder = new TextEncoder();
    const data = encoder.encode(text);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('').slice(0, 16);
  }

  // ═══ 67. SLA INDICATOR ═══
  getSLAStatus(latencyMs) {
    if (latencyMs < 2000) return { status: 'normal', message: null };
    if (latencyMs < 5000) return {
      status: 'elevated',
      message: { en: 'Processing...', de: 'Verarbeitung...', pt: 'Processando...' }
    };
    return {
      status: 'high',
      message: { en: 'High load — response may take longer', de: 'Hohe Last — Antwort kann länger dauern', pt: 'Alta carga — resposta pode demorar' }
    };
  }

  // ═══ 68. OFFLINE BUNDLE MODE ═══
  prepareOfflineBundle(messages, metadata = {}) {
    const bundle = {
      type: 'WINDI_OFFLINE_EVIDENCE_BUNDLE',
      version: '1.0',
      createdAt: new Date().toISOString(),
      sessionId: metadata.sessionId || `SESSION-${Date.now().toString(36)}`,
      governance: {
        trustLevel: this.getTrustLevel(),
        decisionCount: this.decisionLedger.length,
        telemetry: this.getTelemetrySummary()
      },
      messages: messages.map((m, i) => ({
        index: i,
        role: m.role,

        dragon: m.dragon,

      })),

    };

    return {
      json: JSON.stringify(bundle, null, 2),
      filename: `WINDI-OFFLINE-${bundle.sessionId}.json`

  }

  // ═══ 69. "ASK FOR EVIDENCE" PATTERN (Witness) ═══
  generateEvidenceRequest(claim, lang = 'en') {
    const templates = {
      en: {
        intro: 'To verify this claim, the following evidence would be helpful:',

      }
    };

    const t = templates[lang] || templates.en;
    const evidenceTypes = [];

    if (/compliant|compliance/i.test(claim)) evidenceTypes.push('compliance audit report');
    if (/secure|security/i.test(claim)) evidenceTypes.push('security assessment');
    if (/verified|verification/i.test(claim)) evidenceTypes.push('verification certificate');

    return {

  // ═══ 70. GOVERNANCE WATERMARK ═══
  isGovernedSession() {
