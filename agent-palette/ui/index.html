// VoiceBudget — Cost control for ElevenLabs API
class VoiceBudget {
  constructor(options = {}) {
    this.maxCharsPerSession = options.maxChars || 10000; // ~$3/session max
    this.charsUsed = 0;
    this.requestsThisMinute = 0;
    this.maxRequestsPerMinute = 5;
    this.lastMinuteReset = Date.now();
  }

  canSpeak(textLength) {
    // Reset rate limit counter every minute
    if (Date.now() - this.lastMinuteReset > 60000) {
      this.requestsThisMinute = 0;
      this.lastMinuteReset = Date.now();
    }
    if (this.requestsThisMinute >= this.maxRequestsPerMinute) return { ok: false, reason: 'rate_limit' };
    if (this.charsUsed + textLength > this.maxCharsPerSession) return { ok: false, reason: 'budget' };
    return { ok: true };
  }

  record(textLength) {
    this.charsUsed += textLength;
    this.requestsThisMinute++;
  }

  get remaining() { return this.maxCharsPerSession - this.charsUsed; }
  get percentUsed() { return Math.round((this.charsUsed / this.maxCharsPerSession) * 100); }
}

// VoiceEngine — Text-to-Speech via Backend proxy to ElevenLabs
class VoiceEngine {
  constructor() {
    this.enabled = false; // Disabled by default until backend is ready
    this.available = false; // Will be set to true if backend supports voice
    this.playing = false;
    this.currentAudio = null;
    this.cache = new Map();
    this.maxCacheSize = 20;
    this.budget = new VoiceBudget({ maxChars: 10000 });
    this.onStateChange = null; // Callback for UI updates

    // Check if backend supports voice
    this.checkAvailability();
  }

  async checkAvailability() {
    try {
      const res = await fetch(VOICE_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: '', voice_id: 'test', check_only: true })
      });
      // If we get anything other than 404, the endpoint might be available
      this.available = res.status !== 404;
      console.log(`[VoiceEngine] Available: ${this.available}`);
    } catch (e) {
      this.available = false;
      console.log('[VoiceEngine] Not available (backend endpoint missing)');
    }
  }

  // Hash text for cache key
  _hashText(text, dragonId) {
    let hash = 0;
    const str = dragonId + ':' + text.slice(0, 200);
    for (let i = 0; i < str.length; i++) {
      hash = ((hash << 5) - hash) + str.charCodeAt(i);
      hash |= 0;
    }
    return hash.toString(36);
  }

  // Clean text for speech
  _cleanText(text) {
    return text
      .replace(/<[^>]*>/g, '')           // Remove HTML
      .replace(/\*\*(.*?)\*\*/g, '$1')   // Remove markdown bold
      .replace(/\*(.*?)\*/g, '$1')       // Remove markdown italic
      .replace(/`(.*?)`/g, '$1')         // Remove code
      .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1') // Remove markdown links
      .replace(/#{1,6}\s*/g, '')         // Remove markdown headers
      .replace(/\n{3,}/g, '\n\n')        // Reduce multiple newlines
      .trim()
      .slice(0, VOICE_MAX_CHARS);
  }

  // Notify UI of state changes
  _notifyState(state, data = {}) {
    if (this.onStateChange) {
      this.onStateChange({ state, playing: this.playing, ...data });
    }
    // Also dispatch DOM event for other listeners
    window.dispatchEvent(new CustomEvent('voice-state', {
      detail: { state, playing: this.playing, ...data }
    }));
  }

  // Main speak method
  async speak(text, dragonId = 'guardian') {
    if (!this.enabled || !this.available || !text) {
      console.log('[VoiceEngine] Cannot speak:', { enabled: this.enabled, available: this.available, hasText: !!text });
      return false;
    }

    const cleanText = this._cleanText(text);
    if (cleanText.length < 5) return false;

    // Check budget
    const budgetCheck = this.budget.canSpeak(cleanText.length);
    if (!budgetCheck.ok) {
      console.log('[VoiceEngine] Budget/rate limit:', budgetCheck.reason);
      this._notifyState('budget_exceeded', { reason: budgetCheck.reason });
      return false;
    }

    // Stop current audio if playing
    this.stop();

    // Check cache
    const cacheKey = this._hashText(cleanText, dragonId);
    if (this.cache.has(cacheKey)) {
      console.log('[VoiceEngine] Playing from cache');
      return this._playBlob(this.cache.get(cacheKey), dragonId);
    }

    // Get voice config
    const voiceConfig = DRAGON_VOICES[dragonId] || DRAGON_VOICES.guardian;

    try {
      this.playing = true;
      this._notifyState('loading', { dragonId });

      const response = await fetch(VOICE_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text: cleanText,
          voice_id: voiceConfig.voice_id,
          model_id: VOICE_MODEL,
          voice_settings: voiceConfig.settings
        })
      });

      if (!response.ok) {
        throw new Error(`Voice API ${response.status}`);
      }

      const audioBlob = await response.blob();

      // Cache the audio
      this.cache.set(cacheKey, audioBlob);
      if (this.cache.size > this.maxCacheSize) {
        const firstKey = this.cache.keys().next().value;
        this.cache.delete(firstKey);
      }

      // Record usage
      this.budget.record(cleanText.length);

      // Play audio
      return await this._playBlob(audioBlob, dragonId);

    } catch (error) {
      console.warn('[VoiceEngine] Failed:', error.message);
      this.playing = false;
      this._notifyState('error', { error: error.message, dragonId });
      return false;
    }
  }

  // Play audio blob
  async _playBlob(blob, dragonId) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(blob);
      this.currentAudio = new Audio(url);

      this.currentAudio.onended = () => {
        URL.revokeObjectURL(url);
        this.playing = false;
        this.currentAudio = null;
        this._notifyState('idle', { dragonId });
        resolve(true);
      };

      this.currentAudio.onerror = (e) => {
        URL.revokeObjectURL(url);
        this.playing = false;
        this.currentAudio = null;
        this._notifyState('error', { dragonId });
        resolve(false);
      };

      this.playing = true;
      this._notifyState('playing', { dragonId });
      this.currentAudio.play().catch(e => {
        console.warn('[VoiceEngine] Play failed:', e);
        this.playing = false;
        this._notifyState('error', { dragonId });
        resolve(false);
      });
    });
  }

  // Stop playback
  stop() {
    if (this.currentAudio) {
      this.currentAudio.pause();
      this.currentAudio.currentTime = 0;
      this.currentAudio = null;
    }
    this.playing = false;
    this._notifyState('idle');
  }

  // Toggle enable/disable
  toggle() {
    if (!this.available) {
      console.log('[VoiceEngine] Cannot toggle - not available');
      return false;
    }
    this.enabled = !this.enabled;
    if (!this.enabled) this.stop();
    return this.enabled;
  }

  // Get status
  getStatus() {
    return {
      enabled: this.enabled,
      available: this.available,
      playing: this.playing,
      budgetUsed: this.budget.percentUsed,
      budgetRemaining: this.budget.remaining
    };
  }
}

  LAYER7_FORBIDDEN.forEach(r => { f = f.replace(r.avoid, r.prefer); });
  return f;
}

function validateInvariants(text) {
  const violations = [];
  if (/\b(?:i decided|i have decided|i will decide|ich entscheide|eu decidi)\b/i.test(text))
    violations.push({ inv:"I1", sev:"CRITICAL", detail:"Agent claimed decision authority" });
  if (/\b(?:i know for (?:a )?fact|garantiere? dass|garanto que)\b/i.test(text))
    violations.push({ inv:"I5", sev:"WARNING", detail:"Over-certainty detected" });
  if (/\bauto[_-]?(?:apply|execute|approve)\b/i.test(text))
    violations.push({ inv:"I9", sev:"FATAL", detail:"Autonomy escalation — IRREMEDIABLE" });
  return { valid:violations.length===0, violations, hasFatal:violations.some(v=>v.sev==="FATAL") };
}

function classifyInput(text, intentHistory) {
  const t = text.toLowerCase().trim();
  const words = t.split(/\s+/);
  const isShort = words.length <= 4;
  let bestChat = null, bestChatScore = 0;
  for (const [type, cfg] of Object.entries(CHAT_PATTERNS)) {
    let score = 0;
    cfg.rx.forEach(rx => { if (rx.test(t)) score += cfg.weight; });
    if (score > bestChatScore) { bestChatScore = score; bestChat = type; }
  }
  let docScore = 0;
  for (const cfg of Object.values(DOCS)) {
    cfg.kw.forEach(k => { if (t.includes(k)) docScore += 0.3; });
    (cfg.rx || []).forEach(rx => { if (rx.test(text)) docScore += 0.5; });
  }
  if (bestChatScore > 0.5 && bestChatScore > docScore) return { mode: "chat", chatType: bestChat, chatScore: bestChatScore, docScore };
  if (docScore > 0.3) return { mode: "document", chatType: null, chatScore: bestChatScore, docScore };
  if (isShort && docScore === 0) return { mode: "chat", chatType: bestChat || "casual", chatScore: Math.max(bestChatScore, 0.3), docScore };
  if (bestChatScore > 0 && docScore === 0) return { mode: "chat", chatType: bestChat, chatScore: bestChatScore, docScore };
  return docScore > 0 ? { mode: "document", chatType: null, chatScore: bestChatScore, docScore } :
    { mode: "chat", chatType: "casual", chatScore: 0.2, docScore: 0 };
}

function detectLang(text) {
  const t = text.toLowerCase();
  const words = t.split(/\s+/).filter(w => w.length > 0);
  let scores = { de:0, en:0, pt:0 };
  const totalWords = words.length;
  words.forEach(w => {
    // Skip ambiguous single-char words (a, o, i) — they collide across languages
    if (LANG_AMBIGUOUS.includes(w)) return;
    for (const [l, markers] of Object.entries(LANG)) {
      if (markers.includes(w)) {
        const idx = markers.indexOf(w);
        scores[l] += (idx < 15 ? 1.5 : 1);
      }
    }
  });
  // Tiebreaker: if scores are very close, count matched words ratio
  const sorted = Object.entries(scores).sort((a,b) => b[1] - a[1]);
  if (sorted.length >= 2 && sorted[0][1] > 0 && sorted[1][1] > 0) {
    const diff = sorted[0][1] - sorted[1][1];
    if (diff < 1.0) {
      // Too close — add bonus for language with more unique matches
      const countMatches = (lang) => words.filter(w => !LANG_AMBIGUOUS.includes(w) && LANG[lang].includes(w)).length;
      const c0 = countMatches(sorted[0][0]);
      const c1 = countMatches(sorted[1][0]);
      if (c1 > c0) { sorted[0] = [sorted[1][0], sorted[1][1] + 0.5]; sorted[1] = [sorted[0][0], sorted[0][1]]; }
    }
  }
  return sorted[0][1] > 0 ? sorted[0][0] : null;
}

  org:      /(?:Stadtwerke|GmbH|AG|e\.V\.|Ltd\.|Inc\.|Corp\.|SA|Ltda)\s*[A-ZÄÖÜa-zäöüß]*/g,
};

function extractEntities(text) {
  const e = {};
  for (const [type, rx] of Object.entries(ENTITY_RX)) {
    const matches = [...text.matchAll(new RegExp(rx.source, rx.flags))];
    if (matches.length > 0) e[type] = [...new Set(matches.map(m => m[0].trim()))];
  }
  return e;
}

// ── INTENT PARSER v2 ──────────────────────────────────────────────────
function parseIntent(text, history = []) {
  const t = text.toLowerCase();
  const words = t.split(/\s+/).filter(w => w.length > 0);
  let scores = {};
  for (const [dtype, cfg] of Object.entries(DOCS)) {
    let s = 0;
    (cfg.rx || []).forEach(rx => { if (rx.test(text)) s += 0.55; });
    let kwHits = 0;
    cfg.kw.forEach(k => { if (t.includes(k)) kwHits++; });
    s += Math.min(kwHits * 0.25, 0.6);
    if (kwHits > 0 && s > 0.55) s += 0.1;
    scores[dtype] = Math.min(s, 1.0);
  }
  const lastIntent = history.length > 0 ? history[history.length - 1] : null;
  if (lastIntent?.doc_type && scores[lastIntent.doc_type] > 0.1) {
    scores[lastIntent.doc_type] = Math.min(scores[lastIntent.doc_type] + 0.1, 1.0);
  }
  const sorted = Object.entries(scores).filter(([,s]) => s > 0).sort((a,b) => b[1] - a[1]);
  const bestType = sorted.length > 0 ? sorted[0][0] : "note";
  const confidence = sorted.length > 0 ? sorted[0][1] : 0.15;
  const ambiguous = sorted.length >= 2 && sorted[0][1] - sorted[1][1] < 0.15;
  let langScores = { de:0, en:0, pt:0 };
  words.forEach(w => { if (LANG_AMBIGUOUS.includes(w)) return; for (const [l, markers] of Object.entries(LANG)) { if (markers.includes(w)) langScores[l] += (markers.indexOf(w) < 15 ? 1.5 : 1); } });
  const langSorted = Object.entries(langScores).sort((a,b) => b[1] - a[1]);
  const lang = langSorted[0][1] > 0 ? langSorted[0][0] : "de";
  const urgencyMap = { critical:["asap","sofort","urgente","emergency","notfall","immediately","kritisch","crítico"], urgent:["urgent","dringend","schnell","rápido","soon","bald","logo"] };
  let urgency = "normal";
  for (const [lvl, markers] of Object.entries(urgencyMap)) if (markers.some(m => t.includes(m))) { urgency = lvl; break; }
  const formalityMap = { institutional:["official","offiziell","oficial","institutional","governance","behörde","amtlich"], formal:["formal","formell","professional","geschäftlich","profissional"], informal:["casual","quick","schnell","rápido","internal","intern","kurz","short"] };
  let formality = "formal";
  for (const [lvl, markers] of Object.entries(formalityMap)) if (markers.some(m => t.includes(m))) { formality = lvl; break; }
  const entities = extractEntities(text);
  const stop = new Set(["a","an","the","der","die","das","ein","eine","einen","o","os","as","and","und","e","for","für","para","with","mit","com","is","ist","é","to","zu","please","bitte","por","favor","create","write","make","draft","erstell","schreib","cria","escreve","i","me","my","ich","mein","eu","meu","need","want","brauche","preciso","sobre","über","von","from","de",...Object.values(DOCS).flatMap(d => d.kw)]);
  const keywords = words.filter(w => w.length > 2 && !stop.has(w)).slice(0, 10);
  const needsLlm = confidence < 0.5 || (keywords.length < 2 && !entities.person && !entities.org);
  let clarification = null;
  if (ambiguous && confidence < 0.7) {
    const alt = sorted[1];
    const d1 = DOCS[bestType], d2 = DOCS[alt[0]];
    clarification = { type: "ambiguous", options: [
      { type: bestType, label: d1[lang] || d1.en, score: Math.round(confidence * 100) },
      { type: alt[0], label: d2[lang] || d2.en, score: Math.round(alt[1] * 100) },
    ]};
  } else if (confidence < 0.3 && words.length > 3) {
    clarification = { type: "low_confidence", message: lang === "de" ? "Ich konnte den Dokumenttyp nicht sicher erkennen. Können Sie genauer beschreiben?" : lang === "pt" ? "Não consegui identificar o tipo de documento. Pode descrever melhor?" : "I couldn't confidently identify the document type. Could you describe more specifically?" };
  }
  return {
    doc_type: bestType, confidence: Math.round(confidence * 100) / 100, language: lang,
    urgency, formality, keywords, entities, needs_llm: needsLlm,
    ambiguous, clarification,
    alternatives: sorted.slice(1,4).map(([t,s]) => ({ type: t, score: Math.round(s*100)/100 })),
    _scores: scores,
  };
}

};

function resolveTemplate(intent) {
  let best = null, bestScore = 0, alts = [];
  for (const [tid, tpl] of Object.entries(TPL)) {
    let s = 0;
    if (tpl.types.includes(intent.doc_type)) s += 0.5;
    if (tpl.formality.includes(intent.formality)) s += 0.2;
    const fieldSet = new Set(tpl.fields);
    if (intent.entities?.person && (fieldSet.has("recipient") || fieldSet.has("to") || fieldSet.has("recipient_name"))) s += 0.1;
    if (intent.entities?.money && (fieldSet.has("total") || fieldSet.has("items"))) s += 0.1;
    if (intent.entities?.date && (fieldSet.has("date") || fieldSet.has("due_date") || fieldSet.has("effective_date"))) s += 0.1;
    if (intent.entities?.org && (fieldSet.has("client") || fieldSet.has("parties"))) s += 0.1;
    const kwOverlap = intent.keywords.filter(k => fieldSet.has(k)).length;
    s += (kwOverlap / Math.max(tpl.fields.length, 1)) * 0.2;
    if (s > bestScore) { if (best) alts.push({ id:best.id, score:bestScore, name:best.name }); bestScore = s; best = { id:tid, ...tpl, score:s }; }
    else if (s > 0) alts.push({ id:tid, score:s, name:tpl.name });
  }
  return { template: best || { id:"GEN-LETTER", ...TPL["GEN-LETTER"], score:0.1 }, alternatives: alts.sort((a,b) => b.score - a.score).slice(0,3) };
}

// Async runSGE — tries Dragon Server first, falls back to local
async function runSGE(text, tier, intent, templateId) {
  const tierCfg = TIERS[tier];

  // Try Backend SGE first (6-layer, 130+ entities)
  if (window.dragon) {
    try {
      const result = await window.dragon.sge(text, { source: templateId || 'palette' });
      if (result && result.success) {
        // Convert backend response to frontend format
        const riskNum = parseInt(result.risk_level?.replace('R', '') || '0');
        const effectiveRisk = Math.min(riskNum, tierCfg.sgeMax);
        return {
          risk: `R${effectiveRisk}`,
          riskRaw: riskNum,
          score: result.score,
          blocked: riskNum > tierCfg.sgeMax,
          findings: result.findings || [],
          findingsCount: result.findings_count || 0,
          hash: result.scan_hash || 'sge-backend',
          humanRequired: result.human_required || false,
          explanation: result.findings?.slice(0, 3).map(f => `${f.category}: ${f.title}`).join(' · ') || 'No issues',
          source: 'dragon-sge-6layer',
          engineVersion: result.engine_version,
          scanDuration: result.scan_duration_ms,
          // 6-layer details for GovPanel
          layers: {
            lexical: { score: 0, findings: [] },
            syntactic: { score: 0, findings: [] },
            semantic: { score: 0, findings: [] },
            pragmatic: { score: 0, findings: [] },
            regulatory: { score: 0, findings: [] },
            institutional: { score: 0, findings: [] },
          }
        };
      }
    } catch (error) {
      console.warn('[SGE] Backend unavailable, using local fallback:', error.message);
    }
  }

  // Fallback: local processing (maintains offline functionality)
  return runSGELocal(text, tier, intent, templateId);
}

// Original local SGE (renamed, kept as fallback)
function runSGELocal(text, tier, intent, templateId) {
  const t = text.toLowerCase();
  const tierCfg = TIERS[tier];
  const template = TPL[templateId];
  const expectedRisk = template?.expectedRisk || [];
  const findings = {};
  let rawTotal = 0;
  for (const [layer, db] of Object.entries(RISK_DB)) {
    const highHits = db.high.filter(k => t.includes(k));
    const medHits = db.med.filter(k => t.includes(k));
    const unexpectedHigh = highHits.filter(k => !expectedRisk.some(er => er === `${layer}_high`));
    const baseRisk = unexpectedHigh.length > 0 ? 2 : highHits.length > 0 ? 1 : medHits.length > 0 ? 1 : 0;
    findings[layer] = { risk: baseRisk, high: highHits, med: medHits, unexpected: unexpectedHigh };
    rawTotal += baseRisk;
  }
  findings.semantic = { risk: intent.confidence < 0.3 ? 1 : 0, detail: intent.confidence < 0.3 ? "Low intent confidence" : "Clear intent", high:[], med:[], unexpected:[] };
  rawTotal += findings.semantic.risk;
  const pragRisk = intent.urgency === "critical" ? 1 : 0;
  const formalityMismatch = intent.formality === "informal" && (intent.doc_type === "governance_decision" || intent.doc_type === "contract") ? 1 : 0;
  findings.pragmatic = { risk: pragRisk + formalityMismatch, detail: pragRisk ? "Critical urgency" : formalityMismatch ? "Formality mismatch" : "Normal", high:[], med:[], unexpected:[] };
  rawTotal += findings.pragmatic.risk;
  findings.syntactic = { risk: 0, detail: "Structure pending", high:[], med:[], unexpected:[] };
  const crossAmplify = (findings.lexical?.risk >= 2 && findings.regulatory?.risk >= 1) ? 1 :
    (findings.institutional?.risk >= 2 && findings.financial?.risk >= 1) ? 1 : 0;
  rawTotal += crossAmplify;
  const crossNote = crossAmplify > 0 ? "Cross-layer correlation detected" : null;
  const clampedRisk = Math.min(rawTotal, 5);
  const effectiveRisk = Math.min(clampedRisk, tierCfg.sgeMax);
  const hash = "sha256:" + Array.from(text).reduce((h,c) => (((h<<5)-h)+c.charCodeAt(0))|0, 0).toString(16).replace("-","a").padStart(12,"0");
  return {
    risk: `R${effectiveRisk}`, riskRaw: clampedRisk, blocked: clampedRisk > tierCfg.sgeMax,
    findings, hash, humanRequired: clampedRisk >= 3, crossCorrelation: crossNote,
    explanation: buildSGEExplanation(findings, effectiveRisk, crossNote, intent.language),
    source: 'local-fallback', // Added for Phase 1
    score: 100 - (clampedRisk * 15), // Approximate score for local
  };
}

function buildSGEExplanation(findings, risk, crossNote, lang) {
  const layers = Object.entries(findings).filter(([,v]) => v.risk > 0);
  if (layers.length === 0) return lang === "de" ? "Keine Auffälligkeiten." : lang === "pt" ? "Nenhuma anomalia." : "No issues detected.";
  const parts = layers.map(([name, v]) => {
    const triggers = [...(v.high||[]), ...(v.med||[])].slice(0,3).join(", ");
    return `${name}: R${v.risk}${triggers ? ` (${triggers})` : ""}`;
  });
  if (crossNote) parts.push(crossNote);
  return parts.join(" · ");
}

// ── RECEIPT GENERATOR ─────────────────────────────────────────────────
function genReceipt(intent, tid, sge, tier, validation) {
  const now = new Date();
  const ds = now.toISOString().slice(0,10).replace(/-/g,"");
  const hash = "sha256:" + Array.from(JSON.stringify({intent:intent.doc_type,tid,r:sge.risk,tier,ts:now.getTime()}))
    .reduce((h,c) => (((h<<5)-h)+c.charCodeAt(0))|0, 0).toString(16).replace("-","a").padStart(12,"0");
  return {
    id:`WINDI-PAL-${ds}-${Math.random().toString(36).substr(2,6).toUpperCase()}`,
    ts:now.toISOString(), src:`palette-v${V}`, doc:intent.doc_type, tpl:tid, hash, risk:sge.risk, tier,
    constitutional: {
      invariants_checked: Object.keys(INVARIANTS).length,
      stability_layers: Object.keys(STABILITY_LAYERS).length,
      layer7_active: true,
      validation: validation?.valid ? "CLEAN" : `VIOLATIONS:${validation?.violations?.length||0}`,
    },
    status: validation?.hasFatal ? "BLOCKED" : !validation?.valid ? "FLAGGED" : "SEALED",
    closing: "Human decides. WINDI observes.",
  };
}

// ── FORMAT RESOLVER ───────────────────────────────────────────────────
function resolveFormat(intent, tierCfg) {
  const t = intent.doc_type;
  if (t === "invoice" && tierCfg.formats.includes("xlsx")) return "xlsx";
  if (t === "presentation" && tierCfg.formats.includes("pptx")) return "pptx";
  if ((t === "communique" || t === "governance_decision" || t === "certificate") && tierCfg.formats.includes("pdf")) return "pdf";
  if (intent.formality === "institutional" && tierCfg.formats.includes("pdf")) return "pdf";
  return "docx";
}

// AGENT BRAIN — v0.6.0-K: Clean responses, silent governance
// Phase 1: Now async to support Backend SGE
// ═══════════════════════════════════════════════════════════════════════
async function agentThink(userInput, tier, intentHistory, stats) {
  const t0 = performance.now();
  const classification = classifyInput(userInput, intentHistory);
  const detectedLang = detectLang(userInput);
  
  if (classification.mode === "chat") {
    const lang = detectedLang || "de";
    const response = applyLayer7(chatRespond(classification.chatType, lang, stats || {docs:0,sealed:0,avgMs:0}, tier));
    return {
      type: "chat", chatType: classification.chatType, message: response,
      intent: { language: lang, doc_type: null, confidence: 0 },
      sge: null, receipt: null, template: null, alternatives: null,
      constitutional: { active: true, invariants: Object.keys(INVARIANTS).length, layers: Object.keys(STABILITY_LAYERS).length },
      ms: Math.round(performance.now() - t0),
    };
  }
  
  const intent = parseIntent(userInput, intentHistory);
  const tierCfg = TIERS[tier];
  const doc = DOCS[intent.doc_type] || DOCS.note;
  const L = intent.language;
  const label = doc[L] || doc.en;

  if (intent.clarification) {
    if (intent.clarification.type === "ambiguous") {
      const opts = intent.clarification.options;
      return {
        type:"clarification", intent,
        message: L === "de" ? `Ich erkenne zwei mögliche Typen:\n• ${DOCS[opts[0].type]?.icon} **${opts[0].label}**\n• ${DOCS[opts[1].type]?.icon} **${opts[1].label}**\nWelchen meinst du?` :
          L === "pt" ? `Detectei dois tipos possíveis:\n• ${DOCS[opts[0].type]?.icon} **${opts[0].label}**\n• ${DOCS[opts[1].type]?.icon} **${opts[1].label}**\nQual preferes?` :
          `I detected two possible types:\n• ${DOCS[opts[0].type]?.icon} **${opts[0].label}**\n• ${DOCS[opts[1].type]?.icon} **${opts[1].label}**\nWhich one did you mean?`,
        sge:null, receipt:null, template:null, ms:Math.round(performance.now()-t0),
      };
    }
    if (intent.clarification.type === "low_confidence") {
      return { type:"clarification", intent, message:intent.clarification.message, sge:null, receipt:null, template:null, ms:Math.round(performance.now()-t0) };
    }
  }

  if (!tierCfg.types.includes(intent.doc_type)) {
    const avail = tierCfg.types.map(t => `${DOCS[t]?.icon} ${DOCS[t]?.[L]||DOCS[t]?.en}`).join(", ");
    return { type:"blocked_tier", intent,
      message: L === "de" ? `${doc.icon} **${label}** ist im ${tierCfg.label}-Tier nicht verfügbar.\nVerfügbar: ${avail}` :
        L === "pt" ? `${doc.icon} **${label}** não está disponível no tier ${tierCfg.label}.\nDisponíveis: ${avail}` :
        `${doc.icon} **${label}** is not available in ${tierCfg.label} tier.\nAvailable: ${avail}`,
      sge:null, receipt:null, template:null, ms:Math.round(performance.now()-t0) };
  }

  const { template, alternatives } = resolveTemplate(intent);
  const format = resolveFormat(intent, tierCfg);
  const sge = await runSGE(userInput, tier, intent, template.id);

  if (sge.blocked) {
    return { type:"blocked_sge", intent, sge, template, alternatives,
      message: L === "de" ? `⚠️ **Governance-Prüfung**: Dieses Dokument benötigt eine höhere Berechtigungsstufe.\nMenschliche Entscheidung erforderlich.` :
        L === "pt" ? `⚠️ **Verificação de governança**: Este documento requer um nível superior.\nDecisão humana necessária.` :
        `⚠️ **Governance check**: This document requires a higher permission level.\nHuman decision required.`,
      receipt:null, ms:Math.round(performance.now()-t0) };
  }

  const needsConfirm = sge.humanRequired && !sge.blocked;

  // ── CLEAN RESPONSE (no technical jargon for humans) ──
  const entityParts = [];
  if (intent.entities?.person) entityParts.push(`👤 ${intent.entities.person.join(", ")}`);
  if (intent.entities?.org) entityParts.push(`🏢 ${intent.entities.org.join(", ")}`);
  if (intent.entities?.money) entityParts.push(`💶 ${intent.entities.money.join(", ")}`);
  if (intent.entities?.date) entityParts.push(`📅 ${intent.entities.date.join(", ")}`);

  const langLabel = {de:"Deutsch",en:"English",pt:"Português"}[L] || "DE";
  const fmtLabel = {docx:"Word",pdf:"PDF",xlsx:"Excel",pptx:"PowerPoint",jmpg:"JMPG"}[format] || format;

  const lines = [];
  lines.push(`${doc.icon} **${template.name}**`);
  lines.push(`${langLabel} · ${fmtLabel}${intent.urgency !== "normal" ? " · ⚡ " + intent.urgency.toUpperCase() : ""}`);
  if (entityParts.length > 0) lines.push(entityParts.join(" · "));
  
  // Only show risk warning if risk > 0
  if (sge.riskRaw > 0) {
    const riskLabel = L === "de" ? "Governance-Hinweis" : L === "pt" ? "Aviso de governança" : "Governance note";
    lines.push(`🛡️ ${riskLabel}: ${L === "de" ? "Prüfung erkannt" : L === "pt" ? "Verificação detectada" : "Check detected"}`);
  }

  const message = lines.join("\n");
  const filteredMessage = applyLayer7(message);
  const validation = validateInvariants(filteredMessage);
  let receipt = null;
  if (tierCfg.ledger) receipt = genReceipt(intent, template.id, sge, tier, validation);

  return {
    type: validation.hasFatal ? "blocked_constitutional" : "success",
    intent, sge, receipt, template, alternatives, format,
    method: intent.needs_llm && tierCfg.llm ? "hybrid" : "local",
    message: validation.hasFatal
      ? `🚫 **Governance Block** — ${L === "de" ? "Menschliche Intervention erforderlich." : L === "pt" ? "Intervenção humana necessária." : "Human intervention required."}`
      : filteredMessage,
    needsConfirm,
    constitutional: { validation, invariants: Object.keys(INVARIANTS).length, layers: Object.keys(STABILITY_LAYERS).length },
    ms: Math.round(performance.now()-t0),
  };
}

function DocsView({ docs, stats, loading, T, lang, onAction }) {
  const L = DOC_LABELS[lang] || DOC_LABELS.de;

  // Stats header
  const counts = stats?.counts || { published:0, draft:0, review:0, archived:0, total:0 };
  const publishedPct = counts.total > 0 ? Math.round((counts.published / counts.total) * 100) : 0;

  // Get status color from theme
  const getStatusColor = (status) => {
    const st = STATUS_THEME[status] || STATUS_THEME.DRAFT;
    if (st.color === 'green') return T.green;
    if (st.color === 'warning') return T.gold;
    if (st.color === 'red') return T.red || '#c44';
    return T.dim;
  };

  // Format time ago
  const timeAgo = (isoDate) => {
    if (!isoDate) return '';
    const diff = Date.now() - new Date(isoDate).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 60) return `${mins}m`;
    const hours = Math.floor(mins / 60);
    if (hours < 24) return `${hours}h`;
    return `${Math.floor(hours / 24)}d`;
  };

  // Action handler with optimistic UI
  const handleAction = async (doc, action) => {
    if (onAction) onAction(doc, action);
  };

  return React.createElement("div", { style: { padding:20, height:"100%", overflowY:"auto" } },
    // Stats Header
    React.createElement("div", { style: {
      display:"flex", justifyContent:"space-between", alignItems:"center",
      padding:"12px 16px", marginBottom:16, borderRadius:12,
      background:T.card, border:`1px solid ${T.border}`,

        React.createElement("div", { style: {
          width:80, height:6, borderRadius:3, background:T.border+"40", overflow:"hidden"
        }},
          React.createElement("div", { style: {
            width:`${publishedPct}%`, height:"100%", background:T.green, borderRadius:3,
            transition:"width 0.5s ease"
          }})
        ),
        React.createElement("span", { style: { fontSize:9, color:T.dim, fontFamily:T.mono } },
          `${publishedPct}%`)
      )
    ),

    // Loading state
    loading && React.createElement("div", { style: { textAlign:"center", padding:40, color:T.muted } },
      React.createElement("span", { style: { fontSize:24, display:"block", marginBottom:8 } }, "⏳"),

    }},

      const res = await fetch("/palette/api/multimodal/ocr", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ image: base64, language: "deu+eng+por" })

        const updatedImages = [...images];
        updatedImages[imgIndex] = { ...img, ocrText: result.text || '' };

// ── LivingOrb: Canvas 60fps breathing orb (Design Reference) ──────────
function LivingOrb({ score, T, size, onClick, active }) {
  const canvasRef = useRef(null);
  const frameRef = useRef(0);
  const pct = (score || 0) / 100;
  const sz = size || 28;

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    canvas.width = sz * dpr;
    canvas.height = sz * dpr;
    ctx.scale(dpr, dpr);
    let running = true;

    function draw(time) {
      if (!running) return;
      ctx.clearRect(0, 0, sz, sz);
      const cx = sz / 2, cy = sz / 2;
      const breathRate = 0.001 + (1 - pct) * 0.001;
      const breath = Math.sin(time * breathRate) * 0.5 + 0.5;
      const breathScale = 0.7 + breath * 0.3 * pct;

      // Outer glow
      const glowR = (sz / 2 - 2) * breathScale;
      const glow = ctx.createRadialGradient(cx, cy, glowR * 0.3, cx, cy, glowR);
      glow.addColorStop(0, T.gold + "60");
      glow.addColorStop(0.5, T.green + "20");
      glow.addColorStop(1, "transparent");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(cx, cy, glowR, 0, Math.PI * 2);
      ctx.fill();

      // Core orb
      const coreR = (sz / 2 - 6) * (0.6 + breathScale * 0.4);
      const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreR);
      core.addColorStop(0, T.gold + "FF");
      core.addColorStop(0.6, T.green + "AA");
      core.addColorStop(1, T.goldDim + "40");
      ctx.fillStyle = core;
      ctx.beginPath();
      ctx.arc(cx, cy, coreR, 0, Math.PI * 2);
      ctx.fill();

      // Pupil highlight
      const pupilR = coreR * 0.3 * (0.8 + breath * 0.2);
      const pupil = ctx.createRadialGradient(cx, cy, 0, cx, cy, pupilR);
      pupil.addColorStop(0, "#FFFFFF" + (pct > 0.8 ? "CC" : "66"));
      pupil.addColorStop(1, "transparent");
      ctx.fillStyle = pupil;
      ctx.beginPath();
      ctx.arc(cx, cy, pupilR, 0, Math.PI * 2);
      ctx.fill();

      // Progress ring
      const ringR = sz / 2 - 2;
      ctx.strokeStyle = T.gold + "30";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, ringR, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = T.gold + (active ? "CC" : "66");
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.arc(cx, cy, ringR, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct);
      ctx.stroke();

      frameRef.current = requestAnimationFrame(draw);
    }
    frameRef.current = requestAnimationFrame(draw);
    return () => { running = false; cancelAnimationFrame(frameRef.current); };
  }, [score, T, sz, pct, active]);

  return React.createElement("canvas", { ref: canvasRef, onClick: onClick,
    style: { width: sz, height: sz, cursor: "pointer", transition: "transform 0.2s ease",
      transform: active ? "scale(1.1)" : "scale(1)" } });
}

// ── NerveStrand: Particle system for service health (Design Reference) ─
function NerveStrand({ services, T, width, onClick, active }) {
  const canvasRef = useRef(null);
  const frameRef = useRef(0);
  const w = width || 180;
  const h = 24;

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.scale(dpr, dpr);
    let running = true;

    const particles = (services || []).slice(0, 20).map((s, i) => ({
      x: (i / Math.max(services.length, 1)) * w,
      baseY: h / 2,
      speed: s.up !== false ? 0.3 + Math.random() * 0.4 : 0,
      amplitude: s.up !== false ? 2 + Math.random() * 3 : 0,
      phase: Math.random() * Math.PI * 2,
      up: s.up !== false, radius: s.up !== false ? 2 : 1.5,
    }));

    function draw(time) {
      if (!running) return;
      ctx.clearRect(0, 0, w, h);

      // Baseline
      ctx.strokeStyle = T.border + "40";
      ctx.lineWidth = 0.5;
      ctx.beginPath();
      ctx.moveTo(0, h / 2);
      ctx.lineTo(w, h / 2);
      ctx.stroke();

      particles.forEach((p, i) => {
        const t = time * 0.001;
        const waveX = p.x + Math.sin(t * p.speed + p.phase) * 8;
        const waveY = p.baseY + Math.sin(t * p.speed * 2 + p.phase) * p.amplitude;
        const displayX = ((waveX % w) + w) % w;

        // Glow
        const glowColor = p.up ? T.green : T.red;
        const glow = ctx.createRadialGradient(displayX, waveY, 0, displayX, waveY, p.radius * 4);
        glow.addColorStop(0, glowColor + "40");
        glow.addColorStop(1, "transparent");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(displayX, waveY, p.radius * 4, 0, Math.PI * 2);
        ctx.fill();

        // Particle
        ctx.fillStyle = p.up ? T.green + "DD" : T.red + "AA";
        ctx.beginPath();
        ctx.arc(displayX, waveY, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      frameRef.current = requestAnimationFrame(draw);
    }
    frameRef.current = requestAnimationFrame(draw);
    return () => { running = false; cancelAnimationFrame(frameRef.current); };
  }, [services, T, w]);

  return React.createElement("canvas", { ref: canvasRef, onClick: onClick,
    style: { width: w, height: h, cursor: "pointer", borderRadius: 12,
      background: active ? T.gold + "10" : "transparent", transition: "background 0.3s ease" } });
}

    switch (risk) {
      case "R5": return { allowExport: false, requireHumanApproval: true, watermark: "RESTRICTED", logLevel: "critical" };
      case "R4": return { allowExport: true, requireHumanApproval: true, watermark: "REVIEW REQUIRED", logLevel: "high" };

  const policy = riskPolicies(getRisk());

    const r = String(risk || "R0");
    if (r === "R5" || r === "R4") return "high";
    if (r === "R3" || r === "R2") return "med";
    return "low";
  };

  const riskColor = (risk) => {
    const cls = riskClass(risk);
    if (cls === "high") return "#ff4d4d";
    if (cls === "med") return "#f5a623";
    return T.green;
  };

  const invariantsCompliant =
    result?.constitutional?.compliant !== false &&
    (result?.constitutional?.violations?.length || 0) === 0 &&
    result?.constitutional?.validation?.hasFatal !== true;

  const pubScore =
    publishabilityScore?.score ??
    (typeof publishabilityScore === "number" ? publishabilityScore : null);

  // ═══ 73: ReviewCallout helpers ═══
  const showReviewCallout = () => {
    const r = getRisk();
    return r === "R4" || r === "R5";

      en: `Human review recommended before acting on this output. (Risk ${risk})`,

      pt: `Revisão humana recomendada antes de agir com este resultado. (Risco ${risk})`,

            <span>{dragonEmoji}</span>

            {isLocal && <span style={{color:"#e67e22", marginLeft:4, fontSize:8, padding:"1px 5px", borderRadius:8, background:"#e67e2215", display:"inline-flex", alignItems:"center", gap:2}}>🏛️ LOCAL</span>}
            {/* Phase 5B+: Witness auto-activation badge */}

            {/* Phase 5B++: Dual dragon assist badge */}
            {dualDragon && <span style={{color:dualColor, marginLeft:4, fontSize:8, padding:"1px 5px", borderRadius:8, background:dualColor+"15", display:"inline-flex", alignItems:"center", gap:2}}>{dualDragon.label}</span>}
            {/* Phase 5B++: Escalation warning badge */}
            {escalation && escalation.level >= 3 && <span style={{color: escalation.level >= 4 ? "#FF4444" : "#FFA500", marginLeft:4, fontSize:8, padding:"1px 5px", borderRadius:8, background: (escalation.level >= 4 ? "#FF4444" : "#FFA500")+"15", display:"inline-flex", alignItems:"center", gap:2}}>{escalation.label}</span>}
            {/* 31: Dragon Council badge */}
            {councilMode && <span style={{color:"#9B59B6", marginLeft:4, fontSize:8, padding:"1px 5px", borderRadius:8, background:"#9B59B615", display:"inline-flex", alignItems:"center", gap:2}}>🐉🐉🐉 {councilMode.label}</span>}
            {/* 33: Impact tag */}
            {impactTag && <span style={{color:impactTag.color, marginLeft:4, fontSize:8, padding:"1px 5px", borderRadius:8, background:impactTag.color+"15", display:"inline-flex", alignItems:"center", gap:2}}>{impactTag.icon} {impactTag.tag}</span>}
            {/* 40: Risk gradient */}
            {riskGradient && riskGradient.level > 0 && <span style={{marginLeft:4, fontSize:8}}>{riskGradient.icon}</span>}
            {/* 35: Traceability badge */}
            {traceabilityBadge && <span style={{color:"#3498DB", marginLeft:4, fontSize:8, padding:"1px 5px", borderRadius:8, background:"#3498DB15", display:"inline-flex", alignItems:"center", gap:2}}>{traceabilityBadge.icon} {traceabilityBadge.label}</span>}
            {/* ═══ 72: GovChips ═══ */}

            <span title={`Publishability: ${computedPublishability}% (${pubScore != null ? 'backend' : 'risk-based'})`} style={{...govChipStyle, color:computedPublishability>=80?T.green:computedPublishability>=60?"#f5a623":"#ff4d4d", background:(computedPublishability>=80?T.green:computedPublishability>=60?"#f5a623":"#ff4d4d")+"12", cursor:"help"}}>📄 {computedPublishability}%</span>

      <div style={{ maxWidth:"85%", padding:"12px 16px", fontSize:13.5, lineHeight:1.65, fontFamily:T.font, color:T.text, whiteSpace:"pre-wrap",

        {/* Phase 5B: Closing Principle */}
        {a && dragonClosing && showClosing && (

      {download && <WisdomBtn download={download} docData={result} T={T} lang={result?.intent?.language||"de"} />}
      {result?.type === "clarification" && result.intent?.clarification?.options && (

          {result.intent.clarification.options.map((o,i) => (
            <div key={i} style={{ padding:"8px 14px", borderRadius:10, background:T.card, border:`1px solid ${T.border}`, fontSize:12, color:T.dim, fontFamily:T.font, boxShadow:T.shadow }}>
              {DOCS[o.type]?.icon} {o.label}

      <div style={{ display:"flex", alignItems:"center", gap:6, marginTop:3, flexWrap:"wrap" }}>

        {/* 19: Consensus mode badge */}
        {a && consensusMode && (
          <span style={{ fontSize:8, color:"#9B59B6", padding:"1px 5px", borderRadius:8, background:"#9B59B615", fontFamily:T.mono }}>
            🤝 {consensusMode.label?.[lang] || consensusMode.label?.en || 'Consensus'}
          </span>

        {/* Voice button for assistant messages */}
        {a && voiceEnabled && onVoiceClick && (
          <button
            onClick={() => onVoiceClick(msgId, text, dragon || 'guardian')}
            title={isPlaying
              ? (lang==="de"?"Stoppen":lang==="pt"?"Parar":"Stop")

            style={{
              width:22, height:22, borderRadius:"50%", border:"none",

        {a && auditViewEnabled && onExplain && (
          <button

        {/* Enterprise 57: Red Team micro-check */}
        {a && redTeamCheck && auditViewEnabled && (

  );
}

// ── SealBadge: Minimal governance indicator (replaces full Pipeline) ──
function SealBadge({ result, T }) {
  const [open, setOpen] = useState(false);
  const { sge, receipt, template, ms } = result;
  const sealed = !!receipt;
  const riskNum = sge ? parseInt(sge.risk.replace("R","")) : 0;
  
  return (
    <div style={{ marginTop:4, maxWidth:"85%" }}>
      {/* Compact badge — just the essentials */}
      <div onClick={() => setOpen(!open)} 
        style={{ display:"inline-flex", alignItems:"center", gap:6, padding:"4px 10px", borderRadius:20, 
          background:sealed ? T.green+"0C" : T.card, border:`1px solid ${sealed ? T.green+"25" : T.border}`,
          cursor:"pointer", transition:"all 0.2s", fontSize:11, fontFamily:T.mono }}>
        <span style={{ color:sealed?T.green:T.muted }}>{sealed ? "✓" : "○"}</span>
        <span style={{ color:T.dim, fontSize:10 }}>
          {sealed ? (result.intent?.language === "de" ? "Versiegelt" : result.intent?.language === "pt" ? "Selado" : "Sealed") : 
           (result.intent?.language === "de" ? "Lokal" : result.intent?.language === "pt" ? "Local" : "Local")}
        </span>
        {riskNum > 0 && <span style={{ color:rc(sge?.risk, T), fontSize:9, fontWeight:600 }}>{sge.risk}</span>}
        <span style={{ color:T.muted, fontSize:9 }}>{open?"▾":"▸"}</span>
      </div>
      
      {/* Expandable technical details — only for those who want them */}
      {open && (
        <div style={{ marginTop:4, padding:10, borderRadius:8, background:T.card, border:`1px solid ${T.border}`, fontFamily:T.mono, fontSize:10, color:T.dim, lineHeight:1.8, boxShadow:T.shadow }}>
          {template && <div>Template: <span style={{color:T.text}}>{template.id}</span> ({template.fields.length} fields)</div>}
          {sge && <div>SGE: <span style={{color:rc(sge.risk, T)}}>{sge.risk}</span> — {sge.explanation}</div>}
          {sge?.crossCorrelation && <div style={{color:T.orange}}>⚡ {sge.crossCorrelation}</div>}
          {receipt && <div style={{color:T.green}}>📜 {receipt.id} · {receipt.status}</div>}
          {sge && <div style={{color:T.muted, fontSize:9}}>{sge.hash}</div>}
          <div style={{color:T.muted, fontSize:9}}>{ms}ms · {result.method} · {result.format?.toUpperCase()}</div>
        </div>
      )}
    </div>
  );
}

function TierSwitch({ tier, set, T }) {
  // Redirect to subdomain instead of changing tier locally
  const handleTierClick = (targetTier) => {
    if (targetTier === tier) return; // Already on this tier
    if (SUBDOMAIN_MAP[targetTier]) {
      window.location.href = SUBDOMAIN_MAP[targetTier];
    }
  };
  return (
    <div style={{ display:"flex", gap:2, background:T.bg, borderRadius:8, padding:2, border:`1px solid ${T.border}` }}>
      {Object.entries(TIERS).map(([k,v]) => (
        <button key={k} onClick={()=>handleTierClick(k)} title={k===tier ? v.label : `Switch to ${v.label}`} style={{ padding:"4px 10px", borderRadius:6, fontSize:10, fontFamily:T.mono, cursor:k===tier?"default":"pointer", transition:"all 0.2s", border:"none", background:tier===k?v.color+"15":"transparent", color:tier===k?v.color:T.muted, fontWeight:tier===k?600:400 }}>{v.label}</button>
      ))}
    </div>
  );
}

      // Generate DID locally (sovereign approach)
      const timestamp = Date.now();
      const raw = `WINDI-DID:${name}:${timestamp}:${Math.random().toString(36).substr(2)}`;
      const encoder = new TextEncoder();
      const data = encoder.encode(raw);
      const hashBuffer = await crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      const fingerprint = hashArray.slice(0, 8).map(b => b.toString(16).padStart(2, '0')).join('');

      const walletData = {
        wallet_id: `WLT-${fingerprint.toUpperCase()}`,
        fingerprint: fingerprint,
        name: name,
        email: email || null,
        created_at: new Date().toISOString()
      };

      // Store locally (sovereign)
      localStorage.setItem('windi_wallet_id', walletData.wallet_id);
      localStorage.setItem('windi_did', walletData.fingerprint);
      localStorage.setItem('windi_did_name', walletData.name);

      // Try to register with backend (optional, best-effort)
      try {
        await fetch('/palette/api/wallet/provision', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(walletData)
        });
      } catch (e) { /* Backend registration optional */ }

      setStep('success');
      setTimeout(() => {
        onWalletCreated(walletData);
      }, 2000);
    } catch (e) {
      setError(e.message);
    }
    setLoading(false);
  };

  return (
    <div style={{
      position:'fixed', bottom:0, left:0, right:0, zIndex:10000,
      background:`linear-gradient(135deg, ${T.card}, ${T.bg})`,
      borderTop:`2px solid ${T.gold}40`,
      boxShadow:`0 -4px 20px ${T.shadow}`,
      padding:'20px 24px', animation:'slideUp 0.4s ease-out'
    }}>
      <style>{`@keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }`}</style>

      {step === 'intro' && (
        <div style={{ maxWidth:600, margin:'0 auto', textAlign:'center' }}>
          <div style={{ fontSize:18, fontWeight:600, color:T.text, marginBottom:8 }}>
            🪞 {L.title}
          </div>
          <div style={{ fontSize:13, color:T.muted, marginBottom:16 }}>{L.desc}</div>
          <div style={{ display:'flex', justifyContent:'center', gap:16, marginBottom:16, flexWrap:'wrap' }}>
            {L.benefits.map((b, i) => (
              <span key={i} style={{ fontSize:11, color:T.gold, background:T.gold+'12', padding:'4px 10px', borderRadius:12 }}>
                {['🔏','📜','⚡'][i]} {b}
              </span>
            ))}
          </div>
          <div style={{ display:'flex', justifyContent:'center', gap:12 }}>
            <button onClick={()=>setStep('form')} style={{
              padding:'10px 24px', borderRadius:8, border:'none', cursor:'pointer',
              background:`linear-gradient(135deg, ${T.gold}, ${T.gold}cc)`,
              color:'#000', fontWeight:600, fontSize:13
            }}>{L.cta}</button>
            <button onClick={handleDismiss} style={{
              padding:'10px 16px', borderRadius:8, border:`1px solid ${T.border}`,
              background:'transparent', color:T.muted, fontSize:12, cursor:'pointer'
            }}>{L.skip}</button>
          </div>
        </div>
      )}

      {step === 'form' && (
        <div style={{ maxWidth:400, margin:'0 auto' }}>
          <div style={{ marginBottom:12 }}>
            <input type="text" value={name} onChange={e=>setName(e.target.value)} placeholder={L.name}
              style={{ width:'100%', padding:'10px 14px', borderRadius:8, border:`1px solid ${T.border}`,
                background:T.bg, color:T.text, fontSize:14, boxSizing:'border-box' }} />
          </div>
          <div style={{ marginBottom:16 }}>
            <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder={L.email}
              style={{ width:'100%', padding:'10px 14px', borderRadius:8, border:`1px solid ${T.border}`,
                background:T.bg, color:T.muted, fontSize:13, boxSizing:'border-box' }} />
          </div>
          {error && <div style={{ color:'#e74c3c', fontSize:12, marginBottom:8 }}>{error}</div>}
          <div style={{ display:'flex', gap:12 }}>
            <button onClick={handleSubmit} disabled={loading || !name.trim()} style={{
              flex:1, padding:'10px', borderRadius:8, border:'none', cursor:loading?'wait':'pointer',
              background:loading ? T.muted : `linear-gradient(135deg, ${T.gold}, ${T.gold}cc)`,
              color:'#000', fontWeight:600, fontSize:13, opacity:!name.trim()?0.5:1
            }}>{loading ? L.creating : L.cta}</button>
            <button onClick={handleDismiss} style={{
              padding:'10px 16px', borderRadius:8, border:`1px solid ${T.border}`,
              background:'transparent', color:T.muted, fontSize:12, cursor:'pointer'
            }}>{L.skip}</button>
          </div>
        </div>
      )}

      {step === 'success' && (
        <div style={{ maxWidth:400, margin:'0 auto', textAlign:'center' }}>
          <div style={{ fontSize:32, marginBottom:8 }}>🪞</div>
          <div style={{ fontSize:16, fontWeight:600, color:T.green }}>{L.success}</div>
          <div style={{ fontSize:12, color:T.muted, marginTop:4 }}>{L.sealed}</div>
        </div>
      )}
    </div>
  );
}

// "Feed insights to the Wisdom Protocol"

function WisdomBtn({ download, docData, T, lang }) {
  const [status, setStatus] = useState(null);
  const [showInput, setShowInput] = useState(false);
  const [insight, setInsight] = useState("");

  if (!download?.success) return null;

  const labels = {
    de: { btn: "Zur Wisdom", placeholder: "Was ist das Besondere an diesem Dokument?", submit: "Einreichen", success: "Eingereicht!", cancel: "Abbrechen" },
    en: { btn: "To Wisdom", placeholder: "What's notable about this document?", submit: "Submit", success: "Submitted!", cancel: "Cancel" },
    pt: { btn: "Para Wisdom", placeholder: "O que há de notável neste documento?", submit: "Enviar", success: "Enviado!", cancel: "Cancelar" },
  };
  const L = labels[lang] || labels.en;

  const submitWisdom = async () => {
    if (!insight.trim()) return;
    setStatus("submitting");
    try {
      const res = await fetch("/palette/api/wisdom/candidate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          doc_serial: download.serial || "WINDI-UNKNOWN",
          content_hash: download.content_hash || "",
          insight: insight,
          category: "insight",
          source_type: docData?.intent?.doc_type || "document",
          tier: docData?.forensic?.tier || "MED",
          metadata: {
            filename: download.filename,
            format: download.format,
            governance_level: download.governance_level,
          }
        })
      });
      const data = await res.json();
      if (data.success) {
        setStatus("success");
        setTimeout(() => { setStatus(null); setShowInput(false); setInsight(""); }, 2000);
      } else {
        setStatus("error");
      }
    } catch (e) {
      console.error("Wisdom submit error:", e);
      setStatus("error");
    }
  };

  if (showInput) {
    return React.createElement("div", { style: { marginTop: 8, padding: 12, borderRadius: 8, background: T.gold + "08", border: "1px solid " + T.gold + "25" } },
      React.createElement("div", { style: { fontSize: 10, color: T.gold, marginBottom: 6, fontWeight: 600 } }, "🌀 Wisdom Candidate"),
      React.createElement("textarea", {
        value: insight,
        onChange: e => setInsight(e.target.value),
        placeholder: L.placeholder,
        style: { width: "100%", minHeight: 60, padding: 8, borderRadius: 6, border: "1px solid " + T.border, background: T.bg, color: T.text, fontSize: 11, fontFamily: T.font, resize: "vertical" }
      }),
      React.createElement("div", { style: { display: "flex", gap: 8, marginTop: 8 } },
        React.createElement("button", {
          onClick: submitWisdom,
          disabled: !insight.trim() || status === "submitting",
          style: { padding: "6px 14px", borderRadius: 6, border: "none", background: T.gold, color: "#FFF", fontSize: 11, cursor: insight.trim() ? "pointer" : "default", opacity: insight.trim() ? 1 : 0.5 }
        }, status === "submitting" ? "..." : status === "success" ? "✓ " + L.success : L.submit),
        React.createElement("button", {
          onClick: () => { setShowInput(false); setInsight(""); setStatus(null); },
          style: { padding: "6px 14px", borderRadius: 6, border: "1px solid " + T.border, background: "transparent", color: T.dim, fontSize: 11, cursor: "pointer" }
        }, L.cancel)
      )
    );
  }

  return React.createElement("button", {
    onClick: () => setShowInput(true),
    title: "Submit to Wisdom Protocol",
    style: { display: "inline-flex", alignItems: "center", gap: 4, padding: "6px 12px", borderRadius: 8, background: T.gold + "08", border: "1px solid " + T.gold + "25", color: T.gold, fontSize: 11, cursor: "pointer", transition: "all 0.2s" }
  }, "🌀 " + L.btn);
}

  // Try to get items from fields

  if (typeof items === "string") try { items = JSON.parse(items); } catch(e) { items = []; }
  if (!Array.isArray(items) || items.length === 0) {
    // Generate 3 empty placeholder rows
    let rows = "";
    for (let i = 1; i <= 3; i++) {
      const bg = i % 2 === 0 ? "#FDFBF5" : "transparent";
      rows += '<tr style="border-bottom:1px solid #DDD6C2;background:' + bg + '">' +

        '<td style="text-align:right;padding:10px;font-size:12px;color:#8B6914">\u20AC 0,00</td>' +
      '</tr>';
    }
    return rows;
  }
  return items.map(function(item, i) {
    const bg = i % 2 === 1 ? "#FDFBF5" : "transparent";
    const desc = item.description || item.desc || item.descricao || "[Item]";
    const qty = item.quantity || item.qty || item.qtd || 1;
    const price = item.unit_price || item.price || item.preco || "\u20AC 0,00";
    const total = item.total || item.total_price || price;
    return '<tr style="border-bottom:1px solid #DDD6C2;background:' + bg + '">' +
      '<td style="padding:10px;font-size:12px">' + desc + '</td>' +
      '<td style="text-align:center;padding:10px;font-size:12px">' + qty + '</td>' +

      '<td style="text-align:right;padding:10px;font-size:12px;font-weight:600">' + total + '</td>' +
    '</tr>';
  }).join("");
}

// ── Invoice Field Extraction from userInput — mirrors server-side parser ──
function extractInvoiceFields(userInput, intent) {
  if (!userInput) return {};
  const text = userInput;
  const t = text.toLowerCase();
  const lang = intent?.language || "de";

  // ── Parse German-format prices: €2.500,00 or 2.500 € ──
  function parsePrice(s) {
    if (!s) return 0;
    let clean = s.replace(/[€$EURUSD\s]/gi, "").trim();
    // German format: 2.500,00 → 2500.00
    if (/^\d{1,3}(\.\d{3})+(,\d{1,2})?$/.test(clean)) {
      clean = clean.replace(/\./g, "").replace(",", ".");
    } else if (/,\d{1,2}$/.test(clean)) {
      clean = clean.replace(",", ".");
    }
    return parseFloat(clean) || 0;
  }

  function fmtPrice(num) {
    return num.toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  }

  // ── Extract client (EMPFÄNGER) from entities or text ──
  const orgs = intent?.entities?.org || [];
  // Also try to find "Company Name + suffix" pattern directly in text
  const orgFullRx = /(?:^|[\s,;(])([A-ZÄÖÜ][a-zäöüß]+(?:\s+[A-ZÄÖÜ][A-Za-zäöüß]*){0,3})\s+(GmbH|AG|SE|KG|OHG|UG|e\.V\.|Ltd\.|Inc\.|Corp\.|SA|Ltda|Co\.|GbR)/g;
  let orgFull = null;
  const orgMatch = orgFullRx.exec(text);
  if (orgMatch) orgFull = (orgMatch[1].trim() + " " + orgMatch[2]).trim();
  // Also check "für/for/para CompanyName"
  if (!orgFull) {
    const fuerMatch = text.match(/(?:für|for|para|an|to|cliente|client|empfänger|recipient)\s+([A-ZÄÖÜ][A-Za-zÄÖÜäöüß&\-.\s]{2,40}?)(?:\s*[,.]|\s+\d|\s*$)/i);
    if (fuerMatch) orgFull = fuerMatch[1].trim();
  }
  const client = orgFull || (orgs[0] && orgs[0].length > 3 ? orgs[0] : null);

  // ── Extract items: "3x Widget zu €2.500" or "Widget, Menge 3, €2.500" ──
  const items = [];
  const itemPatterns = [
    // "3x Widget zu €2.500" / "3 Widget à €2.500"
    /(\d+)\s*[x×]\s*(.+?)\s*(?:zu|à|at|@|por)\s*((?:€|EUR|\$|R\$)\s*[\d.,]+|[\d.,]+\s*(?:€|Euro))/gi,
    // "Widget, Menge 3, Einzelpreis €2.500"
    /(.+?),?\s*(?:Menge|qty|qtd|quantity)\s*:?\s*(\d+),?\s*(?:Einzelpreis|Preis|price|preço|unit price)?\s*:?\s*((?:€|EUR|\$|R\$)\s*[\d.,]+|[\d.,]+\s*(?:€|Euro))/gi,
    // "Widget, 3, €2.500" (simple CSV-like)
    /(.+?),\s*(\d+)\s*,\s*((?:€|EUR|\$|R\$)\s*[\d.,]+|[\d.,]+\s*(?:€|Euro))/gi,
  ];

  for (const rx of itemPatterns) {
    let m;
    while ((m = rx.exec(text)) !== null) {
      const isQtyFirst = /^\d+$/.test(m[1].trim());
      const desc = isQtyFirst ? m[2].trim() : m[1].trim();
      const qty = isQtyFirst ? parseInt(m[1]) : parseInt(m[2]);
      const priceRaw = m[3].trim();
      const unitPrice = parsePrice(priceRaw);
      const lineTotal = unitPrice * qty;
      items.push({
        description: desc.replace(/^[,;.\s]+|[,;.\s]+$/g, ""),
        quantity: qty,
        unit_price: fmtPrice(unitPrice),
        total: fmtPrice(lineTotal),
        _unitNum: unitPrice,
        _totalNum: lineTotal,
      });
    }
    if (items.length > 0) break;
  }

  // ── If no structured items found, try to use money entities ──
  if (items.length === 0 && intent?.entities?.money?.length > 0) {
    const moneyStr = intent.entities.money[0];
    const price = parsePrice(moneyStr);
    if (price > 0) {
      items.push({
        description: lang === "de" ? "Position 1" : lang === "pt" ? "Item 1" : "Item 1",
        quantity: 1,
        unit_price: fmtPrice(price),
        total: fmtPrice(price),
        _unitNum: price,
        _totalNum: price,
      });
    }
  }

  // ── Calculate totals ──
  const subtotalNum = items.reduce((s, it) => s + (it._totalNum || 0), 0);
  const vatRate = t.includes("7%") ? 7 : t.includes("0%") ? 0 : 19;
  const vatNum = subtotalNum * (vatRate / 100);
  const grandNum = subtotalNum + vatNum;

  // ── Payment terms ──
  let payTerms = "";
  const termMatch = text.match(/(\d+)\s*(?:Tage|days|dias)\s*(?:netto|net|líquido)?/i);
  if (termMatch) payTerms = termMatch[0];
  else if (t.includes("sofort") || t.includes("immediately")) payTerms = lang === "de" ? "Sofort fällig" : "Due immediately";
  else payTerms = "30 " + (lang === "de" ? "Tage netto" : lang === "pt" ? "dias líquido" : "days net");

  // ── Build fields object matching DOC_TEMPLATES.invoice expectations ──
  const fields = {};
  if (client) fields.client_name = client;
  if (items.length > 0) {
    fields.items = items.map(it => ({
      description: it.description,
      quantity: it.quantity,
      unit_price: it.unit_price,
      total: it.total,
    }));
    fields.subtotal = fmtPrice(subtotalNum);
    fields.vat_rate = String(vatRate);
    fields.vat_amount = fmtPrice(vatNum);
    fields.total_amount = fmtPrice(grandNum);
  }
  fields.payment_terms = payTerms;

  return fields;
}

function renderDocTemplate(text, intent, lang, userInput) {
  // Extract JSON fields from LLM response
  let fields = {};
  const bt3 = String.fromCharCode(96,96,96);
  const jsonStart = text.indexOf(bt3 + "json");
  if (jsonStart >= 0) {
    const jsonEnd = text.indexOf(bt3, jsonStart + 6);
    if (jsonEnd > jsonStart) {
      try {
        const raw = text.substring(jsonStart + 7, jsonEnd).trim();
        const parsed = JSON.parse(raw);
        fields = parsed?.document?.fields || parsed?.fields || parsed || {};
      } catch(e) {}
    }
  }

  // ── Fallback: extract fields from userInput + intent entities ──
  const docType = intent?.doc_type || "note";
  if (docType === "invoice" && (!fields.client_name && !fields.nome_cliente && !fields.items)) {
    const extracted = extractInvoiceFields(userInput, intent);
    fields = { ...extracted, ...fields }; // JSON fields override extracted
  }

  if (DOC_TEMPLATES[docType]) {
    return { html: DOC_TEMPLATES[docType](fields, lang), hasTemplate: true };
  }
  return { html: null, hasTemplate: false };
}

// ── DocumentPanel: Slide-out formatted document preview ──────────────
function DocumentPanel({ doc, onClose, T, lang }) {
  if (!doc) return null;
  const labels = {
    de:{title:"Dokument",close:"Schlie\u00DFen",download:"Herunterladen",tip:"Tipp: Passen Sie die markierten Felder an."},
    en:{title:"Document",close:"Close",download:"Download",tip:"Tip: Customize the highlighted fields."},
    pt:{title:"Documento",close:"Fechar",download:"Baixar",tip:"Dica: Personalize os campos destacados."},
  };
  const L = labels[lang] || labels.en;
  const typeIcons = {invoice:"\u{1F4B0}",letter:"\u{1F4E8}",memo:"\u{1F4DD}",report:"\u{1F4CA}",contract:"\u{1F4DC}",protocol:"\u{1F4CB}",certificate:"\u{1F3C5}",email:"\u2709\uFE0F",note:"\u{1F4CC}"};
  const icon = typeIcons[doc.intent?.doc_type] || "\u{1F4C4}";
  const docName = doc.intent?.doc_type ? (DOCS[doc.intent.doc_type]?.[lang] || DOCS[doc.intent.doc_type]?.en || doc.intent.doc_type) : L.title;

  // Extract ONLY document content — no agent dialogue
  function parseContent(text) {
    if (!text) return [];
    // Try JSON block first
    const BT3 = String.fromCharCode(96,96,96);
    let docContent = "";
    const jsonStart = text.indexOf(BT3 + "json");
    const jsonEnd = jsonStart >= 0 ? text.indexOf(BT3, jsonStart + 6) : -1;
    if (jsonStart >= 0 && jsonEnd > jsonStart) {
      try {
        const raw = text.substring(jsonStart + 7, jsonEnd).trim();
        const parsed = JSON.parse(raw);
        if (parsed?.document?.content) docContent = parsed.document.content;
        else if (parsed?.content) docContent = parsed.content;
      } catch(e) {}
    }
    // Fallback: find document structure in text
    if (!docContent) {
      const lines = text.split("\n");
      const docLines = [];
      let inDoc = false;
      const chatStarts = /^(Compreendo|Preparei|Vou criar|I understand|Ich erstelle|Estrutura|O modelo|A fatura|Humano decide|Pr.ximos|O documento|Sure|Klar|Claro|Here is|Aqui est|Hier ist)/;
      const bulletExplain = /^- \*\*/;
      for (const line of lines) {
        const t = line.trim();
        if (/^(FATURA|RECHNUNG|INVOICE|DADOS|DATEN|MEMO|BRIEF|LETTER|VERTRAG|CONTRACT)/.test(t)) inDoc = true;
        if (chatStarts.test(t) || bulletExplain.test(t)) continue;
        if (t.startsWith(BT3)) continue;
        if (inDoc || /^(N\u00BA|N\u00ba|Fatura N|Invoice N|Rechnung N|----)/.test(t)) { inDoc = true; docLines.push(line); }
      }
      if (docLines.length > 3) docContent = docLines.join("\n");
    }
    if (!docContent) return [];
    // Parse into sections
    const sections = [];
    let cur = { title: null, lines: [] };
    docContent.split("\n").forEach(line => {
      const t = line.trim();
      if (!t) { if (cur.lines.length > 0 || cur.title) { sections.push(cur); cur = { title:null, lines:[] }; } return; }
      if (/^---/.test(t)) return;
      if (/^[A-Z\u00C0-\u00DC\s/()]{4,}:?$/.test(t)) {
        if (cur.lines.length > 0 || cur.title) sections.push(cur);
        cur = { title: t.replace(/:$/,""), lines: [] };
      } else {
        cur.lines.push(t);
      }
    });
    if (cur.lines.length > 0 || cur.title) sections.push(cur);
    return sections;
  }

  function renderLine(line, idx) {
    const parts = line.split(/(\[[^\]]+\])/g);
    return React.createElement("div", { key: idx, style: { marginBottom: 4, lineHeight: 1.7, fontSize: 13 } },
      parts.map((p, i) =>
        /^\[/.test(p)
          ? React.createElement("span", { key: i, style: { background: T.gold+"18", border: "1px dashed "+T.gold+"50", borderRadius: 4, padding: "1px 6px", fontSize: 12, fontFamily: T.mono, color: T.gold } }, p)
          : React.createElement("span", { key: i }, p)
      )
    );
  }

  function isTableRow(line) { return /^\|.*\|$/.test(line.trim()); }
  function isTableSep(line) { return /^\|[\s\-:|]+\|$/.test(line.trim()); }
  function renderTable(lines) {
    const rows = lines.filter(l => !isTableSep(l)).map(l => l.split("|").filter(c => c.trim()!=="").map(c => c.trim()));
    if (rows.length === 0) return null;
    return React.createElement("table", { style: { width:"100%", borderCollapse:"collapse", marginBottom:12, fontSize:12, fontFamily:T.mono } },
      React.createElement("thead", null,
        React.createElement("tr", null, rows[0].map((h,i) =>
          React.createElement("th", { key:i, style: { textAlign:"left", padding:"6px 10px", borderBottom:"2px solid "+T.gold+"40", color:T.gold, fontSize:11, fontWeight:600 } }, h)
        ))
      ),
      React.createElement("tbody", null, rows.slice(1).map((row,ri) =>

            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
