              </div>
            ) : urlResult?.title ? (
              <div style={{ background:T.input, borderRadius:8, padding:16, border:`1px solid ${T.border}` }}>
                <div style={{ fontWeight:600, fontSize:14, marginBottom:8 }}>{urlResult.title}</div>
                {urlResult.description && <div style={{ fontSize:13, color:T.muted, lineHeight:1.5, marginBottom:12 }}>{urlResult.description}</div>}
                <div style={{ fontSize:10, color:T.dim, fontFamily:T.mono }}>
                  {urlResult.content_type && <span style={{ marginRight:12 }}>Type: {urlResult.content_type}</span>}
                  {urlResult.status_code && <span>Status: {urlResult.status_code}</span>}
                </div>
                <button onClick={()=>{setInput(prev=>prev+(prev?"\n":"")+`[${urlResult.title}](${urlInput})`);setShowUrlModal(false);inputRef.current?.focus();}}
                  style={{ marginTop:12, padding:"8px 16px", borderRadius:8, border:"none", background:T.gold, color:themeName==="KLAR"?"#FFF":T.bg, cursor:"pointer", fontWeight:600, fontSize:12 }}>
                  ✓ {lang==="de"?"Link einfügen":lang==="pt"?"Inserir link":"Insert link"}
                </button>
              </div>
            ) : null}
          </div>
        </div>
      )}

      {/* Document Generation Modal (Phase 3 LAUNCH Plan — Enhanced Export) */}
      {docGenModal && (
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.7)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:1000 }} onClick={()=>setDocGenModal(null)}>
          <div style={{ background:T.card, borderRadius:16, padding:24, maxWidth:520, width:"90%", border:`1px solid ${T.border}`, maxHeight:"90vh", overflowY:"auto" }} onClick={e=>e.stopPropagation()}>
            {/* Header */}
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:20 }}>
              <span style={{ fontSize:16, fontWeight:600, color:T.gold }}>📄 {lang==="de"?"Dokument exportieren":lang==="pt"?"Exportar documento":"Export Document"}</span>
              <button onClick={()=>setDocGenModal(null)} style={{ background:"none", border:"none", color:T.muted, fontSize:20, cursor:"pointer" }}>×</button>
            </div>

            {/* Document Type Selection */}
            <div style={{ marginBottom:16 }}>
              <div style={{ fontSize:10, color:T.muted, marginBottom:8, fontFamily:T.mono, letterSpacing:"0.5px", textTransform:"uppercase" }}>{lang==="de"?"Dokumenttyp":lang==="pt"?"Tipo de documento":"Document Type"}</div>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:8 }}>
                {[
                  { type:"pdf", icon:"📕", name:"PDF", desc:lang==="de"?"Zum Teilen":"For sharing" },
                  { type:"docx", icon:"📘", name:"DOCX", desc:lang==="de"?"Bearbeitbar":"Editable" },
                  { type:"pptx", icon:"📙", name:"PPTX", desc:lang==="de"?"Präsentation":"Presentation" },
                  { type:"xlsx", icon:"📗", name:"XLSX", desc:lang==="de"?"Tabelle":"Spreadsheet" }
                ].map(d => (
                  <button key={d.type} onClick={()=>{setExportType(d.type);setDocGenModal({format:d.type})}}
                    style={{
                      display:"flex", flexDirection:"column", alignItems:"center", gap:4, padding:"12px 8px", borderRadius:8,
                      border:`2px solid ${(docGenModal?.format || exportType) === d.type ? T.gold : T.border}`,
                      background:(docGenModal?.format || exportType) === d.type ? T.gold+"15" : T.bg,
                      cursor:"pointer", transition:"all 0.2s"
                    }}>
                    <span style={{ fontSize:20 }}>{d.icon}</span>
                    <span style={{ fontSize:12, fontWeight:600, color:(docGenModal?.format || exportType) === d.type ? T.gold : T.text }}>{d.name}</span>
                    <span style={{ fontSize:9, color:T.muted }}>{d.desc}</span>
                  </button>
                ))}
              </div>
            </div>

            {/* Content Source Selection */}
            <div style={{ marginBottom:16 }}>
              <div style={{ fontSize:10, color:T.muted, marginBottom:8, fontFamily:T.mono, letterSpacing:"0.5px", textTransform:"uppercase" }}>{lang==="de"?"Inhalt":lang==="pt"?"Conteúdo":"Content"}</div>
              <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                {[
                  { id:"chat", label:lang==="de"?"Kompletter Chat exportieren":lang==="pt"?"Exportar chat completo":"Full chat conversation", icon:"💬", disabled:msgs.length < 2 },
                  { id:"sge", label:lang==="de"?"Letzte SGE-Analyse":lang==="pt"?"Última análise SGE":"Last SGE analysis report", icon:"🛡️", disabled:!msgs.some(m=>m.result?.sge) },
                  { id:"custom", label:lang==="de"?"Eigener Inhalt":lang==="pt"?"Conteúdo personalizado":"Custom content", icon:"✏️", disabled:false }
                ].map(opt => (
                  <label key={opt.id} style={{
                    display:"flex", alignItems:"center", gap:10, padding:"8px 12px", borderRadius:8,
                    background:exportSource === opt.id ? T.gold+"10" : "transparent",
                    border:`1px solid ${exportSource === opt.id ? T.gold+"40" : "transparent"}`,
                    cursor:opt.disabled ? "not-allowed" : "pointer", opacity:opt.disabled ? 0.4 : 1
                  }}>
                    <input type="radio" name="exportSource" value={opt.id} checked={exportSource === opt.id}
                      onChange={()=>!opt.disabled && setExportSource(opt.id)} disabled={opt.disabled}
                      style={{ accentColor:T.gold }} />
                    <span style={{ fontSize:14 }}>{opt.icon}</span>
                    <span style={{ fontSize:13, color:T.text }}>{opt.label}</span>
                  </label>
                ))}
              </div>
            </div>

            {/* Custom Content Input (only if custom selected) */}
            {exportSource === 'custom' && (
              <div style={{ marginBottom:16 }}>
                <input value={docGenTitle} onChange={e=>setDocGenTitle(e.target.value)} placeholder={lang==="de"?"Titel":lang==="pt"?"Título":"Title"}
                  style={{ width:"100%", padding:"10px 14px", borderRadius:8, border:`1px solid ${T.border}`, background:T.input, color:T.text, fontSize:14, marginBottom:8, outline:"none" }} />
                <textarea value={docGenContent} onChange={e=>setDocGenContent(e.target.value)} placeholder={lang==="de"?"Inhalt beschreiben...":lang==="pt"?"Descrever conteúdo...":"Describe content..."}
                  rows={4} style={{ width:"100%", padding:"10px 14px", borderRadius:8, border:`1px solid ${T.border}`, background:T.input, color:T.text, fontSize:13, resize:"none", outline:"none", lineHeight:1.5 }} />
              </div>
            )}

            {/* Governance Options */}
            <div style={{ marginBottom:20, padding:12, borderRadius:8, background:T.bg, border:`1px solid ${T.border}` }}>
              <div style={{ fontSize:10, color:T.gold, marginBottom:10, fontFamily:T.mono, letterSpacing:"0.5px", textTransform:"uppercase" }}>🛡️ {lang==="de"?"Governance-Optionen":lang==="pt"?"Opções de governança":"Governance Options"}</div>
              <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                {[
                  { id:"sge", label:lang==="de"?"SGE-Analyse einbeziehen":lang==="pt"?"Incluir análise SGE":"Include SGE analysis", checked:exportIncludeSGE, set:setExportIncludeSGE },
                  { id:"meta", label:lang==="de"?"Metadaten (Hash, Timestamp)":lang==="pt"?"Metadados (Hash, Timestamp)":"Metadata (hash, timestamp)", checked:exportIncludeMeta, set:setExportIncludeMeta },
                  { id:"seal", label:lang==="de"?"WINDI Seal Badge":lang==="pt"?"Selo WINDI":"WINDI Seal badge", checked:exportIncludeSeal, set:setExportIncludeSeal }
                ].map(opt => (
                  <label key={opt.id} style={{ display:"flex", alignItems:"center", gap:10, cursor:"pointer" }}>
                    <input type="checkbox" checked={opt.checked} onChange={e=>opt.set(e.target.checked)} style={{ accentColor:T.gold, width:16, height:16 }} />
                    <span style={{ fontSize:12, color:T.text }}>{opt.label}</span>
                  </label>
                ))}
              </div>
            </div>

            {/* Footer Actions */}
            <div style={{ display:"flex", gap:8, justifyContent:"flex-end" }}>
              <button onClick={()=>setDocGenModal(null)} style={{ padding:"10px 18px", borderRadius:8, border:`1px solid ${T.border}`, background:"transparent", color:T.muted, cursor:"pointer", fontSize:13 }}>
                {lang==="de"?"Abbrechen":lang==="pt"?"Cancelar":"Cancel"}
              </button>
              <button onClick={handleDocGenerate} disabled={docGenLoading || (exportSource === 'custom' && (!docGenTitle.trim() || !docGenContent.trim()))}
                style={{ padding:"10px 20px", borderRadius:8, border:"none", background:T.gold, color:themeName==="KLAR"?"#FFF":T.bg, cursor:"pointer", fontWeight:600, fontSize:13, opacity:(docGenLoading || (exportSource === 'custom' && (!docGenTitle.trim() || !docGenContent.trim()))) ? 0.5 : 1, display:"flex", alignItems:"center", gap:6 }}>
                {docGenLoading ? <span style={{ animation:"pulse 1s infinite" }}>⏳</span> : "📄"}
                {lang==="de"?"Generieren & Herunterladen":lang==="pt"?"Gerar & Baixar":"Generate & Download"}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Jornaline Composer Modal — Sprint J1 */}
      {jornalineOpen && (
        <JornalineComposer
          data={jornalineData}
          onChange={setJornalineData}
          onClose={() => setJornalineOpen(false)}
          onSubmit={handleJornalineSubmit}
          T={T}
          lang={lang}
          loading={jornalineLoading}
        />
      )}

      {/* 93: Compliance View Modal */}
      {showComplianceModal && (
        <ComplianceViewModal
          lastMeta={lastRouteMeta}
          tenant={tenant}
          circuitStatus={window.WINDI_CircuitBreaker?.status() || { mode: 'ONLINE', failures: 0 }}
          T={T}
          lang={lang}
          onClose={() => setShowComplianceModal(false)}
        />
      )}

      {/* 77: Chat Search Modal */}
      {showSearchModal && (
        <ChatSearchModal
          messages={msgs}
          T={T}
          lang={lang}
          onClose={() => setShowSearchModal(false)}
          onJump={(m) => { setShowSearchModal(false); /* TODO: scroll to message */ }}
        />
      )}

      {/* 90: Human Decision Gate (R5) */}
      {humanGateRequired && (
        <HumanDecisionGate
          T={T}
          lang={lang}
          onConfirm={() => { humanGateRequired.onConfirm?.(); setHumanGateRequired(null); }}
          onCancel={() => setHumanGateRequired(null)}
        />
      )}

      </div>{/* End Main Content Area */}

      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
        @keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.6}}
        @keyframes bounce{0%,80%,100%{transform:scale(0.6);opacity:0.4}40%{transform:scale(1);opacity:1}}
        @keyframes voicePulse{0%,100%{transform:scale(1);box-shadow:0 0 0 0 currentColor}50%{transform:scale(1.1);box-shadow:0 0 8px 2px currentColor}}
        @keyframes breatheIn{from{opacity:0;transform:translateY(-6px) scale(0.97)}to{opacity:1;transform:translateY(0) scale(1)}}
        @keyframes softPulse{0%,100%{opacity:1}50%{opacity:0.5}}
        @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
        @keyframes dragonPulse{0%,100%{transform:scale(1);opacity:0.8;filter:drop-shadow(0 0 0 transparent)}50%{transform:scale(1.08);opacity:1;filter:drop-shadow(0 0 8px var(--windi-gold,#D4A843))}}
        @keyframes dragonHandover{0%{transform:scale(0.9);opacity:0}50%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
        :root{--windi-gold:#D4A843;--windi-ink:#16161F;--dragon-guardian:#FF6B6B;--dragon-architect:#FFD93D;--dragon-witness:#6BCB77;--dragon-vox:#4D96FF}
        *{box-sizing:border-box;margin:0;padding:0}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:${T.border};border-radius:2px}
        textarea::placeholder{color:${T.muted}}
        button:hover{filter:brightness(1.05)}
        .dragon-breathe{animation:breathe 4s ease-in-out infinite}
        .dragon-step{transition:all 0.3s ease}
        .dragon-step.active{animation:dragonPulse 2s ease-in-out infinite}
        .dragon-handover{animation:dragonHandover 0.4s cubic-bezier(0.34,1.56,0.64,1)}
      `}</style>

      {/* Wallet Banner — Personal tier, 5 min trigger */}
      <WalletBanner
        show={showWalletBanner}
        onClose={() => setShowWalletBanner(false)}
        onWalletCreated={(data) => {
          setWalletId(data.wallet_id);
          setShowWalletBanner(false);
        }}
        T={T}
        lang={lang}
      />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(WINDIAgentSuite));
</script>

<script>
(function() {
  'use strict';
  // ═══════════════════════════════════════════════════════════════════
  // DRAGON BRAIN CONNECTOR v1.0.0
  // Injected by agent_dragon_server.py
  // Overrides local chatRespond with LLM-powered dragon routing
  // ═══════════════════════════════════════════════════════════════════

  const DRAGON_API = 'api/dragon';
  const DRAGON_EMOJIS = { guardian: '🛡️', architect: '🏗️', witness: '👁️' };
  const DRAGON_NAMES = { guardian: 'Guardian', architect: 'Architect', witness: 'Witness' };

  // Store original functions
  const _originalChatRespond = window.chatRespond || null;

  // ── Dragon Chat API Call ──────────────────────────────────────────
  async function dragonChat(message, opts = {}) {
    try {
      const resp = await fetch(DRAGON_API + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message,
          tier: opts.tier || 'HIGH',
          chatType: opts.chatType || null,
          intentMode: opts.intentMode || 'chat',
          language: opts.language || 'de',
          history: opts.history || [],
        }),
      });
      if (!resp.ok) throw new Error('API ' + resp.status);
      return await resp.json();
    } catch (err) {
      console.error('[DragonBrain] Chat error:', err);
      return null;
    }
  }

  // ── Dragon Generate API Call ──────────────────────────────────────
  async function dragonGenerate(message, opts = {}) {
    try {
      const resp = await fetch(DRAGON_API + '/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message,
          tier: opts.tier || 'HIGH',
          intent: opts.intent || {},
          templateId: opts.templateId || null,
          language: opts.language || 'de',
        }),
      });
      if (!resp.ok) throw new Error('API ' + resp.status);
      return await resp.json();
    } catch (err) {
      console.error('[DragonBrain] Generate error:', err);
      return null;
    }
  }

  // ── Health Check ──────────────────────────────────────────────────
  async function dragonHealth() {
    try {
      const resp = await fetch(DRAGON_API + '/health');
      return await resp.json();
    } catch (err) {
      return { status: 'unreachable', error: err.message };
    }
  }

  // ── Expose to global scope for React ─────────────────────────────
  window.DragonBrain = {
    chat: dragonChat,
    generate: dragonGenerate,
    health: dragonHealth,
    emojis: DRAGON_EMOJIS,
    names: DRAGON_NAMES,
    version: '1.0.0',
    ready: true,
  };

  // ── Override the send function via MutationObserver ───────────────
  // We need to hook into React's send mechanism. The cleanest way
  // is to override the agentThink function to be async-aware.
  // We patch it via a global hook that the React component checks.

  window.__dragonBrainHook = async function(userInput, tier, intentHistory, stats, setMsgs, setLang, setIntentHistory, setStats) {
    // Run the original classification (synchronous)
    const classification = classifyInput(userInput, intentHistory);
    const detectedLang = detectLang(userInput) || 'de';

    if (classification.mode === 'chat') {
      // ── ASYNC: Call Dragon API for chat ──
      const chatHistory = [];
      // Build message history from DOM (simplified)
      document.querySelectorAll('[data-msg-role]').forEach(el => {
        chatHistory.push({ role: el.dataset.msgRole, text: el.dataset.msgText || el.textContent });
      });

      const dragon = await dragonChat(userInput, {
        tier,
        chatType: classification.chatType,
        intentMode: 'chat',
        language: detectedLang,
        history: chatHistory.slice(-10),
      });

      if (dragon && dragon.message) {
        const emoji = DRAGON_EMOJIS[dragon.dragon] || '🐉';
        const name = DRAGON_NAMES[dragon.dragon] || 'Agent';
        return {
          type: 'chat',
          chatType: classification.chatType,
          message: dragon.message,
          dragon: dragon.dragon,
          dragonEmoji: emoji,
          dragonName: name,
          source: dragon.source,
          intent: { language: detectedLang, doc_type: null, confidence: 0 },
          sge: null, receipt: null, template: null, alternatives: null,
          constitutional: { active: true, invariants: 9, layers: 8 },
          metadata: dragon.metadata || {},
          ms: 0,
        };
      }
      // Fallback to local if API fails
    }

    if (classification.mode === 'document') {
      // Run local intent parsing first
      const intent = parseIntent(userInput, intentHistory);
      const tierCfg = TIERS[tier];

      // Try LLM generation for document content
      if (tierCfg.llm) {
        const { template } = resolveTemplate(intent);
        const dragon = await dragonGenerate(userInput, {
          tier,
          intent,
          templateId: template?.id,
          language: detectedLang,
        });

        if (dragon && dragon.message) {
          // Run SGE on the response (tries Backend first)
          const sge = await runSGE(dragon.message, tier, intent, template?.id);
          const validation = validateInvariants(dragon.message);
          const format = resolveFormat(intent, tierCfg);
          let receipt = null;
          if (tierCfg.ledger) receipt = genReceipt(intent, template?.id, sge, tier, validation);

          return {
            type: validation.hasFatal ? 'blocked_constitutional' : 'success',
            intent, sge, receipt, template,
            alternatives: resolveTemplate(intent).alternatives,
            format,
            method: 'hybrid',
            message: dragon.message,
            dragon: 'architect',
            dragonEmoji: '🏗️',
            dragonName: 'Architect',
            source: dragon.source,
            needsConfirm: sge.humanRequired && !sge.blocked,
            constitutional: { validation, invariants: 9, layers: 8 },
            metadata: dragon.metadata || {},
            ms: 0,
          };
        }
      }
    }

    // ── FALLBACK: Use original local agentThink ──
    return await agentThink(userInput, tier, intentHistory, stats);
  };

  // Signal that brain is loaded
  console.log('[DragonBrain] 🐉 Three Dragons Protocol ACTIVE — v1.0.0');
  console.log('[DragonBrain] Guardian 🛡️ | Architect 🏗️ | Witness 👁️');

  // Check health on load
  dragonHealth().then(h => {
    console.log('[DragonBrain] Health:', h.status, h.api_key_configured ? '✓ API Key' : '✗ No API Key');
    window.DragonBrain.health_status = h;
  });

  // ═══════════════════════════════════════════════════════════════════
  // ORCHESTRATOR EVENT LISTENERS — Phase 5D Handover Visualization
  // ═══════════════════════════════════════════════════════════════════

  window.addEventListener('dragonHandover', (e) => {
    const { id, dragon, previous, timestamp } = e.detail;

    // Update global status indicators if they exist
    const statusLabel = document.getElementById('current-dragon-label');
    const statusIcon = document.getElementById('current-dragon-icon');
    if (statusLabel) statusLabel.innerText = dragon.label;
    if (statusIcon) statusIcon.innerText = dragon.icon;

    // Activate the current step, deactivate others
    document.querySelectorAll('.dragon-step').forEach(el => {
      el.classList.remove('active');
      el.classList.remove('dragon-handover');
    });
    const activeStep = document.getElementById(`step-${id}`);
    if (activeStep) {
      activeStep.classList.add('active');
      activeStep.classList.add('dragon-handover');
    }

    // Console pulse (for dev visibility)
    console.log(`%c[Handover] ${dragon.icon} ${dragon.label}`,
      `color: var(--dragon-${id}, #D4A843); font-weight: bold; font-size: 14px;`);
  });

  window.addEventListener('dragonFlowComplete', (e) => {
    const { metrics, status } = e.detail;
    const total = Math.round(metrics.totalDuration);
    const steps = Object.entries(metrics.steps || {})
      .map(([k, v]) => `${k}:${Math.round(v.duration || 0)}ms`)
      .join(' → ');

    console.log(`%c[Flow Complete] ${status} in ${total}ms | ${steps}`,
      'color: #6BCB77; font-weight: bold;');

    // Clear active states after flow
    setTimeout(() => {
      document.querySelectorAll('.dragon-step').forEach(el => {
        el.classList.remove('active');
      });
    }, 1000);
  });

  console.log('[DragonBrain] Orchestrator listeners attached');
})();
</script>

</body>
