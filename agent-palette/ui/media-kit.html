                <div style={{ fontSize:13, fontWeight:700, color: selectedPott===pott.id ? th.gold : th.text }}>
                  {t(pott.name)}
                </div>
                {selectedPott===pott.id && (
                  <div style={{ marginTop:10, fontSize:11, color:th.dim, lineHeight:1.5,
                    animation:"slideIn 0.3s ease" }}>
                    {t(pott.desc)}
                  </div>
                )}
              </div>
            ))}
          </div>

              <div style={{ fontSize:11 }}>
                <span style={{ color:th.success }}>🫕</span> {lang==="de"?"Koordiniert Ersteller, verstärkt Reichweite":lang==="pt"?"Coordena criadores, amplifica alcance":"Coordinates creators, amplifies reach"}
              </div>
            </div>

          <span>💰</span> {lang==="de"?"Drei-Schichten-Umsatz":lang==="pt"?"Receita Três Camadas":"Three-Layer Revenue"}

        <div style={{ display:"flex", flexDirection:"column", gap:12 }}>
          {REVENUE.map(layer => (
            <div key={layer.layer} style={{ display:"flex", gap:16, padding:16, borderRadius:12,

                border:"2px solid "+layer.color, display:"flex", alignItems:"center", justifyContent:"center",
                fontSize:16, fontWeight:800, color:layer.color, flexShrink:0 }}>{layer.layer}</div>
              <div style={{ flex:"1 1 200px" }}>
                <div style={{ fontSize:14, fontWeight:700, color:th.text }}>{layer.name}</div>
                <div style={{ fontSize:10, color:th.dim }}>{layer.sub}</div>
                <div style={{ marginTop:6, display:"flex", gap:6, flexWrap:"wrap" }}>
                  {layer.items.map((item, i) => (
                    <span key={i} style={{ fontSize:9, padding:"2px 6px", borderRadius:4,
                      background:th.hover, border:"1px solid "+th.border, color:th.dim }}>{item}</span>
                  ))}
                </div>
              </div>
              <div style={{ fontSize:18, fontWeight:800, color:layer.color, flexShrink:0 }}>{layer.amount}</div>
            </div>
          ))}
        </div>

        {/* Summary */}
        <div style={{ marginTop:20, padding:20, borderRadius:12, background:th.sealed+"F0",
          border:"1.5px solid "+th.forensic, color:"#E8F5E9" }}>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(120px, 1fr))", gap:16, textAlign:"center" }}>
            <div>
              <div style={{ fontSize:10, color:"#A5D6A7" }}>Total Revenue</div>
              <div style={{ fontSize:20, fontWeight:800 }}>€368,700</div>
            </div>
            <div>
              <div style={{ fontSize:10, color:"#A5D6A7" }}>Costs (~25%)</div>

            </div>
            <div>
              <div style={{ fontSize:10, color:"#A5D6A7" }}>Net Profit</div>
              <div style={{ fontSize:20, fontWeight:800, color:"#81C784" }}>€276,525</div>
            </div>
            <div>
              <div style={{ fontSize:10, color:"#A5D6A7" }}>Global Margin</div>
              <div style={{ fontSize:20, fontWeight:800, color:"#D4A843" }}>75%</div>
            </div>
          </div>
          <div style={{ marginTop:12, fontSize:10, color:"#A5D6A7", textAlign:"center", fontStyle:"italic" }}>
            80/20 local processing. Distribution uses creator's channels at zero cost.
          </div>
        </div>
      </section>

      {/* ═══ FOUR PILLARS ═══ */}
      <section style={{ padding:"40px 24px", background:th.card, borderTop:"1px solid "+th.border,
        borderBottom:"1px solid "+th.border }}>
        <div style={{ maxWidth:900, margin:"0 auto" }}>
          <h2 style={{ fontSize:20, fontWeight:800, color:th.gold, marginBottom:20, display:"flex", alignItems:"center", gap:8 }}>
            <span>🏛️</span> {lang==="de"?"Die vier Säulen":lang==="pt"?"Os Quatro Pilares":"The Four Pillars"}
          </h2>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(200px, 1fr))", gap:12 }}>
            {PILLARS.map(pillar => (
              <div key={pillar.id} style={{ padding:20, borderRadius:12, background:th.hover,
                border:"1px solid "+th.border, textAlign:"center" }}>
                <div style={{ width:40, height:40, borderRadius:10, background:th.gold+"15",
                  border:"1.5px solid "+th.gold+"33", display:"flex", alignItems:"center", justifyContent:"center",
                  fontSize:18, margin:"0 auto 12px" }}>{pillar.icon}</div>
                <div style={{ fontSize:13, fontWeight:700, color:th.gold, marginBottom:6 }}>
                  Pillar {pillar.id}: {t(pillar.name)}
                </div>
                <div style={{ fontSize:11, color:th.dim, lineHeight:1.5 }}>{t(pillar.desc)}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* ═══ CLOSING ═══ */}
      <section style={{ padding:"60px 24px", textAlign:"center" }}>
        <div style={{ fontSize:32, marginBottom:16 }}>🐉</div>
        <h2 style={{ fontSize:24, fontWeight:800, color:th.gold, marginBottom:16 }}>
          {lang==="de"?"Souveräne Mediendistribution":lang==="pt"?"Distribuição de Media Soberana":"Sovereign Media Distribution"}
        </h2>
        <p style={{ fontSize:14, color:th.dim, maxWidth:500, margin:"0 auto 24px", lineHeight:1.6, fontStyle:"italic" }}>
          {lang==="de"?"Follower sind kein Publikum. Direkte Kontakte sind Publikum. Plattformen vermitteln. Kontakte verbinden.":
           lang==="pt"?"Seguidores não são audiência. Contactos directos são audiência. Plataformas intermediam. Contactos conectam.":
           "Followers are not audience. Direct contacts are audience. Platforms intermediate. Contacts connect."}
        </p>
        <div style={{ display:"flex", gap:8, justifyContent:"center", flexWrap:"wrap" }}>
          {["Direct Audience Protocol","Portable Video Publishing","Offline-First Streaming","Creator Sovereignty"].map(tag => (
            <span key={tag} style={{ padding:"6px 12px", borderRadius:6, background:th.gold+"15",
              border:"1px solid "+th.gold+"33", fontSize:10, color:th.gold, fontWeight:600 }}>{tag}</span>
          ))}
        </div>
      </section>

      {/* ═══ FOOTER ═══ */}
      <footer style={{ padding:"20px 24px", borderTop:"1px solid "+th.border, background:th.card,
        textAlign:"center" }}>
        <div style={{ fontSize:12, fontWeight:700, color:th.gold, marginBottom:4 }}>WINDI Publishing House</div>
        <div style={{ fontSize:10, color:th.dim }}>AI processes. Human decides. WINDI guarantees.</div>
        <div style={{ fontSize:9, color:th.dim, marginTop:8 }}>Kempten, Bavaria, European Union — February 2026</div>
        <div style={{ marginTop:12, display:"flex", gap:12, justifyContent:"center" }}>
          <a href="/palette/" style={{ fontSize:10, color:th.gold, textDecoration:"none" }}>← Palette</a>
          <a href="/palette/protocol.html" style={{ fontSize:10, color:th.gold, textDecoration:"none" }}>Protocol Spec →</a>
        </div>
