<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200" role="img" aria-label="WINDI Witness">
  <title>Witness</title>
  <!-- Eyelid shape -->
  <path d="M8 50 Q50 6 92 50 Q50 94 8 50 Z"
        fill="#E1F5EE" stroke="#0F6E56" stroke-width="2" stroke-linejoin="round"/>
  <!-- Outer iris ring -->
  <circle cx="50" cy="50" r="20" fill="none" stroke="#0F6E56" stroke-width="1.8"/>
  <!-- Inner iris ring -->
  <circle cx="50" cy="50" r="13" fill="none" stroke="#0F6E56" stroke-width="1" opacity="0.4"/>
  <!-- Pupil -->
  <circle cx="50" cy="50" r="8" fill="#0F6E56"/>
  <!-- Light reflection -->
  <circle cx="55" cy="45" r="2.8" fill="#E1F5EE"/>
  <!-- Corner accents -->
  <line x1="8"  y1="50" x2="1"  y2="50" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
  <line x1="92" y1="50" x2="99" y2="50" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
</svg>
