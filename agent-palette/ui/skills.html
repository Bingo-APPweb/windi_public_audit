<!DOCTYPE html>

<body>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SKILLS = [

      { id: "002", name: "VIP Founder Override", icon: "🐉", category: "CORE", desc: "Acesso total para Jober sem barreira de tier", status: "ACTIVE", commits: ["4e29fb8"], files: ["agent-palette/agent_dragon_server.py"] },

      { id: "004", name: "Trilingual Detection", icon: "🌐", category: "LANG", desc: "Marcadores PT/DE/EN — detecção automática", status: "ACTIVE", commits: ["4a1f64e"], files: ["agent-palette/sovereign_router.py"] },
      { id: "005", name: "Document Tone Guidelines", icon: "🎯", category: "PROD", desc: "10 tipos documentais com tom e voz específicos", status: "ACTIVE", commits: ["79ff2a0"], files: ["agent-palette/agent_dragon_server.py"] },

      { id: "007", name: "Pioneer Onboarding", icon: "🚀", category: "UX", desc: "Guia 5-etapas trilíngue para os 100 Pioneers", status: "ACTIVE", commits: ["5e4adab"], files: ["agent-palette/ui/index.html"] },
      { id: "008", name: "Grove Private Editor", icon: "🌿", category: "PROD", desc: "Rascunhos locais com persistência privada", status: "ACTIVE", commits: ["5e4adab"], files: ["agent-palette/ui/index.html"] },
      { id: "009", name: "WICK Network Interface", icon: "🔗", category: "SOCIAL", desc: "Visualização de evidências na rede WICK", status: "ACTIVE", commits: ["5e4adab"], files: ["agent-palette/ui/index.html"] },

    ];

    const CATEGORY_COLORS = {
      CORE: "#D4A843",
      PROD: "#7B9E87",
      LANG: "#6B8CAE",
      VISUAL: "#A87BAE",
      UX: "#AE8A6B",
      SOCIAL: "#AE6B7B",
      INFRA: "#7B9EAE"
    };

    const CATEGORY_LABELS = {
      CORE: "Core Systems",
      PROD: "Production",
      LANG: "Language",
      VISUAL: "Visual",
      UX: "User Experience",
      SOCIAL: "Social",
      INFRA: "Infrastructure"
    };

    function SkillsConstellation() {
      const [theme, setTheme] = useState(() => {
        if (typeof localStorage !== 'undefined') {
          return localStorage.getItem('windi_theme') || 'KLAR';
        }
        return 'KLAR';
      });
      const [selected, setSelected] = useState(null);
      const [filter, setFilter] = useState("ALL");
      const [ledgerStatus, setLedgerStatus] = useState({ ok: false, receipts: 0 });
      const isDark = theme === "NOIR";

      useEffect(() => {
        if (typeof localStorage !== 'undefined') {
          localStorage.setItem('windi_theme', theme);
        }
      }, [theme]);

      useEffect(() => {
        // Check ledger health
        fetch('http://localhost:8101/health')
          .then(r => r.json())
          .then(d => setLedgerStatus({ ok: d.status === 'healthy', receipts: d.receipts || 0 }))
          .catch(() => setLedgerStatus({ ok: false, receipts: 49210 }));
      }, []);

      const t = isDark ? {
        bg: "#0E0E14", card: "#16161F", border: "#26263A",
        text: "#E2E2EA", dim: "#7A7A96", gold: "#D4A843",
        hover: "#1C1C28", input: "#12121A"
      } : {

        text: "#2C2924", dim: "#6B6560", gold: "#8B6914",
        hover: "#EDE8D8", input: "#FDFBF5"
      };

      const categories = ["ALL", ...new Set(SKILLS.map(s => s.category))];
      const filtered = filter === "ALL" ? SKILLS : SKILLS.filter(s => s.category === filter);

      return (
        <div style={{
          background: t.bg,
          minHeight: "100vh",
          fontFamily: "'JetBrains Mono', monospace",
          padding: "24px",
          color: t.text,
          transition: "all 0.3s"
        }}>
          {/* Header */}
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "28px" }}>
            <div>
              <div style={{ fontSize: "10px", color: t.gold, letterSpacing: "3px", marginBottom: "4px" }}>WINDI PUBLISHING HOUSE</div>
              <h1 style={{ fontSize: "22px", fontWeight: 700, margin: 0, color: t.text }}>Skills Constellation</h1>
              <div style={{ fontSize: "11px", color: t.dim, marginTop: "4px" }}>
                Liga IA+H · {SKILLS.length} skills · Ledger-sealed
              </div>
            </div>
            <div style={{ display: "flex", gap: "8px", alignItems: "center" }}>
              <span style={{
                fontSize: "10px",
                color: ledgerStatus.ok ? "#4CAF50" : t.gold,
                border: `1px solid ${ledgerStatus.ok ? "#4CAF50" : t.gold}`,
                padding: "2px 8px",
                borderRadius: "2px"
              }}>
                {ledgerStatus.ok ? "● LEDGER LIVE" : "✓ Sealed"}
              </span>
              <button
                onClick={() => setTheme(isDark ? "KLAR" : "NOIR")}
                style={{
                  background: t.card,
                  border: `1px solid ${t.border}`,
                  color: t.dim,
                  padding: "4px 12px",
                  borderRadius: "4px",
                  cursor: "pointer",
                  fontSize: "11px",
                  fontFamily: "inherit"
                }}>
                {isDark ? "☀ KLAR" : "◑ NOIR"}
              </button>
            </div>
          </div>

          {/* Founders */}
          <div style={{
            background: t.card,
            border: `1px solid ${t.border}`,
            borderRadius: "6px",
            padding: "16px",
            marginBottom: "20px",
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
            flexWrap: "wrap",
            gap: "12px"
          }}>
            <div style={{ display: "flex", gap: "20px", alignItems: "center" }}>
              <div style={{ textAlign: "center" }}>
                <div style={{ fontSize: "24px" }}>👤</div>
                <div style={{ fontSize: "10px", color: t.gold, marginTop: "4px" }}>HUMAN DRAGON</div>
                <div style={{ fontSize: "11px", color: t.text }}>Jober Mögele Correa</div>
              </div>
              <div style={{ width: "1px", height: "40px", background: t.border }}></div>
              <div style={{ display: "flex", gap: "16px" }}>
                <div style={{ textAlign: "center" }}>
                  <div style={{ fontSize: "20px" }}>🛡️</div>
                  <div style={{ fontSize: "9px", color: t.dim }}>Guardian</div>
                </div>
                <div style={{ textAlign: "center" }}>
                  <div style={{ fontSize: "20px" }}>🏗️</div>
                  <div style={{ fontSize: "9px", color: t.dim }}>Architect</div>
                </div>
                <div style={{ textAlign: "center" }}>
                  <div style={{ fontSize: "20px" }}>👁️</div>
                  <div style={{ fontSize: "9px", color: t.dim }}>Witness</div>
                </div>
              </div>
            </div>
            <div style={{ fontSize: "11px", color: t.dim, fontStyle: "italic" }}>
              "Quem planta a semente, colhe todos os frutos."
            </div>
          </div>

          {/* Filter tabs */}
          <div style={{ display: "flex", gap: "6px", marginBottom: "20px", flexWrap: "wrap" }}>
            {categories.map(cat => (
              <button
                key={cat}
                onClick={() => setFilter(cat)}
                style={{
                  background: filter === cat ? (cat === "ALL" ? t.gold : CATEGORY_COLORS[cat]) : t.card,
                  color: filter === cat ? (isDark ? "#0E0E14" : "#fff") : t.dim,
                  border: `1px solid ${filter === cat ? (cat === "ALL" ? t.gold : CATEGORY_COLORS[cat]) : t.border}`,
                  padding: "3px 10px",
                  borderRadius: "2px",
                  cursor: "pointer",
                  fontSize: "10px",
                  letterSpacing: "1px",
                  fontFamily: "inherit",
                  transition: "all 0.2s"

                {cat}
              </button>
            ))}
          </div>

          {/* Grid */}
          <div style={{
            display: "grid",
            gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))",
            gap: "12px",
            marginBottom: "20px"

            {filtered.map(skill => (
              <div
                key={skill.id}
                onClick={() => setSelected(selected === skill.id ? null : skill.id)}

                  background: selected === skill.id ? t.hover : t.card,
                  border: `1px solid ${selected === skill.id ? t.gold : t.border}`,
                  borderRadius: "6px",
                  padding: "16px",
                  cursor: "pointer",
                  transition: "all 0.2s",
                  borderLeft: `3px solid ${CATEGORY_COLORS[skill.category] || t.gold}`

                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: "8px" }}>

                {selected === skill.id && (

                    fontSize: "9px",

                    letterSpacing: "1px",
                    background: isDark ? "#1C1C28" : "#F5F0E0",
                    padding: "2px 6px",
                    borderRadius: "2px"
                  }}>
                    {skill.category}
                  </span>
                  <span style={{ fontSize: "9px", color: "#4CAF50" }}>● {skill.status}</span>
                </div>
              </div>
            ))}
          </div>

          {/* Add new skill button */}
          <div
            style={{
              border: `1px dashed ${t.border}`,
              borderRadius: "6px",
              padding: "20px",
              textAlign: "center",
              cursor: "pointer",
              color: t.dim,
              fontSize: "12px",
              letterSpacing: "1px",
              transition: "all 0.2s"
            }}
            onMouseEnter={e => {
              e.currentTarget.style.borderColor = t.gold;
              e.currentTarget.style.color = t.text;
            }}
            onMouseLeave={e => {
              e.currentTarget.style.borderColor = t.border;
              e.currentTarget.style.color = t.dim;
            }}>
            + SKILL-0{SKILLS.length + 1} · Adicionar nova capability
          </div>

          {/* Footer */}
          <div style={{
            marginTop: "24px",
            paddingTop: "16px",
            borderTop: `1px solid ${t.border}`,
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
            flexWrap: "wrap",
            gap: "12px",
            fontSize: "9px",
            color: t.dim,
            letterSpacing: "1px"
          }}>
            <span>VR-LIGA-20260308-9267ce65 · {ledgerStatus.receipts.toLocaleString()}+ receipts</span>
            <span>AI processes. Human decides. WINDI guarantees.</span>
          </div>
        </div>
      );
    }

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SkillsConstellation />);
  </script>
</body>
</html>
