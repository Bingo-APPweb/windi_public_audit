// WINDI COGNITIVE INSIGHT CARDS — Design System Component

// ═══════════════════════════════════════════════════════════════════════════════════

// ─── TRANSLATIONS ───────────────────────────────────────────────────────────────

// ═══════════════════════════════════════════════════════════════════════════════════
// COGNITIVE INSIGHT CARD COMPONENT
// ═══════════════════════════════════════════════════════════════════════════════════

function CognitiveInsightCard({ insight, lang = 'en', onAction, onExplain, compact = false }) {
  const [isHovered, setIsHovered] = useState(false);
  const [showExplain, setShowExplain] = useState(false);

  const t = TRANSLATIONS[lang] || TRANSLATIONS.en;
  const style = IMPACT_STYLES[insight.impact] || IMPACT_STYLES.medium;

  // Parse text for formatting (bold, etc.)
  const formatText = (text) => {
    if (!text) return '';
    return text.split('\n').map((line, i) => {
      // Bold text between **
      const parts = line.split(/\*\*(.*?)\*\*/g);
      return (
        <div key={i} style={{ marginBottom: line === '' ? 8 : 2 }}>
          {parts.map((part, j) =>
            j % 2 === 1
              ? <strong key={j} style={{ color: style.accent, fontWeight: 700 }}>{part}</strong>
              : <span key={j}>{part}</span>
          )}
        </div>
      );
    });
  };

  return (
    <div
      onMouseEnter={() => setIsHovered(true)}
      onMouseLeave={() => setIsHovered(false)}
      style={{
        background: style.gradient,
        border: `1px solid ${isHovered ? style.accent : style.border}`,
        borderRadius: 16,
        padding: compact ? '14px 16px' : '20px 24px',
        marginBottom: 12,
        boxShadow: isHovered ? style.glow : 'none',
        transition: 'all 0.3s ease',
        cursor: 'default',
      }}
    >
      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12, marginBottom: compact ? 10 : 14 }}>
        {/* Icon */}
        <div style={{
          width: compact ? 36 : 44,
          height: compact ? 36 : 44,
          borderRadius: 12,
          background: `${style.accent}15`,
          border: `1px solid ${style.accent}33`,
          display: 'flex',
          alignItems: 'center',
          justifyContent: 'center',
          fontSize: compact ? 18 : 22,
          flexShrink: 0,
        }}>
          {insight.type === 'momentum_score' && '📈'}
          {insight.type === 'daily_delta' && '🔔'}
          {insight.type === 'audience_core' && '🧠'}
          {insight.type === 'channel_dominance' && '📡'}
          {insight.type === 'optimal_timing' && '⏰'}
          {insight.type === 'viral_amplifiers' && '🚀'}
          {insight.type === 'frequency_warning' && '⚠️'}
          {!['momentum_score', 'daily_delta', 'audience_core', 'channel_dominance', 'optimal_timing', 'viral_amplifiers', 'frequency_warning'].includes(insight.type) && '💡'}
        </div>

        {/* Title & Badge */}
        <div style={{ flex: 1 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}>
            <span style={{
              fontSize: 9,
              fontFamily: THEME.mono,
              fontWeight: 600,
              padding: '2px 8px',
              borderRadius: 4,
              background: style.badge.bg,
              color: style.badge.color,
              letterSpacing: '0.5px',
            }}>
              {style.badge.label}
            </span>
            <span style={{
              fontSize: 9,
              fontFamily: THEME.mono,
              color: THEME.dim,
            }}>
              {insight.type.replace(/_/g, ' ').toUpperCase()}
            </span>
          </div>
          {/* Confidence */}
          {insight.confidence && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <div style={{
                flex: 1,
                height: 3,
                background: '#1a1a1a',
                borderRadius: 2,
                overflow: 'hidden',
                maxWidth: 80,
              }}>
                <div style={{
                  width: `${insight.confidence * 100}%`,
                  height: '100%',
                  background: style.accent,
                  borderRadius: 2,
                }} />
              </div>
              <span style={{ fontSize: 9, color: THEME.dim, fontFamily: THEME.mono }}>
                {Math.round(insight.confidence * 100)}%
              </span>
            </div>
          )}
        </div>
      </div>

      {/* Content */}
      <div style={{
        fontSize: compact ? 12 : 13,
        lineHeight: 1.7,
        color: THEME.text,
        marginBottom: insight.action ? 16 : 0,
      }}>
        {formatText(insight.text)}
      </div>

      {/* Actions */}
      {insight.action && (
        <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
          <button
            onClick={() => onAction?.(insight)}
            style={{
              padding: '8px 16px',
              borderRadius: 8,
              background: style.accent,
              border: 'none',
              color: '#000',
              fontSize: 11,
              fontWeight: 700,
              cursor: 'pointer',
              display: 'flex',
              alignItems: 'center',
              gap: 6,
            }}
          >
            {insight.action === 'invite_core_to_did' && '👥'}
            {insight.action === 'view_momentum_details' && '📊'}
            {insight.action === 'schedule_optimal' && '📅'}
            {insight.action === 'prioritize_channel' && '📡'}
            {t.action}
          </button>
          <button
            onClick={() => setShowExplain(!showExplain)}
            style={{
              padding: '8px 12px',
              borderRadius: 8,
              background: 'transparent',
              border: `1px solid ${THEME.border}`,
              color: THEME.dim,
              fontSize: 11,
              cursor: 'pointer',
            }}
          >
            🧠 {t.why}
          </button>
        </div>
      )}

      {/* Explainability */}
      {showExplain && (
        <div style={{
          marginTop: 12,
          padding: '12px 14px',
          background: '#0a0a0a',
          borderRadius: 8,
          border: `1px solid ${THEME.border}`,
          fontSize: 11,
          color: THEME.dim,
          lineHeight: 1.6,
        }}>
          <div style={{ fontWeight: 600, color: THEME.text, marginBottom: 6 }}>
            🧠 {lang === 'de' ? 'Warum diese Einsicht?' : lang === 'pt' ? 'Porquê este insight?' : 'Why this insight?'}
          </div>
          <div>📊 {lang === 'de' ? 'Datenquellen' : lang === 'pt' ? 'Fontes de dados' : 'Data sources'}: Ledger, Metrics, Engagement</div>
          <div>🎯 {lang === 'de' ? 'Konfidenz' : lang === 'pt' ? 'Confiança' : 'Confidence'}: {Math.round((insight.confidence || 0.8) * 100)}%</div>
          <div>📈 {lang === 'de' ? 'Erwarteter Einfluss' : lang === 'pt' ? 'Impacto esperado' : 'Expected impact'}: {insight.impact}</div>
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════════════════════════
// COGNITIVE INSIGHTS PANEL — Container for all cards
// ═══════════════════════════════════════════════════════════════════════════════════

function CognitiveInsightsPanel({ lang = 'en', compact = false }) {
  const [insights, setInsights] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const t = TRANSLATIONS[lang] || TRANSLATIONS.en;

  // Fetch insights from Dragon Chat CIL
  const fetchInsights = useCallback(async () => {
    setLoading(true);
    try {
      // Try to fetch from Dragon Chat service via 8108
      const insightsUrl = window.location.hostname === 'localhost'
        ? 'http://localhost:8108/api/dragon'
        : '/api/dragon';
      const res = await fetch(`${insightsUrl}/cognition/insights?lang=${lang}`);
      if (res.ok) {
        const data = await res.json();
        setInsights(data.insights || []);
      } else {
        // Fallback: demo insights
        setInsights(DEMO_INSIGHTS[lang] || DEMO_INSIGHTS.en);
      }
    } catch (e) {
      // Fallback: demo insights
      setInsights(DEMO_INSIGHTS[lang] || DEMO_INSIGHTS.en);
    }
    setLoading(false);
  }, [lang]);

  useEffect(() => {
    fetchInsights();
  }, [fetchInsights]);

  const handleAction = (insight) => {
    console.log('Action triggered:', insight.action, insight);
    // In production: call API or navigate
    alert(`Action: ${insight.action}`);
  };

  return (
    <div style={{
      background: THEME.bg,
      borderRadius: 20,
      padding: compact ? 16 : 24,
      border: `1px solid ${THEME.border}`,
    }}>
      {/* Header */}
      <div style={{
        display: 'flex',
        alignItems: 'center',
        justifyContent: 'space-between',
        marginBottom: compact ? 16 : 20,
        paddingBottom: compact ? 12 : 16,
        borderBottom: `1px solid ${THEME.border}`,
      }}>
        <div>
          <div style={{
            fontSize: compact ? 16 : 20,
            fontWeight: 800,
            color: THEME.gold,
            display: 'flex',
            alignItems: 'center',
            gap: 10,
          }}>
            <span style={{ fontSize: compact ? 20 : 26 }}>🧠</span>
            {t.title}
          </div>
          <div style={{ fontSize: 11, color: THEME.dim, marginTop: 4 }}>
            {t.subtitle}
          </div>
        </div>
        <button
          onClick={fetchInsights}
          disabled={loading}
          style={{
            padding: '6px 12px',
            borderRadius: 8,
            background: THEME.card,
            border: `1px solid ${THEME.border}`,
            color: THEME.dim,
            fontSize: 11,
            cursor: 'pointer',
            display: 'flex',
            alignItems: 'center',
            gap: 6,
          }}
        >
          {loading ? '⏳' : '🔄'} {t.refresh}
        </button>
      </div>

      {/* Insights */}
      {error && (
        <div style={{ padding: 16, color: THEME.danger, fontSize: 12 }}>
          {error}
        </div>
      )}

      {!error && insights.map((insight, i) => (
        <CognitiveInsightCard
          key={`${insight.type}-${i}`}
          insight={insight}
          lang={lang}
          compact={compact}
          onAction={handleAction}
        />
      ))}

      {/* Footer */}
      <div style={{
        marginTop: 16,
        padding: '12px 16px',
        background: '#0d0d0d',
        borderRadius: 10,
        textAlign: 'center',
        fontStyle: 'italic',
        fontSize: 12,
        color: THEME.dim,
        lineHeight: 1.6,
      }}>
        {lang === 'de' && 'Du brauchst nicht mehr Follower.\nDu musst die erkennen, die deine Welt bereits verändern.'}
        {lang === 'en' && "You don't need more followers.\nYou need to recognize the ones already changing your world."}
        {lang === 'pt' && 'Não precisas de mais seguidores.\nPrecisas de reconhecer os que já mudam o teu mundo.'}
      </div>
    </div>
  );
}

function DemoApp() {

  const [compact, setCompact] = useState(false);

  return (
    <div style={{ maxWidth: 600, margin: '0 auto' }}>

      <div style={{
        display: 'flex',
