# ═══════════════════════════════════════════════════════════════════
# W-FERR-001 — COMPLETE Health Endpoint Proxies
# ═══════════════════════════════════════════════════════════════════
#
# PROBLEMA: Grove Arena faz polling de 11 serviços, mas nginx só tem 5 rotas
# SOLUÇÃO: Adicionar as 6 rotas em falta
#
# INSTALAÇÃO:
#   sudo nano /etc/nginx/sites-enabled/windi-domain.com
#   (adicionar após as rotas /ledger/health, /export/health, etc. existentes)
#   sudo nginx -t && sudo systemctl reload nginx
#
# ═══════════════════════════════════════════════════════════════════

    # ─── ROTAS EM FALTA (6) ───

    location = /bridge/health {
        proxy_pass http://127.0.0.1:8097/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /sentinel-law/health {
        proxy_pass http://127.0.0.1:8102/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /schnittstelle/health {
        proxy_pass http://127.0.0.1:8095/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /cortex/health {
        proxy_pass http://127.0.0.1:8889/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /id-genesis/health {
        proxy_pass http://127.0.0.1:8096/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    location = /sentinel/health {
        proxy_pass http://127.0.0.1:8098/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ─── FIM ROTAS HEALTH ───
