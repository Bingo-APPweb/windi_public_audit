# ═══════════════════════════════════════════════════════════════════
# W-FERR-001 — Health Endpoint Proxies
# ═══════════════════════════════════════════════════════════════════
# Adicionar DENTRO do server block HTTPS de windi-domain.com
# (após linha ~596, perto dos outros location blocks)
#
# INSTALAÇÃO:
#   sudo cp /etc/nginx/sites-enabled/windi-domain.com /tmp/windi-domain.com.bak
#   sudo nano /etc/nginx/sites-enabled/windi-domain.com
#   (colar este bloco após "location ^~ /api/dragon/")
#   sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════════════

      # ─── WINDI SERVICE HEALTH ENDPOINTS ───
      # Ferreiro + Connectors system health checks

      location = /ledger/health {
          proxy_pass http://127.0.0.1:8101/health;
          proxy_connect_timeout 5s;
          proxy_read_timeout 5s;
          add_header X-Ferreiro-Probe "ledger" always;
      }

      location = /export/health {
          proxy_pass http://127.0.0.1:8103/health;
