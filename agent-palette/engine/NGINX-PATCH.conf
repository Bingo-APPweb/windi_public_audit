# ══════════════════════════════════════════════════════════════
# DragonEngine v2.0 — NGINX Location Blocks
#
# ADD THIS to /etc/nginx/sites-enabled/windi-domain.com
# BEFORE the line: "# ── HUB static assets ────────────────────"
#
# Then: sudo nginx -t && sudo systemctl reload nginx
# ══════════════════════════════════════════════════════════════

    # ── DragonEngine v2.0 (modular engine) ────────────────────
    location ^~ /engine/ {
        alias /opt/windi/agent-palette/engine/;
        expires 1h;
        add_header Cache-Control "public";
        add_header X-WINDI-Module "DragonEngine-v2.0" always;
    }

    # ── WINDI Assets (logos, icons) ────────────────────────────
    location ^~ /assets/ {
        alias /opt/windi/assets/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
