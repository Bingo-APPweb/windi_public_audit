    # ══════════════════════════════════════════════════════════════════════
    # Pioneer Pages — HTML estático (substitui proxy :8120)
    # Patch I9-aprovado: Human Dragon — 2026-03-15
    # ══════════════════════════════════════════════════════════════════════
    
    # Pioneer One-Pager trilíngue
    location /pioneer/ {
        alias /opt/windi/pioneer/;
        index index.html;
        try_files $uri $uri/ /opt/windi/pioneer/index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # Certificado Demo Florianópolis
    location /pioneer/florianopolis/ {
        alias /opt/windi/pioneer/florianopolis/;
        index index.html;
        try_files $uri $uri/ /opt/windi/pioneer/florianopolis/index.html;
        add_header Cache-Control "public, max-age=3600";
    }
