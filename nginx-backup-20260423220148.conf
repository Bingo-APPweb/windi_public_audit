# ─────────────────────────────────────────────────────────────
# HTTP → HTTPS (with ACME challenge for Certbot)
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name windi-domain.com www.windi-domain.com;

    # Let's Encrypt challenge
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    return 301 https://windi-domain.com$request_uri;
}

# ─────────────────────────────────────────────────────────────
# HTTPS — ONE TREE (main server block)
# ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name windi-domain.com www.windi-domain.com;

    # ── TLS (Certbot managed) ────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/windi-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/windi-domain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-WINDI-Tree "one-tree-v2.2" always;

    # ── Compression (immediate gain, zero risk) ──────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_vary on;

    # ── Logging (centralized) ────────────────────────────────
    access_log /var/log/nginx/windi_unified_access.log;
    error_log  /var/log/nginx/windi_unified_error.log warn;

    # ── Upload limit (for A4 Desk documents) ─────────────────
    client_max_body_size 100m;

    # ── Shared proxy headers ─────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── Default timeouts ─────────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # ══════════════════════════════════════════════════════════
    # HEALTH — Gateway heartbeat
    # ══════════════════════════════════════════════════════════

    location = /health {
        default_type application/json;
        return 200 '{"service":"windi-gateway","version":"2.2","domain":"windi-domain.com","architecture":"one-tree","status":"operational"}';
    }

    # HUB Constellation API (:8091)
    location = /agents/status {
        proxy_pass http://127.0.0.1:8091/agents/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin "*" always;
    }

