</div>);}

function BFeatures({b}){const{content:c,style:s}=b;return(<div style={{background:s.bg,padding:'80px 40px',color:s.textColor}}>
{c.title&&<h2 style={{textAlign:'center',fontSize:36,fontWeight:800,margin:'0 0 56px',fontFamily:"'Playfair Display',Georgia,serif"}}>{c.title}</h2>}
<div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:24,maxWidth:960,margin:'0 auto'}}>
{(c.items||[]).map((item,i)=>(<div key={i} style={{background:s.cardBg,borderRadius:16,padding:32,border:`1px solid ${s.accentColor}22`}}><div style={{fontSize:36,marginBottom:16}}>{item.icon}</div><h3 style={{fontSize:20,fontWeight:700,margin:'0 0 12px'}}>{item.title}</h3><p style={{color:s.textColor+'CC',lineHeight:1.6,margin:0,fontSize:15}}>{item.text}</p></div>))}
</div></div>);}

function BTextblock({b}){const{content:c,style:s}=b;return(<div style={{background:s.bg,padding:'80px 40px',color:s.textColor}}>
<div style={{maxWidth:s.maxWidth||680,margin:'0 auto',textAlign:s.align}}>
{c.label&&<span style={{color:s.accentColor,fontWeight:700,fontSize:12,letterSpacing:3,textTransform:'uppercase',display:'block',marginBottom:16}}>{c.label}</span>}
{c.title&&<h2 style={{fontSize:40,fontWeight:800,lineHeight:1.15,margin:'0 0 24px',fontFamily:"'Playfair Display',Georgia,serif"}}>{c.title.split('\n').map((l,i,a)=><span key={i}>{l}{i<a.length-1&&<br/>}</span>)}</h2>}
{c.body&&<p style={{fontSize:17,lineHeight:1.8,opacity:.8,margin:0}}>{c.body}</p>}
</div></div>);}

function BImagebox({b}){const{content:c,style:s}=b;const has=c.url&&c.url.length>0;return(<div style={{background:s.bg,padding:'60px 40px'}}>

function BGallery({b}){const{content:c,style:s}=b;return(<div style={{background:s.bg,padding:'80px 40px'}}>

function BCta({b}){const{content:c,style:s}=b;return(<div style={{background:s.bg,padding:'80px 40px',textAlign:s.align,color:s.textColor}}>

{c.btnSecText&&<a href="#" style={{border:'2px solid rgba(255,255,255,.4)',color:s.textColor,padding:'14px 36px',borderRadius:100,fontWeight:600,fontSize:15,textDecoration:'none'}}>{c.btnSecText}</a>}
</div></div>);}

function BTestimonial({b}){const{content:c,style:s}=b;return(<div style={{background:s.bg,padding:'80px 40px',textAlign:s.align,color:s.textColor}}>
<div style={{maxWidth:680,margin:'0 auto'}}>
<div style={{fontSize:64,color:s.accentColor,lineHeight:1,marginBottom:16,fontFamily:'Georgia,serif'}}>❝</div>

function BStats({b}){const{content:c,style:s}=b;return(<div style={{background:s.bg,padding:'80px 40px',color:s.textColor,textAlign:'center'}}>
{c.title&&<h2 style={{fontSize:36,fontWeight:800,margin:'0 0 56px',fontFamily:"'Playfair Display',Georgia,serif"}}>{c.title}</h2>}
<div style={{display:'flex',justifyContent:'center',gap:64,flexWrap:'wrap'}}>
{(c.items||[]).map((item,i)=>(<div key={i}><div style={{fontSize:52,fontWeight:900,color:s.accentColor,lineHeight:1}}>{item.value}</div><div style={{opacity:.6,fontSize:14,marginTop:8,letterSpacing:1,textTransform:'uppercase'}}>{item.label}</div></div>))}
</div></div>);}

function BDivider({b}){const{style:s}=b;return(<div style={{background:s.bg,lineHeight:0}}><svg viewBox="0 0 1200 60" preserveAspectRatio="none" style={{display:'block',width:'100%',height:s.height||60}}><path d="M0,0 C300,60 900,60 1200,0 L1200,60 L0,60 Z" fill={s.color}/></svg></div>);}

function BFooter({b}){const{content:c,style:s}=b;return(<div style={{background:s.bg,color:s.textColor,padding:'60px 40px 32px'}}>
<div style={{maxWidth:960,margin:'0 auto'}}>
<div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:48,flexWrap:'wrap',gap:32}}>
<div><div style={{fontSize:24,fontWeight:900,color:s.accentColor,marginBottom:8}}>{c.brand}</div>{c.tagline&&<div style={{opacity:.6,maxWidth:260,lineHeight:1.6,fontSize:14}}>{c.tagline}</div>}</div>
<div style={{display:'flex',gap:32,flexWrap:'wrap'}}>{(c.links||[]).map((l,i)=><a key={i} href="#" style={{color:s.textColor,opacity:.7,textDecoration:'none',fontSize:14}}>{l}</a>)}</div>
</div>
<div style={{borderTop:`1px solid ${s.textColor}22`,paddingTop:24,opacity:.4,fontSize:13}}>{c.copy}</div>
</div></div>);}

function BlockRenderer({block}){
  switch(block.type){
    case 'hero': return <BHero b={block}/>;case 'features': return <BFeatures b={block}/>;
    case 'textblock': return <BTextblock b={block}/>;case 'imagebox': return <BImagebox b={block}/>;
    case 'gallery': return <BGallery b={block}/>;case 'cta': return <BCta b={block}/>;
    case 'testimonial': return <BTestimonial b={block}/>;case 'stats': return <BStats b={block}/>;
    case 'divider': return <BDivider b={block}/>;case 'footer': return <BFooter b={block}/>;
    default: return <div style={{padding:32,background:'#eee',textAlign:'center'}}>{block.type}</div>;
  }
}

const IS=(x={})=>({width:'100%',background:T.card,border:`1px solid ${T.border}`,borderRadius:8,padding:'7px 12px',color:T.text,fontSize:13,fontFamily:'inherit',boxSizing:'border-box',...x});
function CP({label,val,set}){return(<div style={{marginBottom:12}}><div style={{fontSize:10,color:T.dim,letterSpacing:1,textTransform:'uppercase',marginBottom:5}}>{label}</div><div style={{display:'flex',gap:6,alignItems:'center'}}><input type="color" value={val} onChange={e=>set(e.target.value)} style={{width:30,height:30,border:'none',borderRadius:6,cursor:'pointer',background:'transparent',padding:2}}/><input type="text" value={val} onChange={e=>set(e.target.value)} style={{...IS(),flex:1,fontFamily:'monospace',fontSize:11}}/></div></div>);}
function TP({label,val,set,ml}){const s={...IS(),...(ml?{resize:'vertical',minHeight:68}:{})};return(<div style={{marginBottom:12}}><div style={{fontSize:10,color:T.dim,letterSpacing:1,textTransform:'uppercase',marginBottom:5}}>{label}</div>{ml?<textarea value={val} onChange={e=>set(e.target.value)} style={s}/>:<input type="text" value={val} onChange={e=>set(e.target.value)} style={s}/>}</div>);}

// PROPERTIES PANEL
// ═══════════════════════════════════════════════════════════════════
function PropsPanel({block,onChange}){
  const lang=useLang();
  const CATALOG=getCatalog(lang);
  if(!block)return(<div style={{padding:24,textAlign:'center',color:T.dim}}><div style={{fontSize:32,marginBottom:10}}>◫</div><div style={{fontSize:13}}>{t(DICT,'propEmpty',lang)}</div></div>);
  const us=(k,v)=>onChange({...block,style:{...block.style,[k]:v}});
  const uc=(k,v)=>onChange({...block,content:{...block.content,[k]:v}});
  const{content:c,style:s}=block;
  const cat=CATALOG.find(x=>x.type===block.type);
  const SH=(label)=><div style={{fontSize:10,fontWeight:700,color:T.dim,letterSpacing:2,textTransform:'uppercase',margin:'14px 0 8px',paddingBottom:5,borderBottom:`1px solid ${T.border}`}}>{label}</div>;
  return(<div style={{padding:14,overflowY:'auto',height:'100%'}}>
    <div style={{fontSize:11,fontWeight:700,letterSpacing:2,textTransform:'uppercase',color:T.accent,marginBottom:16,display:'flex',alignItems:'center',gap:6}}><span>{cat?.icon}</span>{cat?.label}</div>
    {SH(t(DICT,'propStyle',lang))}
    <CP label={t(DICT,'propBg',lang)} val={s.bg||'#fff'} set={v=>us('bg',v)}/>
    {s.bg2!==undefined&&<CP label={t(DICT,'propBg2',lang)} val={s.bg2} set={v=>us('bg2',v)}/>}
    {s.textColor!==undefined&&<CP label={t(DICT,'propTextColor',lang)} val={s.textColor} set={v=>us('textColor',v)}/>}
    <CP label={t(DICT,'propAccent',lang)} val={s.accentColor||'#7c4dff'} set={v=>us('accentColor',v)}/>
    {s.cardBg!==undefined&&<CP label={t(DICT,'propCard',lang)} val={s.cardBg} set={v=>us('cardBg',v)}/>}
    {s.align!==undefined&&<SP label={t(DICT,'propAlign',lang)} val={s.align} set={v=>us('align',v)} opts={[{v:'left',l:t(DICT,'alignLeft',lang)},{v:'center',l:t(DICT,'alignCenter',lang)},{v:'right',l:t(DICT,'alignRight',lang)}]}/>}
    {SH(t(DICT,'propContent',lang))}
    {block.type==='hero'&&<><TP label={t(DICT,'badge',lang)} val={c.badge||''} set={v=>uc('badge',v)}/><TP label={t(DICT,'headline',lang)} val={c.headline||''} set={v=>uc('headline',v)} ml/><TP label={t(DICT,'subtitle',lang)} val={c.subtitle||''} set={v=>uc('subtitle',v)} ml/><TP label={t(DICT,'btnLabel',lang)} val={c.btnText||''} set={v=>uc('btnText',v)}/><TP label={t(DICT,'btnUrl',lang)} val={c.btnUrl||'#'} set={v=>uc('btnUrl',v)}/></>}
    {block.type==='textblock'&&<><TP label={t(DICT,'labelProp',lang)} val={c.label||''} set={v=>uc('label',v)}/><TP label={t(DICT,'titleProp',lang)} val={c.title||''} set={v=>uc('title',v)} ml/><TP label={t(DICT,'bodyProp',lang)} val={c.body||''} set={v=>uc('body',v)} ml/></>}
    {block.type==='cta'&&<><TP label={t(DICT,'headlineProp',lang)} val={c.headline||''} set={v=>uc('headline',v)} ml/><TP label={t(DICT,'subProp',lang)} val={c.sub||''} set={v=>uc('sub',v)}/><TP label={t(DICT,'btnLabel',lang)} val={c.btnText||''} set={v=>uc('btnText',v)}/><TP label={t(DICT,'btnUrl',lang)} val={c.btnUrl||'#'} set={v=>uc('btnUrl',v)}/><TP label={t(DICT,'btnLabel2',lang)} val={c.btnSecText||''} set={v=>uc('btnSecText',v)}/></>}
    {block.type==='testimonial'&&<><TP label={t(DICT,'quoteProp',lang)} val={c.quote||''} set={v=>uc('quote',v)} ml/><TP label={t(DICT,'authorProp',lang)} val={c.author||''} set={v=>uc('author',v)}/><TP label={t(DICT,'roleProp',lang)} val={c.role||''} set={v=>uc('role',v)}/><TP label={t(DICT,'initialsProp',lang)} val={c.avatar||''} set={v=>uc('avatar',v)}/></>}
    {block.type==='footer'&&<><TP label={t(DICT,'brandProp',lang)} val={c.brand||''} set={v=>uc('brand',v)}/><TP label={t(DICT,'taglineProp',lang)} val={c.tagline||''} set={v=>uc('tagline',v)}/><TP label={t(DICT,'copyrightProp',lang)} val={c.copy||''} set={v=>uc('copy',v)}/></>}
    {block.type==='imagebox'&&<ImageUpload block={block} onUpdate={onChange}/>}
    {['gallery','features','stats'].includes(block.type)&&<div style={{background:T.surface,borderRadius:8,padding:11,border:`1px solid ${T.border}`,fontSize:11,color:T.dim}}>{t(DICT,'multiItemNote',lang)}</div>}
  </div>);
}

// ═══════════════════════════════════════════════════════════════════
// HTML EXPORT GENERATOR
// ═══════════════════════════════════════════════════════════════════
function genHTML(blocks,meta){
  const rows=blocks.map(b=>{const{style:s,content:c}=b;switch(b.type){
    case 'hero':return `<section style="background:linear-gradient(135deg,${s.bg} 0%,${s.bg2||s.bg} 100%);color:${s.textColor};min-height:${s.minHeight}px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:${s.align};padding:80px 40px">${c.badge?`<span style="background:${s.accentColor}33;border:1px solid ${s.accentColor}66;color:${s.accentColor};border-radius:100px;padding:4px 16px;font-size:12px;font-weight:600">${c.badge}</span>`:''}<h1 style="font-size:clamp(36px,6vw,72px);font-weight:900;line-height:1.1;margin:24px 0;font-family:'Playfair Display',Georgia,serif">${(c.headline||'').replace(/\n/g,'<br>')}</h1>${c.subtitle?`<p style="font-size:18px;opacity:.8;max-width:560px;margin:0 0 40px">${c.subtitle}</p>`:''}${c.btnText?`<a href="${c.btnUrl}" style="background:${s.accentColor};color:#fff;padding:14px 36px;border-radius:100px;font-weight:700;text-decoration:none">${c.btnText}</a>`:''}</section>`;
    case 'cta':return `<section style="background:${s.bg};padding:80px 40px;text-align:${s.align};color:${s.textColor}"><h2 style="font-size:clamp(28px,4vw,48px);font-weight:900;margin:0 auto 16px;max-width:700px">${c.headline||''}</h2>${c.sub?`<p style="opacity:.85;font-size:18px;margin:0 0 40px">${c.sub}</p>`:''}${c.btnText?`<a href="${c.btnUrl||'#'}" style="background:${s.accentColor};color:#000;padding:14px 36px;border-radius:100px;font-weight:800;text-decoration:none">${c.btnText}</a>`:''}</section>`;
    case 'footer':return `<footer style="background:${s.bg};color:${s.textColor};padding:60px 40px 32px"><div style="max-width:960px;margin:0 auto"><div style="font-size:24px;font-weight:900;color:${s.accentColor};margin-bottom:8px">${c.brand||''}</div>${c.tagline?`<div style="opacity:.6;font-size:14px;margin-bottom:48px">${c.tagline}</div>`:''}<div style="border-top:1px solid rgba(255,255,255,.1);padding-top:24px;opacity:.4;font-size:13px">${c.copy||''}</div></div></footer>`;
    default:return `<section style="background:${s.bg||'#fff'};padding:60px 40px"><!-- ${b.type} --></section>`;
  }}).join('\n');
  return `<!DOCTYPE html>\n<html lang="${meta.lang||'pt'}">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width,initial-scale=1.0">\n  <title>${meta.title||'Minha Página'}</title>\n  <meta name="description" content="${meta.description||''}">\n  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&display=swap" rel="stylesheet">\n  <style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}img{max-width:100%;display:block}</style>\n</head>\n<body>\n${rows}\n</body>\n</html>`;
}

// ═══════════════════════════════════════════════════════════════════
// EXPORT MODAL
// ═══════════════════════════════════════════════════════════════════
function ExportModal({blocks,meta,setMeta,onClose,onSeal}){
  const lang=useLang();
  const[html,setHtml]=useState(()=>genHTML(blocks,{...meta,lang}));
  const[copied,setCopied]=useState(false);
  const copy=()=>{navigator.clipboard.writeText(html);setCopied(true);setTimeout(()=>setCopied(false),2000);};
  const dl=()=>{const b=new Blob([html],{type:'text/html'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=`${(meta.title||'page').replace(/\s+/g,'-').toLowerCase()}.html`;a.click();URL.revokeObjectURL(u);};
  const refresh=(m)=>setHtml(genHTML(blocks,{...m,lang}));
  return(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.87)',zIndex:200,display:'flex',alignItems:'center',justifyContent:'center',padding:24}} onClick={onClose}>
      <div style={{background:T.surface,borderRadius:16,border:`1px solid ${T.border}`,width:'100%',maxWidth:780,maxHeight:'88vh',display:'flex',flexDirection:'column',overflow:'hidden'}} onClick={e=>e.stopPropagation()}>
        <div style={{padding:'15px 22px',borderBottom:`1px solid ${T.border}`,display:'flex',alignItems:'center',gap:8}}>
          <div><div style={{fontSize:15,fontWeight:800}}>⬇ {t(DICT,'exportTitle',lang)}</div><div style={{fontSize:11,color:T.dim}}>{t(DICT,'exportSub',lang)}</div></div>
          <div style={{marginLeft:'auto',display:'flex',gap:7}}>
            <button onClick={onSeal} style={{background:T.accentGreen+'22',border:`1px solid ${T.accentGreen}66`,borderRadius:8,padding:'6px 12px',color:T.accentGreen,fontSize:12,fontWeight:700,cursor:'pointer'}}>{t(DICT,'sealBtn',lang)}</button>
            <button onClick={copy} style={{background:copied?T.accentGreen+'22':T.card,border:`1px solid ${copied?T.accentGreen:T.border}`,borderRadius:8,padding:'6px 12px',color:copied?T.accentGreen:T.text,fontSize:12,fontWeight:600,cursor:'pointer'}}>{copied?t(DICT,'copiedBtn',lang):t(DICT,'copyBtn',lang)}</button>
            <button onClick={dl} style={{background:`linear-gradient(135deg,${T.accent},${T.accentHot})`,border:'none',borderRadius:8,padding:'6px 13px',color:'#fff',fontSize:13,fontWeight:700,cursor:'pointer'}}>⬇ .html</button>
            <button onClick={onClose} style={{background:'transparent',border:`1px solid ${T.border}`,borderRadius:8,padding:'6px 10px',color:T.dim,cursor:'pointer'}}>✕</button>
          </div>
        </div>
        <div style={{padding:'11px 22px',borderBottom:`1px solid ${T.border}`,display:'flex',gap:12}}>
          {[['pageTitle','title'],['seoDesc','description']].map(([dk,mk])=>(
            <div key={mk} style={{flex:1}}>
              <div style={{fontSize:9,color:T.dim,letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>{t(DICT,dk,lang)}</div>
              <input value={meta[mk]} onChange={e=>{const m={...meta,[mk]:e.target.value};setMeta(m);refresh(m);}} style={{width:'100%',background:T.card,border:`1px solid ${T.border}`,borderRadius:7,padding:'6px 10px',color:T.text,fontSize:12,boxSizing:'border-box'}}/>
            </div>))}
        </div>

// LEDGER SEAL MODAL
// ═══════════════════════════════════════════════════════════════════
function LedgerModal({html,meta,onClose}){
  const lang=useLang();
  const[st,setSt]=useState('idle');
  const[receipt,setReceipt]=useState(null);
  const[docName,setDocName]=useState(meta.title||'html-page');
  const[gov,setGov]=useState('LOW');
  const[actor,setActor]=useState('html-builder');

  const seal=async()=>{
    setSt('sealing');
    try{
      const enc=new TextEncoder();
      const buf=await crypto.subtle.digest('SHA-256',enc.encode(html));
      const hash=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
      const id=`WINDI-HTML-${Date.now()}`;
      const payload={id,actor,app:'windi-html-builder',doc_name:docName,doc_type:'doc',governance_level:gov,content_hash:hash,sge_score:0.85,metadata:{page_title:meta.title,builder:'v3.0',lang,html_bytes:html.length}};
      const res=await fetch(`${LEDGER_URL}/api/receipts`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const data=await res.json();
      setReceipt({id,hash,verifyUrl:VERIFY_BASE+id,offline:!res.ok||!data.ok,ledgerResponse:data});
      setSt('sealed');
    }catch(_e){
      const enc=new TextEncoder();
      const buf=await crypto.subtle.digest('SHA-256',enc.encode(html));
      const hash=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
      setReceipt({id:`LOCAL-${Date.now()}`,hash,verifyUrl:'',offline:true});
      setSt('sealed');
    }
  };

  return(<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.88)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center',padding:24}} onClick={onClose}>
    <div style={{background:T.surface,borderRadius:16,border:`1px solid ${T.border}`,width:'100%',maxWidth:540,overflow:'hidden'}} onClick={e=>e.stopPropagation()}>
      <div style={{padding:'17px 22px',borderBottom:`1px solid ${T.border}`,display:'flex',alignItems:'center',gap:10}}>
        <span style={{fontSize:20}}>🔐</span>
        <div><div style={{fontSize:14,fontWeight:800}}>{t(DICT,'ledgerTitle',lang)}</div><div style={{fontSize:11,color:T.dim}}>{t(DICT,'ledgerSub',lang)}</div></div>
        <button onClick={onClose} style={{marginLeft:'auto',background:'transparent',border:'none',color:T.dim,cursor:'pointer',fontSize:18}}>✕</button>
      </div>
      <div style={{padding:22}}>
        {st==='idle'&&(<>
          <div style={{background:T.accentGold+'15',border:`1px solid ${T.accentGold}44`,borderRadius:9,padding:'10px 14px',marginBottom:16,fontSize:12,color:T.accentGold}}>{t(DICT,'ledgerInfo',lang)}</div>
          <TP label={t(DICT,'ledgerDocName',lang)} val={docName} set={setDocName}/>
          <TP label={t(DICT,'ledgerActor',lang)} val={actor} set={setActor}/>
          <SP label={t(DICT,'ledgerGov',lang)} val={gov} set={setGov} opts={[{v:'LOW',l:t(DICT,'govLow',lang)},{v:'MEDIUM',l:t(DICT,'govMed',lang)},{v:'HIGH',l:t(DICT,'govHigh',lang)}]}/>
          <div style={{display:'flex',gap:8,marginTop:10}}>
            <button onClick={seal} style={{flex:1,background:`linear-gradient(135deg,${T.accentGreen},#00a86b)`,border:'none',borderRadius:9,padding:'11px 0',color:'#fff',fontSize:14,fontWeight:700,cursor:'pointer'}}>{t(DICT,'sealNowBtn',lang)}</button>
            <button onClick={onClose} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:9,padding:'11px 16px',color:T.dim,cursor:'pointer',fontSize:13}}>{t(DICT,'cancelBtn',lang)}</button>
          </div>
        </>)}
        {st==='sealing'&&<div style={{textAlign:'center',padding:'28px 0'}}><div style={{fontSize:36,marginBottom:10}}>⏳</div><div style={{color:T.accentTeal,fontSize:13}}>{t(DICT,'sealing',lang)}</div></div>}
        {st==='sealed'&&receipt&&(<div>
          {receipt.offline&&<div style={{background:'#ffaa4420',border:'1px solid #ffaa4466',borderRadius:8,padding:'8px 12px',marginBottom:12,fontSize:11,color:'#ffaa44'}}>{t(DICT,'ledgerOfflineWarn',lang)}</div>}
          <div style={{background:T.accentGreen+'15',border:`1px solid ${T.accentGreen}44`,borderRadius:11,padding:18,marginBottom:16}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:12}}><span style={{fontSize:16}}>✅</span><span style={{fontWeight:800,color:T.accentGreen,fontSize:13}}>{t(DICT,'sealedTitle',lang)}</span></div>
            {[[t(DICT,'sealedReceiptId',lang),receipt.id],[t(DICT,'sealedHash',lang),receipt.hash?.substring(0,32)+'…'],[t(DICT,'sealedDoc',lang),docName],[t(DICT,'sealedGov',lang),gov]].map(([k,v])=>(<div key={k} style={{display:'flex',gap:10,fontSize:11,marginBottom:5}}><span style={{color:T.dim,minWidth:80}}>{k}</span><span style={{fontFamily:'monospace',color:T.text,wordBreak:'break-all'}}>{v}</span></div>))}
          </div>
          {receipt.verifyUrl&&<><div style={{fontSize:10,color:T.dim,marginBottom:5,letterSpacing:1,textTransform:'uppercase'}}>{t(DICT,'sealedVerifyUrl',lang)}</div>
          <div style={{background:T.card,borderRadius:8,padding:'9px 13px',marginBottom:14,fontSize:11,color:T.accent,fontFamily:'monospace',wordBreak:'break-all'}}>{receipt.verifyUrl}</div></>}
          <button onClick={onClose} style={{width:'100%',background:T.card,border:`1px solid ${T.border}`,borderRadius:9,padding:'9px 0',color:T.text,cursor:'pointer',fontWeight:600}}>{t(DICT,'closeBtn',lang)}</button>
        </div>)}
      </div>
    </div>
  </div>);
}

// ═══════════════════════════════════════════════════════════════════
// IMAGE UPLOAD WITH VAULT INTEGRATION
// ═══════════════════════════════════════════════════════════════════
function ImageUpload({block,onUpdate}){
  const lang=useLang();
  const[uploading,setUploading]=useState(false);
  const[msg,setMsg]=useState('');
  const ref=useRef();

  const handleFile=async(file)=>{
    if(!file)return;
    setUploading(true);setMsg(t(DICT,'vaultUploading',lang));
    try{
      const fd=new FormData();
      fd.append('file',file);
      fd.append('actor','html-builder');
      fd.append('app','windi-html-builder');
      fd.append('doc_name',file.name);
      fd.append('doc_type','doc');
      fd.append('governance_level','LOW');
      const res=await fetch(`${VAULT_URL}/api/upload`,{method:'POST',body:fd});
      if(res.ok){
        const d=await res.json();
        const vaultId=d.receipt_id||d.id||'VAULT-'+Date.now();
        const url=d.url||d.file_url||URL.createObjectURL(file);
        onUpdate({...block,content:{...block.content,url,vaultId}});
        setMsg(`${t(DICT,'vaultSuccess',lang)} ${vaultId}`);
      }else{
        const url=URL.createObjectURL(file);
        onUpdate({...block,content:{...block.content,url,vaultId:''}});
        setMsg(t(DICT,'vaultOffline',lang));
      }
    }catch(_e){
      const url=URL.createObjectURL(file);
      onUpdate({...block,content:{...block.content,url,vaultId:''}});
      setMsg(t(DICT,'vaultOffline',lang));
    }
    setUploading(false);
  };

  const c=block.content;const s=block.style;
  return(<div>
    <div style={{marginBottom:12}}>
      <div style={{fontSize:10,color:T.dim,letterSpacing:1,textTransform:'uppercase',marginBottom:6}}>{t(DICT,'vaultUploadTitle',lang)}</div>
      <div onClick={()=>ref.current?.click()} style={{border:`2px dashed ${s.accentColor}55`,borderRadius:10,padding:'16px',textAlign:'center',cursor:'pointer',background:s.accentColor+'08'}}>
        <div style={{fontSize:22,marginBottom:4}}>🖼</div>
        <div style={{fontSize:11,color:T.dim}}>{t(DICT,'vaultClickHint',lang)}</div>
        <div style={{fontSize:9,color:T.dim,marginTop:2}}>PNG · JPG · WebP · GIF</div>
      </div>
      <input ref={ref} type="file" accept="image/*" style={{display:'none'}} onChange={e=>handleFile(e.target.files[0])}/>
      {uploading&&<div style={{marginTop:5,fontSize:11,color:T.accentTeal}}>⏳ {msg}</div>}
      {!uploading&&msg&&<div style={{marginTop:5,fontSize:11,color:msg.includes('✓')?T.accentGreen:'#ffaa44'}}>{msg}</div>}
    </div>
    <div style={{fontSize:10,color:T.dim,marginBottom:5,letterSpacing:1,textTransform:'uppercase'}}>{t(DICT,'orExternalUrl',lang)}</div>
    <TP label={t(DICT,'imgUrl',lang)} val={c.url||''} set={v=>onUpdate({...block,content:{...block.content,url:v}})}/>
    <TP label={t(DICT,'imgAlt',lang)} val={c.alt||''} set={v=>onUpdate({...block,content:{...block.content,alt:v}})}/>
    <TP label={t(DICT,'imgCaption',lang)} val={c.caption||''} set={v=>onUpdate({...block,content:{...block.content,caption:v}})}/>
    {c.vaultId&&<div style={{background:T.accentGreen+'15',border:`1px solid ${T.accentGreen}33`,borderRadius:7,padding:'6px 11px',marginTop:5,fontSize:10,color:T.accentGreen}}>🔐 Vault: {c.vaultId}</div>}
  </div>);
}

  const addBlock=(item)=>{const nb=mkBlock(item);setBlocks(p=>[...p,nb]);setSelId(nb.id);};

  const delBlock=(id)=>{setBlocks(p=>p.filter(b=>b.id!==id));if(selId===id)setSelId(null);};

    const idx=blocks.findIndex(b=>b.id===id);

                <div style={{fontSize:48,marginBottom:16}}>◫</div>
                <div style={{fontSize:16,fontWeight:700,marginBottom:8}}>{t(DICT,'canvasEmpty',lang)}</div>
                <div style={{fontSize:13}}>{t(DICT,'canvasEmptySub',lang)}</div>
              </div>
            )}
            {blocks.map((block,idx)=>(
              <div key={block.id} style={{position:'relative'}} onClick={e=>{e.stopPropagation();if(!preview)setSelId(block.id);}}>
                {!preview&&(
                  <div style={{position:'absolute',inset:0,zIndex:5,pointerEvents:'none',outline:selId===block.id?`2px solid ${T.accent}`:'2px solid transparent',outlineOffset:-2}}>
                    {selId===block.id&&(<>
                      <div style={{position:'absolute',top:8,right:8,display:'flex',gap:3,pointerEvents:'all'}}>
                        {idx>0&&<button onClick={e=>{e.stopPropagation();moveBlock(block.id,'up');}} style={BC}>↑</button>}
                        {idx<blocks.length-1&&<button onClick={e=>{e.stopPropagation();moveBlock(block.id,'down');}} style={BC}>↓</button>}
                        <button onClick={e=>{e.stopPropagation();delBlock(block.id);}} style={{...BC,background:'#ff4444',borderColor:'#ff4444'}}>✕</button>
                      </div>
                      <div style={{position:'absolute',top:8,left:8,background:T.accent,color:'#fff',fontSize:9,fontWeight:700,padding:'3px 9px',borderRadius:4,letterSpacing:1,textTransform:'uppercase',pointerEvents:'none'}}>
                        {CATALOG.find(x=>x.type===block.type)?.label||block.type}
                      </div>
                    </>)}
                    {selId!==block.id&&<div style={{position:'absolute',inset:0,pointerEvents:'all',cursor:'pointer'}} onMouseEnter={e=>e.currentTarget.style.background='rgba(124,77,255,.04)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}/>}
                  </div>
                )}
                <BlockRenderer block={block}/>
              </div>
            ))}
          </div>
        </div>

        {/* RIGHT PANEL: PROPERTIES */}
        {!preview&&(
          <div style={{width:270,background:T.surface,borderLeft:`1px solid ${T.border}`,display:'flex',flexDirection:'column',flexShrink:0,overflow:'hidden'}}>
            <div style={{padding:'11px 14px',borderBottom:`1px solid ${T.border}`,fontSize:9,fontWeight:700,color:T.dim,letterSpacing:2,textTransform:'uppercase'}}>{t(DICT,'propTitle',lang)}</div>
            <div style={{flex:1,overflowY:'auto'}}><PropsPanel block={sel} onChange={updBlock}/></div>
            <div style={{padding:9,borderTop:`1px solid ${T.border}`,background:T.bg}}>
              <div style={{fontSize:8,color:T.dim,marginBottom:5,textAlign:'center',letterSpacing:1,textTransform:'uppercase'}}>{t(DICT,'quickAdd',lang)}</div>
              <div style={{display:'flex',gap:3,flexWrap:'wrap',justifyContent:'center'}}>
                {['hero','imagebox','cta','divider','footer'].map(type=>{const item=CATALOG.find(b=>b.type===type);if(!item)return null;return(<button key={type} onClick={()=>addBlock(item)} style={{background:T.card,border:`1px solid ${T.border}`,borderRadius:5,padding:'3px 7px',color:T.dim,fontSize:9,cursor:'pointer'}}>{item.icon} {item.label}</button>);})}
              </div>
            </div>
          </div>
        )}
      </div>

      {/* MODALS */}
      {showExport&&<ExportModal blocks={blocks} meta={meta} setMeta={setMeta} onClose={()=>setShowExport(false)} onSeal={()=>{setShowExport(false);setShowLedger(true);}}/>}
      {showTpl&&<TemplatesModal onSelect={loadTpl} onClose={()=>setShowTpl(false)}/>}
      {showLedger&&<LedgerModal html={genHTML(blocks,{...meta,lang})} meta={meta} onClose={()=>setShowLedger(false)}/>}

    </div>
    </LangCtx.Provider>
  );
}

// Mount
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
