<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>WINDI HTML Builder v3.3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ══════════════════════════════════════════════════
   WINDI HTML Builder v3.3 — Guardian Edition
   Design System: KLAR + NOIR | Bricolage Grotesque
   ══════════════════════════════════════════════════ */

:root {
  --bg:        #F5F0E0;
  --bg2:       #EDE8D4;
  --bg3:       #E0D9C4;
  --border:    #C8C0A8;
  --text:      #1A1814;
  --text2:     #4A4540;
  --text3:     #7A7268;
  --gold:      #8B6914;
  --gold-lt:   #B8900A;
  --gold-bg:   #F5EDD0;
  --red:       #C0392B;
  --green:     #27AE60;
  --blue:      #2471A3;
  --radius:    6px;
  --radius-lg: 12px;
  --shadow:    0 2px 8px rgba(0,0,0,0.12);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.16);
  --font:      'Bricolage Grotesque', sans-serif;
  --mono:      'JetBrains Mono', monospace;
  --trans:     all 0.18s ease;
}

[data-theme="noir"] {
  --bg:        #0F0E0C;
  --bg2:       #1A1916;
  --bg3:       #252320;
  --border:    #3A3830;
  --text:      #F0ECD8;
  --text2:     #B8B0A0;
  --text3:     #807870;
  --gold:      #D4A820;
  --gold-lt:   #E8C040;
  --gold-bg:   #1F1C10;
  --shadow:    0 2px 8px rgba(0,0,0,0.4);
  --shadow-lg: 0 8px 24px rgba(0,0,0,0.5);
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ─── Layout ─────────────────────────────────── */
.app { display:flex; flex-direction:column; height:100vh; overflow:hidden; }

.topbar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 16px;
  height: 48px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.topbar-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-right: 8px;
}

.topbar-brand .logo {
  width: 28px; height: 28px;
  background: var(--gold);
  border-radius: 4px;
  display: flex; align-items:center; justify-content:center;
  font-size: 14px; font-weight: 700; color: #fff;
  letter-spacing: -0.5px;
}

.topbar-brand .name {
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.5px;
  color: var(--gold);
}

.topbar-brand .version {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text3);
  background: var(--bg3);
  border: 1px solid var(--border);
  padding: 1px 5px;
  border-radius: 3px;
}

.divider { width:1px; height:24px; background:var(--border); }

.back-link { font-size: 12px; color: var(--text2); border: 1px solid var(--border); }
.back-link:hover { color: var(--gold); border-color: var(--gold); }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;
  border-radius: var(--radius);
  font-family: var(--font);
  font-size: 12px;
  font-weight: 500;
  border: 1px solid transparent;
  cursor: pointer;
  transition: var(--trans);
  white-space: nowrap;
  user-select: none;
}

.btn-ghost {
  background: transparent;
  color: var(--text2);
  border-color: transparent;
}
.btn-ghost:hover { background:var(--bg3); color:var(--text); }
.btn-ghost:disabled { opacity:0.4; cursor:not-allowed; }

.btn-outline {
  background: transparent;
  color: var(--text2);
  border-color: var(--border);
}
.btn-outline:hover { background:var(--bg3); color:var(--text); border-color:var(--text3); }

.btn-gold {
  background: var(--gold);
  color: #fff;
  border-color: var(--gold);
}
.btn-gold:hover { background:var(--gold-lt); border-color:var(--gold-lt); }
.btn-gold:disabled { opacity:0.5; cursor:not-allowed; }

.btn-danger {
  background: transparent;
  color: var(--red);
  border-color: transparent;
}
.btn-danger:hover { background: rgba(192,57,43,0.1); }

.topbar-actions { display:flex; align-items:center; gap:4px; }
.topbar-right { margin-left:auto; display:flex; align-items:center; gap:6px; }

/* ─── Status bar ─────────────────────────────── */
.statusbar {
  height: 26px;
  background: var(--bg3);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 16px;
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text3);
  flex-shrink: 0;
}
.statusbar .sep { color: var(--border); }
.status-dot { width:6px;height:6px;border-radius:50%;background:var(--green); display:inline-block; }
.status-dot.warn { background:var(--gold); }
.status-dot.err  { background:var(--red); }

/* ─── Main workspace ─────────────────────────── */
.workspace {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ─── Sidebar ─────────────────────────────────── */
.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.sidebar-header {
  padding: 10px 12px 8px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sidebar-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--text3);
}

.item-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px;
}

.item-list::-webkit-scrollbar { width:4px; }
.item-list::-webkit-scrollbar-track { background:transparent; }
.item-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

.item-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 10px;
  margin-bottom: 4px;
  cursor: pointer;
  transition: var(--trans);
  position: relative;
  user-select: none;
}

.item-card:hover { border-color: var(--gold); box-shadow: var(--shadow); }
.item-card.active {
  border-color: var(--gold);
  background: var(--gold-bg);
  box-shadow: var(--shadow);
}
.item-card.dragging { opacity:0.5; }

.item-card-header {
  display: flex;
  align-items: center;
  gap: 6px;
}

.item-badge {
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 500;
  padding: 1px 5px;
  border-radius: 3px;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text3);
  text-transform: uppercase;
  flex-shrink: 0;
}

.item-badge.type-h1, .item-badge.type-h2, .item-badge.type-h3 { background:#EEF4FF; border-color:#B0C8F0; color:#2471A3; }
.item-badge.type-p  { background:#F0F4EE; border-color:#B0C8A8; color:#27AE60; }
.item-badge.type-ul, .item-badge.type-ol { background:#FDF5E8; border-color:#E0C890; color:#8B6914; }
.item-badge.type-img { background:#F8E8F8; border-color:#D090D0; color:#8B3090; }
.item-badge.type-div { background:#E8F0F8; border-color:#90A8C8; color:#204070; }
.item-badge.type-code { background:#1A1814; border-color:#3A3430; color:#D4A820; }
.item-badge.type-hr { background:var(--bg3); }
.item-badge.type-blockquote { background:#FFF0E8; border-color:#E0B090; color:#804020; }
.item-badge.type-table { background:#E8F8F0; border-color:#90C8A8; color:#206840; }
.item-badge.type-video { background:#FFE8E8; border-color:#E09090; color:#A02020; }
.item-badge.type-iframe { background:#E8E8FF; border-color:#9090D0; color:#4040A0; }

[data-theme="noir"] .item-badge.type-h1,
[data-theme="noir"] .item-badge.type-h2,
[data-theme="noir"] .item-badge.type-h3 { background:#0A1020; border-color:#1A3050; color:#6090D0; }
[data-theme="noir"] .item-badge.type-p  { background:#0A140A; border-color:#1A3018; color:#50A868; }

.item-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item-preview {
  font-size: 11px;
  color: var(--text3);
  margin-top: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item-actions {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  display: none;
  gap: 2px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 2px;
}
.item-card:hover .item-actions { display:flex; }

.item-action-btn {
  width: 22px; height: 22px;
  border-radius: 3px;
  background: transparent;
  border: none;
  cursor: pointer;
  display:flex; align-items:center; justify-content:center;
  font-size: 11px;
  color: var(--text3);
  transition: var(--trans);
}
.item-action-btn:hover { background:var(--bg3); color:var(--text); }
.item-action-btn.del:hover { background:rgba(192,57,43,0.1); color:var(--red); }

/* ─── Add item panel ─────────────────────────── */
.add-panel {
  padding: 8px;
  border-top: 1px solid var(--border);
  background: var(--bg2);
}

.add-panel-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 6px;
  padding: 0 2px;
}

.type-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
}

.type-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 6px 2px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--bg);
  cursor: pointer;
  transition: var(--trans);
  font-family: var(--font);
}
.type-btn:hover { background:var(--gold-bg); border-color:var(--gold); }
.type-btn .icon { font-size: 14px; }
.type-btn .label { font-size: 9px; font-weight:500; color:var(--text3); letter-spacing:0.3px; }
.type-btn:hover .label { color:var(--gold); }

/* ─── Editor pane ────────────────────────────── */
.editor-pane {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.editor-toolbar {
  padding: 6px 12px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg2);
  flex-shrink: 0;
}

.editor-toolbar .path {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text3);
  flex: 1;
}

.editor-area {
  flex: 1;
  overflow-y: auto;
  padding: 24px 32px;
}

.editor-area::-webkit-scrollbar { width:6px; }
.editor-area::-webkit-scrollbar-track { background:transparent; }
.editor-area::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

/* ─── Item Editor (inline form) ──────────────── */
.item-editor {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}

.item-editor-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
}

.item-editor-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
}

.field-group {
  margin-bottom: 14px;
}

.field-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text3);
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 5px;
}

.field-input, .field-textarea, .field-select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 10px;
  font-family: var(--font);
  font-size: 13px;
  color: var(--text);
  transition: var(--trans);
  outline: none;
}

.field-input:focus, .field-textarea:focus, .field-select:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(139,105,20,0.12);
}

.field-textarea {
  resize: vertical;
  min-height: 80px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.6;
}

.field-select {
  cursor: pointer;
}

.field-row { display:flex; gap:10px; }
.field-row .field-group { flex:1; }

/* ─── Color Picker ──────────────────────────── */
.color-picker-row { display:flex; gap:12px; margin-top:8px; }
.color-picker-group { flex:1; }
.color-picker-label { font-size:11px; font-weight:600; color:var(--text3); margin-bottom:6px; display:block; }
.color-swatches { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:6px; }
.color-swatch {
  width:22px; height:22px; border-radius:4px; cursor:pointer; border:2px solid transparent;
  transition: transform 0.1s, border-color 0.1s;
}
.color-swatch:hover { transform:scale(1.15); }
.color-swatch.active { border-color:var(--gold); }
.color-swatch.transparent { background: linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%), linear-gradient(45deg, #ccc 25%, transparent 25%, transparent 75%, #ccc 75%); background-size:8px 8px; background-position:0 0, 4px 4px; }
.color-input-row { display:flex; gap:4px; align-items:center; }
.color-hex-input { flex:1; font-family:var(--mono); font-size:11px; padding:4px 6px; border:1px solid var(--border); border-radius:4px; background:var(--bg); color:var(--text); }
.color-native-picker { width:28px; height:28px; padding:0; border:1px solid var(--border); border-radius:4px; cursor:pointer; }
.color-preview { width:28px; height:28px; border-radius:4px; border:1px solid var(--border); }
.color-clear-btn { font-size:10px; padding:2px 6px; background:var(--bg3); border:1px solid var(--border); border-radius:3px; cursor:pointer; color:var(--text3); }
.color-clear-btn:hover { background:var(--bg2); color:var(--text); }

.item-editor-actions {
  display: flex;
  gap: 8px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
}

/* ─── Empty state ────────────────────────────── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  height: 100%;
  color: var(--text3);
  text-align: center;
  padding: 40px;
}

.empty-icon { font-size: 48px; opacity:0.3; }
.empty-title { font-size: 16px; font-weight: 600; }
.empty-sub { font-size: 13px; max-width: 280px; line-height:1.6; }

/* ─── Preview pane ───────────────────────────── */
.preview-pane {
  width: 380px;
  flex-shrink: 0;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

.preview-header {
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}

.preview-title {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.8px;
  text-transform: uppercase;
  color: var(--text3);
}

.preview-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
}

.preview-area::-webkit-scrollbar { width:4px; }
.preview-area::-webkit-scrollbar-thumb { background:var(--border); border-radius:2px; }

/* ─── Preview HTML rendering ─────────────────── */
.preview-output {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 24px;
  min-height: 200px;
  font-family: Georgia, serif;
  font-size: 14px;
  line-height: 1.7;
  color: #222;
}

.preview-output h1 { font-size:2em; margin-bottom:.5em; font-family:Arial,sans-serif; }
.preview-output h2 { font-size:1.5em; margin-bottom:.4em; font-family:Arial,sans-serif; }
.preview-output h3 { font-size:1.17em; margin-bottom:.3em; font-family:Arial,sans-serif; }
.preview-output p  { margin-bottom:.8em; }
.preview-output ul, .preview-output ol { padding-left:1.5em; margin-bottom:.8em; }
.preview-output li { margin-bottom:.2em; }
.preview-output blockquote { border-left:3px solid #ccc; padding-left:12px; margin:1em 0; color:#555; font-style:italic; }
.preview-output [style*="background-color"] { padding:8px 12px; border-radius:4px; margin-bottom:.8em; }
.preview-output hr { border:none; border-top:1px solid #ddd; margin:1em 0; }
.preview-output code, .preview-output pre { font-family:monospace; background:#f4f4f4; padding:2px 5px; border-radius:3px; font-size:.9em; }
.preview-output pre { padding:12px; overflow-x:auto; white-space:pre-wrap; }
.preview-output img { max-width:100%; border-radius:4px; }
.preview-output table { border-collapse:collapse; width:100%; margin-bottom:.8em; }
.preview-output th, .preview-output td { border:1px solid #ddd; padding:6px 10px; text-align:left; }
.preview-output th { background:#f8f8f8; font-weight:600; }
.preview-output video { max-width:100%; border-radius:4px; margin-bottom:.8em; }
.preview-output iframe { max-width:100%; border-radius:4px; margin-bottom:.8em; }

/* ─── Seal panel ─────────────────────────────── */
.seal-panel {
  padding: 12px;
  border-top: 1px solid var(--border);
  background: var(--bg2);
  flex-shrink: 0;
}

.seal-panel-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 8px;
}

.seal-meta { display:flex; flex-direction:column; gap:5px; margin-bottom:10px; }
.seal-field { display:flex; flex-direction:column; gap:3px; }
.seal-field label { font-size:10px; font-weight:600; color:var(--text3); text-transform:uppercase; letter-spacing:0.4px; }
.seal-field input, .seal-field select {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 5px 8px;
  font-family: var(--font);
  font-size: 12px;
  color: var(--text);
  outline: none;
}
.seal-field input:focus, .seal-field select:focus { border-color:var(--gold); }

/* ─── Receipt display ────────────────────────── */
.receipt-box {
  background: var(--gold-bg);
  border: 1px solid var(--gold);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-top: 8px;
  font-family: var(--mono);
  font-size: 10px;
  color: var(--gold);
  word-break: break-all;
  line-height: 1.6;
}

/* ─── Toast ──────────────────────────────────── */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 9999;
  pointer-events: none;
}

.toast {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  font-size: 12px;
  color: var(--text);
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 8px;
  animation: slideIn 0.2s ease;
  min-width: 240px;
}

.toast.success { border-color:var(--green); }
.toast.error   { border-color:var(--red);   }
.toast.info    { border-color:var(--gold);  }

@keyframes slideIn {
  from { transform:translateX(20px); opacity:0; }
  to   { transform:translateX(0);    opacity:1; }
}

/* ─── Scroll ─────────────────────────────────── */
::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

/* ─── Code output area ───────────────────────── */
.code-output {
  background: #0F0E0C;
  border: 1px solid #3A3830;
  border-radius: var(--radius);
  padding: 12px 14px;
  font-family: var(--mono);
  font-size: 11px;
  color: #D4C8A8;
  overflow-x: auto;
  white-space: pre;
  word-break: break-all;
  white-space: pre-wrap;
  line-height: 1.7;
  max-height: 300px;
  overflow-y: auto;
}

/* ─── Stats chips ────────────────────────────── */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 100px;
  padding: 2px 8px;
  font-size: 11px;
  color: var(--text3);
  font-family: var(--mono);
}

/* ─── Distribution Modal ────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  backdrop-filter: blur(4px);
}

.distribution-modal {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 500px;
  max-width: 90vw;
  max-height: 85vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.dist-modal-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg2);
}

.dist-modal-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  display: flex;
  align-items: center;
  gap: 8px;
}

.dist-modal-body {
  padding: 16px 20px;
  overflow-y: auto;
  flex: 1;
}

.dist-modal-footer {
  padding: 12px 20px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  background: var(--bg2);
}

.channel-status {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}

.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 100px;
  font-size: 11px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--text3);
}

.status-badge.configured { color: var(--green); border-color: var(--green); }
.status-badge.disabled { color: var(--text3); opacity: 0.6; cursor: not-allowed; }
.status-badge .dot { width: 6px; height: 6px; border-radius: 50%; }
.status-badge.configured .dot { background: var(--green); }
.status-badge.disabled .dot { background: var(--text3); }

.recipient-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}

.recipient-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.recipient-row select {
  width: 110px;
  padding: 6px 8px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 12px;
  color: var(--text);
}

.recipient-row input {
  flex: 1;
  padding: 6px 10px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 12px;
  color: var(--text);
}

.recipient-row input:focus, .recipient-row select:focus {
  outline: none;
  border-color: var(--gold);
}

.recipient-row .remove-btn {
  width: 28px;
  height: 28px;
  border-radius: var(--radius);
  border: none;
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  font-size: 14px;
}

.recipient-row .remove-btn:hover {
  background: rgba(192,57,43,0.1);
  color: var(--red);
}

.add-recipient-btn {
  width: 100%;
  padding: 8px;
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  background: transparent;
  color: var(--text3);
  font-size: 12px;
  cursor: pointer;
  transition: var(--trans);
}

.add-recipient-btn:hover {
  border-color: var(--gold);
  color: var(--gold);
}

.dist-section {
  margin-bottom: 16px;
}

.dist-section-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text3);
  margin-bottom: 6px;
}

.dist-section select, .dist-section textarea {
  width: 100%;
  padding: 8px 10px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 12px;
  color: var(--text);
  font-family: var(--font);
}

.dist-section textarea {
  min-height: 80px;
  resize: vertical;
}

.dist-section select:focus, .dist-section textarea:focus {
  outline: none;
  border-color: var(--gold);
}

.dist-receipt-info {
  background: var(--gold-bg);
  border: 1px solid var(--gold);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 16px;
  font-family: var(--mono);
  font-size: 11px;
  color: var(--gold);
}

// Simple CSS syntax validation
function validateCSS(css) {
  if (!css || !css.trim()) return { valid: true, error: null };
  try {
    // Check for balanced braces
    let braceCount = 0;
    for (const char of css) {
      if (char === '{') braceCount++;
      if (char === '}') braceCount--;
      if (braceCount < 0) return { valid: false, error: 'Unmatched }' };
    }
    if (braceCount !== 0) return { valid: false, error: 'Unmatched {' };
    // Check for basic structure (selector { property: value })
    const stripped = css.replace(/\/\*[\s\S]*?\*\//g, '').replace(/@[^{]+\{[^}]*\}/g, '').trim();
    if (stripped && !stripped.match(/[^{}]+\{[^{}]*\}/)) {
      return { valid: false, error: 'Invalid CSS structure' };
    }
    return { valid: true, error: null };
  } catch (e) {
    return { valid: false, error: e.message };
  }
}

// ─── History Reducer (Undo/Redo) ───────────────────────────────
const MAX_HISTORY = 50;

function historyReducer(state, action) {
  const { past, present, future } = state;
  switch (action.type) {
    case 'SET': {
      if (JSON.stringify(present) === JSON.stringify(action.payload)) return state;
      return { past: [...past.slice(-MAX_HISTORY + 1), present], present: action.payload, future: [] };
    }
    case 'UNDO': {
      if (past.length === 0) return state;
      return { past: past.slice(0, -1), present: past[past.length - 1], future: [present, ...future] };
    }
    case 'REDO': {
      if (future.length === 0) return state;
      return { past: [...past, present], present: future[0], future: future.slice(1) };
    }
    case 'RESET': return { past: [], present: action.payload, future: [] };
    default: return state;
  }
}

function useHistory(initial) {
  const [state, dispatch] = useReducer(historyReducer, { past: [], present: initial, future: [] });
  const set   = useCallback(val => dispatch({ type:'SET',   payload: val }), []);
  const undo  = useCallback(()  => dispatch({ type:'UNDO' }), []);
  const redo  = useCallback(()  => dispatch({ type:'REDO' }), []);
  const reset = useCallback(val => dispatch({ type:'RESET', payload: val }), []);
  return { items: state.present, canUndo: state.past.length > 0, canRedo: state.future.length > 0, set, undo, redo, reset };
}

// ─── HTML Generator ────────────────────────────────────────────
function buildHTML(items, docMeta) {
  const lines = items.map(item => {
    const cls = item.className ? ` class="${item.className}"` : '';
    const id  = item.id_attr   ? ` id="${item.id_attr}"`      : '';
    // Build inline styles for colors
    const colorStyles = [];
    if (item.textColor) colorStyles.push(`color:${item.textColor}`);
    if (item.bgColor) colorStyles.push(`background-color:${item.bgColor}`);
    const styleAttr = colorStyles.length > 0 ? ` style="${colorStyles.join(';')}"` : '';
    const attrs = cls + id + styleAttr;
    switch (item.type) {
      case 'h1': return `<h1${attrs}>${item.content||''}</h1>`;
      case 'h2': return `<h2${attrs}>${item.content||''}</h2>`;
      case 'h3': return `<h3${attrs}>${item.content||''}</h3>`;
      case 'p':  return `<p${attrs}>${item.content||''}</p>`;
      case 'ul': { const lis = (item.content||'').split('\n').filter(Boolean).map(l => `  <li>${l.trim()}</li>`).join('\n'); return `<ul${attrs}>\n${lis}\n</ul>`; }
      case 'ol': { const lis = (item.content||'').split('\n').filter(Boolean).map(l => `  <li>${l.trim()}</li>`).join('\n'); return `<ol${attrs}>\n${lis}\n</ol>`; }
      case 'blockquote': return `<blockquote${attrs}>${item.content||''}</blockquote>`;
      case 'hr': return `<hr${cls}${id}/>`;
      case 'img': { const src = item.src || item.content || ''; const alt = item.alt || ''; const imgStyle = colorStyles.length > 0 ? `max-width:100%;${colorStyles.join(';')}` : 'max-width:100%'; return `<img${cls}${id} src="${src}" alt="${alt}" style="${imgStyle}"/>`; }
      case 'code': { const lang = item.lang || ''; return `<pre${attrs}><code class="language-${lang}">${item.content||''}</code></pre>`; }
      case 'table': {
        const rows = (item.content||'').split('\n').filter(Boolean).map(r => r.split('|'));
        if (!rows.length) return `<table${attrs}></table>`;
        const [hRow, ...bodyRows] = rows;
        const ths = hRow.map(c => `<th>${c.trim()}</th>`).join('');
        const trs = bodyRows.map(r => `  <tr>${r.map(c=>`<td>${c.trim()}</td>`).join('')}</tr>`).join('\n');
        return `<table${attrs}>\n  <thead><tr>${ths}</tr></thead>\n  <tbody>\n${trs}\n  </tbody>\n</table>`;
      }
      case 'div': { const inner = item.content ? `\n  ${item.content}\n` : ''; return `<div${attrs}>${inner}</div>`; }
      case 'video': { const src = item.src || item.content || ''; const poster = item.poster ? ` poster="${item.poster}"` : ''; const autoplay = item.autoplay ? ' autoplay' : ''; const loop = item.loop ? ' loop' : ''; const muted = item.muted ? ' muted' : ''; const vidStyle = colorStyles.length > 0 ? `max-width:100%;${colorStyles.join(';')}` : 'max-width:100%'; return `<video${cls}${id} src="${src}"${poster} controls${autoplay}${loop}${muted} style="${vidStyle}"></video>`; }
      case 'iframe': { const src = item.src || item.content || ''; const w = item.width || '560'; const h = item.height || '315'; const ifrStyle = colorStyles.length > 0 ? `max-width:100%;${colorStyles.join(';')}` : 'max-width:100%'; return `<iframe${cls}${id} src="${src}" width="${w}" height="${h}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="${ifrStyle}"></iframe>`; }
      default: return `<!-- unknown: ${item.type} -->`;
    }
  });
  return lines.join('\n\n');
}

function buildFullHTML(items, docMeta) {
  const body = buildHTML(items, docMeta);
  const title = docMeta.title || 'WINDI Document';
  return `<!DOCTYPE html>\n<html lang="${docMeta.lang || 'pt-BR'}">\n<head>\n  <meta charset="UTF-8"/>\n  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>\n  <title>${title}</title>\n  ${docMeta.css ? `<style>\n${docMeta.css}\n  </style>` : ''}\n</head>\n<body>\n${body}\n</body>\n</html>`;
}

async function sha256(text) {
  const enc = new TextEncoder();
  const buf = await crypto.subtle.digest('SHA-256', enc.encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
