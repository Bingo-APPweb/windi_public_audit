# ═══════════════════════════════════════════════════════════════
# WINDI Communiqué — communique.windia4desk.online
# Marco: 26 Feb 2026
# ═══════════════════════════════════════════════════════════════

server {
    server_name communique.windia4desk.online;

    # Logs
    access_log /var/log/nginx/communique-access.log;
    error_log /var/log/nginx/communique-error.log;

    # Root para ficheiros estáticos
    root /opt/windi/web/communique;
    index index.html;

    # ═══════════════════════════════════════════════════════════
    # Communiqué Pages (static HTML)
    # ═══════════════════════════════════════════════════════════
    location / {
        try_files $uri $uri.html $uri/ =404;

        # Cache para assets
        location ~* \.(css|js|png|jpg|svg|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ═══════════════════════════════════════════════════════════
    # Clean URLs: /COM-20260226-0017 → /COM-20260226-0017.html
    # ═══════════════════════════════════════════════════════════
    location ~ "^/(COM-[0-9]+-[0-9]+)$" {
        try_files /$1.html =404;
    }

    # ═══════════════════════════════════════════════════════════
    # API Proxy to Communiqué Engine (port 8105)
    # ═══════════════════════════════════════════════════════════
    location /api/ {
        proxy_pass http://127.0.0.1:8105/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # ═══════════════════════════════════════════════════════════
    # Feed redirect
    # ═══════════════════════════════════════════════════════════
    location = /feed {
        proxy_pass http://127.0.0.1:8105/feed;
        proxy_set_header Host $host;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    listen 80;
}
