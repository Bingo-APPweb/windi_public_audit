# ═══════════════════════════════════════════════════════════════════
# WINDI Phase 3: Nginx Reverse Proxy with mTLS
# ═══════════════════════════════════════════════════════════════════

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Logging
    log_format mtls '$remote_addr - $ssl_client_s_dn - [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log mtls;
    error_log /var/log/nginx/error.log warn;

    # ─── Upstream Services ───────────────────────────────────────────
    upstream node_registry {
        server hub-node-registry:8070;
    }

    upstream issuer_sync {
        server hub-issuer-sync:8071;
    }

    upstream anchor_receiver {
        server hub-anchor-receiver:8072;
    }

    # ─── HTTP → HTTPS Redirect ───────────────────────────────────────
    server {
        listen 80;
        server_name _;

        location /health {
            return 200 '{"status":"ok","service":"nginx"}';
            add_header Content-Type application/json;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─── HTTPS with mTLS ─────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name hub.windi.local;

        # Server certificate
        ssl_certificate /etc/nginx/certs/hub.crt;
        ssl_certificate_key /etc/nginx/certs/hub.key;

        # Client certificate verification (mTLS)
        ssl_client_certificate /etc/nginx/certs/ca.crt;
        ssl_verify_client optional;  # Set to 'on' for strict mTLS
        ssl_verify_depth 2;

        # TLS settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_session_cache shared:SSL:10m;

        # Pass client cert info to backends
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;

        # ─── Node Registry Routes ────────────────────────────────────
        location /nodes {
            proxy_pass http://node_registry;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /hub/public-key {
            proxy_pass http://node_registry;
            proxy_set_header Host $host;
        }

        # ─── Issuer Sync Routes ──────────────────────────────────────
        location /sync {
            # Require valid client cert for sync endpoints
            if ($ssl_client_verify != SUCCESS) {
                return 403 '{"error":"Client certificate required"}';
            }

            proxy_pass http://issuer_sync;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /admin/issuers {
            proxy_pass http://issuer_sync;
            proxy_set_header Host $host;
        }

        # ─── Anchor Routes ───────────────────────────────────────────
        location /anchors {
            proxy_pass http://anchor_receiver;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── Health Check ────────────────────────────────────────────
        location /health {
            return 200 '{"status":"ok","mtls":"enabled"}';
            add_header Content-Type application/json;
        }
    }
}
