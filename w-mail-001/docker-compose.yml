services:
  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: windi-mailserver
    hostname: mail.windisites.de
    domainname: windisites.de
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "25:25"     # SMTP
      - "587:587"   # Submission (STARTTLS)
      - "465:465"   # Submissions (TLS)
      - "993:993"   # IMAPS
      - "8895:8895" # DACP milter HTTP admin (health, metrics)
    volumes:
      - ./mail-data/:/var/mail/
      - ./mail-state/:/var/mail-state/
      - ./mail-logs/:/var/log/mail/
      - ./config/:/tmp/docker-mailserver/
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - ENABLE_RSPAMD=1
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=1
      - ENABLE_POSTGREY=0
      - ENABLE_SPAMASSASSIN=0
      - SPOOF_PROTECTION=1
      - ENABLE_SRS=0
      - PERMIT_DOCKER=network
      - TLS_LEVEL=modern
      - SSL_TYPE=letsencrypt
      - SSL_DOMAIN=mail.windisites.de
      - POSTMASTER_ADDRESS=postmaster@windisites.de
      - ENABLE_UPDATE_CHECK=1
      - UPDATE_CHECK_INTERVAL=1d
      - LOG_LEVEL=info
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: "ss -lntp | grep -E ':25|:587|:993' || exit 1"
      timeout: 3s
      retries: 0

  snappymail:
    image: djmaze/snappymail:latest
    container_name: windi-snappymail
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./snappymail-data:/var/lib/snappymail
    environment:
      - TZ=Europe/Berlin
      - SNAPPYMAIL_PORT=8888
    depends_on:
      - mailserver
