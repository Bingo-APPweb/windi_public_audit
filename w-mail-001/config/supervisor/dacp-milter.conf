# W-MAIL-DACP-MILTER v1.0 — Supervisor Configuration
# Spec: §227 Section 10.2 (Survivability Hardening)
# Created: 2026-06-18 by DACP-SURVIVABILITY-HARDENING-001
#
# This config ensures the DACP milter auto-restarts inside the container

[program:dacp-milter]
command=/bin/bash /tmp/docker-mailserver/dacp-milter/start-milter.sh
directory=/tmp/docker-mailserver/dacp-milter
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
startretries=5
stdout_logfile=/var/log/mail/dacp-milter.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile=/var/log/mail/dacp-milter-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=DOMAIN="windisites.de",LEDGER_URL="https://windi-domain.com",LEDGER_TIMEOUT="10",RATE_LIMIT_PER_MIN="100",LOG_PATH="/var/log/mail/dacp-milter.log",LOG_LEVEL="INFO",MILTER_SOCKET="inet:8890@127.0.0.1",HTTP_ADMIN_PORT="8895",DKIM_KEYS_PATH="/tmp/docker-mailserver/opendkim/keys"
user=root
