        index index.html;
        try_files $uri $uri/ /ecosystem/index.html;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Library / Historical docs (:8084) ────────────────────
    location ^~ /library/ {
        proxy_pass http://windi_masterarbeit/;
        proxy_http_version 1.1;
    }

    # ── Investor Relations (static files) ────────────────────
    location ^~ /investor/ {
        alias /var/www/investor/;
        index index.html;
        try_files $uri $uri/ /investor/index.html;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Communiqué UI + API (:8105) ─────────────────────────
    # FE calls /communique/api/communique/list
    location ^~ /communique/ {
        proxy_pass http://windi_communique/;
        proxy_http_version 1.1;
    }

    # ══════════════════════════════════════════════════════════
    # BRANCH 4 — Forensic Infrastructure
    # ══════════════════════════════════════════════════════════

    # ── Forensic Vault (:8106) ───────────────────────────────
    location ^~ /vault/ {
        proxy_pass http://windi_vault/;
        proxy_http_version 1.1;
    }

    # ── Vault multimedia (immutable alias — cached forever) ──
    location ^~ /vault/multimedia/ {
        alias /opt/windi/forensic-vault/multimedia/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # ══════════════════════════════════════════════════════════
    # BRANCH 5 — Unified API Gateway (/api/)
    #
    # THE GOLDEN RULE:
    # Every frontend in the entire WINDI ecosystem calls:
    #   fetch('/api/...')
    # Same origin. Zero CORS. Zero configuration.
    # ══════════════════════════════════════════════════════════

    # ── Dragon Server (:8108) — AI + Three Dragons ───────────
    # ── GEN7 status endpoints (:8119) ───────────────────────
    location = /api/dragon/status {
        proxy_pass http://127.0.0.1:8119/api/dragon/status;
        proxy_http_version 1.1;
        add_header Access-Control-Allow-Origin "*" always;
    }
    location = /api/agents/status {
        proxy_pass http://127.0.0.1:8119/api/agents/status;
        proxy_http_version 1.1;
        add_header Access-Control-Allow-Origin "*" always;
    }

    location ^~ /api/dragon/ {
        proxy_pass http://windi_dragon/api/dragon/;
        proxy_http_version 1.1;
    }

    # ── Forensic Ledger (:8101) — 18,238+ receipts ──────────
    location ^~ /api/ledger/ {
        proxy_pass http://windi_ledger/;
        proxy_http_version 1.1;
    }

    # ── Forensic Ledger Receipts API ──────────────────────────
    location ^~ /api/receipts/ {
        proxy_pass http://windi_ledger/api/receipts/;
        proxy_http_version 1.1;
    }

    # ── Forensic Ledger Verify API ───────────────────────────
    location ^~ /api/verify/ {
        proxy_pass http://windi_ledger/api/verify/;
        proxy_http_version 1.1;
    }

    # ── Export Engine (:8103) — PDF + QR generation ──────────
    location ^~ /api/export/ {
        proxy_pass http://windi_export/;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;   # exports can be slow
        proxy_send_timeout 300s;
    }

    # ── Communique Engine (:8105) ────────────────────────────
    location ^~ /api/communique/ {
        proxy_pass http://windi_communique/;
        proxy_http_version 1.1;
    }

    # ── Sentinel LAW (:8102) — Constitutional enforcement ───
    location ^~ /api/sentinel/ {
        proxy_pass http://windi_sentinelaw/;
        proxy_http_version 1.1;
    }

    # ── Sentinel Core (:8098) ────────────────────────────────
    location ^~ /api/sentinel-core/ {
        proxy_pass http://windi_sentinel/;
        proxy_http_version 1.1;
    }

    # ── HUB BABEL API (:8085) ────────────────────────────────
    location ^~ /api/hub/ {
        proxy_pass http://windi_hub/api/hub/;
        proxy_http_version 1.1;
    }

    # ── Governance API (:8085) ───────────────────────────────
    location ^~ /api/gov/ {
        proxy_pass http://windi_hub/api/gov/;
        proxy_http_version 1.1;
    }

    # ── JMPG Viewer (:8104) ─────────────────────────────────
    location ^~ /api/viewer/ {
        proxy_pass http://windi_viewer/;
        proxy_http_version 1.1;
    }

    # ── Cortex Metacognition (:8089) ─────────────────────────
    location ^~ /api/cortex/ {
        proxy_pass http://windi_cortex/;
        proxy_http_version 1.1;
    }

    # ── Wallet "O Espelho" (:8099) ──────────────────────────
    location ^~ /api/wallet/ {
        proxy_pass http://windi_wallet/api/wallet/;
        proxy_http_version 1.1;
    }

    # ── Wallet UI (:8099) ─────────────────────────────────
    location ^~ /wallet/ {
        proxy_pass http://windi_wallet/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── ID Genesis (:8096) ──────────────────────────────────
    location ^~ /api/genesis/ {
        proxy_pass http://windi_genesis/;
        proxy_http_version 1.1;
    }

    # ── Forensic Validation (:8094) ─────────────────────────
    location ^~ /api/forensic/ {
        proxy_pass http://windi_forensicapi/;
        proxy_http_version 1.1;
    }

    # ══════════════════════════════════════════════════════════
    # BRANCH 6 — Static Assets & Legal
    # ══════════════════════════════════════════════════════════

    # ── HUB static assets ────────────────────────────────────
    location ^~ /static/ {
        proxy_pass http://windi_hub/static/;
        proxy_http_version 1.1;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── Impressum (German legal requirement) ─────────────────
    location ^~ /impressum {
        alias /var/www/impressum/;
        index index.html;
    }

    # ── Datenschutz (Privacy Policy) ─────────────────────────
    location ^~ /datenschutz {
        alias /var/www/datenschutz/;
        index index.html;
    }

    # ══════════════════════════════════════════════════════════
    # WebSocket support (for Palette, Desktop, War Room)
    # Already handled per-location above via Upgrade headers
    # ══════════════════════════════════════════════════════════
}


# ═══════════════════════════════════════════════════════════════
# LEGACY REDIRECTS — Old domains → One Tree
# Keep ACTIVE minimum 6 months (until Sep 2026)
# SSL certs must remain valid during redirect period
# ═══════════════════════════════════════════════════════════════

# ── admin.windia4desk.tech ───────────────────────────────────
server {
    listen 443 ssl http2;
    server_name admin.windia4desk.tech;

    ssl_certificate     /etc/letsencrypt/live/admin.windia4desk.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.windia4desk.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Specific path mappings (old → new)
    location ^~ /palette/  { return 301 https://windi-domain.com/app$request_uri; }
    location ^~ /war-room/ { return 301 https://windi-domain.com/war-room$request_uri; }
    location ^~ /clone/    { return 301 https://windi-domain.com/clone$request_uri; }
    location ^~ /bridge/   { return 301 https://windi-domain.com/bridge$request_uri; }
    location ^~ /vault/    { return 301 https://windi-domain.com/vault$request_uri; }
    location ^~ /desktop/  { return 301 https://windi-domain.com/desktop$request_uri; }

    # Everything else

    location / { return 301 https://windi-domain.com$request_uri; }
}

server {
    listen 80;
    server_name admin.windia4desk.tech;
    return 301 https://windi-domain.com$request_uri;
}

