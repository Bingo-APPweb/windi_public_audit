# ─────────────────────────────────────────────────────────────
# UPSTREAMS — Connection pooling with keepalive + fail protection
# Port assignments verified against Location Matrix 18 Feb 2026
# max_fails/fail_timeout: stop sending to dead backends immediately
# (Architect proposed, Witness calibrated: resilience, not load balancing)
# ─────────────────────────────────────────────────────────────

