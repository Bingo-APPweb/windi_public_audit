# Fusion:
#   Architect: upstreams, keepalive, http2, security headers,
#              ACME challenge, centralized logging, gzip, fail_timeout
#   Witness:   real port map (21 services), proxy-based frontends,
#              vault multimedia alias, WebSocket per-location
