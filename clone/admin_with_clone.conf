server {
    server_name admin.windia4desk.tech;

    location / {
        proxy_pass http://127.0.0.1:8086;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /war-room/ {
        proxy_pass http://127.0.0.1:8090/war-room/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/briefing {
        proxy_pass http://127.0.0.1:8090/api/briefing;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/report/ {
        proxy_pass http://127.0.0.1:8090/api/report/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ══════════════════════════════════════════════════════
    # WINDI Clone Territory (→ :8095)
    # clone-a4Desk-WINDI · Território Soberano
    # ══════════════════════════════════════════════════════

    location /clone {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /clone/ {
        proxy_pass http://127.0.0.1:8095/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ══════════════════════════════════════════════════════

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.windia4desk.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.windia4desk.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = admin.windia4desk.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot
    listen 80;
    server_name admin.windia4desk.tech;
    return 404; # managed by Certbot
}
