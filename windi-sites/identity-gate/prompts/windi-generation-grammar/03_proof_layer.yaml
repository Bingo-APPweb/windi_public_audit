# §249 — WINDI Generation Grammar
# Module 03: Proof Layer — Forensic Infrastructure
# Status: ENGINE FOUNDATION
# Constitutional: I11 (forensic permanence)

version: "0.1.0"

# ═══════════════════════════════════════════════════════════════
# PROOF LAYER DOCTRINE
# ═══════════════════════════════════════════════════════════════
doctrine: |
  Every site generated by W-SITES-001 IS registered in the Ledger.
  The receipt exists. The hash exists. The timestamp exists.
  Hiding this treats the product as decoration — instead of infrastructure.

  If W-SITES-001 sells "verifiable sites", every site delivered
  must be able to prove itself verifiable.

  This is institutional honesty, not marketing.

# ═══════════════════════════════════════════════════════════════
# 3C RULE: MINIMAL ALWAYS + FULL CONDITIONAL
# ═══════════════════════════════════════════════════════════════
rule_3c:
  minimal:
    when: always
    location: footer
    format: "WINDI-SITES-001-{receipt_8hex} · Verified at /verify"
    css: |
      .windi-proof-minimal {
        font-family: 'JetBrains Mono', 'Courier New', monospace;
        font-size: 0.7rem;
        color: var(--noir-soft);
        text-align: center;
        margin-top: 0.5rem;
      }
      .windi-proof-minimal a {
        color: var(--gold);
        text-decoration: none;
        border-bottom: 1px solid var(--gold-faint);
      }

  full:
    when: conditional
    triggers:
      - ledger
      - recibo
      - receipt
      - verificação
      - verify
      - imutável
      - immutable
      - forense
      - forensic
      - auditoria
      - audit
      - WINDI
      - compliance
      - governance
    location: before_footer
    html_template: |
      <section class="forensic-proof">
        <div class="proof-label">Forensic Proof — verifiable on the WINDI Ledger</div>
        <dl class="proof-grid">
          <dt>Receipt</dt>
          <dd><code>{receipt_id}</code></dd>
          <dt>SHA-256</dt>
          <dd><code>{hash_truncated}</code></dd>
          <dt>Sealed</dt>
          <dd><code>{timestamp_iso}</code></dd>
          <dt>Verify</dt>
          <dd><a href="/verify">windi-domain.com/verify</a></dd>
        </dl>
      </section>
    css: |
      .forensic-proof {
        border: 1px solid var(--line);
        padding: 1.5rem;
        margin: 3rem 0;
        background: var(--klar);
      }
      .proof-label {
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--noir-soft);
        margin-bottom: 1rem;
      }
      .proof-grid {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 0.5rem 1.5rem;
        margin: 0;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.875rem;
      }
      .proof-grid dt { color: var(--noir-soft); }
      .proof-grid dd { margin: 0; color: var(--noir); }
      .proof-grid a {
        color: var(--gold);
        text-decoration: none;
        border-bottom: 1px solid var(--gold-faint);
      }

# ═══════════════════════════════════════════════════════════════
# FOOTER STRUCTURE (always present)
# ═══════════════════════════════════════════════════════════════
footer:
  required: true
  content:
    line_1: "Verified by WINDI"
    line_2: "{proof_minimal}"  # injected from rule_3c.minimal
  css: |
    footer {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--noir-soft);
      padding: 2rem;
      text-align: center;
      border-top: 1px solid var(--line);
      margin-top: 4rem;
    }
