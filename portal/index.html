            --red: #F87171;

            --bg-secondary: #F5F3F0;
            --bg-card: #FFFFFF;
            --bg-hover: #F0EDE8;
            --gold: #8B7424;
            --gold-dim: #6B5A1C;
            --gold-glow: rgba(139, 116, 36, 0.1);
            --text-primary: #1A1A1A;
            --text-secondary: #5A5A5A;
            --text-muted: #8A8A8A;
            --border: #E0DED8;
            --green: #16A34A;
            --red: #DC2626;
            --yellow: #CA8A04;
            --blue: #2563EB;
            --purple: #7C3AED;
            --cyan: #0891B2;

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;

            color: var(--text-primary);
            min-height: 100vh;
            transition: all 0.3s ease;

        .header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1600px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
        }

            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dim) 100%);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .logo-text {
            font-size: 18px;
            font-weight: 700;
            color: var(--gold);
        }

        .logo-text span {
            color: var(--text-secondary);
            font-weight: 400;
            font-size: 14px;
            margin-left: 8px;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .lang-toggle, .theme-toggle {
            display: flex;
            gap: 4px;
        }

        .btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: 11px;
            transition: all 0.2s;
        }

        .btn:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .btn.active {
            background: var(--gold);
            color: var(--bg-primary);
            border-color: var(--gold);
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(74, 222, 128, 0.1);
            border: 1px solid rgba(74, 222, 128, 0.3);
            border-radius: 4px;
            font-size: 11px;
            color: var(--green);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* ═══ MAIN ═══ */
        .main {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
        }

        /* ═══ SEARCH ═══ */
        .search-container {
            margin-bottom: 24px;
        }

        .search-input {
            width: 100%;
            max-width: 400px;
            padding: 12px 16px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 13px;
            transition: all 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-glow);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        /* ═══ CATEGORY ═══ */
        .category {
            margin-bottom: 32px;
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .category-icon {
            font-size: 20px;
        }

        .category-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .category-count {
            font-size: 11px;
            color: var(--text-muted);
            background: var(--bg-card);
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* ═══ GRID ═══ */
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        /* ═══ SERVICE CARD ═══ */
        .service-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: block;
            position: relative;
            overflow: hidden;
        }

        .service-card:hover {
            border-color: var(--gold-dim);
            background: var(--bg-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .service-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: var(--accent-color, var(--gold));
            opacity: 0;
            transition: opacity 0.2s;
        }

        .service-card:hover::before {
            opacity: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .card-port {
            font-size: 10px;
            color: var(--text-muted);
            font-family: monospace;
        }

        .card-status {
            font-size: 9px;
            padding: 3px 8px;
            border-radius: 3px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .card-status.live {
            background: rgba(74, 222, 128, 0.15);
            color: var(--green);
        }

        .card-status.deprecated {
            background: rgba(248, 113, 113, 0.15);
            color: var(--red);
        }

        .card-status.sealed {
            background: rgba(201, 168, 76, 0.15);
            color: var(--gold);
        }

        .card-description {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .card-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .tag {
            font-size: 9px;
            padding: 2px 6px;
            background: var(--bg-secondary);
            border-radius: 3px;
            color: var(--text-muted);
        }

        .tag.invariant {
            background: rgba(167, 139, 250, 0.15);

            text-align: center;
            padding: 32px 24px;
            border-top: 1px solid var(--border);

            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 8px;

            font-size: 12px;
            color: var(--gold);
            font-style: italic;

                gap: 16px;

            .controls {

                justify-content: center;

        }

        .stat-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;

</head>

        const categories = [
            { id: "dashboards", icon: "📊", key: "cat_dashboards" },
            { id: "legal", icon: "⚖️", key: "cat_legal" },
            { id: "video", icon: "🎬", key: "cat_video" },
            { id: "integration", icon: "🔗", key: "cat_integration" },
            { id: "infrastructure", icon: "🏗️", key: "cat_infrastructure" },
            { id: "api", icon: "🔌", key: "cat_api" },
            { id: "deprecated", icon: "📦", key: "cat_deprecated" }
        ];

        let currentLang = localStorage.getItem('windi-lang') || 'en';
        let currentTheme = localStorage.getItem('windi-theme') || 'noir';

        // ─── Theme ───
        function setTheme(theme) {
            currentTheme = theme;
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('windi-theme', theme);
            document.getElementById('theme-toggle').textContent = theme === 'noir' ? 'KLAR' : 'NOIR';
        }

        document.getElementById('theme-toggle').addEventListener('click', () => {
            setTheme(currentTheme === 'noir' ? 'klar' : 'noir');
        });

        // ─── Language ───
        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('windi-lang', lang);
            document.querySelectorAll('.lang-toggle .btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.lang === lang);
            });
            updateTexts();
            render();
        }

        document.querySelectorAll('.lang-toggle .btn').forEach(btn => {
            btn.addEventListener('click', () => setLang(btn.dataset.lang));
        });

        function t(key) {
            return i18n[currentLang]?.[key] || i18n.en[key] || key;
        }

        function updateTexts() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.textContent = t(el.dataset.i18n);
            });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = t(el.dataset.i18nPlaceholder);
            });
        }

        // ─── Render ───
        function render(filter = '') {
            const container = document.getElementById('categories-container');
            const filterLower = filter.toLowerCase();

            let html = '';

            categories.forEach(cat => {
                const catServices = services.filter(s => {
                    if (s.category !== cat.id) return false;
                    if (!filter) return true;

                    const searchable = [
                        s.name,
                        s.port.toString(),
                        s.description[currentLang] || s.description.en,
                        ...s.tags,
                        ...s.invariants
                    ].join(' ').toLowerCase();

                    return searchable.includes(filterLower);
                });

                if (catServices.length === 0) return;

                html += `
                    <div class="category">
                        <div class="category-header">
                            <span class="category-icon">${cat.icon}</span>
                            <span class="category-title">${t(cat.key)}</span>
                            <span class="category-count">${catServices.length}</span>
                        </div>
                        <div class="services-grid">
                            ${catServices.map(s => `
                                <a href="${s.url}" target="_blank" class="service-card" style="--accent-color: ${s.accent}">
                                    <div class="card-header">
                                        <div>
                                            <div class="card-title">${s.name}</div>
                                            <div class="card-port">:${s.port}</div>
                                        </div>
                                        <span class="card-status ${s.status}">${s.status.toUpperCase()}</span>
                                    </div>
                                    <div class="card-description">${s.description[currentLang] || s.description.en}</div>
                                    <div class="card-tags">
                                        ${s.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                                        ${s.invariants.map(inv => `<span class="tag invariant">${inv}</span>`).join('')}
                                    </div>
                                </a>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html || '<div style="text-align:center;color:var(--text-muted);padding:48px;">No services match your search</div>';
        }

        // ─── Search ───
        document.getElementById('search').addEventListener('input', (e) => {
            render(e.target.value);
        });

        // ─── Init ───
        setTheme(currentTheme);
        setLang(currentLang);
        render();
    </script>
