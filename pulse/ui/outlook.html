<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palette Product Outlook</title>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;400;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0A0A11; }
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(2); opacity: 0; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

const GOLD = "#C9A227";
const BG = "#0A0A11";
const CARD = "#111119";
const CARD2 = "#161620";
const BORDER = "#1E1E30";
const GREEN = "#22C55E";
const RED = "#EF4444";
const AMBER = "#F59E0B";
const BLUE = "#3B82F6";
const PURPLE = "#8B5CF6";
const PINK = "#EC4899";
const DIM = "#6B6B88";
const TEXT = "#E2E2EA";

const DRAGON_API = "/pulse/api/pulse/outlook";

const CATEGORY_META = {
  core: { label: "Core", icon: "\u{1F3DB}", color: BLUE },
  document: { label: "Document Production", icon: "\u{1F3ED}", color: GOLD },
  forensic: { label: "Forensic Stack", icon: "\u{1F510}", color: GREEN },
  intelligence: { label: "Intelligence", icon: "\u{1F9E0}", color: PURPLE },
  governance: { label: "Governance", icon: "\u2696\uFE0F", color: BLUE },
  communication: { label: "Communication", icon: "\u{1F4E1}", color: PINK },
};

const STATUS_META = {
  WIRED: { label: "WIRED", color: GREEN, bg: "rgba(34,197,94,0.12)" },
  ON_SERVER: { label: "ON SERVER", color: AMBER, bg: "rgba(245,158,11,0.12)" },
  NOT_BUILT: { label: "NOT BUILT", color: RED, bg: "rgba(239,68,68,0.08)" },
  DOWN: { label: "DOWN", color: RED, bg: "rgba(239,68,68,0.15)" },
};

function Pulse({ color, animate = true, size = 8 }) {
  return (
    <span style={{ position: "relative", display: "inline-block", width: size, height: size }}>
      <span style={{ display: "block", width: size, height: size, borderRadius: "50%", background: color, position: "relative", zIndex: 1 }} />
      {animate && (
        <span style={{
          position: "absolute", top: -2, left: -2, width: size + 4, height: size + 4,
          borderRadius: "50%", background: color, opacity: 0.3, animation: "pulse-ring 2s ease-out infinite",
        }} />
      )}
    </span>
  );
}

function Badge({ children, color, bg, small }) {
  return (
    <span style={{
      display: "inline-flex", alignItems: "center",
      padding: small ? "1px 6px" : "2px 8px",
      borderRadius: 4, fontSize: small ? 9 : 10,
      fontWeight: 700, letterSpacing: "0.04em",
      color, backgroundColor: bg || `${color}18`,
      fontFamily: "'JetBrains Mono', monospace", whiteSpace: "nowrap",
    }}>
      {children}
    </span>
  );
}

function FeatureRow({ f, expanded, onToggle }) {
  const cat = CATEGORY_META[f.category] || { label: f.category, icon: "?", color: DIM };
  const statusMeta = STATUS_META[f.status] || { label: f.status, color: DIM, bg: `${DIM}18` };
  const isWired = f.status === "WIRED";
  const isDown = f.status === "DOWN";

  return (
    <div onClick={onToggle} style={{
      background: expanded ? CARD2 : CARD, border: `1px solid ${expanded ? `${cat.color}33` : BORDER}`,
      borderRadius: 8, padding: "10px 14px", cursor: "pointer",
      borderLeft: `3px solid ${isWired ? GREEN : isDown ? RED : AMBER}`,
      transition: "all 0.15s",
    }}>
      <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
        <Pulse color={statusMeta.color} animate={isWired} size={8} />
        <span style={{ fontSize: 11, color: DIM, fontFamily: "'JetBrains Mono', monospace", width: 28, flexShrink: 0 }}>{f.id}</span>
        <span style={{ fontSize: 13, color: TEXT, fontWeight: 600, flex: 1, minWidth: 120 }}>{f.name}</span>
        <div style={{ display: "flex", gap: 4, flexWrap: "wrap", justifyContent: "flex-end" }}>
          <Badge color={cat.color} small>{cat.icon} {cat.label}</Badge>
          <Badge color={statusMeta.color} bg={statusMeta.bg} small>{statusMeta.label}</Badge>
        </div>
      </div>
      {expanded && f.checks && (
        <div style={{ marginTop: 10, paddingTop: 10, borderTop: `1px solid ${BORDER}` }}>
          <div style={{ fontSize: 11, color: DIM, fontFamily: "'JetBrains Mono', monospace" }}>
            {f.checks.map((c, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                <span style={{ color: c.status === "ok" ? GREEN : RED }}>{c.status === "ok" ? "\u2713" : "\u2717"}</span>
                <span>{c.label}</span>
                {c.code && <span style={{ color: DIM }}>HTTP {c.code}</span>}
                {c.self && <Badge color={BLUE} small>SELF</Badge>}
                {c.error && <span style={{ color: RED }}>{c.error}</span>}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function PaletteOutlook() {
  const [data, setData] = useState(null);
  const [frontend, setFrontend] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [expandedId, setExpandedId] = useState(null);
  const [viewMode, setViewMode] = useState("sprint");
  const [lastRefresh, setLastRefresh] = useState(null);
  const [autoRefresh, setAutoRefresh] = useState(true);

  const fetchData = useCallback(async () => {
    try {
      const [outlookRes, frontendRes] = await Promise.allSettled([
        fetch(DRAGON_API).then(r => r.json()),
        fetch("/pulse/api/pulse/frontend").then(r => r.json()),
      ]);
      if (outlookRes.status === "fulfilled") setData(outlookRes.value);
      if (frontendRes.status === "fulfilled") setFrontend(frontendRes.value);
      setError(null);
      setLastRefresh(new Date());
    } catch (e) {
      setError(`Failed to fetch: ${e.message}`);
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { fetchData(); }, [fetchData]);

  useEffect(() => {
    if (!autoRefresh) return;
    const interval = setInterval(fetchData, 30000);
    return () => clearInterval(interval);
  }, [autoRefresh, fetchData]);

  const features = useMemo(() => {
    if (!data?.features) return [];
    return Object.values(data.features).sort((a, b) => a.sprint - b.sprint || a.id.localeCompare(b.id));
  }, [data]);

  const summary = data?.summary || { total: 0, wired: 0, on_server: 0, not_built: 0, down: 0, wired_pct: 0 };
  const sprints = data?.sprints || {};

  const grouped = useMemo(() => {
    if (viewMode === "sprint") {
      return Object.entries(sprints).map(([num, s]) => ({
        key: `S${num}`,
        title: `SPRINT ${num} \u2014 ${s.name}`,
        color: [RED, GOLD, GREEN, PURPLE, BLUE][parseInt(num)] || DIM,
        items: s.features.map(id => features.find(f => f.id === id)).filter(Boolean),
      }));
    }
    if (viewMode === "category") {
      const cats = {};
      features.forEach(f => {
        if (!cats[f.category]) cats[f.category] = [];
        cats[f.category].push(f);
      });
      return Object.entries(cats).map(([key, items]) => {
        const meta = CATEGORY_META[key] || { label: key, icon: "?", color: DIM };
        return { key, title: `${meta.icon} ${meta.label}`, color: meta.color, items };
      });
    }
    // wiring view
    return [
      { key: "wired", title: "\u2705 Fully Wired", color: GREEN, items: features.filter(f => f.status === "WIRED") },
      { key: "on-server", title: "\u{1F7E1} On Server (not wired)", color: AMBER, items: features.filter(f => f.status === "ON_SERVER") },
      { key: "not-built", title: "\u{1F534} Not Built", color: RED, items: features.filter(f => f.status === "NOT_BUILT") },
      { key: "down", title: "\u26A0\uFE0F Down", color: RED, items: features.filter(f => f.status === "DOWN") },
    ].filter(g => g.items.length > 0);
  }, [viewMode, features, sprints]);

  if (loading) {
    return (
      <div style={{ background: BG, minHeight: "100vh", display: "flex", alignItems: "center", justifyContent: "center", color: GOLD }}>
        <div style={{ textAlign: "center" }}>
          <div style={{ fontSize: 48, marginBottom: 16, animation: "spin 2s linear infinite" }}>{"\u{1F409}"}</div>
          <div style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 12 }}>Loading Outlook...</div>
        </div>
      </div>
    );
  }

  return (
    <div style={{ background: BG, minHeight: "100vh", color: TEXT, fontFamily: "'Bricolage Grotesque', system-ui, sans-serif", padding: "20px 16px" }}>
      <div style={{ maxWidth: 960, margin: "0 auto" }}>
        {/* Header */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
            <span style={{ fontSize: 32 }}>{"\u{1F409}"}</span>
            <div>
              <h1 style={{ margin: 0, fontSize: 20, fontWeight: 800, color: GOLD }}>PALETTE PRODUCT OUTLOOK</h1>
              <p style={{ margin: 0, fontSize: 11, color: DIM, fontFamily: "'JetBrains Mono', monospace" }}>
                Live Status \u2014 {lastRefresh ? lastRefresh.toLocaleTimeString("de-DE") : "..."} {autoRefresh && "\u00B7 Auto-refresh 30s"}
              </p>
            </div>
          </div>
          <div style={{ display: "flex", gap: 6 }}>
            <button onClick={() => setAutoRefresh(!autoRefresh)} style={{
              padding: "4px 10px", fontSize: 10, fontWeight: 600, border: "none", borderRadius: 4, cursor: "pointer",
              background: autoRefresh ? `${GREEN}20` : `${RED}20`, color: autoRefresh ? GREEN : RED,
            }}>
              {autoRefresh ? "⚡ LIVE" : "⏸ PAUSED"}
            </button>
            <button onClick={fetchData} style={{
              padding: "4px 10px", fontSize: 10, fontWeight: 600, border: `1px solid ${BORDER}`,
              borderRadius: 4, cursor: "pointer", background: CARD, color: GOLD,
            }}>
              ↻ Refresh
            </button>
            <a href="/palette/api/dragon/outlook/report.md" download style={{
              padding: "4px 10px", fontSize: 10, fontWeight: 600, border: `1px solid ${GOLD}`,
              borderRadius: 4, cursor: "pointer", background: `${GOLD}20`, color: GOLD,
              textDecoration: "none", display: "inline-flex", alignItems: "center",
            }}>
              ⬇ .MD
            </a>
          </div>
        </div>

        {/* Error Banner */}
        {error && (
          <div style={{ background: `${RED}15`, border: `1px solid ${RED}40`, borderRadius: 8, padding: 12, marginBottom: 16 }}>
            <span style={{ color: RED, fontWeight: 600 }}>{"\u26A0"} {error}</span>
          </div>
        )}

        {/* Dashboard Cards */}
        <div style={{ display: "grid", gridTemplateColumns: "repeat(6, 1fr)", gap: 8, marginBottom: 16 }}>
          {[
            { label: "Total Features", value: summary.total, color: TEXT },
            { label: "Fully Wired", value: summary.wired, color: GREEN },
            { label: "On Server", value: summary.on_server, color: AMBER },
            { label: "Not Built", value: summary.not_built, color: RED },
            { label: "Wired %", value: `${summary.wired_pct.toFixed(0)}%`, color: summary.wired_pct === 100 ? GREEN : summary.wired_pct >= 50 ? AMBER : RED },
            { label: "Frontend", value: frontend?.score != null ? `${Math.round(frontend.score)}%` : "\u2014", color: frontend?.status === "GREEN" ? GREEN : frontend?.status === "RED" ? RED : AMBER },
          ].map(s => (
            <div key={s.label} style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 8, padding: "10px 12px", textAlign: "center" }}>
              <div style={{ fontSize: 22, fontWeight: 800, color: s.color, fontFamily: "'JetBrains Mono', monospace" }}>{s.value}</div>
              <div style={{ fontSize: 9, color: DIM, fontWeight: 600, letterSpacing: "0.06em", marginTop: 2 }}>{s.label.toUpperCase()}</div>
            </div>
          ))}
        </div>

        {/* Wiring Progress Bar */}
        <div style={{ background: CARD, border: `1px solid ${BORDER}`, borderRadius: 10, padding: 16, marginBottom: 16 }}>
          <h3 style={{ margin: "0 0 10px", fontSize: 13, fontWeight: 700, color: GOLD }}>{"\u{1F50C}"} Wiring Status</h3>
          <div style={{ height: 12, background: "#1a1a2e", borderRadius: 6, overflow: "hidden", display: "flex", marginBottom: 8 }}>
            <div style={{ width: `${(summary.wired / summary.total) * 100}%`, background: GREEN, transition: "width 0.4s" }} />
            <div style={{ width: `${(summary.on_server / summary.total) * 100}%`, background: AMBER, transition: "width 0.4s" }} />
            <div style={{ width: `${(summary.not_built / summary.total) * 100}%`, background: `${RED}60`, transition: "width 0.4s" }} />
          </div>
          <div style={{ display: "flex", gap: 16, justifyContent: "center", fontSize: 10 }}>
            <span style={{ color: GREEN }}>{"\u25CF"} {summary.wired} wired</span>
            <span style={{ color: AMBER }}>{"\u25CF"} {summary.on_server} on server</span>
            <span style={{ color: `${RED}99` }}>{"\u25CF"} {summary.not_built} not built</span>
          </div>
        </div>

        {/* Success Banner (if 100%) */}
        {summary.wired_pct === 100 && (
          <div style={{ background: `${GREEN}15`, border: `1px solid ${GREEN}40`, borderRadius: 10, padding: 14, marginBottom: 16 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 20 }}>{"\u2705"}</span>
              <div>
                <span style={{ fontSize: 13, fontWeight: 700, color: GREEN }}>ALL FEATURES WIRED!</span>
                <p style={{ fontSize: 11, color: TEXT, margin: "4px 0 0" }}>
                  Dragon Server v1.2.0 \u2014 {summary.total} features operational
                </p>
              </div>
            </div>
          </div>
        )}

        {/* View Controls */}
        <div style={{ display: "flex", gap: 4, background: CARD, padding: 3, borderRadius: 6, border: `1px solid ${BORDER}`, marginBottom: 16, width: "fit-content" }}>
          {[
            { key: "sprint", label: "\u{1F3C3} Sprint Plan" },
            { key: "wiring", label: "\u{1F50C} Wiring View" },
            { key: "category", label: "\u{1F4C2} By Category" },
          ].map(v => (
            <button key={v.key} onClick={() => setViewMode(v.key)} style={{
              padding: "6px 14px", fontSize: 11, fontWeight: 600, border: "none", borderRadius: 4, cursor: "pointer",
              background: viewMode === v.key ? GOLD : "transparent",
              color: viewMode === v.key ? BG : DIM,
            }}>
              {v.label}
            </button>
          ))}
        </div>

        {/* Feature Groups */}
        <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>
          {grouped.map(group => (
            <div key={group.key}>
              <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 8 }}>
                <h2 style={{ margin: 0, fontSize: 14, fontWeight: 700, color: group.color || TEXT }}>{group.title}</h2>
                <Badge color={group.color}>{group.items.length} features</Badge>
              </div>
              <div style={{ display: "flex", flexDirection: "column", gap: 5 }}>
                {group.items.map(f => (
                  <FeatureRow key={f.id} f={f} expanded={expandedId === f.id} onToggle={() => setExpandedId(expandedId === f.id ? null : f.id)} />
                ))}
              </div>
            </div>
          ))}
        </div>

        {/* Footer */}
        <div style={{ marginTop: 24, textAlign: "center", fontSize: 10, color: DIM, lineHeight: 1.8 }}>
          <div style={{ color: GOLD, fontWeight: 700, fontSize: 11 }}>"KI verarbeitet. Der Mensch entscheidet. WINDI garantiert."</div>
          <div>WINDI Publishing House {'\u00B7'} Kempten, Bavaria {'\u00B7'} Palette Product Outlook</div>
          <div style={{ fontFamily: "'JetBrains Mono', monospace" }}>
            {summary.wired}/{summary.total} wired {'\u00B7'} {summary.wired_pct.toFixed(1)}% {'\u00B7'} Live from Dragon API
          </div>
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<PaletteOutlook />);
  </script>
</body>
</html>
