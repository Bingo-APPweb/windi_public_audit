# ══════════════════════════════════════════════════════════════
# PATCH: Documentation Routes
# Date: 23 Apr 2026
# Author: Dragon + Architect
# Location: Add after line 422 in /etc/nginx/sites-enabled/windi-domain.com
#           (after the Library block, before Investor Relations)
# ══════════════════════════════════════════════════════════════

    # ── Documentation Portal (static) ────────────────────────
    location ^~ /docs/ {
        alias /opt/windi/static/docs/;
        index index.html;
        expires 1d;
        add_header Cache-Control "public";
    }

    # ── API Documentation / Swagger UI (static) ──────────────
    location ^~ /api-docs/ {
        alias /opt/windi/api-docs/;
        index index.html;
        expires 1d;
        add_header Cache-Control "public";
    }

    # ── OpenAPI Specs (static YAML/JSON) ─────────────────────
    location ^~ /specs/ {
        alias /opt/windi/specs/;
        autoindex on;
        expires 1d;
        add_header Cache-Control "public";
    }

# ══════════════════════════════════════════════════════════════
# INSTRUCTIONS:
#
# 1. Edit nginx config:
#    sudo nano /etc/nginx/sites-enabled/windi-domain.com
#
# 2. Find line 422 (after "location ^~ /library/ { ... }")
#
# 3. Paste the 3 location blocks above
#
# 4. Test and reload:
#    sudo nginx -t && sudo systemctl reload nginx
#
# 5. Verify:
#    curl -I https://windi-domain.com/docs/
#    curl -I https://windi-domain.com/api-docs/
#    curl -I https://windi-domain.com/specs/
# ══════════════════════════════════════════════════════════════
