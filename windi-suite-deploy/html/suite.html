<script>
  // Polyfill for window.storage (used in artifacts with persistent storage)
  if (!window.storage) {
    const _store = {};
    window.storage = {
      get: async (k) => { if (_store[k]) return { key: k, value: _store[k] }; throw new Error('not found'); },
      set: async (k, v) => { _store[k] = v; return { key: k, value: v }; },
      delete: async (k) => { delete _store[k]; return { key: k, deleted: true }; },
      list: async (prefix) => { const keys = Object.keys(_store).filter(k => !prefix || k.startsWith(prefix)); return { keys }; },
    };
  }
</script>

            display: "flex", alignItems: "center", gap: 6, marginBottom: 16,
          }}>
            <span style={{ fontSize: 13, fontWeight: 600, color: text2, letterSpacing: 0.5 }}>
              Neu
            </span>
            <span style={{
              fontSize: 10, color: text3, fontFamily: "'JetBrains Mono'",
              padding: "1px 5px", borderRadius: 3,
              backgroundColor: isDark ? "#1E2030" : "#F0F1F4",
            }}>
              {templates.length} Vorlagen
            </span>
          </div>

          <div style={{
            display: "grid",
            gridTemplateColumns: `repeat(${Math.min(templates.length, 6)}, minmax(120px, 150px))`,
            gap: 16, marginBottom: 8,
          }}>
            {templates.map((t, i) => (
              <div key={t.id} className="tmpl-card"
                onMouseEnter={() => setHoveredTemplate(t.id)}
                onMouseLeave={() => setHoveredTemplate(null)}
                style={{
                  cursor: "pointer", borderRadius: 10,
                  border: `1px solid ${hoveredTemplate === t.id ? appColor : border}`,
                  backgroundColor: surface, padding: "16px 12px 12px",
                  display: "flex", flexDirection: "column", alignItems: "center",
                  transition: "all 0.25s ease",
                  animation: `fadeUp 0.4s ease ${i * 0.06}s both`,
                  position: "relative", overflow: "hidden",
                }}>
                {/* Governance indicator - only visible in GOV mode */}
                {showGovernance && (
                  <div style={{
                    position: "absolute", top: 6, right: 6,
                    display: "flex", alignItems: "center", gap: 3,
                  }}>
                    <GovernanceDot level={t.governance}/>
                    <span style={{
                      fontSize: 8, fontFamily: "'JetBrains Mono'", color: text3,
                      fontWeight: 500, letterSpacing: 0.3,
                    }}>{t.governance}</span>
                  </div>
                )}
                <DocIcon type={t.icon} color={appColor} size={56}/>
                <span style={{
                  fontSize: 12, fontWeight: 500, color: text1,
                  marginTop: 8, textAlign: "center", lineHeight: 1.3,
                }}>{t.name}</span>
                <span style={{
                  fontSize: 10, color: text3, marginTop: 2, textAlign: "center",
                }}>{t.desc}</span>
              </div>
            ))}
          </div>
        </div>

        {/* Recent documents */}
        <div style={{
          flex: 1, padding: "0 48px 40px",
          animation: "fadeUp 0.5s ease 0.2s both",
        }}>
          <div style={{
            display: "flex", alignItems: "center", justifyContent: "space-between",
            marginBottom: 12,
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
              <span style={{
                fontSize: 13, fontWeight: 600, color: appColor,
                padding: "4px 12px", borderRadius: 20,
                backgroundColor: isDark ? "#1E2030" : "#F0F1F4",
              }}>Zuletzt verwendet</span>
              <span style={{
                fontSize: 13, color: text3, cursor: "pointer",
                padding: "4px 12px", borderRadius: 20,
              }}>Favoriten</span>
              <span style={{
                fontSize: 13, color: text3, cursor: "pointer",
                padding: "4px 12px", borderRadius: 20,
              }}>Mit mir geteilt</span>
            </div>
            {showGovernance && (
              <span style={{
                fontSize: 10, color: gold, fontFamily: "'JetBrains Mono'",
                display: "flex", alignItems: "center", gap: 4,
                animation: "pulseGold 2s ease infinite",
              }}>
                <svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor">
                  <path d="M8 1L2 4v4.5c0 3.5 2.6 6.8 6 7.5 3.4-.7 6-4 6-7.5V4L8 1z"/>
                </svg>
                GOVERNANCE ACTIVE
              </span>
            )}
          </div>

          {/* Table header */}
          <div style={{
            display: "grid",
            gridTemplateColumns: showGovernance ? "1fr 120px 80px 80px 80px" : "1fr 120px 80px",
            padding: "8px 16px", fontSize: 11, color: text3, fontWeight: 500,
            borderBottom: `1px solid ${border}`, letterSpacing: 0.3,
          }}>
            <span>Name</span>
            <span>Änderungsdatum</span>
            {showGovernance && <span>Governance</span>}
            {showGovernance && <span>SGE Score</span>}
            <span>Status</span>
          </div>

          {/* Document rows */}
          {recentDocs.map((doc, i) => (
            <div key={i} className="doc-row"
              onClick={() => setSelectedDoc(doc)}
              style={{
                display: "grid",
                gridTemplateColumns: showGovernance ? "1fr 120px 80px 80px 80px" : "1fr 120px 80px",
                padding: "12px 16px", cursor: "pointer",
                borderBottom: `1px solid ${isDark ? "#1A1D27" : "#F5F5F5"}`,
                borderRadius: 6, transition: "background 0.15s ease",
                animation: `fadeUp 0.3s ease ${0.3 + i * 0.05}s both`,
                alignItems: "center",
              }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <rect x="3" y="1" width="12" height="16" rx="2" fill={appColor} opacity="0.12"/>
                  <rect x="3" y="1" width="12" height="16" rx="2" stroke={appColor} strokeWidth="1" opacity="0.3"/>
                  <line x1="6" y1="6" x2="12" y2="6" stroke={appColor} strokeWidth="1" opacity="0.4" strokeLinecap="round"/>
                  <line x1="6" y1="9" x2="12" y2="9" stroke={appColor} strokeWidth="1" opacity="0.4" strokeLinecap="round"/>
                  <line x1="6" y1="12" x2="10" y2="12" stroke={appColor} strokeWidth="1" opacity="0.4" strokeLinecap="round"/>
                </svg>
                <span style={{ fontSize: 13, fontWeight: 500, color: text1 }}>
                  {doc.name}
                </span>
              </div>
              <span style={{ fontSize: 12, color: text3 }}>{doc.date}</span>
              {showGovernance && (
                <div style={{ display: "flex", alignItems: "center" }}>
                  <GovernanceDot level={doc.governance}/>
                  <span style={{ fontSize: 11, color: text2, fontFamily: "'JetBrains Mono'" }}>
                    {doc.governance}
                  </span>
                </div>
              )}
              {showGovernance && (
                <span style={{
                  fontSize: 11, fontFamily: "'JetBrains Mono'", fontWeight: 500,
                  color: doc.sge > 0.8 ? "#EF4444" : doc.sge > 0.6 ? "#F59E0B" : "#22C55E",
                }}>{doc.sge.toFixed(2)}</span>
              )}
              <SealBadge status={doc.status}/>
            </div>
          ))}
        </div>

        {/* Bottom bar - Governance whisper */}
        <div style={{
          padding: "12px 48px", borderTop: `1px solid ${border}`,
          display: "flex", alignItems: "center", justifyContent: "space-between",
          backgroundColor: isDark ? "#12141C" : "#FAFBFC",
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
            <svg width="14" height="14" viewBox="0 0 16 16" fill={gold} opacity="0.5">
              <path d="M8 1L2 4v4.5c0 3.5 2.6 6.8 6 7.5 3.4-.7 6-4 6-7.5V4L8 1z"/>
            </svg>
            <span style={{
              fontSize: 10, color: text3, fontFamily: "'JetBrains Mono'",
              letterSpacing: 0.3,
            }}>
              Geschützt durch WINDI Governance Layer
            </span>
          </div>
          <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
            <span style={{ fontSize: 10, color: text3, fontFamily: "'JetBrains Mono'" }}>
              ISP: Deutsche Bahn · BaFin · Bundesregierung
            </span>
            <span style={{ fontSize: 10, color: text3, fontFamily: "'JetBrains Mono'" }}>
              Ed25519 · SGE v1.0
            </span>
          </div>
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(WINDISuite));
</script>
</body>
</html>
