<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WINDI Travel · Mapa SVG Curado · Bayern Süd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --klar-bg: #F5F0E0;
    --klar-paper: #EDE5D0;
    --klar-ink: #2A2520;
    --klar-ink-soft: #5C5548;
    --klar-gold: #8B6914;
    --klar-gold-warm: #A8803A;
    --klar-rule: #C4B896;
    --klar-shadow: rgba(42,37,32,.12);
    --font-display: "Bricolage Grotesque", Georgia, serif;
    --font-mono: "JetBrains Mono", ui-monospace, monospace;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--klar-bg);color:var(--klar-ink);font-family:var(--font-display);-webkit-font-smoothing:antialiased}

  /* Grão de papel sobre tudo */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
    background-image:
      radial-gradient(circle at 25% 35%, transparent 0, rgba(139,105,20,.015) 2px, transparent 3px),
      radial-gradient(circle at 75% 65%, transparent 0, rgba(42,37,32,.018) 1px, transparent 2px);
    background-size: 3px 3px, 5px 5px;
    mix-blend-mode: multiply;
  }

  /* ===== HEADER ===== */
  header{
    padding: 28px 40px 20px;
    border-bottom: 1px solid var(--klar-rule);
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 24px;
    position: relative;
    z-index: 2;
  }
  .brand{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--klar-ink-soft);font-weight:500}
  .brand span{color:var(--klar-gold);font-weight:600}
  .title-mark{
    text-align:center;
    font-size: 11px;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--klar-ink-soft);
  }
  .title-mark b{display:block;font-size:22px;letter-spacing:.02em;text-transform:none;color:var(--klar-ink);font-weight:600;margin-top:4px;font-style:italic}
  .stamp{
    justify-self:end;
    font-family:var(--font-mono);
    font-size:10px;
    color:var(--klar-gold);
    border:1px solid var(--klar-gold);
    padding: 6px 10px;
    letter-spacing:.1em;
    transform: rotate(1.5deg);
    background: rgba(139,105,20,.04);
  }

  /* ===== LAYOUT PRINCIPAL — three column ===== */
  .stage{
    display: grid;
    grid-template-columns: 260px 1fr 260px;
    gap: 0;
    min-height: calc(100vh - 120px);
    position: relative;
    z-index: 2;
  }

  /* ===== SIDEBAR ESQUERDA · cidades seladas ===== */
  .sidebar-left{
    padding: 32px 24px;
    border-right: 1px solid var(--klar-rule);
    background: linear-gradient(180deg, transparent, rgba(196,184,150,.08));
  }
  .sidebar-label{
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--klar-ink-soft);
    margin-bottom: 18px;
    padding-bottom: 8px;
    border-bottom: 1px dotted var(--klar-rule);
  }
  .city-list{display:flex;flex-direction:column;gap:18px}
  .city-card{cursor:pointer;transition:transform .2s}
  .city-card:hover{transform:translateX(3px)}
  .city-card .num{
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--klar-gold);
    letter-spacing: .1em;
  }
  .city-card h3{
    font-size: 17px;
    font-weight: 600;
    margin-top: 2px;
    letter-spacing: -.01em;
  }
  .city-card .sub{
    font-size: 11px;
    color: var(--klar-ink-soft);
    font-style: italic;
    margin-top: 2px;
  }
  .city-card .meta{
    display:flex;gap:12px;
    font-family: var(--font-mono);
    font-size: 9px;
    color: var(--klar-ink-soft);
    margin-top: 6px;
    letter-spacing: .05em;
  }
  .city-card .meta b{color:var(--klar-gold);font-weight:500}

  /* ===== CANVAS CENTRAL — O MAPA SVG ===== */
  .canvas{
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse at 50% 45%, rgba(245,240,224,1) 0%, rgba(237,229,208,1) 70%, rgba(220,210,180,.9) 100%);
  }

  /* Cantos decorativos */
  .corner{position:absolute;width:40px;height:40px;z-index:5;opacity:.5}
  .corner-tl{top:14px;left:14px;border-top:1.5px solid var(--klar-gold);border-left:1.5px solid var(--klar-gold)}
  .corner-tr{top:14px;right:14px;border-top:1.5px solid var(--klar-gold);border-right:1.5px solid var(--klar-gold)}
  .corner-bl{bottom:14px;left:14px;border-bottom:1.5px solid var(--klar-gold);border-left:1.5px solid var(--klar-gold)}
  .corner-br{bottom:14px;right:14px;border-bottom:1.5px solid var(--klar-gold);border-right:1.5px solid var(--klar-gold)}

  /* Rosa dos ventos flutuante */
  .compass{
    position:absolute;top:24px;right:24px;
    width: 70px;height:70px;z-index:6;
    opacity:.65;
  }

  /* Legenda escala */
  .scale{
    position:absolute;bottom:24px;left:24px;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing:.12em;
    color: var(--klar-ink-soft);
    z-index:6;
  }
  .scale-bar{
    display:block;width:80px;height:4px;
    background:linear-gradient(to right,var(--klar-ink) 0,var(--klar-ink) 50%,transparent 50%,transparent 100%);
    border:1px solid var(--klar-ink);
    margin-top:4px;
  }

  /* O SVG ocupa o canvas inteiro */
  .map-svg{width:100%;height:100%;display:block}

  /* ===== SIDEBAR DIREITA · polaroids ===== */
  .sidebar-right{
    padding: 32px 24px;
    border-left: 1px solid var(--klar-rule);
    background: linear-gradient(180deg, transparent, rgba(196,184,150,.08));
  }
  .polaroid-stack{display:flex;flex-direction:column;gap:20px;align-items:center;margin-top:18px}
  .polaroid{
    width: 170px;
    background: #FAF6EA;
    padding: 10px 10px 28px;
    box-shadow: 0 3px 0 var(--klar-shadow), 0 8px 16px rgba(42,37,32,.1);
    position: relative;
    transition: transform .3s ease, box-shadow .3s ease;
  }
  .polaroid:hover{transform:rotate(0deg) scale(1.04) !important;box-shadow:0 4px 0 var(--klar-shadow), 0 12px 24px rgba(42,37,32,.15)}
  .polaroid-image{
    width:100%;aspect-ratio: 1/1;position:relative;overflow:hidden;
  }
  .polaroid-image svg{width:100%;height:100%;display:block}
  .polaroid-caption{
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--klar-ink);
    text-align: center;
    margin-top: 10px;
    letter-spacing: .03em;
  }
  .polaroid-seal{
    position:absolute;top:6px;right:6px;
    font-family:var(--font-mono);
    font-size:8px;color:var(--klar-gold);
    letter-spacing:.1em;
  }

  /* ===== FOOTER ===== */
  footer{
    padding: 14px 40px;
    border-top: 1px solid var(--klar-rule);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--klar-ink-soft);
    letter-spacing: .08em;
    position: relative;
    z-index: 2;
  }
  footer b{color:var(--klar-gold);font-weight:500}

  /* ===== MOBILE (390px) ===== */
  @media (max-width: 768px){
    header{padding:18px 16px;grid-template-columns:1fr;gap:10px;text-align:center}
    .stamp{justify-self:center;margin-top:4px}
    .stage{grid-template-columns:1fr;min-height:auto}
    .sidebar-left,.sidebar-right{border:none;border-bottom:1px solid var(--klar-rule);padding:20px 16px}
    .canvas{min-height:420px;border-bottom:1px solid var(--klar-rule)}
    .city-list{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    .polaroid-stack{flex-direction:row;flex-wrap:wrap;justify-content:center}
    .polaroid{width:140px}
    footer{padding:10px 16px;font-size:9px;flex-direction:column;gap:4px;text-align:center}
  }

  /* Fade-in orquestrado */
  @media (prefers-reduced-motion: no-preference){
    @keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    header>*{opacity:0;animation:fu .6s .1s ease-out forwards}
    header>*:nth-child(2){animation-delay:.25s}
    header>*:nth-child(3){animation-delay:.4s}
    .sidebar-left{opacity:0;animation:fu .7s .5s ease-out forwards}
    .sidebar-right{opacity:0;animation:fu .7s .7s ease-out forwards}
    .canvas{opacity:0;animation:fu .9s .3s ease-out forwards}
    .polaroid{opacity:0;animation:fu .5s ease-out forwards}
    .polaroid:nth-child(1){animation-delay:.8s}
    .polaroid:nth-child(2){animation-delay:.95s}
    .polaroid:nth-child(3){animation-delay:1.1s}
    .polaroid:nth-child(4){animation-delay:1.25s}
    .polaroid:nth-child(5){animation-delay:1.4s}
  }
</style>
</head>
<body>

<header>
  <div class="brand">WINDI <span>Travel</span> · Memória Verificável</div>
  <div class="title-mark">
    Mapa Curado · Edição Südbayern
    <b>Bayern · Allgäu · Alpen</b>
  </div>
  <div class="stamp">MAPA 01 / 03</div>
</header>

<main class="stage">

  <!-- SIDEBAR ESQUERDA · 5 cidades -->
  <aside class="sidebar-left">
    <div class="sidebar-label">Cidades Seladas · 2026</div>
    <ul class="city-list" id="cityList"></ul>
  </aside>

  <!-- CANVAS · mapa SVG desenhado à mão -->
  <section class="canvas" id="canvas">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Rosa dos ventos -->
    <svg class="compass" viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">
      <circle cx="35" cy="35" r="28" fill="none" stroke="#8B6914" stroke-width=".8"/>
      <circle cx="35" cy="35" r="22" fill="none" stroke="#8B6914" stroke-width=".4" stroke-dasharray="1,2"/>
      <path d="M35 10 L38 35 L35 33 L32 35 Z" fill="#8B6914"/>
      <path d="M35 60 L38 35 L35 37 L32 35 Z" fill="#2A2520" opacity=".6"/>
      <path d="M10 35 L35 32 L33 35 L35 38 Z" fill="#2A2520" opacity=".5"/>
      <path d="M60 35 L35 32 L37 35 L35 38 Z" fill="#2A2520" opacity=".5"/>
      <text x="35" y="8" text-anchor="middle" font-family="JetBrains Mono" font-size="7" fill="#8B6914" font-weight="600">N</text>
      <text x="35" y="68" text-anchor="middle" font-family="JetBrains Mono" font-size="6" fill="#5C5548">S</text>
      <text x="5" y="37" text-anchor="middle" font-family="JetBrains Mono" font-size="6" fill="#5C5548">W</text>
      <text x="65" y="37" text-anchor="middle" font-family="JetBrains Mono" font-size="6" fill="#5C5548">E</text>
    </svg>

    <!-- O MAPA -->
    <svg class="map-svg" viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <defs>
        <!-- Textura aguarela para áreas -->
        <filter id="watercolor" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="2" seed="3"/>
          <feColorMatrix values="0 0 0 0 0.545  0 0 0 0 0.411  0 0 0 0 0.078  0 0 0 0.08 0"/>
          <feComposite in="SourceGraphic" in2="SourceGraphic" operator="over"/>
        </filter>

        <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="5"/>
          <feDisplacementMap in="SourceGraphic" scale="2.5"/>
        </filter>

        <!-- Gradiente para a Bavaria (área principal) -->
        <radialGradient id="bavariaBg" cx="50%" cy="50%">
          <stop offset="0%" stop-color="#F0E6C8"/>
          <stop offset="100%" stop-color="#E0D4B0"/>
        </radialGradient>

        <!-- Padrão de água (lagos + rios) -->
        <pattern id="water" width="10" height="10" patternUnits="userSpaceOnUse">
          <rect width="10" height="10" fill="#B8CCD8" opacity=".3"/>
          <path d="M0 5 Q2.5 3 5 5 T10 5" stroke="#5C7A8A" stroke-width=".4" fill="none" opacity=".4"/>
        </pattern>

        <!-- Padrão de montanhas (Alpes) -->
        <pattern id="mountains" width="30" height="20" patternUnits="userSpaceOnUse">
          <path d="M0 20 L8 8 L12 14 L18 4 L24 12 L30 20 Z" fill="#8A7A5A" opacity=".25"/>
          <path d="M0 20 L8 8 L12 14 L18 4 L24 12 L30 20" fill="none" stroke="#5C4A2A" stroke-width=".4" opacity=".6"/>
        </pattern>

        <!-- Padrão de floresta -->
        <pattern id="forest" width="12" height="12" patternUnits="userSpaceOnUse">
          <circle cx="3" cy="3" r="1.2" fill="#6B7A4A" opacity=".3"/>
          <circle cx="9" cy="9" r="1" fill="#5A6A3A" opacity=".35"/>
          <circle cx="8" cy="2" r=".8" fill="#7A8A5A" opacity=".25"/>
        </pattern>
      </defs>

      <!-- FUNDO: área da Bavaria aguarelada -->
      <path d="M 60 180 Q 80 140 160 120 Q 260 90 380 100 Q 520 95 640 130 Q 720 155 740 220 Q 745 290 720 360 Q 700 430 640 470 Q 540 500 420 490 Q 280 485 180 450 Q 90 410 60 340 Q 45 260 60 180 Z"
            fill="url(#bavariaBg)" stroke="#8A7A5A" stroke-width="1.2" stroke-dasharray="4,2" opacity=".9" filter="url(#rough)"/>

      <!-- Áustria (canto inferior direito) -->
      <path d="M 600 440 Q 660 430 720 445 Q 760 460 780 500 L 780 560 L 580 560 Q 570 510 600 440 Z"
            fill="#E8DCC0" stroke="#8A7A5A" stroke-width=".8" stroke-dasharray="3,3" opacity=".6"/>
      <text x="720" y="530" font-family="Bricolage Grotesque" font-size="12" fill="#8A7A5A" font-style="italic" opacity=".7">Österreich</text>

      <!-- Suíça (canto inferior esquerdo) -->
      <path d="M 40 440 Q 60 460 80 490 L 80 560 L 30 560 Z"
            fill="#E8DCC0" stroke="#8A7A5A" stroke-width=".8" stroke-dasharray="3,3" opacity=".6"/>
      <text x="40" y="540" font-family="Bricolage Grotesque" font-size="11" fill="#8A7A5A" font-style="italic" opacity=".7">CH</text>

      <!-- Alpes (faixa inferior) — faixa de montanhas estilizadas -->
      <g opacity=".9">
        <path d="M 60 420 L 90 380 L 110 400 L 140 360 L 170 395 L 200 370 L 240 390 L 270 360 L 310 385 L 350 350 L 390 380 L 430 345 L 470 375 L 510 340 L 550 370 L 590 345 L 630 375 L 670 355 L 710 385 L 740 370 L 740 470 L 60 470 Z"
              fill="url(#mountains)" stroke="#5C4A2A" stroke-width=".8" opacity=".85"/>
        <!-- Picos mais altos: Zugspitze, Nebelhorn, Watzmann -->
        <path d="M 150 345 L 170 395 L 130 395 Z" fill="#FAF6EA" stroke="#5C4A2A" stroke-width=".6"/>
        <path d="M 350 335 L 370 385 L 330 385 Z" fill="#FAF6EA" stroke="#5C4A2A" stroke-width=".6"/>
        <path d="M 600 325 L 625 380 L 575 380 Z" fill="#FAF6EA" stroke="#5C4A2A" stroke-width=".6"/>
      </g>

      <!-- Florestas (manchas dispersas) -->
      <ellipse cx="220" cy="200" rx="45" ry="22" fill="url(#forest)" opacity=".7"/>
      <ellipse cx="440" cy="180" rx="55" ry="25" fill="url(#forest)" opacity=".7"/>
      <ellipse cx="600" cy="240" rx="50" ry="28" fill="url(#forest)" opacity=".7"/>

      <!-- Lagos: Bodensee (esquerda), Starnberger See, Königssee -->
      <ellipse cx="110" cy="355" rx="38" ry="14" fill="url(#water)" stroke="#5C7A8A" stroke-width=".6"/>
      <text x="110" y="375" font-family="Bricolage Grotesque" font-size="9" fill="#5C7A8A" text-anchor="middle" font-style="italic">Bodensee</text>

      <ellipse cx="470" cy="310" rx="14" ry="26" fill="url(#water)" stroke="#5C7A8A" stroke-width=".5"/>
      <text x="470" y="346" font-family="Bricolage Grotesque" font-size="8" fill="#5C7A8A" text-anchor="middle" font-style="italic">Starnberger</text>

      <ellipse cx="660" cy="395" rx="10" ry="18" fill="url(#water)" stroke="#5C7A8A" stroke-width=".5"/>
      <text x="660" y="425" font-family="Bricolage Grotesque" font-size="8" fill="#5C7A8A" text-anchor="middle" font-style="italic">Königssee</text>

      <!-- Rio Danúbio (faixa superior) -->
      <path d="M 60 160 Q 200 150 380 165 Q 560 175 740 170" stroke="#5C7A8A" stroke-width="2" fill="none" opacity=".55" stroke-linecap="round"/>
      <text x="200" y="145" font-family="Bricolage Grotesque" font-size="9" fill="#5C7A8A" font-style="italic" opacity=".8">Donau</text>

      <!-- Rio Isar (ligação München) -->
      <path d="M 420 420 Q 440 360 460 290 Q 475 240 495 180" stroke="#5C7A8A" stroke-width="1.4" fill="none" opacity=".5"/>

      <!-- === ESTRADAS PONTILHADAS entre cidades === -->
      <g stroke="#8B6914" stroke-width="1.2" fill="none" stroke-dasharray="3,4" opacity=".55">
        <!-- Kempten → Oberstdorf -->
        <path d="M 195 325 Q 175 360 170 410"/>
        <!-- Kempten → Neuschwanstein -->
        <path d="M 195 325 Q 260 340 320 370"/>
        <!-- Kempten → München -->
        <path d="M 195 325 Q 330 280 470 290"/>
        <!-- München → Berchtesgaden -->
        <path d="M 470 290 Q 570 320 640 380"/>
        <!-- Neuschwanstein → Oberstdorf -->
        <path d="M 320 370 Q 260 395 170 410"/>
      </g>

      <!-- === CIDADES (5 marcadores) ===
           Projecção manual para Bayern:
           Lng 10.0°..13.5° → X 80..740
           Lat 47.3°..48.8° → Y 430..130 (inverso)
      -->
      <!-- Kempten (47.73, 10.32) — primary -->
      <g class="pin" transform="translate(195,325)">
        <circle r="14" fill="rgba(139,105,20,.15)"/>
        <circle r="8" fill="#8B6914" stroke="#FAF6EA" stroke-width="2"/>
        <circle r="3" fill="#FAF6EA"/>
        <text x="0" y="-22" text-anchor="middle" font-family="Bricolage Grotesque" font-size="15" font-weight="700" fill="#2A2520">Kempten</text>
        <text x="0" y="-9" text-anchor="middle" font-family="JetBrains Mono" font-size="7.5" fill="#8B6914" letter-spacing=".1em">◆ SEDE WINDI</text>
      </g>

      <!-- Oberstdorf (47.41, 10.28) -->
      <g class="pin" transform="translate(170,410)">
        <circle r="6" fill="#8B6914" stroke="#FAF6EA" stroke-width="1.5"/>
        <circle r="2" fill="#FAF6EA"/>
        <text x="-12" y="4" text-anchor="end" font-family="Bricolage Grotesque" font-size="13" font-weight="600" fill="#2A2520">Oberstdorf</text>
        <text x="-12" y="16" text-anchor="end" font-family="JetBrains Mono" font-size="7" fill="#5C5548" font-style="italic">Allgäuer Alpen</text>
      </g>

      <!-- Neuschwanstein (47.56, 10.75) -->
      <g class="pin" transform="translate(320,370)">
        <!-- Pequeno ícone de castelo -->
        <path d="M -5 -12 L -5 -4 L -3 -4 L -3 -7 L -1 -7 L -1 -4 L 1 -4 L 1 -7 L 3 -7 L 3 -4 L 5 -4 L 5 -12 L 3 -12 L 3 -10 L 1 -10 L 1 -12 L -1 -12 L -1 -10 L -3 -10 L -3 -12 Z" fill="#8B6914" stroke="#2A2520" stroke-width=".4"/>
        <circle r="6" fill="#8B6914" stroke="#FAF6EA" stroke-width="1.5" cy="0"/>
        <circle r="2" fill="#FAF6EA"/>
        <text x="0" y="20" text-anchor="middle" font-family="Bricolage Grotesque" font-size="13" font-weight="600" fill="#2A2520">Neuschwanstein</text>
      </g>

      <!-- München (48.13, 11.58) — primary -->
      <g class="pin" transform="translate(470,290)">
        <circle r="16" fill="rgba(139,105,20,.15)"/>
        <circle r="9" fill="#8B6914" stroke="#FAF6EA" stroke-width="2"/>
        <circle r="3.5" fill="#FAF6EA"/>
        <text x="0" y="-22" text-anchor="middle" font-family="Bricolage Grotesque" font-size="16" font-weight="700" fill="#2A2520">München</text>
        <text x="0" y="-9" text-anchor="middle" font-family="JetBrains Mono" font-size="7.5" fill="#8B6914" letter-spacing=".1em">◆ BAYERN</text>
      </g>

      <!-- Berchtesgaden (47.63, 13.00) -->
      <g class="pin" transform="translate(640,380)">
        <circle r="6" fill="#8B6914" stroke="#FAF6EA" stroke-width="1.5"/>
        <circle r="2" fill="#FAF6EA"/>
        <text x="10" y="-8" text-anchor="start" font-family="Bricolage Grotesque" font-size="13" font-weight="600" fill="#2A2520">Berchtesgaden</text>
        <text x="10" y="5" text-anchor="start" font-family="JetBrains Mono" font-size="7" fill="#5C5548" font-style="italic">Alpen · Grenze</text>
      </g>

      <!-- Assinatura canónica -->
      <text x="400" y="540" text-anchor="middle" font-family="Bricolage Grotesque" font-size="10" fill="#8B6914" font-style="italic" opacity=".7" letter-spacing=".3em">— WINDI TRAVEL · GENTLY PROVES · SILENTLY SEALS —</text>
    </svg>

    <!-- Escala -->
    <div class="scale">
      ~80 KM
      <span class="scale-bar"></span>
    </div>
  </section>

  <!-- SIDEBAR DIREITA · polaroids Tesoura -->
  <aside class="sidebar-right">
    <div class="sidebar-label">Tesoura Soberana · Postais</div>
    <div class="polaroid-stack" id="polaroidStack"></div>
  </aside>

</main>

<footer>
  <div>🔐 <b>Abordagem:</b> SVG curado à mão · ilustração editorial</div>
  <div>I16 · Creator Cartographic Sovereignty · <b>Mapa 01</b></div>
  <div>🐉 windi-travel.de</div>
</footer>

<script>

const CITIES = [

  {id:"neuschwanstein",name:"Neuschwanstein",subtitle:"Schwangau · Ícone",lat:47.5576,lng:10.7498,sealed:"2026-03-15",receipts:23,primary:false,story:"Selamos a prova."},

  {id:"berchtesgaden",name:"Berchtesgaden",subtitle:"Alpes · Fronteira",lat:47.6309,lng:13.0017,sealed:"2026-03-29",receipts:11,primary:false,story:"Fim do mapa."}
];

  {id:"p2",cityId:"oberstdorf",caption:"Nebelhorn · névoa",rotation:3,c1:"#5C6B7A",c2:"#8A97A5",pattern:"dots"},

// Gerar SVG pattern para polaroid (arte abstracta WINDI)
function polaroidArt(p){
  const patterns = {
    lines: `<defs><pattern id="pat_${p.id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="${p.c1}" stroke-width="1.5"/></pattern></defs><rect width="100" height="100" fill="${p.c2}"/><rect width="100" height="100" fill="url(#pat_${p.id})" opacity=".7"/><circle cx="50" cy="50" r="22" fill="${p.c1}" opacity=".35"/>`,
    dots: `<rect width="100" height="100" fill="${p.c2}"/><g fill="${p.c1}"><circle cx="20" cy="20" r="3"/><circle cx="50" cy="15" r="2"/><circle cx="80" cy="25" r="2.5"/><circle cx="30" cy="50" r="4"/><circle cx="70" cy="55" r="3"/><circle cx="15" cy="80" r="2"/><circle cx="55" cy="85" r="3.5"/><circle cx="85" cy="75" r="2.5"/></g><path d="M0 65 Q50 50 100 70 L100 100 L0 100 Z" fill="${p.c1}" opacity=".4"/>`,
    triangles: `<rect width="100" height="100" fill="${p.c2}"/><polygon points="50,20 80,75 20,75" fill="${p.c1}"/><polygon points="30,40 60,75 10,75" fill="${p.c1}" opacity=".6"/><circle cx="75" cy="30" r="8" fill="${p.c2}" stroke="${p.c1}" stroke-width="1.5"/>`,
    waves: `<rect width="100" height="100" fill="${p.c2}"/><path d="M0 40 Q25 30 50 40 T100 40 L100 60 Q75 70 50 60 T0 60 Z" fill="${p.c1}" opacity=".6"/><path d="M0 70 Q25 60 50 70 T100 70 L100 90 L0 90 Z" fill="${p.c1}"/><circle cx="75" cy="25" r="10" fill="${p.c1}" opacity=".7"/>`,
    circles: `<rect width="100" height="100" fill="${p.c2}"/><circle cx="50" cy="50" r="35" fill="none" stroke="${p.c1}" stroke-width="1"/><circle cx="50" cy="50" r="24" fill="none" stroke="${p.c1}" stroke-width="1"/><circle cx="50" cy="50" r="14" fill="${p.c1}" opacity=".5"/><path d="M0 70 Q50 55 100 70 L100 100 L0 100 Z" fill="${p.c1}" opacity=".7"/>`
  };
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${patterns[p.pattern] || patterns.dots}</svg>`;
}

// Renderizar polaroids
const pStack = document.getElementById("polaroidStack");
POLAROIDS.forEach(p=>{
  const div = document.createElement("div");
  div.className = "polaroid";
  div.style.transform = `rotate(${p.rotation}deg)`;
  div.innerHTML = `
    <div class="polaroid-seal">◆ SEAL</div>
    <div class="polaroid-image">${polaroidArt(p)}</div>
    <div class="polaroid-caption">${p.caption}</div>
  `;
  pStack.appendChild(div);
});
