<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WINDI Travel · Map Comparator</title>
<style>
:root {
  --bg: #0A0A10;
  --gold: #C9A84C;
  --text: #E8E6E1;
  --border: #1A1A24;
  --card-bg: #12121A;
  --card-hover: #1A1A24;
}
[data-theme="klar"] {
  --bg: #FAFAF8;
  --gold: #8B7424;
  --text: #1A1A1A;
  --border: #E0DED8;
  --card-bg: #FFFFFF;
  --card-hover: #F5F0E0;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Bricolage Grotesque', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 40px 20px;
}
.container { max-width: 640px; margin: 0 auto; }
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--gold);
}
h1 { font-size: 22px; font-weight: 800; }
.controls { display: flex; gap: 12px; align-items: center; }
.lang-toggle, .theme-toggle {
  display: flex;
  gap: 4px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px;
}
.lang-toggle button, .theme-toggle button {
  background: transparent;
  border: none;
  color: var(--text);
  padding: 6px 10px;
  cursor: pointer;
  border-radius: 4px;
  font-size: 12px;
  font-weight: 600;
  opacity: 0.5;
  transition: all 0.2s;
}
.lang-toggle button.active, .theme-toggle button.active {
  background: var(--gold);
  color: var(--bg);
  opacity: 1;
}
.lang-toggle button:hover, .theme-toggle button:hover { opacity: 0.8; }
ul { list-style: none; }
li { margin: 16px 0; }
a.map-link {
  display: block;
  padding: 20px 24px;
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  text-decoration: none;
  color: var(--text);
  font-weight: 600;
  transition: all 0.2s;
}
a.map-link:hover {
  background: var(--card-hover);
  border-color: var(--gold);
  transform: translateX(4px);
}
a.map-link.featured {
  background: var(--gold);
  color: var(--bg);
  border-color: var(--gold);
}
a.map-link.featured:hover {
  background: var(--gold);
  opacity: 0.9;
}
.num {
  color: var(--gold);
  margin-right: 12px;
  font-family: 'JetBrains Mono', monospace;
}
a.map-link.featured .num { color: var(--bg); }
.desc {
  display: block;
  font-size: 13px;
  font-weight: 400;
  opacity: 0.7;
  margin-top: 6px;
}
footer {
  margin-top: 48px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
  font-size: 12px;
  opacity: 0.6;
  text-align: center;
}
footer code {
  font-family: 'JetBrains Mono', monospace;
  background: var(--card-bg);
  padding: 2px 6px;
  border-radius: 4px;
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
</head>
<body>
<div class="container">
  <header>
    <h1 data-i18n="title">Map Comparator · Bayern Süd</h1>
    <div class="controls">
      <div class="lang-toggle">
        <button data-lang="de">DE</button>
        <button data-lang="en">EN</button>
        <button data-lang="pt">PT</button>
      </div>
      <div class="theme-toggle">
        <button data-theme-btn="noir" title="NOIR">●</button>
        <button data-theme-btn="klar" title="KLAR">○</button>
      </div>
    </div>
  </header>

  <ul>
    <li>
      <a href="01-svg-curado.html" class="map-link">
        <span class="num">01</span><span data-i18n="map1_title">SVG Curated</span>
        <span class="desc" data-i18n="map1_desc">Hand-drawn editorial illustration</span>
      </a>
    </li>
    <li>
      <a href="02-leaflet-osm.html" class="map-link">
        <span class="num">02</span><span data-i18n="map2_title">Leaflet + OSM</span>
        <span class="desc" data-i18n="map2_desc">KLAR theme with OpenStreetMap</span>
      </a>
    </li>
    <li>
      <a href="03-maplibre-gl.html" class="map-link">
        <span class="num">03</span><span data-i18n="map3_title">MapLibre GL</span>
        <span class="desc" data-i18n="map3_desc">Cinematic terrain rendering</span>
      </a>
    </li>
    <li>
      <a href="03-v2-berlin-pitch.html" class="map-link featured">
        <span class="num">★</span><span data-i18n="map4_title">Berlin Pitch v2</span>
        <span class="desc" data-i18n="map4_desc">6 refinements + Ledger LIVE integration</span>
      </a>
    </li>
  </ul>

  <footer>
    <p>WINDI Travel · <code>I16</code> <span data-i18n="footer">Creator Cartographic Sovereignty</span></p>
  </footer>
</div>

<script>
const i18n = {
  de: {
    title: "Kartenvergleich · Bayern Süd",
    map1_title: "SVG Kuratiert",
    map1_desc: "Handgezeichnete redaktionelle Illustration",
    map2_title: "Leaflet + OSM",
    map2_desc: "KLAR-Thema mit OpenStreetMap",
    map3_title: "MapLibre GL",
    map3_desc: "Kinematische Geländedarstellung",
    map4_title: "Berlin Pitch v2",
    map4_desc: "6 Verfeinerungen + Ledger LIVE Integration",
    footer: "Kartographische Souveränität des Schöpfers"
  },
  en: {
    title: "Map Comparator · Bayern Süd",
    map1_title: "SVG Curated",
    map1_desc: "Hand-drawn editorial illustration",
    map2_title: "Leaflet + OSM",
    map2_desc: "KLAR theme with OpenStreetMap",
    map3_title: "MapLibre GL",
    map3_desc: "Cinematic terrain rendering",
    map4_title: "Berlin Pitch v2",
    map4_desc: "6 refinements + Ledger LIVE integration",
    footer: "Creator Cartographic Sovereignty"
  },
  pt: {
    title: "Comparador de Mapas · Bayern Süd",
    map1_title: "SVG Curado",
    map1_desc: "Ilustração editorial desenhada à mão",
    map2_title: "Leaflet + OSM",
    map2_desc: "Tema KLAR com OpenStreetMap",
    map3_title: "MapLibre GL",
    map3_desc: "Renderização cinematográfica de terreno",
    map4_title: "Berlin Pitch v2",
    map4_desc: "6 refinamentos + integração Ledger LIVE",
    footer: "Soberania Cartográfica do Criador"
  }
};

function getLang() {
  const stored = localStorage.getItem('windi-lang');
  if (stored && i18n[stored]) return stored;
  const browser = navigator.language.slice(0,2).toLowerCase();
  if (i18n[browser]) return browser;
  return 'en';
}

function setLang(lang) {
  localStorage.setItem('windi-lang', lang);
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (i18n[lang][key]) el.textContent = i18n[lang][key];
  });
  document.querySelectorAll('.lang-toggle button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.lang === lang);
  });
}

function getTheme() {
  return localStorage.getItem('windi-theme') || 'noir';
}

function setTheme(theme) {
  localStorage.setItem('windi-theme', theme);
  document.documentElement.dataset.theme = theme;
  document.querySelectorAll('.theme-toggle button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.themeBtn === theme);
  });
}

// Init
document.querySelectorAll('.lang-toggle button').forEach(btn => {
  btn.addEventListener('click', () => setLang(btn.dataset.lang));
});
document.querySelectorAll('.theme-toggle button').forEach(btn => {
  btn.addEventListener('click', () => setTheme(btn.dataset.themeBtn));
});

setTheme(getTheme());
setLang(getLang());
</script>
</body>
</html>
