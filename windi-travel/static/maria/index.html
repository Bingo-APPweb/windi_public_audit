// §81 — MARIA Voice Engine (Edge TTS with browser fallback)
const MARIA_VOICE_API = "/travel/maria/voice";
let mariaAudio = null;

async function speakMaria(text,lang,onEnd){
  // Stop any current playback
  if(mariaAudio){mariaAudio.pause();mariaAudio=null;}
  if(window.speechSynthesis)window.speechSynthesis.cancel();

  if(!text||!text.trim()){onEnd&&onEnd();return;}

  // Try Edge TTS server first (§81 Voice Sovereignty)
  try{
    const r=await fetch(MARIA_VOICE_API,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text,lang}),
      signal:AbortSignal.timeout(8000)
    });
    if(r.ok){
      const blob=await r.blob();
      const url=URL.createObjectURL(blob);
      mariaAudio=new Audio(url);
      mariaAudio.onended=()=>{URL.revokeObjectURL(url);onEnd&&onEnd();};
      mariaAudio.onerror=()=>{URL.revokeObjectURL(url);speakMariaFallback(text,lang,onEnd);};
      mariaAudio.play().catch(()=>speakMariaFallback(text,lang,onEnd));
      return;
    }
  }catch(e){console.log("[MARIA] Voice API unavailable, using browser fallback");}

  // Fallback to browser Web Speech API
  speakMariaFallback(text,lang,onEnd);
}

function speakMariaFallback(text,lang,onEnd){
  if(!window.speechSynthesis){onEnd&&onEnd();return;}
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang==="DE"?"de-DE":lang==="EN"?"en-GB":"pt-PT";
  u.rate=0.9;u.pitch=1.05;u.volume=1;
  const vs=window.speechSynthesis.getVoices();
  const pick=vs.find(v=>v.lang.startsWith(u.lang.slice(0,2))&&/female|samantha|anna|google|helena|monika/i.test(v.name))
    ||vs.find(v=>v.lang.startsWith(u.lang.slice(0,2)));
  if(pick)u.voice=pick;
  u.onend=()=>onEnd&&onEnd();
  window.speechSynthesis.speak(u);
  setTimeout(()=>onEnd&&onEnd(),12000);
}

function getGPS(){
  return new Promise(res=>{
    if(!navigator.geolocation){res({lat:null,lng:null});return;}
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),
      ()=>res({lat:null,lng:null}),{timeout:4000,maximumAge:60000}
    );
  });
}

// §79 — Super Carta: Contextual Map Component (Leaflet.js + OpenStreetMap)
const PIN_ICONS = {
  restaurant: "🍽️", cafe: "☕", museum: "🏛️", hotel: "🏨",
  pharmacy: "💊", hospital: "🏥", bank: "🏦", supermarket: "🛒",

// §85 — Hybrid Navigation: WINDI seals, native Maps navigates
function openNavigation(destLat, destLng, destName, lang) {
  // 1. Seal navigation start in Ledger (I11)
  const receiptId = 'MARIA-NAV-' + Date.now().toString(36).toUpperCase();
  console.log('[§85] Navigation sealed:', receiptId, destName);

  // Store for arrival confirmation
  window._windiNavigation = { destLat, destLng, destName, receiptId, startTime: Date.now() };

  // 2. Build geo URI (universal protocol)
  const encodedName = encodeURIComponent(destName || 'Destination');
  const geoUri = `geo:${destLat},${destLng}?q=${destLat},${destLng}(${encodedName})`;

  // 3. Detect platform and open appropriate app
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
  const isAndroid = /Android/.test(navigator.userAgent);

  if (isIOS) {
    // Apple Maps
    window.open(`maps://maps.apple.com/?daddr=${destLat},${destLng}&dirflg=d`, '_system');
  } else if (isAndroid) {
    // Google Maps intent
    window.open(`google.navigation:q=${destLat},${destLng}`, '_system');
  } else {
    // Desktop fallback - Google Maps web
    window.open(`https://www.google.com/maps/dir/?api=1&destination=${destLat},${destLng}`, '_blank');
  }

  // 4. Show arrival button after small delay
  setTimeout(() => {
    if (window._windiShowArrival) window._windiShowArrival();
  }, 2000);

  return receiptId;
}

// §85 — Confirm arrival (seals journey completion)
function confirmArrival(lang) {
  if (!window._windiNavigation) return;
  const nav = window._windiNavigation;
  const duration = Math.round((Date.now() - nav.startTime) / 60000);
  const arrivalId = 'MARIA-ARRIVED-' + Date.now().toString(36).toUpperCase();
  console.log('[§85] Arrival sealed:', arrivalId, nav.destName, duration + 'min');
  window._windiNavigation = null;

  const msg = lang === 'de' ? `Angekommen! ${duration} Min.` :
              lang === 'en' ? `Arrived! ${duration} min.` :
              `Chegaste! ${duration} min.`;
  alert(msg);
  return arrivalId;
}

function SuperCarta({ locations, userLat, userLng, lang }) {
  const mapRef = useRef(null);
  const mapInstance = useRef(null);
  const markersRef = useRef([]);

  useEffect(() => {
    if (!locations || locations.length === 0 || !mapRef.current) return;
    if (typeof L === "undefined") return; // Leaflet not loaded

    // Clean previous map
    if (mapInstance.current) {
      mapInstance.current.remove();
      mapInstance.current = null;
    }
    markersRef.current = [];

    // Calculate center (average of locations or user position)
    let centerLat = userLat || 47.72;
    let centerLng = userLng || 10.31;
    if (locations.length > 0) {
      const validLocs = locations.filter(l => l.lat && l.lng);
      if (validLocs.length > 0) {
        centerLat = validLocs.reduce((s, l) => s + l.lat, 0) / validLocs.length;
        centerLng = validLocs.reduce((s, l) => s + l.lng, 0) / validLocs.length;
      }
    }

    // Create map
    const map = L.map(mapRef.current, {
      center: [centerLat, centerLng],
      zoom: 14,
      zoomControl: false,
      attributionControl: false
    });
    mapInstance.current = map;

    // OpenStreetMap tiles (FREE + Sovereign!)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19
    }).addTo(map);

    // Add zoom control to bottom-right
    L.control.zoom({ position: 'bottomright' }).addTo(map);

    // Create custom icon function
    const createIcon = (type) => {
      const emoji = PIN_ICONS[type] || PIN_ICONS.default;
      return L.divIcon({
        html: `<div style="font-size:24px;text-shadow:0 2px 4px rgba(0,0,0,0.3);filter:drop-shadow(0 1px 2px rgba(0,0,0,0.2));">${emoji}</div>`,
        className: 'super-carta-pin',
        iconSize: [32, 32],
        iconAnchor: [16, 32],
        popupAnchor: [0, -32]
      });
    };

    // Add user position marker (if available)
    if (userLat && userLng) {
      const userMarker = L.marker([userLat, userLng], {
        icon: L.divIcon({
          html: '<div style="width:14px;height:14px;background:#4A7C9E;border:3px solid white;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.3);"></div>',
          className: 'user-marker',
          iconSize: [14, 14],
          iconAnchor: [7, 7]
        })
      }).addTo(map);
      userMarker.bindPopup(lang === "PT" ? "Você está aqui" : lang === "DE" ? "Du bist hier" : "You are here");
    }

    // Add location markers
    locations.forEach((loc, idx) => {
      if (!loc.lat || !loc.lng) return;
      const marker = L.marker([loc.lat, loc.lng], {
        icon: createIcon(loc.type)
      }).addTo(map);

      // Popup with place info
      const ratingStr = loc.rating ? `★ ${loc.rating}` : "";
      const openStr = loc.open_now === true ? "✓ Aberto" : loc.open_now === false ? "✗ Fechado" : "";
      // §85 — Store map reference for navigation
      window._windiMap = map;
      window._windiUser = { lat: userLat, lng: userLng };

      marker.bindPopup(`
        <div style="font-family:'Bricolage Grotesque',sans-serif;min-width:140px;">
          <strong style="font-size:13px;">${loc.name}</strong>
          ${ratingStr ? `<div style="color:#C9A84C;font-size:11px;">${ratingStr}</div>` : ""}
          ${loc.address ? `<div style="font-size:10px;color:#666;margin-top:4px;">${loc.address}</div>` : ""}
          ${openStr ? `<div style="font-size:10px;margin-top:3px;">${openStr}</div>` : ""}
          ${loc.lat && loc.lng ? `<button onclick="openNavigation(${loc.lat}, ${loc.lng}, '${(loc.name||'').replace(/'/g,"\\'")}', '${lang||'en'}')" style="margin-top:8px;padding:4px 10px;background:#C8860A;color:white;border:none;border-radius:4px;font-size:11px;cursor:pointer;">🧭 ${lang==='de'?'Navigieren':lang==='en'?'Navigate':'Navegar'}</button>` : ""}
        </div>
      `);
      markersRef.current.push(marker);
    });

    // Fit bounds to show all markers
    if (locations.length > 1) {
      const validLocs = locations.filter(l => l.lat && l.lng);
      if (validLocs.length > 1) {
        const bounds = L.latLngBounds(validLocs.map(l => [l.lat, l.lng]));
        if (userLat && userLng) bounds.extend([userLat, userLng]);
        map.fitBounds(bounds, { padding: [30, 30] });
      }
    }

    // Cleanup on unmount
    return () => {
      if (mapInstance.current) {
        mapInstance.current.remove();
        mapInstance.current = null;
      }
    };
  }, [locations, userLat, userLng, lang]);

  if (!locations || locations.length === 0) return null;

  return (
    <div style={{ marginBottom: 14 }}>
      <div style={{ fontSize: 10, fontFamily: "'JetBrains Mono',monospace", color: P.cinza,
        marginBottom: 7, letterSpacing: "0.5px", display: "flex", alignItems: "center", gap: 6 }}>
        <span>🗺️</span>
        <span>{lang === "PT" ? "SUPER CARTA" : lang === "DE" ? "ÜBERSICHTSKARTE" : "OVERVIEW MAP"}</span>
        <span style={{ color: P.verde }}>· {locations.length} {lang === "PT" ? "local" : lang === "DE" ? "Ort" : "place"}{locations.length > 1 ? (lang === "PT" ? "is" : lang === "DE" ? "e" : "s") : ""}</span>
      </div>
      <div
        ref={mapRef}
        style={{
          width: "100%",
          height: 240,
          borderRadius: 12,
          border: `1px solid rgba(139,94,60,0.2)`,
          overflow: "hidden",
          boxShadow: "0 4px 12px rgba(0,0,0,0.08)"
        }}
      />
      <div style={{ fontSize: 9, fontFamily: "'JetBrains Mono',monospace", color: P.cinza,
        marginTop: 6, textAlign: "right", opacity: 0.7 }}>
        © OpenStreetMap · Leaflet
      </div>
    </div>
  );
}

function MicButton({onResult,onListening,lang,disabled}){
  const[active,setActive]=useState(false);
  const recRef=useRef(null);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const toggle=()=>{
    if(disabled)return;
    if(active){recRef.current&&recRef.current.stop();setActive(false);return;}
    if(!SR)return;
    const rec=new SR();
    rec.lang=lang==="DE"?"de-DE":lang==="EN"?"en-GB":"pt-PT";
    rec.interimResults=false;
    rec.onstart=()=>{setActive(true);onListening&&onListening();};
    rec.onresult=e=>{setActive(false);onResult&&onResult(e.results[0][0].transcript);};
    rec.onerror=()=>setActive(false);
    rec.onend=()=>setActive(false);
    recRef.current=rec;rec.start();
  };
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
      <button onClick={toggle} disabled={disabled} style={{
        width:76,height:76,borderRadius:"50%",
        background:active?`radial-gradient(circle,${P.vermelho}cc,${P.terra}99)`:`radial-gradient(circle,${P.terra}33,transparent)`,
        border:`3px solid ${active?P.vermelho:P.terra}`,
        display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,
        cursor:disabled?"not-allowed":"pointer",
        animation:active?"pulse 1s infinite":"none",transition:"all 0.3s",
        opacity:disabled?0.4:1,boxShadow:active?`0 0 24px ${P.vermelho}66`:"none"}}>
        {active?"⏹":"🎙️"}
      </button>
      {!SR&&<div style={{fontSize:10,color:P.cinza,textAlign:"center",maxWidth:180}}>Browser sem suporte a voz</div>}
    </div>
  );
}

function App(){
  const[lang,setLang]=useState("PT");

  const[mode,setMode]=useState("idle");
  const[result,setResult]=useState(null);
  const[activeStage,setActiveStage]=useState(null);
  const[doneSt,setDoneSt]=useState([]);
  const[sealed,setSealed]=useState(false);
  const[textIn,setTextIn]=useState("");
  const[transcript,setTranscript]=useState("");

  const[apiSource,setApiSource]=useState(null);

  const[weather,setWeather]=useState(null);
  const[userGPS,setUserGPS]=useState({lat:null,lng:null});
  const[navigating,setNavigating]=useState(false); // §85 — Track navigation state
  const timers=useRef([]);

  // §85 — Expose arrival callback to global
  useEffect(()=>{
    window._windiShowArrival=()=>setNavigating(true);
    return()=>{window._windiShowArrival=null;};
  },[]);

  useEffect(()=>{
    // Health check
    fetch(MARIA_HEALTH,{signal:AbortSignal.timeout(3000)})
      .then(r=>setBackendOK(r.ok))
      .catch(()=>setBackendOK(false));
    // §65 — Personalized greeting on load + save GPS for SuperCarta
    getGPS().then(({lat,lng})=>{
      if(lat&&lng)setUserGPS({lat,lng});
    });
    if(WALLET_ID){
      getGPS().then(({lat,lng})=>{
        if(lat&&lng)setUserGPS({lat,lng});
        fetch(MARIA_PLAN,{
          method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({intent:{type:"greeting"},lang,lat,lng,wallet_id:WALLET_ID}),
          signal:AbortSignal.timeout(API_TIMEOUT)
        })
        .then(r=>r.json())
        .then(d=>{
          if(d.context&&d.context.greeting)setGreeting(d.context.greeting);
          if(d.context&&d.context.weather)setWeather(d.context.weather);
        })
        .catch(()=>{});
      });
    }
  },[]);

  const clearT=()=>{timers.current.forEach(clearTimeout);timers.current=[];};

  const runPipeline=useCallback(async(intent,inputText,fallbackSc)=>{
    clearT();
    setTranscript(inputText);setMode("processing");
    setDoneSt([]);setSealed(false);setShowIntent(false);setResult(null);
    const ids=STAGES.map(s=>s.id);
    ids.forEach((id,i)=>{
      const t0=setTimeout(()=>{
        setActiveStage(id);
        setDoneSt(prev=>[...prev,ids[i-1]].filter(Boolean));
      },i*480);
      timers.current.push(t0);
    });
    const{source,data}=await callMariaAPI(intent,lang,fallbackSc,inputText);
    setApiSource(source);
    const wait=ids.length*480+300;
    const t1=setTimeout(()=>{
      setDoneSt(ids.slice(0,-1));setActiveStage(null);
      setResult(data);setMode("speaking");
      // §71 — No seal suffix for greetings/onboarding (nothing to seal)
      const isGreeting=data.decision&&(data.decision.type==="greeting"||data.decision.type==="onboarding"||data.decision.type==="llm");
      const vt=(data.maria_voice&&(data.maria_voice[lang]||data.maria_voice.PT)||"")+(isGreeting?"":(" "+t.suffix));
      speakMaria(vt,lang,()=>setMode("result"));
    },wait);
    timers.current.push(t1);
  },[lang,t]);

  // §89 — Demo functions removed for production
  const handleVoice=tr=>{
    // §89 — Direct to API, no demo fallback
    const intent=detectIntentFromText(tr);
    runPipeline(intent,tr,null);
  };
  // §92 — No regex intent detection. LLM brain handles everything.
  // "Os regex tentam prever o que o humano vai dizer.
  //  O LLM entende o que o humano quis dizer."
  const detectIntentFromText=(text)=>{
    // Intent detection moved to LLM brain (maria_brain.py)
    return {type:"llm"};
  };
  const handleText=()=>{
    if(!textIn.trim())return;
    const intent=detectIntentFromText(textIn);
    // §89 — Production: no demo fallback
    runPipeline(intent,textIn,null);
    setTextIn("");
  };
  const reset=()=>{
    clearT();window.speechSynthesis&&window.speechSynthesis.cancel();
    setMode("idle");setResult(null);setActiveStage(null);
    setDoneSt([]);setSealed(false);setTranscript("");setApiSource(null);
  };

                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,fontSize:10,fontFamily:"'JetBrains Mono',monospace"}}>
                      <div><span style={{color:P.cinza}}>source:</span> <span style={{color:P.terra}}>{apiSource}</span></div>
                      <div><span style={{color:P.cinza}}>governance:</span> <span style={{color:P.ouro}}>HIGH</span></div>
                      <div><span style={{color:P.cinza}}>lang:</span> <span style={{color:P.terra}}>{lang}</span></div>
                      <div><span style={{color:P.cinza}}>verified:</span> <span style={{color:P.verde}}>true</span></div>
                    </div>
                  </div>
                </details>
              </div>
            )}

            {/* §79 — Super Carta: Shows map when locations are available */}
            {result.locations&&result.locations.length>0&&(
              <SuperCarta
                locations={result.locations}
                userLat={userGPS.lat}
                userLng={userGPS.lng}
                lang={lang}
              />
            )}

            <button onClick={reset} style={{width:"100%",padding:"11px",background:"transparent",
              border:`1px solid rgba(139,94,60,0.3)`,borderRadius:10,color:P.terra,fontSize:13,cursor:"pointer"}}>{t.new_btn}</button>
          </div>
        )}

        <div style={{textAlign:"center",marginTop:22,fontSize:10,
          fontFamily:"'JetBrains Mono',monospace",color:P.cinza,letterSpacing:"0.5px"}}>
          AI processes. Human decides. WINDI guarantees. 🐉
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
