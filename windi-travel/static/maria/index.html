function speakMaria(text,lang,onEnd){
  if(!window.speechSynthesis){onEnd&&onEnd();return;}
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=lang==="DE"?"de-DE":lang==="EN"?"en-GB":"pt-PT";
  u.rate=0.9;u.pitch=1.05;u.volume=1;
  const vs=window.speechSynthesis.getVoices();
  const pick=vs.find(v=>v.lang.startsWith(u.lang.slice(0,2))&&/female|samantha|anna|google|helena|monika/i.test(v.name))
    ||vs.find(v=>v.lang.startsWith(u.lang.slice(0,2)));
  if(pick)u.voice=pick;
  u.onend=()=>onEnd&&onEnd();
  window.speechSynthesis.speak(u);
  setTimeout(()=>onEnd&&onEnd(),9000);
}

function getGPS(){
  return new Promise(res=>{
    if(!navigator.geolocation){res({lat:null,lng:null});return;}
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude,lng:p.coords.longitude}),
      ()=>res({lat:null,lng:null}),{timeout:4000,maximumAge:60000}
    );
  });
}

async function callMariaAPI(intent,lang,fallbackSc){
  const{lat,lng}=await getGPS();
  try{
    const ctrl=new AbortController();
    const tid=setTimeout(()=>ctrl.abort(),API_TIMEOUT);
    const r=await fetch(MARIA_API,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({intent,lang,lat,lng}),signal:ctrl.signal,
    });
    clearTimeout(tid);
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    return{source:"live",data:await r.json()};
  }catch(e){
    return{source:"fallback",data:{
      request_id:"demo-"+Math.random().toString(36).slice(2,10),
      decision:fallbackSc.s,context:fallbackSc.ctx,
      maria_voice:{PT:fallbackSc.voice,DE:fallbackSc.voice,EN:fallbackSc.voice},
      intent_parsed:intent,ledger_receipt_id:null,sovereign_mode:true,
      timestamp:new Date().toISOString(),
    }};
  }
}

}

function MicButton({onResult,onListening,lang,disabled}){
  const[active,setActive]=useState(false);
  const recRef=useRef(null);
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const toggle=()=>{
    if(disabled)return;
    if(active){recRef.current&&recRef.current.stop();setActive(false);return;}
    if(!SR)return;
    const rec=new SR();
    rec.lang=lang==="DE"?"de-DE":lang==="EN"?"en-GB":"pt-PT";
    rec.interimResults=false;
    rec.onstart=()=>{setActive(true);onListening&&onListening();};
    rec.onresult=e=>{setActive(false);onResult&&onResult(e.results[0][0].transcript);};
    rec.onerror=()=>setActive(false);
    rec.onend=()=>setActive(false);
    recRef.current=rec;rec.start();
  };
  return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
      <button onClick={toggle} disabled={disabled} style={{
        width:76,height:76,borderRadius:"50%",
        background:active?`radial-gradient(circle,${P.vermelho}cc,${P.terra}99)`:`radial-gradient(circle,${P.terra}33,transparent)`,
        border:`3px solid ${active?P.vermelho:P.terra}`,
        display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,
        cursor:disabled?"not-allowed":"pointer",
        animation:active?"pulse 1s infinite":"none",transition:"all 0.3s",
        opacity:disabled?0.4:1,boxShadow:active?`0 0 24px ${P.vermelho}66`:"none"}}>
        {active?"⏹":"🎙️"}
      </button>
      {!SR&&<div style={{fontSize:10,color:P.cinza,textAlign:"center",maxWidth:180}}>Browser sem suporte a voz</div>}
    </div>
  );
}

    },wait);
    timers.current.push(t1);
  },[lang,t]);

          <div style={{animation:"fadeIn 0.4s ease"}}>
            <div style={{textAlign:"center",padding:"18px 0 14px"}}>
              <div style={{fontSize:10,color:P.cinza,fontFamily:"'JetBrains Mono',monospace",
                letterSpacing:"1px",marginBottom:6,textTransform:"uppercase"}}>{t.tagline}</div>
              <div style={{fontSize:19,fontWeight:900,color:P.noite,lineHeight:1.2,
                maxWidth:270,margin:"0 auto 18px"}}>{t.headline}</div>
              <MicButton onResult={handleVoice} onListening={()=>setMode("listening")} lang={lang} disabled={false}/>
              <div style={{fontSize:11,color:P.cinza,marginTop:9,fontFamily:"'JetBrains Mono',monospace"}}>{t.tap_mic}</div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10,margin:"14px 0"}}>
              <div style={{flex:1,height:1,background:"rgba(139,94,60,0.15)"}}/>
              <span style={{fontSize:10,color:P.cinza,fontFamily:"'JetBrains Mono',monospace"}}>ou</span>
              <div style={{flex:1,height:1,background:"rgba(139,94,60,0.15)"}}/>
            </div>
            <div style={{marginBottom:14}}>
              <div style={{fontSize:10,fontFamily:"'JetBrains Mono',monospace",color:P.cinza,marginBottom:8,letterSpacing:"0.5px"}}>{t.demos_label}</div>
              {t.scenarios.map((s,i)=>(
                <button key={i} onClick={()=>handleDemo(s)} style={{
                  width:"100%",textAlign:"left",background:"white",
                  border:`1px solid rgba(139,94,60,0.15)`,borderRadius:10,
                  padding:"10px 13px",marginBottom:6,cursor:"pointer",
                  display:"flex",alignItems:"center",gap:10}}>
                  <span style={{fontSize:16}}>🎙️</span>
                  <span style={{fontSize:13,color:P.noite,lineHeight:1.3}}>"{s.input}"</span>
                </button>
              ))}
            </div>
            <div style={{marginBottom:18}}>
              <div style={{fontSize:10,fontFamily:"'JetBrains Mono',monospace",color:P.cinza,marginBottom:7,letterSpacing:"0.5px"}}>{t.or_write}</div>
              <div style={{display:"flex",gap:7}}>
                <input value={textIn} onChange={e=>setTextIn(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&handleText()}
                  placeholder={t.input_ph}
                  style={{flex:1,padding:"10px 11px",border:`1px solid rgba(139,94,60,0.25)`,
                    borderRadius:8,fontSize:13,fontFamily:"'Bricolage Grotesque',sans-serif",
                    background:"white",color:P.noite,outline:"none"}}/>
                <button onClick={handleText} style={{padding:"10px 15px",background:P.terra,
                  color:"white",border:"none",borderRadius:8,fontSize:17,cursor:"pointer"}}>→</button>
              </div>
            </div>
          </div>
        )}

        {/* LISTENING */}
        {mode==="listening"&&(
          <div style={{textAlign:"center",padding:"40px 0",animation:"fadeIn 0.3s ease"}}>
            <WaveAnim color={P.terra} bars={5}/>
            <div style={{fontSize:15,fontWeight:700,color:P.terra,marginTop:14}}>{t.listening}</div>
          </div>
        )}

        {/* PROCESSING */}
        {mode==="processing"&&(
          <div style={{animation:"fadeIn 0.3s ease"}}>
            <div style={{background:"rgba(201,168,76,0.08)",border:`1px solid ${P.ouro}44`,
              borderRadius:10,padding:"11px 13px",marginBottom:14,
              fontStyle:"italic",color:P.terra,fontSize:13,lineHeight:1.4}}>
              "{transcript}"
            </div>
            <div style={{textAlign:"center",color:P.cinza,fontSize:11,fontFamily:"'JetBrains Mono',monospace"}}>{t.processing}</div>
          </div>
        )}

        {/* SPEAKING */}
        {mode==="speaking"&&result&&(
          <div style={{textAlign:"center",padding:"24px 16px",animation:"fadeIn 0.3s ease"}}>
            <WaveAnim color={P.agua} bars={7}/>
            <div style={{fontSize:14,fontWeight:700,color:P.agua,marginTop:12}}>{t.speaking}</div>
            <div style={{fontSize:13,color:P.terra,fontStyle:"italic",marginTop:10,
              maxWidth:280,margin:"10px auto 0",lineHeight:1.5}}>
              "{result.maria_voice&&(result.maria_voice[lang]||result.maria_voice.PT)}"
            </div>
          </div>
        )}

        {/* RESULT */}
        {mode==="result"&&result&&decision&&(
          <div style={{animation:"fadeIn 0.4s ease"}}>
            <div style={{background:"rgba(201,168,76,0.08)",border:`1px solid ${P.ouro}44`,
              borderRadius:10,padding:"9px 13px",marginBottom:13,
              fontStyle:"italic",color:P.terra,fontSize:13}}>"{transcript}"</div>

            {ctx&&(
              <div style={{marginBottom:10}}>
                <div style={{fontSize:10,fontFamily:"'JetBrains Mono',monospace",color:P.cinza,marginBottom:7,letterSpacing:"0.5px"}}>{t.ctx_label}</div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:7}}>
                  {Object.entries(ctx).filter(([k])=>["weather","location","companions"].includes(k)).map(([k,v])=>(
                    <div key={k} style={{background:P.pergaminho,border:`1px solid rgba(139,94,60,0.15)`,
                      borderRadius:8,padding:"7px 5px",textAlign:"center"}}>
                      <div style={{fontSize:8,fontFamily:"'JetBrains Mono',monospace",color:P.cinza,
                        textTransform:"uppercase",letterSpacing:"0.3px",marginBottom:3}}>{t.ctx_keys[k]||k}</div>
                      <div style={{fontSize:11,fontWeight:600,color:P.terra}}>{String(v)}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {result.sovereign_mode&&(
              <div style={{background:"rgba(107,76,147,0.08)",border:`1px solid ${P.roxo}44`,
                borderRadius:8,padding:"7px 11px",marginBottom:10,fontSize:10,
                fontFamily:"'JetBrains Mono',monospace",color:P.roxo}}>◌ {t.sovereign_notice}</div>
            )}

            <button onClick={()=>setShowIntent(v=>!v)} style={{background:"none",border:"none",cursor:"pointer",
              fontSize:10,fontFamily:"'JetBrains Mono',monospace",color:P.agua,letterSpacing:"0.5px",marginBottom:8,padding:0}}>
              {showIntent?t.intent_hide:t.intent_show}
            </button>
            {showIntent&&(
              <div style={{background:"rgba(74,124,158,0.08)",border:`1px solid rgba(74,124,158,0.2)`,
                borderRadius:10,padding:"11px 13px",marginBottom:11}}>
                <div style={{fontSize:10,fontFamily:"'JetBrains Mono',monospace",color:P.agua,marginBottom:7,letterSpacing:"1px"}}>W-INTENT-ENGINE · PARSED</div>
                <pre style={{fontSize:11,fontFamily:"'JetBrains Mono',monospace",color:P.noite,margin:0,lineHeight:1.6,whiteSpace:"pre-wrap"}}>
                  {JSON.stringify(result.intent_parsed,null,2)}
                </pre>
              </div>
            )}

            <div style={{background:P.noite,borderRadius:14,padding:"15px",marginBottom:13,position:"relative"}}>
              <div style={{position:"absolute",top:-10,left:14,background:P.terra,borderRadius:20,
                padding:"2px 10px",fontSize:10,color:"white",fontFamily:"'JetBrains Mono',monospace"}}>{t.maria_tag}</div>
              <p style={{color:P.pergaminho,fontSize:13,lineHeight:1.6,margin:"7px 0 0",fontStyle:"italic"}}>
                "{result.maria_voice&&(result.maria_voice[lang]||result.maria_voice.PT)} {t.suffix}"
              </p>
              <button onClick={()=>speakMaria((result.maria_voice&&(result.maria_voice[lang]||result.maria_voice.PT)||"")+" "+t.suffix,lang,null)}
                style={{background:"none",border:`1px solid rgba(255,255,255,0.2)`,borderRadius:20,
                  padding:"3px 11px",color:"rgba(255,255,255,0.55)",fontSize:10,
                  fontFamily:"'JetBrains Mono',monospace",cursor:"pointer",marginTop:9}}>{t.replay}</button>
            </div>

            <div style={{marginBottom:8}}>
              <div style={{fontSize:10,fontFamily:"'JetBrains Mono',monospace",color:P.cinza,marginBottom:7,letterSpacing:"0.5px"}}>{t.decision_label}</div>
              <div style={{background:sealed?`linear-gradient(135deg,${P.verde}15,${P.ouro}10)`:`linear-gradient(135deg,${P.pergaminho},white)`,
                border:`2px solid ${sealed?P.verde:P.ouro}`,borderRadius:14,padding:"14px",marginBottom:11,transition:"all 0.4s"}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                  <div>
                    <div style={{fontSize:17,fontWeight:800,color:P.noite}}>{decision.name}</div>
                    <div style={{fontSize:12,color:P.cinza,marginTop:2}}>{decision.type} · {decision.distance_text}</div>
                    {decision.rating&&<div style={{fontSize:11,color:P.ouro,marginTop:2}}>★ {decision.rating}</div>}
                  </div>
                  <div style={{background:P.verde,color:"white",borderRadius:20,padding:"3px 9px",fontSize:10,fontWeight:600,fontFamily:"'JetBrains Mono',monospace"}}>{decision.queue_status}</div>
                </div>
                <div style={{background:"rgba(26,26,46,0.04)",borderRadius:8,padding:"9px 11px",marginBottom:11,borderLeft:`3px solid ${P.ouro}`}}>
                  <div style={{fontSize:10,fontFamily:"'JetBrains Mono',monospace",color:P.cinza,marginBottom:3,letterSpacing:"0.5px"}}>{t.reason_label}</div>
                  <div style={{fontSize:12,color:P.terra,lineHeight:1.5}}>{decision.reason}</div>
                </div>
                {!sealed?(
                  <button onClick={()=>setSealed(true)} style={{width:"100%",padding:"11px",
                    background:`linear-gradient(135deg,${P.terra},${P.ouro})`,color:"white",
                    border:"none",borderRadius:10,fontSize:13,fontWeight:700,cursor:"pointer"}}>{t.seal_btn}</button>
                ):(
                  <div style={{background:P.verde,color:"white",borderRadius:10,padding:"9px",
                    textAlign:"center",fontSize:11,fontFamily:"'JetBrains Mono',monospace"}}>
                    ✓ SEALED · {result.ledger_receipt_id||"WINDI-TRAVEL-"+Date.now().toString(36).toUpperCase()}
                  </div>
                )}
              </div>
            </div>

            {sealed&&(
              <div style={{background:"rgba(92,122,90,0.08)",border:`1px solid ${P.verde}44`,
                borderRadius:10,padding:"11px 13px",marginBottom:14,animation:"fadeIn 0.4s ease"}}>
                <div style={{fontSize:10,fontFamily:"'JetBrains Mono',monospace",color:P.verde,marginBottom:7,letterSpacing:"1px"}}>{t.ledger_label}</div>
                <pre style={{fontSize:10,fontFamily:"'JetBrains Mono',monospace",color:P.noite,margin:0,lineHeight:1.6,whiteSpace:"pre-wrap"}}>
{`{
  "receipt_id": "${result.ledger_receipt_id||"DEMO-"+Date.now().toString(36).toUpperCase()}",
  "place": "${decision.name}",
  "queue": "${decision.queue_status}",
  "lang": "${lang}",
  "source": "${apiSource}",
  "timestamp": "${result.timestamp}",
  "verified": true,
  "governance": "HIGH"
}`}
                </pre>
              </div>
            )}

            <button onClick={reset} style={{width:"100%",padding:"11px",background:"transparent",
              border:`1px solid rgba(139,94,60,0.3)`,borderRadius:10,color:P.terra,fontSize:13,cursor:"pointer"}}>{t.new_btn}</button>
          </div>
        )}

        <div style={{textAlign:"center",marginTop:22,fontSize:10,
          fontFamily:"'JetBrains Mono',monospace",color:P.cinza,letterSpacing:"0.5px"}}>
          AI processes. Human decides. WINDI guarantees. 🐉
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
