
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
.root { font-family: var(--font-mono, monospace); padding: 1rem 0; }

.profiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 1.25rem; }

.profile-btn {

  background: var(--color-background-primary);
  cursor: pointer; transition: all 0.15s; text-align: center;

.profile-btn.active { border-color: var(--color-border-primary); background: var(--color-background-secondary); }

.pb-icon { font-size: 16px; margin-bottom: 4px; }

.pb-role { font-size: 9px; color: var(--color-text-tertiary); margin-top: 2px; font-family: var(--font-mono); }

.journey { display: flex; flex-direction: column; gap: 8px; }

.step-row {

}

.step-label {
  font-family: var(--font-mono); font-size: 9px; letter-spacing: 0.1em;

}

.step-card {

.sc-title { font-size: 11px; font-weight: 500; color: var(--color-text-primary); }

}

.sum-item { display: flex; flex-direction: column; gap: 3px; }

  cursor: pointer; font-family: var(--font-mono); letter-spacing: 0.06em;
  transition: background 0.15s;
}
