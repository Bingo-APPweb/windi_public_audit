# WINDI NOC - Prometheus Configuration

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'windi-noc'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - /etc/prometheus/alert_rules.yml

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Node Exporter - Host metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'

  # NOC Agent metrics
  - job_name: 'noc-agent'
    static_configs:
      - targets: ['noc-agent:8880']
        labels:
          service: 'noc-agent'
    metrics_path: /metrics

  # ISP Agent (se disponivel)
  - job_name: 'isp-agent'
    static_configs:
      - targets: ['host.docker.internal:8800']
        labels:
          service: 'isp-agent'
    metrics_path: /metrics
    scrape_interval: 30s

  # Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          service: 'loki'

  # Docker containers (via cAdvisor se configurado)
