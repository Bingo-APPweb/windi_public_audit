version: '3.8'

# WINDI NOC Agent - Monitoring Stack
# Prometheus + Grafana + Alertmanager + Loki

services:
  # ============================================
  # PROMETHEUS - Metricas
  # ============================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: windi-noc-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ./data/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    networks:
      - windi-noc

  # ============================================
  # GRAFANA - Visualizacao
  # ============================================
  grafana:
    image: grafana/grafana:10.2.2
    container_name: windi-noc-grafana
    restart: unless-stopped
    ports:
      - "3033:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=windi123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3033
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    volumes:
      - ./data/grafana:/var/lib/grafana
      - ./dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
      - loki
    networks:
      - windi-noc

  # ============================================
  # ALERTMANAGER - Gestao de Alertas
  # ============================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: windi-noc-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./data/alertmanager:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - windi-noc

  # ============================================
  # LOKI - Agregacao de Logs
  # ============================================
  loki:
    image: grafana/loki:2.9.2
    container_name: windi-noc-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki.yml:/etc/loki/local-config.yaml:ro
      - ./data/loki:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - windi-noc

  # ============================================
  # PROMTAIL - Coletor de Logs
  # ============================================
  promtail:
    image: grafana/promtail:2.9.2
    container_name: windi-noc-promtail
    restart: unless-stopped
    volumes:
      - ./config/promtail.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/windi:ro
      - /var/log:/var/log/host:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - windi-noc

  # ============================================
  # NODE EXPORTER - Metricas do Host
  # ============================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: windi-noc-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - windi-noc

  # ============================================
  # NOC AGENT - Agente Principal
  # ============================================
  noc-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: windi-noc-agent
    restart: unless-stopped
    ports:
      - "8880:8880"
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - ALERTMANAGER_URL=http://alertmanager:9093
      - LOKI_URL=http://loki:3100
      - NOC_PORT=8880
    volumes:
      - ./config:/app/config:ro
      - ./data/noc:/app/data
      - ./logs:/app/logs
    depends_on:
      - prometheus
      - alertmanager
      - loki
    networks:
      - windi-noc

networks:
  windi-noc:
    name: windi-noc-network
    driver: bridge
