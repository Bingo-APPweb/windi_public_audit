// === HELPERS ===
const getSGEColor = (score) => {
  if (score >= 0.85) return "#EF4444";
  if (score >= 0.65) return "#F59E0B";
  if (score >= 0.40) return "#3B82F6";
  return "#22C55E";
};

const getAvgSGE = (docs) => {
  const sum = docs.reduce((a, d) => a + d.sge, 0);
  return sum / docs.length;
};

const getRiskLabel = (score) => {
  if (score >= 0.85) return "KRITISCH";
  if (score >= 0.65) return "ERHÖHT";
  if (score >= 0.40) return "MODERAT";
  return "NIEDRIG";
};

// === MINI SPARKLINE ===
const Sparkline = ({ data, width = 80, height = 24, color }) => {
  const max = Math.max(...data);
  const min = Math.min(...data);
  const range = max - min || 1;
  const points = data.map((v, i) =>
    `${(i / (data.length - 1)) * width},${height - ((v - min) / range) * height}`
  ).join(" ");

  return (
    <svg width={width} height={height} style={{ display: "block" }}>
      <polyline points={points} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={width} cy={height - ((data[data.length - 1] - min) / range) * height} r="2.5" fill={color}/>
    </svg>
  );
};

                              {doc.sge >= 0.85 && (
                                <div style={{
                                  position: "absolute", inset: 0, borderRadius: 5,
                                  boxShadow: `0 0 10px ${getSGEColor(doc.sge)}30`,
                                  animation: "pulse 2s ease infinite",
                                }}/>
                              )}
                              {!doc.sealed && (
                                <div style={{
                                  position: "absolute", top: -2, right: -2,
                                  width: 8, height: 8, borderRadius: "50%",
                                  backgroundColor: "#F97316", border: `2px solid ${surface}`,
                                }}/>
                              )}
                            </div>
                            {/* Tooltip */}
                            {hoveredDoc === `${dept.id}-${j}` && (
                              <div style={{
                                position: "absolute", bottom: "calc(100% + 8px)", left: "50%",
                                transform: "translateX(-50%)", zIndex: 100,
                                backgroundColor: isDark ? "#1A1E2E" : "#FFFFFF",
                                border: `1px solid ${border}`, borderRadius: 10,
                                padding: "12px 16px", minWidth: 220,
                                boxShadow: "0 8px 30px rgba(0,0,0,0.15)",
                                animation: "fadeIn 0.15s ease",
                              }}>
                                <div style={{ fontSize: 12, fontWeight: 600, color: text1, marginBottom: 6 }}>
                                  {doc.name}
                                </div>
                                <div style={{ display: "flex", gap: 12, marginBottom: 6 }}>
                                  <div>
                                    <div style={{ fontSize: 8, color: text3, fontFamily: "'JetBrains Mono'", letterSpacing: 0.5 }}>SGE</div>
                                    <div style={{ fontSize: 14, fontWeight: 700, color: getSGEColor(doc.sge), fontFamily: "'JetBrains Mono'" }}>{doc.sge.toFixed(2)}</div>
                                  </div>
                                  <div>
                                    <div style={{ fontSize: 8, color: text3, fontFamily: "'JetBrains Mono'", letterSpacing: 0.5 }}>LEVEL</div>
                                    <div style={{ fontSize: 11, fontWeight: 600, color: doc.level === "HIGH" ? "#EF4444" : doc.level === "MEDIUM" ? "#F59E0B" : "#22C55E", fontFamily: "'JetBrains Mono'" }}>{doc.level}</div>
                                  </div>
                                  <div>
                                    <div style={{ fontSize: 8, color: text3, fontFamily: "'JetBrains Mono'", letterSpacing: 0.5 }}>STATUS</div>
                                    <div style={{ fontSize: 11, fontWeight: 500, color: doc.sealed ? gold : "#F97316", fontFamily: "'JetBrains Mono'" }}>{doc.sealed ? "SEALED" : "DRAFT"}</div>
                                  </div>
                                </div>
                                {doc.flags.length > 0 && (
                                  <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                                    {doc.flags.map((f, fi) => (
                                      <span key={fi} style={{
                                        fontSize: 8, fontFamily: "'JetBrains Mono'", fontWeight: 500,
                                        color: FLAG_COLORS[f] || text3, letterSpacing: 0.3,
                                        padding: "1px 5px", borderRadius: 3,
                                        backgroundColor: (FLAG_COLORS[f] || text3) + "15",
                                      }}>{f}</span>
                                    ))}
                                  </div>
                                )}
                                <div style={{
                                  position: "absolute", bottom: -5, left: "50%", transform: "translateX(-50%) rotate(45deg)",
                                  width: 10, height: 10, backgroundColor: isDark ? "#1A1E2E" : "#FFFFFF",
                                  borderRight: `1px solid ${border}`, borderBottom: `1px solid ${border}`,
                                }}/>
                              </div>
                            )}
                          </div>
                        ))}
                      </div>
                      <span style={{
                        fontSize: 11, fontFamily: "'JetBrains Mono'", fontWeight: 600,
                        color: getSGEColor(getAvgSGE(dept.docs)), minWidth: 40, textAlign: "right",
                      }}>{getAvgSGE(dept.docs).toFixed(2)}</span>
                    </div>
                    {di < DEPARTMENTS.length - 1 && (
                      <div style={{ borderBottom: `1px solid ${isDark ? "#151825" : "#F0F0F0"}` }}/>
                    )}
                  </div>
                ))}

                {/* Legend */}
                <div style={{
                  display: "flex", alignItems: "center", gap: 16, marginTop: 24,
                  paddingTop: 16, borderTop: `1px solid ${border}`,
                }}>
                  <span style={{ fontSize: 9, color: text3, fontFamily: "'JetBrains Mono'" }}>RISIKO:</span>
                  {[
                    { label: "Niedrig", color: "#22C55E", range: "0-0.39" },
                    { label: "Moderat", color: "#3B82F6", range: "0.40-0.64" },
                    { label: "Erhöht", color: "#F59E0B", range: "0.65-0.84" },
                    { label: "Kritisch", color: "#EF4444", range: "0.85-1.00" },
                  ].map((l, i) => (
                    <div key={i} style={{ display: "flex", alignItems: "center", gap: 5 }}>
                      <div style={{ width: 12, height: 12, borderRadius: 3, backgroundColor: l.color, opacity: 0.7 }}/>
                      <span style={{ fontSize: 9, color: text2, fontFamily: "'JetBrains Mono'" }}>{l.label}</span>
                      <span style={{ fontSize: 8, color: text3, fontFamily: "'JetBrains Mono'" }}>({l.range})</span>
                    </div>
                  ))}
                  <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 5 }}>
                    <div style={{ width: 8, height: 8, borderRadius: "50%", backgroundColor: "#F97316", border: `2px solid ${surface}` }}/>
                    <span style={{ fontSize: 9, color: text2, fontFamily: "'JetBrains Mono'" }}>Nicht versiegelt</span>
                  </div>
                </div>
              </div>

              {/* ALERTS PANEL */}
              <div style={{
                marginTop: 16, backgroundColor: surface, borderRadius: 14,
                padding: "20px 24px", border: `1px solid ${border}`,
                animation: "fadeUp 0.4s ease 0.3s both",
              }}>
                <div style={{
                  fontSize: 10, color: text3, fontFamily: "'JetBrains Mono'",
                  letterSpacing: 1, marginBottom: 14, textTransform: "uppercase",
                  display: "flex", alignItems: "center", gap: 6,
                }}>
                  <span style={{ width: 6, height: 6, borderRadius: "50%", backgroundColor: "#EF4444", animation: "pulse 1.5s ease infinite" }}/>
                  Aktive Warnungen
                </div>
                {allDocs.filter(d => d.flags.includes("PENDING-REVIEW") || d.sge >= 0.90).map((doc, i) => (
                  <div key={i} style={{
                    display: "flex", alignItems: "center", gap: 12,
                    padding: "10px 0",
                    borderBottom: `1px solid ${isDark ? "#151825" : "#F5F5F5"}`,
                    animation: `fadeUp 0.3s ease ${0.35 + i * 0.05}s both`,
                  }}>
                    <div style={{
                      width: 32, height: 32, borderRadius: 8,
                      backgroundColor: getSGEColor(doc.sge) + "18",
                      display: "flex", alignItems: "center", justifyContent: "center",
                      fontSize: 14,
                    }}>
                      {doc.sge >= 0.90 ? "⚠" : "◎"}
                    </div>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 12, fontWeight: 500, color: text1 }}>{doc.name}</div>
                      <div style={{ fontSize: 10, color: text3, display: "flex", gap: 8, marginTop: 2 }}>
                        <span>SGE: <span style={{ color: getSGEColor(doc.sge), fontFamily: "'JetBrains Mono'", fontWeight: 600 }}>{doc.sge.toFixed(2)}</span></span>
                        <span>·</span>
                        <span>{doc.sealed ? "Versiegelt" : "Entwurf"}</span>
                      </div>
                    </div>
                    <div style={{ display: "flex", gap: 3 }}>
                      {doc.flags.map((f, fi) => (
                        <span key={fi} style={{
                          fontSize: 8, fontFamily: "'JetBrains Mono'", fontWeight: 500,
                          color: FLAG_COLORS[f] || text3,
                          padding: "2px 6px", borderRadius: 4,
                          backgroundColor: (FLAG_COLORS[f] || text3) + "12",
                        }}>{f}</span>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          ) : (
            /* DEPARTMENT DETAIL VIEW */
            <div style={{ animation: "fadeUp 0.3s ease" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 20 }}>
                <button onClick={() => setSelectedDept(null)} style={{
                  background: "none", border: `1px solid ${border}`, borderRadius: 6,
                  padding: "4px 10px", cursor: "pointer", color: text2, fontSize: 12,
                  fontFamily: "'Outfit'",
                }}>← Zurück</button>
                <h2 style={{
                  fontFamily: "'Bricolage Grotesque'", fontSize: 22, fontWeight: 700, color: text1,
                }}>
                  {activeDept.name}
                </h2>
                <span style={{ fontSize: 11, color: text3 }}>· {activeDept.head}</span>
                <span style={{
                  fontSize: 12, fontWeight: 700, fontFamily: "'JetBrains Mono'",
                  color: getSGEColor(getAvgSGE(activeDept.docs)),
                  marginLeft: "auto",
                }}>
                  Ø SGE: {getAvgSGE(activeDept.docs).toFixed(2)}
                </span>
              </div>

              {/* Department documents */}
              <div style={{
                backgroundColor: surface, borderRadius: 14, border: `1px solid ${border}`,
                overflow: "hidden",
              }}>
                {/* Table header */}
                <div style={{
                  display: "grid", gridTemplateColumns: "1fr 80px 70px 70px 70px 1fr",
                  padding: "10px 20px", fontSize: 9, color: text3, fontFamily: "'JetBrains Mono'",
                  letterSpacing: 0.5, borderBottom: `1px solid ${border}`, textTransform: "uppercase",
                  backgroundColor: isDark ? "#0E1018" : "#FAFBFC",
                }}>
                  <span>Dokument</span>
                  <span>Typ</span>
                  <span>SGE</span>
                  <span>Level</span>
                  <span>Status</span>
                  <span>Flags</span>
                </div>

                {activeDept.docs.map((doc, i) => (
                  <div key={i} className="doc-row" style={{
                    display: "grid", gridTemplateColumns: "1fr 80px 70px 70px 70px 1fr",
                    padding: "14px 20px", alignItems: "center",
                    borderBottom: `1px solid ${isDark ? "#151825" : "#F5F5F5"}`,
                    cursor: "pointer", transition: "background 0.15s ease",
                    animation: `fadeUp 0.3s ease ${i * 0.05}s both`,
                  }}>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <HeatCell score={doc.sge} size={24} isDark={isDark}/>
                      <span style={{ fontSize: 13, fontWeight: 500, color: text1 }}>{doc.name}</span>
                    </div>
                    <span style={{ fontSize: 11, color: text2 }}>{doc.type}</span>
                    <span style={{
                      fontSize: 13, fontWeight: 700, fontFamily: "'JetBrains Mono'",
                      color: getSGEColor(doc.sge),
                    }}>{doc.sge.toFixed(2)}</span>
                    <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                      <span style={{
                        width: 7, height: 7, borderRadius: "50%",
                        backgroundColor: doc.level === "HIGH" ? "#EF4444" : doc.level === "MEDIUM" ? "#F59E0B" : "#22C55E",
                      }}/>
                      <span style={{ fontSize: 10, fontFamily: "'JetBrains Mono'", color: text2 }}>{doc.level}</span>
                    </div>
                    <div>
                      {doc.sealed ? (
                        <span style={{
                          fontSize: 9, color: gold, fontFamily: "'JetBrains Mono'",
                          fontWeight: 500, display: "flex", alignItems: "center", gap: 3,
                        }}>
                          <svg width="9" height="9" viewBox="0 0 16 16" fill="currentColor">
                            <path d="M8 0l2.2 5.5L16 6.1l-4 3.7 1 5.7L8 12.8l-5 2.7 1-5.7-4-3.7 5.8-.6z"/>
                          </svg>
                          SEALED
                        </span>
                      ) : (
                        <span style={{ fontSize: 9, color: "#F97316", fontFamily: "'JetBrains Mono'", fontWeight: 500 }}>DRAFT</span>
                      )}
                    </div>
                    <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                      {doc.flags.map((f, fi) => (
                        <span key={fi} style={{
                          fontSize: 8, fontFamily: "'JetBrains Mono'", fontWeight: 500,
                          color: FLAG_COLORS[f] || text3, letterSpacing: 0.3,
                          padding: "1px 5px", borderRadius: 3,
                          backgroundColor: (FLAG_COLORS[f] || text3) + "12",
                        }}>{f}</span>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      </div>

      {/* === BOTTOM BAR === */}
      <div style={{
        padding: "8px 20px", borderTop: `1px solid ${border}`,
        display: "flex", alignItems: "center", justifyContent: "space-between",
        backgroundColor: isDark ? "#0D0F17" : "#FAFBFC",
      }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <svg width="12" height="12" viewBox="0 0 16 16" fill={gold} opacity="0.5">
            <path d="M8 1L2 4v4.5c0 3.5 2.6 6.8 6 7.5 3.4-.7 6-4 6-7.5V4L8 1z"/>
          </svg>
          <span style={{ fontSize: 9, color: text3, fontFamily: "'JetBrains Mono'" }}>
            WINDI Governance Layer · Controller Mode · Ed25519 · SGE v1.0
          </span>
        </div>
        <span style={{ fontSize: 9, color: text3, fontFamily: "'JetBrains Mono'" }}>
          AI processes. Human decides. WINDI guarantees.
        </span>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(WINDIWarRoom));
</script>
</body>
</html>
