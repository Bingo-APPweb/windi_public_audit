function generateXlsx(title, columns, rows, meta) {
  const esc = (v) => '"' + String(v != null ? v : "").replace(/"/g, '""') + '"';
  const lines = [
    ["\u25C6 WINDI \u2014 " + title],
    ["Erstellt:", meta.ts, "", "ID:", meta.id, "", "Governance:", meta.gov],
    [],
    columns,
    ...rows,
    [],
    ["\u25C6 WINDI Seal: SEALED \u2713 | SGE " + meta.sge + " | Hash: " + meta.hash],
  ];
  const csv = "\uFEFF" + lines.map((r) => r.map(esc).join(",")).join("\n");
  return { data: csv, name: `${meta.id}.csv`, mime: "text/csv;charset=utf-8" };
}

function generatePptx(title, slidesData, meta) {
  const gold = C.gold;

  let slides = [];

  for (const s of slidesData) {
    if (s.type === "title") {
      slides.push(`<div style="${ss};display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(135deg,#0A0A0F,#1a1a2e);color:#fff;text-align:center;padding:60px">
        <div style="font-size:14px;color:${gold};letter-spacing:8px;margin-bottom:30px">\u25C6 W I N D I</div>
        <h1 style="font-size:36px;margin:0;font-weight:700">${s.title}</h1>
        <p style="font-size:16px;color:#888;margin-top:14px">${s.subtitle || ""}</p>
        <div style="position:absolute;bottom:30px;font-size:10px;color:#444">${meta.id} | ${meta.ts}</div></div>`);
    } else if (s.type === "content") {
      slides.push(`<div style="${ss};padding:55px;background:#fff">
        <div style="color:${gold};font-size:11px;letter-spacing:5px;margin-bottom:16px">\u25C6 WINDI</div>
        <h2 style="font-size:28px;color:#1a1a1a;border-bottom:3px solid ${gold};padding-bottom:8px">${s.heading}</h2>
        <p style="font-size:16px;line-height:1.9;color:#333;margin-top:18px;white-space:pre-wrap">${s.body}</p></div>`);
    } else if (s.type === "risks") {
      slides.push(`<div style="${ss};padding:55px;background:#fff">
        <div style="color:${gold};font-size:11px;letter-spacing:5px;margin-bottom:16px">\u25C6 WINDI</div>
        <h2 style="font-size:28px;color:#1a1a1a;border-bottom:3px solid ${C.red};padding-bottom:8px">${s.heading}</h2>
        <div style="margin-top:16px">${s.items.map((r, i) => `<div style="padding:10px 14px;margin:8px 0;background:#FEF2F2;border-left:4px solid #EF4444;border-radius:5px;font-size:15px">R${i + 1}. ${r}</div>`).join("")}</div></div>`);
    } else if (s.type === "actions") {
      slides.push(`<div style="${ss};padding:55px;background:#fff">
        <div style="color:${gold};font-size:11px;letter-spacing:5px;margin-bottom:16px">\u25C6 WINDI</div>
        <h2 style="font-size:28px;color:#1a1a1a;border-bottom:3px solid ${C.green};padding-bottom:8px">${s.heading}</h2>
        <div style="margin-top:16px">${s.items.map((a, i) => `<div style="padding:10px 14px;margin:8px 0;background:#F0FDF4;border-left:4px solid #34D399;border-radius:5px;font-size:15px">${i + 1}. ${a}</div>`).join("")}</div></div>`);
    } else if (s.type === "dashboard") {
      slides.push(`<div style="${ss};padding:55px;background:#fff">
        <div style="color:${gold};font-size:11px;letter-spacing:5px;margin-bottom:16px">\u25C6 WINDI COMPLIANCE</div>
        <h2 style="font-size:28px;color:#1a1a1a;border-bottom:3px solid ${gold};padding-bottom:8px">Status\u00FCbersicht</h2>
        <div style="display:flex;gap:20px;margin-top:24px">
          <div style="flex:1;background:#F0FDF4;border-radius:10px;padding:24px;text-align:center;border:1px solid #d1fae5">
            <div style="font-size:36px">\u2705</div><div style="font-size:11px;color:#666;margin:6px 0">Framework</div>
            <div style="font-size:17px;font-weight:700">${s.framework}</div></div>
          <div style="flex:1;background:#F0FDF4;border-radius:10px;padding:24px;text-align:center;border:1px solid #d1fae5">
            <div style="font-size:36px">\u{1F3DB}\uFE0F</div><div style="font-size:11px;color:#666;margin:6px 0">Status</div>
            <div style="font-size:17px;font-weight:700;color:${C.green}">${s.status}</div></div>
          <div style="flex:1;background:#FFFBEB;border-radius:10px;padding:24px;text-align:center;border:1px solid #fef3c7">
            <div style="font-size:36px">\u{1F4CA}</div><div style="font-size:11px;color:#666;margin:6px 0">SGE Score</div>
            <div style="font-size:17px;font-weight:700">${meta.sge}</div></div></div></div>`);
    }
  }

  // Closing slide
  slides.push(`<div style="${ss};display:flex;flex-direction:column;justify-content:center;align-items:center;background:linear-gradient(135deg,#0A0A0F,#1a1a2e);color:#fff;text-align:center;padding:60px">
    <div style="font-size:48px;color:${gold}">\u25C6</div>

    <p style="font-size:12px;color:#888;margin-top:16px">AI processes. Human decides. WINDI guarantees.</p>
    <div style="margin-top:30px;padding:10px 20px;border:1px solid ${gold}44;border-radius:8px;font-size:10px;color:#666">
      \u{1F512} SEALED | ${meta.id} | SGE ${meta.sge}</div></div>`);

  const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${title}</title>
<style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Segoe UI,sans-serif;background:#1a1a2e;padding:10px}
@media print{body{background:#fff;padding:0}div{box-shadow:none!important;margin:0!important;page-break-after:always}}</style></head>
<body>${slides.join("\n")}</body></html>`;
  return { data: html, name: `${meta.id}_deck.html`, mime: "text/html" };
}

function dl(data, name, mime) {
  const b = new Blob([data], { type: mime });
  const u = URL.createObjectURL(b);
  const a = document.createElement("a"); a.href = u; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(u);
}

  const [docs, setDocs] = useState([]);
  const [toast, setToast] = useState(null);
  const [busy, setBusy] = useState(false);
  const editorRef = useRef(null);

  const n = theme === "noir";
  const bg = n ? C.dark : C.light;
  const card = n ? C.card : C.lCard;
  const bdr = n ? C.bdr : C.lBdr;
  const txt = n ? "#E5E5E5" : "#1a1a1a";
  const mut = n ? "#666" : "#999";

  // ── Open a template ──
  const openTemplate = (t) => {
    setTpl(t);
    if (t.type === "doc") {
      setTitle(t.content.title);
      setBody(t.content.body);
    } else if (t.type === "xlsx") {
      setTitle(t.label);
      if (t.prefill && t.prefill.length > 0) {
        setXlsxRows(t.prefill.map((r) => [...r]));
      } else {
        setXlsxRows(Array.from({ length: t.rows || 5 }, () => t.columns.map(() => "")));
      }
    } else if (t.type === "pptx") {
      setTitle(t.slides[0]?.title || t.label);
      setPptxSlides(t.slides.map((s) => ({ ...s, items: s.items ? [...s.items] : undefined })));
    }
    setView("editor");
    setTimeout(() => editorRef.current?.focus(), 100);
  };

  // ── Generate & Download ──
  const generate = () => {
    if (busy) return;
    setBusy(true);
    const meta = {
      id: mkId(), sge: mkSge(tpl.gov), hash: mkHash(), ts: ts(),
      gov: tpl.gov, isp: "Bundesregierung \u00B7 BaFin \u00B7 DSGVO",
    };

    setTimeout(() => {
      let r;
      if (tpl.type === "doc") {
        r = generateDoc(title || "Dokument", body, meta);
      } else if (tpl.type === "xlsx") {
        r = generateXlsx(title || "Tabelle", tpl.columns, xlsxRows, meta);
      } else {
        r = generatePptx(title || "Pr\u00E4sentation", pptxSlides, meta);
      }
      dl(r.data, r.name, r.mime);
      setDocs((p) => [{ id: meta.id, name: title || tpl.label, type: tpl.type, gov: tpl.gov, sge: meta.sge, ts: meta.ts }, ...p]);
      setBusy(false);
      setToast({ id: meta.id, name: title || tpl.label });
      setTimeout(() => setToast(null), 4000);
    }, 600);
  };

  const greet = () => {
    const h = new Date().getHours();
    return h < 12 ? "Guten Morgen" : h < 18 ? "Guten Tag" : "Guten Abend";
  };

  const tabItems = [
    { id: "doc", label: "Dokumente", icon: "\u{1F4C4}" },
    { id: "xlsx", label: "Tabellen", icon: "\u{1F4CA}" },
    { id: "pptx", label: "Pr\u00E4sentationen", icon: "\u{1F3AC}" },
  ];

  const typeConf = {
    doc: { l: "DOC", c: C.blue }, xlsx: { l: "XLSX", c: C.green }, pptx: { l: "PPTX", c: C.orange },
  };

  // ═══════ RENDER ═══════
  return (
    <div style={{ background: bg, color: txt, minHeight: "100vh", fontFamily: "Outfit, Segoe UI, sans-serif", transition: "all .3s" }}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;600;800&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap');
        @keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
        *{box-sizing:border-box;margin:0}
        textarea:focus,input:focus{outline:none;border-color:${C.gold}!important}
        button:hover{opacity:.85}
        ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:${C.gold}33;border-radius:3px}`}</style>

      {/* ══ HEADER ══ */}
      <div style={{ background: n ? "#08080D" : "#fff", borderBottom: `1px solid ${bdr}`, padding: "10px 20px", display: "flex", alignItems: "center", justifyContent: "space-between", position: "sticky", top: 0, zIndex: 50 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10, cursor: "pointer" }} onClick={() => { setView("gallery"); setTpl(null); }}>
          <span style={{ color: C.gold, fontSize: 18, fontWeight: 800, letterSpacing: 3, fontFamily: "Bricolage Grotesque" }}>{"\u25C6"} WINDI</span>
          <span style={{ color: mut, fontSize: 11, letterSpacing: 2 }}>SUITE</span>
        </div>
        <button onClick={() => setTheme(n ? "klar" : "noir")} style={{ background: "transparent", border: `1px solid ${bdr}`, borderRadius: 6, padding: "4px 12px", color: mut, fontSize: 10, cursor: "pointer" }}>
          {n ? "\u2600\uFE0F Klar" : "\u{1F319} Noir"}
        </button>
      </div>

      {/* ══ TOAST ══ */}
      {toast && (
        <div style={{ position: "fixed", top: 60, right: 20, background: card, border: `1px solid ${C.green}40`, borderRadius: 10, padding: "12px 18px", zIndex: 100, animation: "fadeIn .3s", boxShadow: "0 4px 20px rgba(0,0,0,.3)", display: "flex", alignItems: "center", gap: 10 }}>
          <span style={{ fontSize: 18 }}>{"\u2705"}</span>
          <div>
            <div style={{ fontSize: 12, fontWeight: 600 }}>{toast.name} erstellt</div>
            <div style={{ fontSize: 10, color: mut, fontFamily: "JetBrains Mono" }}>{toast.id}</div>
          </div>
        </div>
      )}

      {view === "gallery" ? (
        /* ════════════════════════════════════
           GALLERY VIEW — Pick your template
           ════════════════════════════════════ */
        <div style={{ maxWidth: 900, margin: "0 auto", padding: "30px 20px" }}>
          <h1 style={{ fontSize: 24, fontWeight: 300, fontFamily: "Bricolage Grotesque", marginBottom: 30 }}>
            {greet()}. <span style={{ color: mut }}>Was m\u00F6chten Sie erstellen?</span>
          </h1>

          {/* Tabs */}
          <div style={{ display: "flex", gap: 2, marginBottom: 24, borderBottom: `1px solid ${bdr}` }}>
            {tabItems.map((t) => (
              <button key={t.id} onClick={() => setTab(t.id)}
                style={{ padding: "10px 20px", background: "transparent", border: "none", borderBottom: tab === t.id ? `2px solid ${C.gold}` : "2px solid transparent", color: tab === t.id ? C.gold : mut, fontSize: 13, fontWeight: tab === t.id ? 600 : 400, cursor: "pointer", display: "flex", alignItems: "center", gap: 6 }}>
                {t.icon} {t.label}
              </button>
            ))}
          </div>

          {/* Template Cards */}
          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(200px, 1fr))", gap: 14 }}>
            {TEMPLATES[tab].map((t) => (
              <div key={t.id} onClick={() => openTemplate(t)}
                style={{ background: card, border: `1px solid ${bdr}`, borderRadius: 12, padding: 22, cursor: "pointer", transition: "all .25s" }}
                onMouseEnter={(e) => { e.currentTarget.style.borderColor = C.gold; e.currentTarget.style.transform = "translateY(-3px)"; e.currentTarget.style.boxShadow = `0 8px 24px ${C.gold}12`; }}
                onMouseLeave={(e) => { e.currentTarget.style.borderColor = bdr; e.currentTarget.style.transform = "none"; e.currentTarget.style.boxShadow = "none"; }}>
                <div style={{ fontSize: 32, marginBottom: 12 }}>{t.icon}</div>
                <div style={{ fontWeight: 600, fontSize: 15 }}>{t.label}</div>
                <div style={{ fontSize: 11, color: mut, marginTop: 4 }}>{t.sub}</div>
              </div>
            ))}
          </div>

          {/* Created Documents */}
          {docs.length > 0 && (
            <div style={{ marginTop: 36 }}>
              <h3 style={{ fontSize: 11, color: mut, letterSpacing: 2, marginBottom: 10 }}>LETZTE DOKUMENTE</h3>
              <div style={{ background: card, border: `1px solid ${bdr}`, borderRadius: 10, overflow: "hidden" }}>
                {docs.map((d, i) => (
                  <div key={d.id} style={{ padding: "10px 16px", borderBottom: i < docs.length - 1 ? `1px solid ${bdr}` : "none", display: "flex", alignItems: "center", gap: 12, fontSize: 12 }}>
                    <span style={{ fontFamily: "JetBrains Mono", fontSize: 9, color: C.gold, minWidth: 110 }}>{d.id}</span>
                    <span style={{ flex: 1, fontWeight: 500 }}>{d.name}</span>
                    <span style={{ background: typeConf[d.type].c + "18", color: typeConf[d.type].c, padding: "2px 8px", borderRadius: 4, fontSize: 9, fontWeight: 700 }}>{typeConf[d.type].l}</span>
                    <span style={{ color: C.green, fontSize: 9 }}>{"\u{1F512}"} Versiegelt</span>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      ) : (
        /* ════════════════════════════════════
           EDITOR VIEW — Work on your document
           ════════════════════════════════════ */
        <div style={{ maxWidth: 860, margin: "0 auto", padding: "20px" }}>
          {/* Back button */}
          <button onClick={() => { setView("gallery"); setTpl(null); }}
            style={{ background: "transparent", border: "none", color: C.gold, fontSize: 12, cursor: "pointer", marginBottom: 16, padding: 0 }}>
            {"\u2190"} Vorlagen
          </button>

          {/* Document Editor */}
          <div style={{ background: card, border: `1px solid ${bdr}`, borderRadius: 12, overflow: "hidden" }}>
            {/* Editor Header */}
            <div style={{ padding: "16px 22px", borderBottom: `1px solid ${bdr}`, display: "flex", alignItems: "center", gap: 12 }}>
              <span style={{ fontSize: 22 }}>{tpl.icon}</span>
              {tpl.type === "doc" ? (
                <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Titel eingeben..."
                  style={{ flex: 1, background: "transparent", border: "none", fontSize: 18, fontWeight: 600, color: txt, fontFamily: "Bricolage Grotesque" }} />
              ) : (
                <div>
                  <div style={{ fontSize: 16, fontWeight: 600 }}>{tpl.label}</div>
                  <div style={{ fontSize: 11, color: mut }}>{tpl.sub}</div>
                </div>
              )}
              <button onClick={generate} disabled={busy}
                style={{ background: busy ? C.gold + "66" : C.gold, color: "#000", border: "none", borderRadius: 8, padding: "10px 24px", fontSize: 13, fontWeight: 700, cursor: busy ? "wait" : "pointer", whiteSpace: "nowrap" }}>
                {busy ? "\u23F3" : "\u2B07\uFE0F"} {busy ? "Erstellt..." : "Herunterladen"}
              </button>
            </div>

            {/* Content Area */}
            <div style={{ padding: 0 }}>
              {tpl.type === "doc" && (
                <textarea ref={editorRef} value={body} onChange={(e) => setBody(e.target.value)}
                  placeholder="Beginnen Sie zu schreiben..."
                  style={{
                    width: "100%", minHeight: 500, background: n ? "#0d0d14" : "#FAFAF8",
                    border: "none", padding: "22px 28px", color: txt, fontSize: 13,
                    fontFamily: "Calibri, Outfit, sans-serif", lineHeight: 1.9, resize: "vertical",
                  }} />
              )}

              {tpl.type === "xlsx" && (
                <div style={{ overflowX: "auto" }}>
                  <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12 }}>
                    <thead>
                      <tr>
                        {tpl.columns.map((col, j) => (
                          <th key={j} style={{ padding: "10px 12px", borderBottom: `2px solid ${C.gold}`, textAlign: "left", fontWeight: 600, fontSize: 11, color: C.gold, background: n ? "#0d0d14" : "#f5f5f0", whiteSpace: "nowrap" }}>{col}</th>
                        ))}
                        <th style={{ width: 40, background: n ? "#0d0d14" : "#f5f5f0" }}></th>
                      </tr>
                    </thead>
                    <tbody>
                      {xlsxRows.map((row, i) => (
                        <tr key={i}>
                          {row.map((cell, j) => (
                            <td key={j} style={{ padding: 0, borderBottom: `1px solid ${bdr}` }}>
                              <input value={cell} onChange={(e) => {
                                const nr = xlsxRows.map((r) => [...r]);
                                nr[i][j] = e.target.value;
                                setXlsxRows(nr);
                              }}
                                style={{ width: "100%", background: "transparent", border: "none", padding: "8px 12px", color: txt, fontSize: 12, fontFamily: "inherit" }} />
                            </td>
                          ))}
                          <td style={{ borderBottom: `1px solid ${bdr}`, textAlign: "center" }}>
                            <button onClick={() => setXlsxRows((p) => p.filter((_, idx) => idx !== i))}
                              style={{ background: "transparent", border: "none", color: mut, cursor: "pointer", fontSize: 14 }}>{"\u00D7"}</button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                  <button onClick={() => setXlsxRows((p) => [...p, tpl.columns.map(() => "")])}
                    style={{ width: "100%", padding: "10px", background: "transparent", border: "none", borderTop: `1px solid ${bdr}`, color: C.gold, fontSize: 12, cursor: "pointer" }}>
                    + Zeile hinzuf\u00FCgen
                  </button>
                </div>
              )}

              {tpl.type === "pptx" && (
                <div style={{ padding: 22 }}>
                  {pptxSlides.map((slide, i) => (
                    <div key={i} style={{ background: n ? "#0d0d14" : "#f5f5f0", border: `1px solid ${bdr}`, borderRadius: 8, padding: 18, marginBottom: 12 }}>
                      <div style={{ fontSize: 10, color: mut, marginBottom: 8 }}>Folie {i + 1} \u2014 {slide.type === "title" ? "Titelfolie" : slide.type === "risks" ? "Risiken" : slide.type === "actions" ? "Ma\u00DFnahmen" : slide.type === "dashboard" ? "Dashboard" : "Inhalt"}</div>
                      {slide.type === "title" && (
                        <>
                          <input value={slide.title} onChange={(e) => { const ns = [...pptxSlides]; ns[i] = { ...ns[i], title: e.target.value }; setPptxSlides(ns); }}
                            placeholder="Titel..." style={{ width: "100%", background: "transparent", border: `1px solid ${bdr}`, borderRadius: 5, padding: "8px 12px", color: txt, fontSize: 16, fontWeight: 600, marginBottom: 8, fontFamily: "inherit" }} />
                          <input value={slide.subtitle || ""} onChange={(e) => { const ns = [...pptxSlides]; ns[i] = { ...ns[i], subtitle: e.target.value }; setPptxSlides(ns); }}
                            placeholder="Untertitel..." style={{ width: "100%", background: "transparent", border: `1px solid ${bdr}`, borderRadius: 5, padding: "8px 12px", color: txt, fontSize: 13, fontFamily: "inherit" }} />
                        </>
                      )}
                      {slide.type === "content" && (
                        <>
                          <input value={slide.heading} onChange={(e) => { const ns = [...pptxSlides]; ns[i] = { ...ns[i], heading: e.target.value }; setPptxSlides(ns); }}
                            style={{ width: "100%", background: "transparent", border: `1px solid ${bdr}`, borderRadius: 5, padding: "8px 12px", color: txt, fontSize: 14, fontWeight: 600, marginBottom: 8, fontFamily: "inherit" }} />
                          <textarea value={slide.body} onChange={(e) => { const ns = [...pptxSlides]; ns[i] = { ...ns[i], body: e.target.value }; setPptxSlides(ns); }}
                            rows={4} style={{ width: "100%", background: "transparent", border: `1px solid ${bdr}`, borderRadius: 5, padding: "8px 12px", color: txt, fontSize: 13, fontFamily: "inherit", resize: "vertical", lineHeight: 1.7 }} />
                        </>
                      )}
                      {(slide.type === "risks" || slide.type === "actions") && (
                        <>
                          <input value={slide.heading} onChange={(e) => { const ns = [...pptxSlides]; ns[i] = { ...ns[i], heading: e.target.value }; setPptxSlides(ns); }}
                            style={{ width: "100%", background: "transparent", border: `1px solid ${bdr}`, borderRadius: 5, padding: "8px 12px", color: txt, fontSize: 14, fontWeight: 600, marginBottom: 8, fontFamily: "inherit" }} />
                          {slide.items.map((item, j) => (
                            <div key={j} style={{ display: "flex", gap: 6, marginBottom: 4 }}>
                              <span style={{ color: slide.type === "risks" ? C.red : C.green, fontWeight: 600, minWidth: 24, paddingTop: 8 }}>
                                {slide.type === "risks" ? `R${j + 1}` : `${j + 1}.`}
                              </span>
                              <input value={item} onChange={(e) => {
                                const ns = pptxSlides.map((s, si) => si === i ? { ...s, items: s.items.map((it, ji) => ji === j ? e.target.value : it) } : s);
                                setPptxSlides(ns);
                              }}
                                style={{ flex: 1, background: "transparent", border: `1px solid ${bdr}`, borderRadius: 5, padding: "6px 10px", color: txt, fontSize: 12, fontFamily: "inherit" }} />
                            </div>
                          ))}
                          <button onClick={() => {
                            const ns = pptxSlides.map((s, si) => si === i ? { ...s, items: [...s.items, ""] } : s);
                            setPptxSlides(ns);
                          }}
                            style={{ background: "transparent", border: "none", color: C.gold, fontSize: 11, cursor: "pointer", marginTop: 4 }}>
                            + Eintrag hinzuf\u00FCgen
                          </button>
                        </>
                      )}
                      {slide.type === "dashboard" && (
                        <div style={{ fontSize: 12, color: mut }}>Dashboard-Folie wird automatisch generiert mit aktuellem Compliance-Status.</div>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* ══ FOOTER ══ */}
      <div style={{ borderTop: `1px solid ${bdr}`, padding: "14px 20px", textAlign: "center", marginTop: 30, fontSize: 10, color: mut }}>
        <span style={{ color: C.gold, fontWeight: 600 }}>{"\u25C6"} WINDI</span> Publishing House \u2014 Pre-AI Governance Layer
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(WINDISuiteApp));
</script>
</body>
</html>
