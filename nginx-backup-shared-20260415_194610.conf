# Redirect HTTP -> HTTPS (domínio canônico)
server {
    listen 80;
    server_name windi-domain.com www.windi-domain.com;

    return 301 https://windi-domain.com$request_uri;
}

# HTTPS principal
server {
    listen 443 ssl http2;
    server_name windi-domain.com;

    ssl_certificate /etc/letsencrypt/live/windi-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/windi-domain.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# WSG Service Worker - precisa do header para scope "/"
location = /wsg/wsg-service-worker.js {
    proxy_pass http://127.0.0.1:8085;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    add_header Service-Worker-Allowed "/";
    add_header Cache-Control "no-cache";
}

# ─── WINDI Command Center (:8118) ─────────────
location /dashboard/ {
    proxy_pass http://127.0.0.1:8118/dashboard/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location / {
    limit_req zone=one burst=20 nodelay;

    proxy_pass http://127.0.0.1:8085;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    proxy_set_header Connection "";
    proxy_buffering off;
}
}
