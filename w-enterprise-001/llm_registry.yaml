# ─── TIER A — Núcleo de Raciocínio ────────────────────────────────────────
tier_a:
  label: "Núcleo de Raciocínio e Documentos"
  weight_class: HIGH
  pho_required: true

  models:

    claude:
      provider: "Anthropic"
      model_id: "claude-sonnet-4-20250514"
      alias: "Guardian"
      tier: A
      weight: 0.95
      strengths:
        - "interpretação longa"
        - "compliance reasoning"
        - "leitura de documentos extensos"
        - "análise densa"
        - "segurança constitucional"
      primary_tasks:
        - "legal_analysis"
        - "document_review"
        - "compliance_reasoning"
        - "gdpr_interpretation"
        - "eu_ai_act_analysis"
      cost_tier: HIGH
      max_tokens: 200000
      latency_sla_s: 8
      gdpr_safe: true
      eu_resident: false
      fallback_to: "gpt4"

    gpt4:
      provider: "OpenAI"
      model_id: "gpt-4o"
      alias: "Architect"
      tier: A
      weight: 0.90
      strengths:
        - "estruturação lógica"
        - "consistência"
        - "pareceres"
        - "síntese regulatória"
        - "contratos"
      primary_tasks:
        - "legal_drafting"
        - "contract_analysis"
        - "regulatory_synthesis"
        - "structured_output"
      cost_tier: HIGH
      max_tokens: 128000
      latency_sla_s: 6
      gdpr_safe: false
      eu_resident: false
      fallback_to: "claude"

    gemini:
      provider: "Google DeepMind"
      model_id: "gemini-2.0-flash"
      alias: "Witness"
      tier: A
      weight: 0.85
      strengths:
        - "multimodal"
        - "busca contextual"
        - "enriquecimento factual"
        - "inputs multimodais"
        - "contexto externo"
      primary_tasks:
        - "factual_enrichment"
        - "multimodal_analysis"
        - "external_context"
        - "real_time_data"
      cost_tier: MED
      max_tokens: 1000000
      latency_sla_s: 4
      gdpr_safe: false
      eu_resident: false
