# ─── TASK MAP — Routing por Tipo de Tarefa ────────────────────────────────
task_map:

  legal_analysis:
    label: "Análise jurídica"
    mode: HIGH
    primary: ["claude", "gpt4"]
    consensus_required: true
    min_models: 2
    pho_required: true
    seal_required: true

  contract_analysis:
    label: "Análise de contratos"
    mode: HIGH
    primary: ["claude", "gpt4"]
    consensus_required: true
    min_models: 2
    pho_required: true
    seal_required: true

  compliance_reasoning:
    label: "Raciocínio de compliance"
    mode: HIGH
    primary: ["claude"]
    secondary: ["gpt4"]
    consensus_required: false
    pho_required: true
    seal_required: true

  eu_ai_act_analysis:
    label: "Análise EU AI Act"
    mode: HIGH
    primary: ["claude", "gpt4"]
    consensus_required: true
    min_models: 2
    pho_required: true
    seal_required: true
    legal_anchor: ["EU AI Act Art.6", "Art.9", "Art.14", "Art.17"]

  gdpr_sensitive:
    label: "Dados sensíveis GDPR"
    mode: LOCAL
    primary: ["llama"]
    consensus_required: false
    pho_required: true
    seal_required: true
    data_stays_local: true
    legal_anchor: ["GDPR Art.5", "Art.9", "Art.44"]

  factual_enrichment:
    label: "Enriquecimento factual"
    mode: MED
    primary: ["gemini"]
    consensus_required: false
    pho_required: false
    seal_required: false

  stress_test:
    label: "Stress-test / contra-narrativa"
    mode: MED
    primary: ["grok"]
    secondary: ["claude"]
    consensus_required: true
    min_models: 2
    pho_required: true
    seal_required: true
    note: "Grok propõe. Claude valida. VERA decide."

  high_risk_decision:
    label: "Decisão alto risco"
    mode: HIGH
    primary: ["claude", "gpt4", "gemini"]
    consensus_required: true
    min_models: 3
    divergence_threshold: 0.20
    pho_required: true
    seal_required: true
    legal_anchor: ["EU AI Act Art.14", "GDPR Art.22"]

  low_latency:
    label: "Workload controlado / baixa latência"
    mode: FREE
    primary: ["mistral"]
    consensus_required: false
    pho_required: false
    seal_required: false

  document_classification:
    label: "Classificação de documentos"
    mode: MED
    primary: ["cohere"]
    fallback: ["mistral"]
    consensus_required: false
    pho_required: false

  dora_incident:
    label: "Incidente DORA"
    mode: HIGH
    primary: ["claude", "gpt4"]
    consensus_required: true
    min_models: 2
    pho_required: true
    seal_required: true
    reporting_sla_hours: 24
    legal_anchor: ["DORA Art.19", "NIS2 Art.23", "GDPR Art.33"]

  instructor_guidance:
    label: "Instrução ao utilizador"
    mode: MED
    primary: ["claude"]
    consensus_required: false
    pho_required: false
    seal_required: false

# ─── CONSENSUS RULES — Triangulação de Inteligência ──────────────────────
consensus_rules:

  # ─── DYNAMIC THRESHOLDS — O Rigor do Paladar (Paper-001 §201) ───────────
  # "Quanto mais crítica a tarefa, menos aceitamos divergência."
  divergence_settings:

    high_governance:
      # Certificação OVS, Legal Analysis, EU AI Act
      label: "Alta Corte"
      threshold_warning: 0.15
      threshold_critical: 0.20
      min_consensus: 2
      priority_models: ["claude", "gpt4"]
      action_on_critical: "block_output + escalate_to_human_dragon"

    med_capacity:
      # Análise de Artigo 14, Compliance Reasoning
      label: "Análise Estruturada"
      threshold_warning: 0.25
      threshold_critical: 0.35
      min_consensus: 2
      priority_models: ["claude", "gpt4", "gemini"]
      action_on_critical: "block_output + require_pho"

    low_trivial:
      # E1/E4 tasks, low_latency, document_classification
      label: "Técnica de Suporte"
      threshold_warning: 0.40
      threshold_critical: 0.50
      min_consensus: 1
      priority_models: ["mistral", "llama"]
      action_on_critical: "flag_only"

  # Task-to-threshold mapping
  threshold_map:
    legal_analysis: "high_governance"
    contract_analysis: "high_governance"
    eu_ai_act_analysis: "high_governance"
    dora_incident: "high_governance"
    high_risk_decision: "high_governance"
    compliance_reasoning: "med_capacity"
    gdpr_sensitive: "med_capacity"
    stress_test: "med_capacity"
    factual_enrichment: "low_trivial"
    low_latency: "low_trivial"
    document_classification: "low_trivial"
    instructor_guidance: "low_trivial"

  # Legacy fallback (deprecated — use divergence_settings)
  divergence_detection:
    method: "semantic_similarity"
    threshold_warning: 0.25
    threshold_critical: 0.40
    action_on_warning: "flag_to_officer"
    action_on_critical: "block_output + require_pho"
    deprecated: true
    migration_note: "Use divergence_settings.{level} instead"

  agreement_scoring:
    method: "weighted_average"
    weights_source: "model.weight"
    min_agreement_score: 0.70

  conflict_resolution:
    strategy: "escalate_to_human"
    never_auto_resolve: true
    reason: "I9 — Princípio da Não-Decisão"

  confidence_matrix:
    fields:
      - "model_id"
      - "response_hash"
      - "confidence_score"
      - "latency_ms"
      - "divergence_from_consensus"
      - "pho_flag"
      - "eligibility_level"  # E1/E4/HIGH
    output_format: "json"
    include_in_receipt: true

# ─── FALLBACK CHAIN — Degradação Declarada (Princípio XIII) ───────────────
fallback_chain:

  default_sequence:
    - claude
    - gpt4
    - gemini
    - mistral
    - llama

  gdpr_sensitive_sequence:
    - llama
    - mistral

  offline_mode:
    trigger: "all_tier_a_unavailable"
    action: "declare_degraded_mode"
    message: "VERA em modo degradado — LLMs Tier A indisponíveis. Activando fallback soberano."
    log_to_ledger: true
    notify_officer: true
    never_silent: true

  degraded_capabilities:
    - task: "legal_analysis"
      fallback_model: "mistral"
      confidence_cap: 0.60
      pho_required: true
      warning: "Análise com capacidade reduzida. Revisão humana obrigatória."

# ─── GOVERNANCE — Invariantes Constitucionais ─────────────────────────────
governance:

  active_invariants:
    I9:
      label: "Proibição de Escalada de Autonomia"
      rule: "VERA nunca executa. Sempre propõe + explicita risco."
      irremediable: true

    I14:
      label: "Princípio da Falha Explícita"
      rule: "Nunca silencioso. Nunca placeholder. Declarar sempre."
      irremediable: true

    I11:
      label: "Ledger Obrigatório"
      rule: "Toda decisão HIGH é selada no Forensic Ledger."
      endpoint: "POST /api/receipts"

  pho_layer:
    label: "Proof of Human Oversight"
    legal_anchor: "EU AI Act Art.14"
    required_fields:
      - "officer_did"
      - "models_consulted"
      - "confidence_matrix"
      - "divergence_score"
      - "decision_approved_by_human"
      - "timestamp_utc"
      - "seal_hash"

  never_allowed:
    - "autonomous_final_decision"
    - "silent_fallback"
    - "fabricated_legal_citations"
    - "cross_session_data_without_did"
    - "extra_eu_transfer_without_tia"
