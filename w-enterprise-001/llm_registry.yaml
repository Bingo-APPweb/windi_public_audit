      tier: B
      weight: 0.75
      strengths:
        - "open-weight auditável"
        - "execução local"
        - "zero data egress"
        - "GDPR forte"
      primary_tasks:
        - "gdpr_sensitive"
        - "local_fallback"
        - "sovereign_execution"
        - "pii_processing"
      cost_tier: LOCAL
      max_tokens: 128000
      latency_sla_s: 12
      gdpr_safe: true
      eu_resident: true
      fallback_to: "mistral"
      deployment: "local_inference"

    mistral:
      provider: "Mistral AI"
      model_id: "mistral-large-latest"
      alias: "Efficiency"
      tier: B
      weight: 0.70
      strengths:
        - "eficiência"
        - "baixa latência"
        - "contexto europeu"
        - "alinhamento EU"
      primary_tasks:
        - "low_latency_tasks"
        - "controlled_workloads"
        - "free_tier_serving"
        - "eu_context"
      cost_tier: LOW
      max_tokens: 131000
      latency_sla_s: 3
      gdpr_safe: true
      eu_resident: true
      fallback_to: "llama"

