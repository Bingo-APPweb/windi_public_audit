// ═══════════════════════════════════════════════════════════════════════════
// SHA-256 client-side (Web Crypto API)
// ═══════════════════════════════════════════════════════════════════════════
async function sha256(buffer) {
  if (!(window.crypto && crypto.subtle)) throw new Error("no-subtle");
  const digest = await crypto.subtle.digest("SHA-256", buffer);
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, "0")).join("");
}

// ═══════════════════════════════════════════════════════════════════════════
// API calls — read-only sobre /verify-public/
// ═══════════════════════════════════════════════════════════════════════════
async function fetchVerify(type, value) {
  const endpoint = type === "hash"
    ? `${API_BASE}/hash/${value}`
    : `${API_BASE}/document/${value}`;

  const resp = await fetch(endpoint, {
    method: "GET",
    headers: { "Accept": "application/json" }
  });

  if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
  return await resp.json();
}

// ═══════════════════════════════════════════════════════════════════════════
// REGRA DA CORRESPONDÊNCIA — por campo consultado (GATE-001-RESOLVIDO §2.1)
// ═══════════════════════════════════════════════════════════════════════════
function avaliar(asked, got) {
  if (!got) return { state: "NAO_VERIFICAVEL", corr: false, why: "erro_reconciliacao", gotVal: null };

  let corr = false, gotVal = null;

  // 1. Correspondência POR CAMPO CONSULTADO
  if (asked.field === "hash") {
    gotVal = got.hash || got.content_hash;
    // Normalizar: remover prefixo sha256: se existir, comparar lowercase
    const askedNorm = asked.value.toLowerCase().replace(/^sha256:/, "");
    const gotNorm = gotVal ? gotVal.toLowerCase().replace(/^sha256:/, "") : null;
    corr = !!gotNorm && gotNorm === askedNorm;
  } else if (asked.field === "serial") {
    gotVal = got.document_id;
    corr = !!gotVal && gotVal === asked.value;
  } else {
    return { state: "NAO_VERIFICAVEL", corr: false, why: "tipo_desconhecido", gotVal: null };
  }

  // 2. Allowlist fechada
  const okEstado = ESTADOS_ADMISSIVEIS.includes(got.status_semantics);

  // 3. Âncora real no Ledger
  const okAncora = got.ledger_anchor === true;

  // 4. Âncora utilizável
  const okUtil = !!got.document_id;

  // Veredicto
  const ok = corr && okEstado && okAncora && okUtil;

  return {
    state: ok ? "VERIFICAVEL" : "NAO_VERIFICAVEL",
    corr,
    gotVal,
    okEstado,
    okAncora,
    okUtil,
    why: ok ? null : (!corr ? "sem_correspondencia" : !okEstado ? "estado_fora_allowlist" : !okAncora ? "sem_ancora" : "sem_identificador"),
    semantics: got.status_semantics,
    assurance: got.assurance_level,
    docId: got.document_id,
    docName: got.doc_name
  };
}

// ═══════════════════════════════════════════════════════════════════════════
// CANÁRIO DE RUNTIME (§3 do GATE-001)
// ═══════════════════════════════════════════════════════════════════════════
function randomHash() {
  const arr = new Uint8Array(32);
  crypto.getRandomValues(arr);
  return [...arr].map(b => b.toString(16).padStart(2, "0")).join("");
}

async function runCanary() {
  const t = I18N[LANG];
  say(t.testing, "busy");

  try {
    const h1 = randomHash();
    const h2 = randomHash();

    const [r1, r2] = await Promise.all([
      fetchVerify("hash", h1),
      fetchVerify("hash", h2)
    ]);

    // Se algum voltar FOUND com correspondência → anomalia
    const v1 = avaliar({ field: "hash", value: h1 }, r1);
    const v2 = avaliar({ field: "hash", value: h2 }, r2);

    if (v1.state === "VERIFICAVEL" || v2.state === "VERIFICAVEL") {
      CANARY_OK = false;
      say(t.canaryFail, "err");
      updateBanner();
      return false;
    }

    CANARY_OK = true;
    say(t.canaryOk, "ok");
    updateBanner();
    return true;

  } catch (e) {
    // Erro de rede — não é falha do canário, mas não podemos armar verde
    CANARY_OK = null;
    say(t.ready, "ok");
    return null;
  }
}

async function handleFile(file) {
  const t = I18N[LANG];
  $("err").classList.remove("show");
  say(t.hashing, "busy");

  try {
    const hash = await sha256(await file.arrayBuffer());
    say(t.recon, "busy");

    const got = await fetchVerify("hash", hash);
    renderResult({
      name: file.name,
      size: file.size,
      asked: { field: "hash", value: hash },
      got
    });

  } catch (e) {
    say(t.ready, "ok");
    showError(e.message === "no-subtle" ? "hash" : "net");
  }
}

async function handleText(input) {
  if (!input) return;

  const t = I18N[LANG];
  $("err").classList.remove("show");
  say(t.recon, "busy");

  // Detectar tipo
  const isHash = /^(sha256:)?[0-9a-f]{64}$/i.test(input);
  const isSerial = /^WINDI-/i.test(input);

  const field = isSerial ? "serial" : "hash";
  const value = isHash ? input.replace(/^sha256:/i, "") : input;

  try {
    const got = await fetchVerify(field, value);
    renderResult({
      asked: { field, value },
      got
    });
  } catch (e) {
    say(t.ready, "ok");
    showError("net");
  }
}

  b.setAttribute("aria-pressed", "true");
  LANG = b.dataset.lang;
  localStorage.setItem("windi-lang", LANG);
  applyLang();
});

// Theme toggle
$("theme").onclick = () => {
  const noir = document.documentElement.getAttribute("data-theme") === "noir";
  document.documentElement.setAttribute("data-theme", noir ? "klar" : "noir");
  $("theme").setAttribute("aria-pressed", (!noir).toString());
  $("theme").textContent = noir ? "NOIR" : "KLAR";
  localStorage.setItem("windi-theme", noir ? "klar" : "noir");
};

// Init
(function init() {
  // Restore preferences
  const savedLang = localStorage.getItem("windi-lang");
  if (savedLang && I18N[savedLang]) {
    LANG = savedLang;
    document.querySelectorAll(".lang").forEach(b => {
      b.setAttribute("aria-pressed", b.dataset.lang === LANG ? "true" : "false");
    });
  }

  const savedTheme = localStorage.getItem("windi-theme");
  if (savedTheme === "noir") {
    document.documentElement.setAttribute("data-theme", "noir");
    $("theme").setAttribute("aria-pressed", "true");
    $("theme").textContent = "KLAR";
  }

  applyLang();

  // Run canary
  runCanary();
})();
</script>
</body>
</html>
