<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WINDI Playground — Living Surface</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ================================================================
     LIVING SURFACE — W-PLAYGROUND CANDIDATE
     Contrato: S1-S7, E1-E5

     S1: Input Perene (sempre visível)
     S2: Capítulos Append-Only
     S3: Berater Só Com Voz Real + Fertilidade
     S4: Painéis São Projecções
     S5: Indicador Mostra, Não Navega
     S6: Container É a Verdade (verdade vs vista)
     S7: Reentrada É Reconstituição
     ================================================================ */

  :root {
    --bg: #F5F0E0;
    --bg-elev: #FBF8EF;
    --bg-elev2: #FFFFFF;
    --ink: #1C1A14;
    --ink-soft: #4A4636;
    --ink-faint: #837C66;
    --line: #DED7C2;
    --accent: #B5481F;
    --accent-ink: #FBF8EF;
    --seal: #3A5A40;
    --seal-soft: #5A7A60;
    --warn: #C4841D;
    --dim-product: #4A7C59;
    --dim-regulatory: #8B4513;
    --dim-users: #2E6B8A;
    --dim-technology: #6B4E8A;
    --dim-costs: #8A6B4E;
  }

  html[data-theme="noir"] {
    --bg: #0A0A10;
    --bg-elev: #12121A;
    --bg-elev2: #1A1A24;
    --ink: #E8E6E1;
    --ink-soft: #B8B4A8;
    --ink-faint: #6B6860;
    --line: #2A2A34;
    --accent: #E07040;
    --accent-ink: #0A0A10;
    --seal: #5A8A60;
    --seal-soft: #4A7A50;
    --warn: #D4A42D;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Bricolage Grotesque', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ---- Header ---- */
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    border-bottom: 1px solid var(--line);
    background: var(--bg-elev);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 700;
    font-size: 1.1rem;
  }

  .brand .glyph { font-size: 1.4rem; }
  .brand .sub { font-weight: 400; color: var(--ink-soft); }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .lang-toggle {
    display: flex;
    gap: 4px;
    background: var(--bg);
    padding: 4px;
    border-radius: 8px;
  }

  .lang-btn {
    padding: 6px 10px;
    font-size: 0.75rem;
    font-weight: 600;
    background: transparent;
    border: none;
    color: var(--ink-faint);
    cursor: pointer;
    border-radius: 6px;
    transition: all 0.2s;
  }

  .lang-btn.active {
    background: var(--bg-elev2);
    color: var(--ink);
  }

  .theme-toggle {
    padding: 8px 14px;
    font-size: 0.75rem;
    font-weight: 600;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--ink);
    cursor: pointer;
    border-radius: 8px;
  }

  /* ---- Phase Indicator (S5: Mostra, Não Navega) ---- */
  .phase-indicator {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 24px;
    font-size: 0.85rem;
    color: var(--ink-faint);
    border-bottom: 1px solid var(--line);
    background: var(--bg-elev);
    /* S5: pointer-events none - não é navegação */
    pointer-events: none;
    user-select: none;
  }

  .phase-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--line);
    transition: background 0.3s;
  }

  .phase-dot.active { background: var(--seal); }
  .phase-dot.complete { background: var(--seal-soft); }

  /* ---- Living Surface Container ---- */
  .living-surface {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 24px;
  }

  /* ---- Chapters Container (S2: Append-Only) ---- */
  .chapters {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-bottom: 24px;
    overflow-y: auto;
  }

  .chapter {
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
    transition: all 0.2s;
  }

  .chapter-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    background: var(--bg-elev2);
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }

  .chapter-title {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .chapter-title.human { color: var(--seal); }
  .chapter-title.berater { color: var(--accent); }

  .chapter-toggle {
    font-size: 0.75rem;
    color: var(--ink-faint);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
  }

  .chapter-content {
    padding: 16px;
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--ink-soft);
  }

  .chapter.collapsed .chapter-content {
    display: none;
  }

  .chapter-number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--ink-faint);
  }

  /* ---- Panels Container (S4: Projecções) ---- */
  .panels-bar {
    display: flex;
    gap: 8px;
    padding: 12px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    margin-bottom: 16px;
  }

  .panel-tab {
    padding: 8px 16px;
    font-size: 0.8rem;
    font-weight: 500;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
    color: var(--ink-soft);
    transition: all 0.2s;
  }

  .panel-tab.active {
    background: var(--bg-elev2);
    border-color: var(--seal);
    color: var(--ink);
  }

  .panel-tab:hover:not(.active) {
    border-color: var(--ink-faint);
  }

  .panel-content {
    display: none;
    background: var(--bg-elev);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    max-height: 400px;
    overflow-y: auto;
  }

  .panel-content.active {
    display: block;
  }

  /* ---- Input Container (S1: Perene) ---- */
  .input-container {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    padding: 16px 0;
    border-top: 1px solid var(--line);
  }

  .input-wrapper {
    display: flex;
    gap: 12px;
    background: var(--bg-elev);
    border: 2px solid var(--line);
    border-radius: 12px;
    padding: 12px 16px;
    transition: border-color 0.2s;
  }

  .input-wrapper:focus-within {
    border-color: var(--accent);
  }

  .input-field {
    flex: 1;
    font-family: inherit;
    font-size: 1rem;
    background: transparent;
    border: none;
    color: var(--ink);
    resize: none;
    outline: none;
    min-height: 24px;
    max-height: 150px;
  }

  .input-field::placeholder {
    color: var(--ink-faint);
  }

  .input-send {
    align-self: flex-end;
    padding: 10px 20px;
    font-size: 0.9rem;
    font-weight: 600;
    background: var(--seal);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .input-send:hover {
    background: var(--seal-soft);
  }

  .input-send:disabled {
    background: var(--line);
    color: var(--ink-faint);
    cursor: not-allowed;
  }

  /* ---- Welcome State ---- */
  .welcome {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }

  .welcome h1 {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 12px;
  }

  .welcome p {
    font-size: 1rem;
    max-width: 400px;
    margin: 0 auto;
  }

  /* ---- Graph Panel (Dimensions) ---- */
  .dimensions-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px;
  }

  .dimension-card {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
  }

  .dimension-card .dim-name {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 6px;
  }

  .dimension-card .dim-content {
    font-size: 0.85rem;
    color: var(--ink-soft);
    line-height: 1.5;
  }

  .dimension-card.product .dim-name { color: var(--dim-product); }
  .dimension-card.regulatory .dim-name { color: var(--dim-regulatory); }
  .dimension-card.users .dim-name { color: var(--dim-users); }
  .dimension-card.technology .dim-name { color: var(--dim-technology); }
  .dimension-card.costs .dim-name { color: var(--dim-costs); }

  /* ---- Loading ---- */
  .loading-indicator {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 12px;
    color: var(--ink-faint);
    font-size: 0.85rem;
  }

  .loading-indicator.active {
    display: flex;
  }

  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ---- Toast ---- */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--bg);
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 0.9rem;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    z-index: 1000;
  }

  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ---- Responsive ---- */
  @media (max-width: 600px) {
    .living-surface { padding: 16px; }
    .welcome h1 { font-size: 1.4rem; }
    .panels-bar { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="glyph">&#128194;</span>
    <span>WINDI <span class="sub" id="brandSub">Playground</span></span>
  </div>
  <div class="header-actions">
    <div class="lang-toggle" id="langToggle">
      <button class="lang-btn active" data-lang="pt">PT</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="de">DE</button>
    </div>
    <button class="theme-toggle" id="themeBtn">NOIR</button>
  </div>
</header>

<!-- S5: Phase Indicator (mostra, não navega) -->
<div class="phase-indicator">
  <span class="phase-dot active" id="dot1"></span>
  <span id="phaseLabel1">Intenção</span>
  <span>→</span>
  <span class="phase-dot" id="dot2"></span>
  <span id="phaseLabel2">Projecto</span>
  <span>→</span>
  <span class="phase-dot" id="dot3"></span>
  <span id="phaseLabel3">Construção</span>
</div>

<!-- Living Surface -->
<div class="living-surface">

  <!-- Welcome (shown when no chapters) -->
  <div class="welcome" id="welcome">
    <h1 id="welcomeTitle">O que queres criar?</h1>
    <p id="welcomeSubtitle">Escreve a tua ideia abaixo. O Berater vai iluminar o terreno.</p>
  </div>

  <!-- S2: Chapters (append-only) -->
  <div class="chapters" id="chapters">
    <!-- Chapters are appended here dynamically -->
  </div>

  <!-- S4: Panels (projections, not pages) -->
  <div class="panels-bar" id="panelsBar" style="display: none;">
    <button class="panel-tab" data-panel="graph" id="tabGraph">
      <span>📊</span> <span id="tabGraphText">Dimensões</span>
    </button>
    <button class="panel-tab" data-panel="diff" id="tabDiff">
      <span>📜</span> <span id="tabDiffText">Percurso</span>
    </button>
    <button class="panel-tab" data-panel="handoff" id="tabHandoff">
      <span>📦</span> <span id="tabHandoffText">Pacote</span>
    </button>
  </div>

  <!-- Panel Contents (hidden by default) -->
  <div class="panel-content" id="panelGraph">
    <div class="dimensions-grid" id="dimensionsGrid"></div>
  </div>

  <div class="panel-content" id="panelDiff">
    <div id="diffContent"><!-- DIFF timeline rendered here --></div>
  </div>

  <div class="panel-content" id="panelHandoff">
    <div id="handoffContent"><!-- HANDOFF rendered here --></div>
  </div>

  <!-- Loading Indicator -->
  <div class="loading-indicator" id="loading">
    <div class="spinner"></div>
    <span id="loadingText">A processar...</span>
  </div>

  <!-- S1: Input (perene, sempre visível) -->
  <div class="input-container">
    <div class="input-wrapper">
      <textarea
        class="input-field"
        id="inputField"
        placeholder="Escreve a tua ideia ou continua a conversa..."
        rows="1"
      ></textarea>
      <button class="input-send" id="sendBtn" disabled>
        <span id="sendBtnText">Enviar</span>
      </button>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
// LIVING SURFACE — W-PLAYGROUND CANDIDATE
// Contrato: S1-S7, E1-E5
// ============================================================

// i18n
const UI = {
  pt: {
    playground: 'Playground',
    phase1: 'Intenção', phase2: 'Projecto', phase3: 'Construção',
    welcomeTitle: 'O que queres criar?',
    welcomeSubtitle: 'Escreve a tua ideia abaixo. O Berater vai iluminar o terreno.',
    inputPlaceholder: 'Escreve a tua ideia ou continua a conversa...',
    send: 'Enviar',
    processing: 'A processar...',
    tabGraph: 'Dimensões', tabDiff: 'Percurso', tabHandoff: 'Pacote',
    chapterHuman: 'Humano', chapterBerater: 'Berater',
    collapse: 'Recolher', expand: 'Expandir',
    dims: { product: 'Produto', regulatory: 'Regulatório', users: 'Utilizadores', technology: 'Tecnologia', costs: 'Custos' },
    notApplicable: 'Não aplicável',
    notIdentified: 'Não identificado'
  },
  en: {
    playground: 'Playground',
    phase1: 'Intent', phase2: 'Project', phase3: 'Construction',
    welcomeTitle: 'What do you want to create?',
    welcomeSubtitle: 'Write your idea below. The Berater will illuminate the terrain.',
    inputPlaceholder: 'Write your idea or continue the conversation...',
    send: 'Send',
    processing: 'Processing...',
    tabGraph: 'Dimensions', tabDiff: 'Journey', tabHandoff: 'Package',
    chapterHuman: 'Human', chapterBerater: 'Berater',
    collapse: 'Collapse', expand: 'Expand',
    dims: { product: 'Product', regulatory: 'Regulatory', users: 'Users', technology: 'Technology', costs: 'Costs' },
    notApplicable: 'Not applicable',
    notIdentified: 'Not identified'
  },
  de: {
    playground: 'Playground',
    phase1: 'Absicht', phase2: 'Projekt', phase3: 'Bau',
    welcomeTitle: 'Was möchtest du erstellen?',
    welcomeSubtitle: 'Schreibe deine Idee unten. Der Berater wird das Terrain beleuchten.',
    inputPlaceholder: 'Schreibe deine Idee oder setze das Gespräch fort...',
    send: 'Senden',
    processing: 'Verarbeiten...',
    tabGraph: 'Dimensionen', tabDiff: 'Verlauf', tabHandoff: 'Paket',
    chapterHuman: 'Mensch', chapterBerater: 'Berater',
    collapse: 'Einklappen', expand: 'Ausklappen',
    dims: { product: 'Produkt', regulatory: 'Regulatorisch', users: 'Benutzer', technology: 'Technologie', costs: 'Kosten' },
    notApplicable: 'Nicht anwendbar',
    notIdentified: 'Nicht identifiziert'
  }
};

// ============================================================
// STATE (S6: verdade no Container, vista no cliente)
// ============================================================

let currentLang = localStorage.getItem('windi_lang') || 'pt';
// S7: localStorage persiste entre sessões (sessionStorage morre ao fechar aba)
let currentContainerId = localStorage.getItem('windi_playground_container_id');

// View state (ephemeral, disposable)
let viewState = {
  activePanel: null,
  collapsedChapters: new Set()
};

function t(key) {
  const keys = key.split('.');
  let val = UI[currentLang];
  for (const k of keys) val = val?.[k];
  return val ?? key;
}

// ============================================================
// CONTAINER API (S6: Container É a Verdade)
// ============================================================

const CONTAINER_API = '/api/containers';
// FIX: Usar caminho relativo ao workbench, não à root
const DECOMPOSE_API = '/workbench/api/decompose';

const ContainerAPI = {
  async create(sessionId) {
    const resp = await fetch(CONTAINER_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId })
    });
    const data = await resp.json();
    return data.success ? data.container : null;
  },

  async get(containerId) {
    const resp = await fetch(`${CONTAINER_API}/${containerId}`);
    const data = await resp.json();
    return data.success ? data.container : null;
  },

  async addReasoning(containerId, thought, type = 'human') {
    const resp = await fetch(`${CONTAINER_API}/${containerId}/reasoning`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ thought, type })
    });
    const data = await resp.json();
    return data.success ? data.container : null;
  },

  async updateGraph(containerId, graph) {
    const resp = await fetch(`${CONTAINER_API}/${containerId}/graph`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ graph })
    });
    const data = await resp.json();
    return data.success ? data.container : null;
  },

  async recordChangeOfMind(containerId, oldDir, newDir) {
    const resp = await fetch(`${CONTAINER_API}/${containerId}/change-of-mind`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ old_direction: oldDir, new_direction: newDir })
    });
    const data = await resp.json();
    return data.success ? data.container : null;
  }
};

// ============================================================
// DOM Elements
// ============================================================

const welcome = document.getElementById('welcome');
const chapters = document.getElementById('chapters');
const panelsBar = document.getElementById('panelsBar');
const inputField = document.getElementById('inputField');
const sendBtn = document.getElementById('sendBtn');
const loading = document.getElementById('loading');
const toast = document.getElementById('toast');

// ============================================================
// INITIALIZATION (S7: Reentrada É Reconstituição)
// ============================================================

async function init() {
  updateUILanguage();

  // S7: Tentar reconstituir, mas NUNCA bloquear setupEventListeners
  if (currentContainerId) {
    try {
      await reconstructFromContainer(currentContainerId);
    } catch (err) {
      console.warn('[Init] Reconstituição falhou, começando de novo:', err.message);
      currentContainerId = null;
      localStorage.removeItem('windi_playground_container_id');
      showWelcome();
    }
  } else {
    showWelcome();
  }

  // CRÍTICO: Isto DEVE correr sempre, independentemente do Container
  setupEventListeners();
}

async function reconstructFromContainer(containerId) {
  const container = await ContainerAPI.get(containerId);

  if (!container) {
    // Container não existe mais - começar de novo
    currentContainerId = null;
    localStorage.removeItem('windi_playground_container_id');
    showWelcome();
    return;
  }

  // S7: Reconstruir capítulos do reasoning
  if (container.reasoning && container.reasoning.length > 0) {
    hideWelcome();

    // Reconstruir capítulos do histórico
    // Assumimos que reasoning[] alterna human/system ou é todo human
    const evolution = container.intent_evolution || [];

    evolution.forEach((entry, idx) => {
      // Só mostrar entradas human (I14 fix)
      if (entry.type === 'system') return;

      const isHuman = entry.trigger !== 'berater_response';
      createChapter(entry.state, isHuman ? 'human' : 'berater', idx + 1);
    });

    // Mostrar painéis se há grafo
    if (container.graph && Object.keys(container.graph).length > 0) {
      showPanels();
      renderGraph(container.graph);
      updatePhase(2);
    }
  } else {
    showWelcome();
  }
}

// ============================================================
// UI Functions
// ============================================================

function showWelcome() {
  welcome.style.display = 'block';
  chapters.innerHTML = '';
  panelsBar.style.display = 'none';
}

function hideWelcome() {
  welcome.style.display = 'none';
}

function showPanels() {
  panelsBar.style.display = 'flex';
}

function showLoading(show) {
  loading.classList.toggle('active', show);
  sendBtn.disabled = show;
}

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('visible');
  setTimeout(() => toast.classList.remove('visible'), 3000);
}

function updatePhase(phase) {
  const dot1 = document.getElementById('dot1');
  const dot2 = document.getElementById('dot2');
  const dot3 = document.getElementById('dot3');

  dot1.classList.toggle('active', phase >= 1);
  dot1.classList.toggle('complete', phase > 1);
  dot2.classList.toggle('active', phase >= 2);
  dot2.classList.toggle('complete', phase > 2);
  dot3.classList.toggle('active', phase >= 3);
}

// ============================================================
// CHAPTERS (S2: Append-Only)
// ============================================================

let chapterCount = 0;

function createChapter(content, type, number = null) {
  chapterCount++;
  const num = number || chapterCount;

  const chapter = document.createElement('div');
  chapter.className = 'chapter';
  chapter.dataset.number = num;

  const title = type === 'human' ? t('chapterHuman') : t('chapterBerater');
  const titleClass = type === 'human' ? 'human' : 'berater';

  chapter.innerHTML = `
    <div class="chapter-header">
      <span class="chapter-title ${titleClass}">
        <span class="chapter-number">#${num}</span>
        ${title}
      </span>
      <button class="chapter-toggle">${t('collapse')}</button>
    </div>
    <div class="chapter-content">${escapeHtml(content)}</div>
  `;

  // Toggle collapse
  const header = chapter.querySelector('.chapter-header');
  const toggle = chapter.querySelector('.chapter-toggle');

  header.addEventListener('click', () => {
    const isCollapsed = chapter.classList.toggle('collapsed');
    toggle.textContent = isCollapsed ? t('expand') : t('collapse');

    // View state (ephemeral)
    if (isCollapsed) {
      viewState.collapsedChapters.add(num);
    } else {
      viewState.collapsedChapters.delete(num);
    }
  });

  chapters.appendChild(chapter);

  // Scroll to new chapter
  chapter.scrollIntoView({ behavior: 'smooth', block: 'end' });

  return chapter;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============================================================
// PANELS (S4: Projecções)
// ============================================================

document.querySelectorAll('.panel-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const panelId = tab.dataset.panel;
    togglePanel(panelId);
  });
});

function togglePanel(panelId) {
  const tabs = document.querySelectorAll('.panel-tab');
  const panels = document.querySelectorAll('.panel-content');

  // Toggle logic
  const isActive = viewState.activePanel === panelId;

  if (isActive) {
    // Close panel
    panels.forEach(p => p.classList.remove('active'));
    tabs.forEach(t => t.classList.remove('active'));
    viewState.activePanel = null;
  } else {
    // Open panel
    panels.forEach(p => p.classList.remove('active'));
    tabs.forEach(t => t.classList.remove('active'));

    document.getElementById(`panel${capitalize(panelId)}`).classList.add('active');
    document.getElementById(`tab${capitalize(panelId)}`).classList.add('active');
    viewState.activePanel = panelId;
  }
}

function capitalize(str) {
  return str.charAt(0).toUpperCase() + str.slice(1);
}

function renderGraph(graph) {
  const grid = document.getElementById('dimensionsGrid');
  const dims = graph.dimensions || [];

  grid.innerHTML = dims.map(dim => {
    const dimName = t(`dims.${dim.id}`) || dim.id;
    const content = dim.applicable === false
      ? t('notApplicable')
      : (dim.content || t('notIdentified'));

    return `
      <div class="dimension-card ${dim.id}">
        <div class="dim-name">${dimName}</div>
        <div class="dim-content">${escapeHtml(content)}</div>
      </div>
    `;
  }).join('');
}

// ============================================================
// MAIN FLOW (E4: Continuidade Sem Confirmação, E5: Processa Antes de Falar)
// ============================================================

async function handleSend() {
  const text = inputField.value.trim();
  if (!text) return;

  // E5: Sistema processa antes de falar
  showLoading(true);
  hideWelcome();

  // S2: Criar capítulo HUMANO (append-only) - imediatamente visível
  createChapter(text, 'human');

  // Container API calls são opcionais (podem falhar se localhost não acessível)
  // DEBT: Migrar Container API para proxy nginx ou URL pública
  try {
    if (!currentContainerId) {
      const container = await ContainerAPI.create('playground-' + Date.now());
      if (container) {
        currentContainerId = container.id;
        localStorage.setItem('windi_playground_container_id', container.id);
      }
    }
    if (currentContainerId) {
      await ContainerAPI.addReasoning(currentContainerId, text, 'human');
    }
  } catch (containerErr) {
    console.warn('[Container] API inaccessível, continuando sem persistência:', containerErr.message);
  }

  // Limpar input
  inputField.value = '';
  sendBtn.disabled = true;

  try {
    // E6: Timeout de 30s para não ficar em spinner eterno
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 30000);

    // Chamar decomposição
    const resp = await fetch(DECOMPOSE_API, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ intent: text, lang: currentLang }),  // Uses default MISTRAL_DIRECT
      signal: controller.signal
    });

    clearTimeout(timeoutId);
    const result = await resp.json();

    // E6: Tratar erros explícitos da API
    if (!result.success) {
      console.error('[Send] API Error:', result.error);
      showToast(result.error || 'Erro no processamento.');
      showLoading(false);
      return;
    }

    if (result.graph) {
      // Container API opcional (pode falhar se localhost inacessível)
      try {
        if (currentContainerId) {
          await ContainerAPI.updateGraph(currentContainerId, result.graph);
        }
      } catch (containerErr) {
        console.warn('[Container] updateGraph falhou:', containerErr.message);
      }

      // Mostrar painéis - ISTO DEVE SEMPRE EXECUTAR
      showPanels();
      renderGraph(result.graph);
      updatePhase(2);

      // S3: Berater só com voice_layer real
      if (result.voice_layer) {
        createChapter(result.voice_layer, 'berater');
        // Container API opcional
        try {
          if (currentContainerId) {
            await ContainerAPI.addReasoning(currentContainerId, result.voice_layer, 'system');
          }
        } catch (containerErr) {
          console.warn('[Container] addReasoning falhou:', containerErr.message);
        }
      }
    }
  } catch (e) {
    console.error('[Send] Error:', e);
    if (e.name === 'AbortError') {
      showToast('Timeout. O servidor demorou demais.');
    } else {
      showToast('Erro ao processar. Tenta novamente.');
    }
  }

  showLoading(false);
}

// ============================================================
// EVENT LISTENERS
// ============================================================

function setupEventListeners() {
  // Input
  inputField.addEventListener('input', () => {
    sendBtn.disabled = inputField.value.trim().length < 3;

    // Auto-resize
    inputField.style.height = 'auto';
    inputField.style.height = Math.min(inputField.scrollHeight, 150) + 'px';
  });

  // Send button
  sendBtn.addEventListener('click', handleSend);

  // Enter to send (Shift+Enter for newline)
  inputField.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) handleSend();
    }
  });

  // Theme toggle
  document.getElementById('themeBtn').addEventListener('click', () => {
    const html = document.documentElement;
    const isNoir = html.dataset.theme === 'noir';
    html.dataset.theme = isNoir ? '' : 'noir';
    document.getElementById('themeBtn').textContent = isNoir ? 'NOIR' : 'KLAR';
    localStorage.setItem('windi_theme', isNoir ? 'klar' : 'noir');
  });

  // Language toggle
  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentLang = btn.dataset.lang;
      localStorage.setItem('windi_lang', currentLang);
      updateUILanguage();
    });
  });
}

function updateUILanguage() {
  document.getElementById('brandSub').textContent = t('playground');
  document.getElementById('phaseLabel1').textContent = t('phase1');
  document.getElementById('phaseLabel2').textContent = t('phase2');
  document.getElementById('phaseLabel3').textContent = t('phase3');
  document.getElementById('welcomeTitle').textContent = t('welcomeTitle');
  document.getElementById('welcomeSubtitle').textContent = t('welcomeSubtitle');
  inputField.placeholder = t('inputPlaceholder');
  document.getElementById('sendBtnText').textContent = t('send');
  document.getElementById('loadingText').textContent = t('processing');
  document.getElementById('tabGraphText').textContent = t('tabGraph');
  document.getElementById('tabDiffText').textContent = t('tabDiff');
  document.getElementById('tabHandoffText').textContent = t('tabHandoff');
}

// ============================================================
// RESTORE THEME
// ============================================================

const savedTheme = localStorage.getItem('windi_theme');
if (savedTheme === 'noir') {
  document.documentElement.dataset.theme = 'noir';
  document.getElementById('themeBtn').textContent = 'KLAR';
}

const savedLang = localStorage.getItem('windi_lang');
if (savedLang) {
  currentLang = savedLang;
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.lang === savedLang);
  });
}

// ============================================================
// INIT
// ============================================================

init();

</script>
