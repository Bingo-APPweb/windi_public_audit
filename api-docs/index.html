<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WINDI API Documentation</title>
<link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
<style>
  body { margin: 0; background: #0F0F0F; }
  .swagger-ui .topbar { background: #1A1A1A; padding: 10px 0; }
  .swagger-ui .topbar .download-url-wrapper { display: none; }
  .swagger-ui .info .title { color: #C9A84C; }
  .swagger-ui .info .description { color: #E8E0CC; }
  .swagger-ui .opblock.opblock-get { border-color: #2D6A2D; background: rgba(45,106,45,0.1); }
  .swagger-ui .opblock.opblock-post { border-color: #C9A84C; background: rgba(201,168,76,0.1); }
  .swagger-ui .scheme-container { background: #1A1A1A; }
  .swagger-ui select { background: #2A2A2A; color: #E8E0CC; }
  /* NOIR Theme - Full Swagger Override */
  .swagger-ui { color: #E8E0CC; }
  .swagger-ui .info p, .swagger-ui .info li { color: #E8E0CC; }
  /* Endpoint path and description - HIGH VISIBILITY */
  .swagger-ui .opblock-summary-path { color: #E8E0CC !important; }
  .swagger-ui .opblock-summary-path span { color: #E8E0CC !important; }
  .swagger-ui .opblock-summary-path__deprecated { color: #999 !important; }
  .swagger-ui .opblock-summary-description { color: #D0C8B0 !important; }
  .swagger-ui .opblock-summary { color: #E8E0CC; }
  .swagger-ui .opblock-summary-control { color: #E8E0CC; }
  .swagger-ui .opblock-description-wrapper p { color: #E8E0CC; }
  .swagger-ui .opblock-summary-method { color: #0F0F0F !important; font-weight: 700; }
  .swagger-ui .opblock-tag { color: #C9A84C; border-bottom-color: #2A2A2A; }
  .swagger-ui .opblock-tag small { color: #B0A080; }
  .swagger-ui .opblock { background: #1A1A1A; }
  .swagger-ui .opblock .opblock-section-header { background: #252525; }
  .swagger-ui .opblock .opblock-section-header h4 { color: #E8E0CC; }
  .swagger-ui .opblock .opblock-section-header label { color: #D0C8B0; }
  .swagger-ui table thead tr td, .swagger-ui table thead tr th { color: #C9A84C; border-color: #2A2A2A; }
  .swagger-ui table tbody tr td { color: #E8E0CC; border-color: #2A2A2A; }
  .swagger-ui .parameter__name { color: #C9A84C; }
  .swagger-ui .parameter__type { color: #B0A080; }
  .swagger-ui .parameter__in { color: #888; }
  .swagger-ui .model-title { color: #C9A84C; }
  .swagger-ui .model { color: #E8E0CC; }
  .swagger-ui .prop-type { color: #B0A080; }
  .swagger-ui .response-col_status { color: #C9A84C; }
  .swagger-ui .response-col_description { color: #E8E0CC; }
  .swagger-ui .btn { background: #2A2A2A; color: #E8E0CC; border-color: #3A3A3A; }
  .swagger-ui .btn:hover { background: #3A3A3A; }
  .swagger-ui input[type=text], .swagger-ui textarea { background: #2A2A2A; color: #E8E0CC; border-color: #3A3A3A; }
  .swagger-ui .markdown p, .swagger-ui .markdown li { color: #E8E0CC; }
  .swagger-ui .markdown code { background: #252525; color: #C9A84C; }
  .swagger-ui .renderedMarkdown p { color: #E8E0CC; }
  .windi-header {
    background: linear-gradient(135deg, #1A1A1A 0%, #0F0F0F 100%);
    padding: 20px;
    text-align: center;
    border-bottom: 2px solid #C9A84C;
  }
  .windi-logo { font-size: 24px; font-weight: 700; color: #C9A84C; letter-spacing: 0.15em; }
  .windi-subtitle { font-size: 12px; color: #B0A080; margin-top: 5px; }
</style>
</head>
<body>
<div class="windi-header">
  <div class="windi-logo">WINDI</div>
  <div class="windi-subtitle">API Documentation · W-KEYS-001</div>
</div>
<div id="swagger-ui"></div>
<script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
  window.onload = function() {
    SwaggerUIBundle({
      url: "/specs/w-keys-001-openapi.yaml",
      dom_id: '#swagger-ui',
      presets: [SwaggerUIBundle.presets.apis, SwaggerUIBundle.SwaggerUIStandalonePreset],
      layout: "BaseLayout",
      deepLinking: true,
      defaultModelsExpandDepth: 1,
      displayRequestDuration: true
    });
  }
</script>
</body>
</html>
