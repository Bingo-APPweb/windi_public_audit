<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200" role="img" aria-label="WINDI Architect">
  <title>Architect</title>
  <!-- Pivot head -->
  <circle cx="50" cy="26" r="7" fill="#BA7517"/>
  <!-- Left leg -->
  <line x1="45" y1="32" x2="24" y2="82" stroke="#BA7517" stroke-width="4" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="55" y1="32" x2="76" y2="82" stroke="#BA7517" stroke-width="4" stroke-linecap="round"/>
  <!-- Arc of measure -->
  <path d="M27 73 A28 12 0 0 0 73 73" fill="none" stroke="#BA7517" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Crossbar -->
  <line x1="33" y1="54" x2="67" y2="54" stroke="#BA7517" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <!-- Top arc (hinge) -->
  <path d="M40 17 A14 14 0 0 1 60 17" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
</svg>
