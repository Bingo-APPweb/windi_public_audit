<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&amp;display=swap');
    </style>
    <!-- Circular text path -->
    <path id="topArc"    d="M 20,100 A 80,80 0 0,1 180,100"/>
    <path id="bottomArc" d="M 35,130 A 80,80 0 0,0 165,130"/>
  </defs>

  <!-- Outer ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#8B6914" stroke-width="1"/>
  <!-- Inner ring -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="#8B6914" stroke-width="0.5" opacity="0.5"/>

  <!-- Tick marks around outer ring -->
  <g stroke="#8B6914" stroke-width="0.8" opacity="0.7">
    <line x1="100" y1="8"  x2="100" y2="16" transform="rotate(0   100 100)"/>
    <line x1="100" y1="8"  x2="100" y2="13" transform="rotate(30  100 100)"/>
    <line x1="100" y1="8"  x2="100" y2="13" transform="rotate(60  100 100)"/>
    <line x1="100" y1="8"  x2="100" y2="16" transform="rotate(90  100 100)"/>
    <line x1="100" y1="8"  x2="100" y2="13" transform="rotate(120 100 100)"/>
    <line x1="100" y1="8"  x2="100" y2="13" transform="rotate(150 100 100)"/>
    <line x1="100" y1="8"  x2="100" y2="16" transform="rotate(180 100 100)"/>
    <line x1="100" y1="8"  x2="100" y2="13" transform="rotate(210 100 100)"/>
    <line x1="100" y1="8"  x2="100" y2="13" transform="rotate(240 100 100)"/>
    <line x1="100" y1="8"  x2="100" y2="16" transform="rotate(270 100 100)"/>
    <line x1="100" y1="8"  x2="100" y2="13" transform="rotate(300 100 100)"/>
    <line x1="100" y1="8"  x2="100" y2="13" transform="rotate(330 100 100)"/>
  </g>

  <!-- Dragon body — stroke style, fina -->
  <g stroke="#8B6914" fill="none" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <!-- Body curve -->
    <path d="M 85,75 C 78,68 72,72 70,80 C 68,90 75,98 82,100 C 90,103 98,98 100,90 C 103,80 98,70 90,68 C 95,65 102,68 106,75"/>
    <!-- Head -->
    <ellipse cx="90" cy="72" rx="10" ry="8" transform="rotate(-20 90 72)"/>
    <!-- Eye -->
    <circle cx="86" cy="69" r="1.5" fill="#8B6914" stroke="none"/>
    <!-- Snout -->
    <path d="M 82,73 C 80,75 80,77 82,78"/>
    <!-- Wing left -->
    <path d="M 78,82 C 65,72 60,80 65,90 C 68,96 76,96 82,92"/>
    <!-- Wing right -->
    <path d="M 102,78 C 115,68 120,76 115,86 C 112,92 104,92 100,88"/>
    <!-- Tail -->
    <path d="M 80,102 C 75,112 78,120 85,118 C 90,116 92,110 88,106"/>
    <!-- Tail tip curl -->
    <path d="M 85,118 C 80,124 82,130 88,128"/>
    <!-- Front legs -->
    <path d="M 82,98  C 78,106 76,112 80,114"/>
    <path d="M 95,98  C 99,106 100,112 96,114"/>
    <!-- Claws -->
    <path d="M 80,114 L 77,117 M 80,114 L 80,118 M 80,114 L 83,117"/>
    <path d="M 96,114 L 93,117 M 96,114 L 96,118 M 96,114 L 99,117"/>
  </g>

  <!-- Top arc text: WINDI PUBLISHING HOUSE -->
  <text font-family="'JetBrains Mono', monospace" font-size="9" font-weight="500"
        fill="#8B6914" letter-spacing="3" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">WINDI · PUBLISHING HOUSE</textPath>
  </text>

  <!-- Bottom arc text: AI PROCESSES · HUMAN DECIDES -->
  <text font-family="'JetBrains Mono', monospace" font-size="7.5" font-weight="500"
        fill="#8B6914" letter-spacing="2" text-anchor="middle" opacity="0.85">
    <textPath href="#bottomArc" startOffset="50%">AI PROCESSES · HUMAN DECIDES</textPath>
  </text>

  <!-- Bottom dots separator -->
  <circle cx="68"  cy="148" r="1.2" fill="#8B6914" opacity="0.6"/>
  <circle cx="132" cy="148" r="1.2" fill="#8B6914" opacity="0.6"/>
</svg>
