<style>
  :root {
    --bg:        #F5F0E0;
    --bg2:       #EDE8D5;
    --border:    #C8C3B0;
    --text:      #2C2C2A;
    --text2:     #5F5E5A;
    --text3:     #888780;
    --teal:      #0F6E56;
    --teal-bg:   #E1F5EE;
    --teal-mid:  #5DCAA5;
    --blue:      #185FA5;
    --blue-bg:   #E6F1FB;
    --amber:     #854F0B;
    --amber-bg:  #FAEEDA;
    --amber-mid: #FAC775;
    --purple:    #534AB7;
    --purple-bg: #EEEDFE;
    --font:      'Bricolage Grotesque', 'Inter', sans-serif;
    --mono:      'JetBrains Mono', 'Fira Mono', monospace;
    --radius:    16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  .header {
    background: var(--text);
    color: var(--bg);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky; top: 0; z-index: 100;
  }
  .logo {
    font-size: 20px; font-weight: 700;
    letter-spacing: -0.5px;
    text-decoration: none; color: inherit;
  }
  .logo-sub {
    font-size: 13px; opacity: 0.5;
    font-weight: 400; letter-spacing: 0;
  }
  .header-space { flex: 1; }

  .lang-switcher {
    display: flex; gap: 2px;
    background: rgba(255,255,255,0.1);
    border-radius: 6px; padding: 2px;
  }
  .lang-btn {
    padding: 4px 10px; border: none;
    background: transparent;
    color: rgba(255,255,255,0.55);
    font-size: 11px; font-weight: 600;
    border-radius: 4px; cursor: pointer;
    font-family: var(--font); letter-spacing: 0.3px;
    transition: all 0.15s;
  }
  .lang-btn.active { background: rgba(255,255,255,0.2); color: #fff; }

  /* ── Hero ── */
  .hero {
    text-align: center;
    padding: 60px 24px 48px;
    max-width: 640px;
    margin: 0 auto;
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--teal-bg);
    border: 1px solid var(--teal-mid);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px; font-weight: 600;
    color: var(--teal); margin-bottom: 20px;
    letter-spacing: 0.3px;
  }
  .hero-title {
    font-size: clamp(28px, 6vw, 44px);
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1.15;
    margin-bottom: 16px;
    color: var(--text);
  }
  .hero-title span { color: var(--teal); }
  .hero-sub {
    font-size: 16px; color: var(--text2);
    line-height: 1.7; margin-bottom: 32px;
    max-width: 480px; margin-left: auto; margin-right: auto;
  }

  /* ── Confidence levels visual ── */
  .confidence-row {
    display: flex; gap: 8px;
    justify-content: center;
    margin-bottom: 48px;
    flex-wrap: wrap;
  }
  .conf-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.3px;
  }
  .conf-pill.high   { background: var(--teal-bg);   color: var(--teal);   border: 1px solid var(--teal-mid); }
  .conf-pill.medium { background: var(--blue-bg);   color: var(--blue);   border: 1px solid #85B7EB; }
  .conf-pill.low    { background: var(--amber-bg);  color: var(--amber);  border: 1px solid var(--amber-mid); }
  .conf-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .high   .conf-dot { background: var(--teal); }
  .medium .conf-dot { background: var(--blue); }
  .low    .conf-dot { background: var(--amber); }

  /* ── Mode cards ── */
  .modes {
    max-width: 1000px;
    margin: 0 auto;
    padding: 0 20px 80px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
  }

  .mode-card {
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    display: flex; flex-direction: column;
    transition: border-color 0.2s, transform 0.15s;
    cursor: pointer;
  }
  .mode-card:hover {
    transform: translateY(-2px);
  }
  .mode-card.mode-1:hover { border-color: var(--teal); }
  .mode-card.mode-2:hover { border-color: var(--blue); }
  .mode-card.mode-3:hover { border-color: var(--amber); }

  .mode-header {
    padding: 24px 24px 20px;
    border-bottom: 1px solid var(--border);
  }
  .mode-card.mode-1 .mode-header { background: var(--teal-bg); }
  .mode-card.mode-2 .mode-header { background: var(--blue-bg); }
  .mode-card.mode-3 .mode-header { background: var(--amber-bg); }

  .mode-num {
    font-size: 11px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    opacity: 0.55; margin-bottom: 6px;
  }
  .mode-name {
    font-size: 20px; font-weight: 700;
    letter-spacing: -0.3px; margin-bottom: 6px;
  }
  .mode-card.mode-1 .mode-name { color: var(--teal); }
  .mode-card.mode-2 .mode-name { color: var(--blue); }
  .mode-card.mode-3 .mode-name { color: var(--amber); }

  .mode-tagline {
    font-size: 13px; color: var(--text2);
    line-height: 1.5;
  }

  .mode-body { padding: 20px 24px; flex: 1; }

  .mode-features {
    list-style: none;
    display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 20px;
  }
  .mode-features li {
    display: flex; gap: 10px; align-items: flex-start;
    font-size: 13px; line-height: 1.5;
    color: var(--text2);
  }
  .feat-icon {
    width: 18px; height: 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; flex-shrink: 0; margin-top: 1px;
    font-weight: 700;
  }
  .mode-1 .feat-icon { background: var(--teal-bg);  color: var(--teal);  }
  .mode-2 .feat-icon { background: var(--blue-bg);  color: var(--blue);  }
  .mode-3 .feat-icon { background: var(--amber-bg); color: var(--amber); }

  .mode-guarantee {
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.2px;
    margin-bottom: 20px;
  }
  .mode-1 .mode-guarantee { background: var(--teal-bg); color: var(--teal); }
  .mode-2 .mode-guarantee { background: var(--blue-bg); color: var(--blue); }
  .mode-3 .mode-guarantee { background: var(--amber-bg); color: var(--amber); }

  .mode-footer {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    background: var(--bg2);
  }
  .btn-mode {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%;
    padding: 12px 16px;
    border: none; border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: var(--font);
    text-decoration: none;
    transition: opacity 0.15s;
  }
  .btn-mode:hover { opacity: 0.88; }
  .mode-1 .btn-mode { background: var(--teal); color: #fff; }
  .mode-2 .btn-mode { background: var(--blue); color: #fff; }
  .mode-3 .btn-mode { background: var(--amber); color: #fff; }
  .btn-arrow { font-size: 16px; }

  /* ── Philosophy strip ── */
  .philosophy {
    background: var(--text);
    color: var(--bg);
    padding: 48px 24px;
    text-align: center;
  }
  .philosophy-inner { max-width: 600px; margin: 0 auto; }
  .philosophy-quote {
    font-size: clamp(16px, 3vw, 22px);
    font-weight: 600; line-height: 1.5;
    margin-bottom: 12px;
    letter-spacing: -0.3px;
  }
  .philosophy-quote em { color: var(--teal-mid); font-style: normal; }
  .philosophy-sub {
    font-size: 13px; opacity: 0.5; line-height: 1.6;
  }

  /* ── Constitution table ── */
  .constitution {
    max-width: 640px; margin: 0 auto;
    padding: 48px 20px;
  }
  .section-label {
    font-size: 11px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    color: var(--text3); margin-bottom: 16px;
  }
  .const-table {
    width: 100%; border-collapse: collapse;
    font-size: 13px;
  }
  .const-table th {
    text-align: left; padding: 8px 12px;
    background: var(--bg2);
    font-size: 11px; font-weight: 600;
    color: var(--text3); letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  .const-table th:first-child { border-radius: 6px 0 0 6px; }
  .const-table th:last-child  { border-radius: 0 6px 6px 0; }
  .const-table td {
    padding: 12px; border-bottom: 1px solid var(--bg2);
    vertical-align: top; line-height: 1.5;
    color: var(--text2);
  }
  .const-table td:first-child { font-weight: 600; color: var(--text); }
  .yes { color: var(--teal); font-weight: 700; }
  .no  { color: var(--text3); }

  /* ── Footer ── */
  .footer {
    border-top: 1px solid var(--border);
    padding: 24px;
    text-align: center;
    font-size: 12px; color: var(--text3);
    line-height: 1.8;
  }
  .footer a { color: var(--text2); text-decoration: none; }
  .footer a:hover { color: var(--text); }

  /* ── Mobile ── */
  @media(max-width: 600px) {
    .hero { padding: 40px 20px 36px; }
    .modes { grid-template-columns: 1fr; }
    .confidence-row { gap: 6px; }
  }
</style>

// ── State ─────────────────────────────────────────────────────
const S = {
  lang: navigator.language.startsWith('de') ? 'de' :
        navigator.language.startsWith('pt') ? 'pt' : 'en',
};

function t(key) { return (I18N[S.lang] || I18N.en)[key] || key; }

// ── Apply I18N ────────────────────────────────────────────────
function applyI18N() {
  const L = I18N[S.lang] || I18N.en;

  // Lang buttons
  ['pt','de','en'].forEach(l =>
    document.getElementById('lb-'+l).classList.toggle('active', l === S.lang)
  );
  document.documentElement.lang = S.lang;

  // Hero
  document.getElementById('hero-badge').textContent = L.hero_badge;
  document.getElementById('hero-title').innerHTML =
    L.hero_title.replace(/\n/g, '<br>');
  document.getElementById('hero-sub').textContent = L.hero_sub;
  document.getElementById('conf-high-label').textContent   = L.conf_high;
  document.getElementById('conf-medium-label').textContent = L.conf_medium;
  document.getElementById('conf-low-label').textContent    = L.conf_low;

  // Static data-i18n elements
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    if (L[key] !== undefined) el.textContent = L[key];
  });

  // Mode features
  ['m1','m2','m3'].forEach(m => {
    const ul = document.getElementById(m+'-features');
    const cls = m === 'm1' ? 'mode-1' : m === 'm2' ? 'mode-2' : 'mode-3';
    ul.innerHTML = L[m+'_feats'].map(f =>
      `<li>
        <span class="feat-icon ${cls}">✓</span>
        <span>${f}</span>
      </li>`
    ).join('');
  });

  // Philosophy
  document.getElementById('phil-quote').innerHTML =
    L.phil_quote.replace(/"([^"]+)"/g, '<em>"$1"</em>');
  document.getElementById('phil-sub').textContent = L.phil_sub;

  // Constitution table
  const tbody = document.getElementById('const-tbody');
  tbody.innerHTML = L.rows.map(row =>
    `<tr>
      <td>${row[0]}</td>
      <td>${row[1]}</td>
      <td class="no">${row[2]}</td>
      <td class="${row[3].startsWith('S') || row[3].startsWith('J') || row[3].startsWith('Y') ? 'yes' : 'no'}">${row[3]}</td>
    </tr>`
  ).join('');

  // Footer
  document.getElementById('footer-text').textContent = L.footer_text;
}

function setLang(lang) {
  S.lang = lang;
  applyI18N();
}

// ── Init ──────────────────────────────────────────────────────
applyI18N();
</script>

<!-- PWA Install Banner -->
<div id="pwa-banner" style="
  display:none;
  position:fixed; bottom:0; left:0; right:0; z-index:9999;
  background:#2C2C2A; color:#F5F0E0;
  padding:16px 20px;
  align-items:center; gap:14px;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
  font-family: 'Bricolage Grotesque', 'Inter', sans-serif;
">
  <div style="width:42px; height:42px; border-radius:10px; background:#0F6E56; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:20px;">🐉</div>
  <div style="flex:1; min-width:0;">
    <div style="font-size:14px; font-weight:600; margin-bottom:2px;" id="pwa-title">Instalar WINDI Verify</div>
    <div style="font-size:12px; opacity:0.6; line-height:1.4;" id="pwa-sub">Acesso rápido · funciona offline</div>
  </div>
  <button id="pwa-install-btn" style="padding:9px 16px; background:#0F6E56; color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; white-space:nowrap; font-family:inherit;">Instalar</button>
  <button onclick="dismissBanner()" style="background:transparent; border:none; color:rgba(255,255,255,0.4); font-size:20px; cursor:pointer; padding:4px; line-height:1;">×</button>
</div>

<script>
(function() {
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/verify-public/web/sw.js', { scope: '/verify-public/' })
        .then(reg => {
          reg.addEventListener('updatefound', () => {
            const sw = reg.installing;
            sw.addEventListener('statechange', () => {
              if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                sw.postMessage({ type: 'SKIP_WAITING' });
              }
            });
          });
        }).catch(err => console.warn('SW registration failed:', err));
    });
  }
  const lang = navigator.language.startsWith('de') ? 'de' : navigator.language.startsWith('pt') ? 'pt' : 'en';
  const BANNER_I18N = {
    pt: { title: 'Instalar WINDI Verify', sub: 'Acesso rápido · funciona offline · câmera nativa', btn: 'Instalar' },
    de: { title: 'WINDI Verify installieren', sub: 'Schnellzugriff · offline verfügbar · native Kamera', btn: 'Installieren' },
    en: { title: 'Install WINDI Verify', sub: 'Quick access · works offline · native camera', btn: 'Install' },
  };
  const BL = BANNER_I18N[lang] || BANNER_I18N.en;
  let deferredPrompt = null;
  const banner = document.getElementById('pwa-banner');
  function showBanner() {
    if (!banner || localStorage.getItem('windi-pwa-dismissed')) return;
    document.getElementById('pwa-title').textContent = BL.title;
    document.getElementById('pwa-sub').textContent = BL.sub;
    const btn = document.getElementById('pwa-install-btn');
    if (btn) btn.textContent = BL.btn;
    banner.style.display = 'flex';
  }
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    setTimeout(showBanner, 3000);
  });
  const installBtn = document.getElementById('pwa-install-btn');
  if (installBtn) {
    installBtn.addEventListener('click', async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      const { outcome } = await deferredPrompt.userChoice;
      deferredPrompt = null;
      banner.style.display = 'none';
    });
  }
  window.dismissBanner = function() {
    if (banner) banner.style.display = 'none';
    localStorage.setItem('windi-pwa-dismissed', '1');
  };
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isInStandalone = window.navigator.standalone;
  if (isIOS && !isInStandalone && !localStorage.getItem('windi-pwa-dismissed')) {
    setTimeout(() => {
      if (!banner) return;
      document.getElementById('pwa-title').textContent = BL.title;
      document.getElementById('pwa-sub').textContent = lang === 'de' ? 'Tippe Teilen → "Zum Home-Bildschirm"' : lang === 'pt' ? 'Toca Partilhar → "Adicionar ao ecrã inicial"' : 'Tap Share → "Add to Home Screen"';
      const btn = document.getElementById('pwa-install-btn');
      if (btn) btn.style.display = 'none';
      banner.style.display = 'flex';
    }, 4000);
  }
  window.addEventListener('appinstalled', () => { if (banner) banner.style.display = 'none'; });
})();
</script>
