        fill="none" stroke="#185FA5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lower chevron (ghost) -->
  <path d="M32 66 L50 52 L68 66"
        fill="none" stroke="#185FA5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>
