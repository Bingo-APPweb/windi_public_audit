  <path d="M50 15 L83 28 L83 56 C83 74 65 85 50 89 C35 85 17 74 17 56 L17 28 Z"
        fill="none" stroke="#185FA5" stroke-width="1" stroke-linejoin="round" opacity="0.45"/>
