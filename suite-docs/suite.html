// ═══════════════════════════════════════════════════
// SHA-256 — Real content hash (browser crypto)
// ═══════════════════════════════════════════════════
async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,"0")).join("");
}

    try {

const relTime = (iso) => {
  if (!iso) return "";
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff/60000);
  if (m < 1) return "gerade eben";
  if (m < 60) return `vor ${m} Min.`;
  const h = Math.floor(m/60);
  if (h < 24) return `vor ${h} Std.`;
  const d = Math.floor(h/24);
  if (d < 7) return `vor ${d} Tag${d>1?"en":""}`;
  return new Date(iso).toLocaleDateString("de-DE");
};

function dl(data,name,mime) {
  const b=new Blob([data],{type:mime});
  const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download=name;
  document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(u);
}

    })();
  },[]);

  const openTemplate=(t)=>{
    setTpl(t);
    if(t.type==="doc"){setTitle(t.content.title);setBody(t.content.body);}
    else if(t.type==="xlsx"){setTitle(t.label);setXlsxRows(t.prefill&&t.prefill.length>0?t.prefill.map(r=>[...r]):Array.from({length:t.rows||5},()=>t.columns.map(()=>"")));}
    else if(t.type==="pptx"){setTitle(t.slides[0]?.title||t.label);setPptxSlides(t.slides.map(s=>({...s,items:s.items?[...s.items]:undefined})));}
    setView("editor");
    setTimeout(()=>edRef.current?.focus(),100);
  };

  // ── Generate, Download & SEAL in Forensic Ledger ──
  const generate=()=>{
    if(busy) return;
    setBusy(true);
    const id=mkId(), sge=mkSge(tpl.gov), isp="Bundesregierung \u00B7 BaFin \u00B7 DSGVO";

    setTimeout(async()=>{
      let r, contentForHash;
      const meta={id,sge,hash:"computing...",ts:ts(),gov:tpl.gov,isp};

      if(tpl.type==="doc"){
        r=genDoc(title||"Dokument",body,meta);
        contentForHash=r.data;
      } else if(tpl.type==="xlsx"){
        r=genXlsx(title||"Tabelle",tpl.columns,xlsxRows,meta);
        contentForHash=r.data;
      } else {
        r=genPptx(title||"Pr\u00E4sentation",pptxSlides,meta);
        contentForHash=r.data;
      }

      // ★ REAL SHA-256 of document content ★
      const contentHash = await sha256(contentForHash);
      const shortHash = "0x" + contentHash.substring(0, 16);

      // Update the hash in the generated file (replace placeholder)
      r.data = r.data.replace(/Hash: computing\.\.\./g, `Hash: ${shortHash}`);
      meta.hash = shortHash;

      dl(r.data,r.name,r.mime);

      const newDoc={
        id, name:title||tpl.label, type:tpl.type, gov:tpl.gov,
        sge, hash:shortHash, contentHash, templateId:tpl.id,
        filename:r.name, bytes:new Blob([r.data]).size,
        isp, createdAt:new Date().toISOString(), fromServer:false,
      };
      setDocs(p=>[newDoc,...p]);

      // ★ SEAL in Forensic Ledger ★
      const sealed=await Registry.register(newDoc);
      if(sealed){newDoc.fromServer=true;setLedgerOnline(true);}

      setBusy(false);
      setToast({id,name:title||tpl.label,sealed,hash:shortHash});
      setTimeout(()=>setToast(null),5000);

      const s=await Registry.stats();
      if(s) setStats(s);
    },400);
  };

  const greet=()=>{const h=new Date().getHours();return h<12?"Guten Morgen":h<18?"Guten Tag":"Guten Abend";};
  const tabItems=[{id:"doc",label:"Dokumente",icon:"\u{1F4C4}"},{id:"xlsx",label:"Tabellen",icon:"\u{1F4CA}"},{id:"pptx",label:"Pr\u00E4sentationen",icon:"\u{1F3AC}"}];
  const typeConf={doc:{l:"DOC",c:C.blue},xlsx:{l:"XLSX",c:C.green},pptx:{l:"PPTX",c:C.orange}};
  const govColor=(g)=>g==="HIGH"?C.red:g==="MEDIUM"?C.orange:C.green;

  return (
    <div style={{background:bg,color:txt,minHeight:"100vh",fontFamily:"Outfit, Segoe UI, sans-serif",transition:"all .3s"}}>
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@300;600;800&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400&display=swap');
        @keyframes fadeIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
        @keyframes slideUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
        @keyframes pulseG{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,0.4)}50%{box-shadow:0 0 0 6px rgba(52,211,153,0)}}
        *{box-sizing:border-box;margin:0}textarea:focus,input:focus{outline:none;border-color:${C.gold}!important}
        button:hover{opacity:.85}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:${C.gold}33;border-radius:3px}`}</style>

      {/* HEADER */}
      <div style={{background:n?"#08080D":"#fff",borderBottom:`1px solid ${bdr}`,padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={()=>{setView("gallery");setTpl(null);}}>
          <span style={{color:C.gold,fontSize:18,fontWeight:800,letterSpacing:3,fontFamily:"Bricolage Grotesque"}}>{"\u25C6"} WINDI</span>
          <span style={{color:mut,fontSize:11,letterSpacing:2}}>SUITE</span>
          <span style={{fontSize:9,color:C.gold,background:C.gold+"18",padding:"2px 8px",borderRadius:4,fontFamily:"JetBrains Mono"}}>v2.1</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{display:"flex",alignItems:"center",gap:5}} title={ledgerOnline?"Forensic Ledger verbunden":"Offline-Modus"}>
            <div style={{width:7,height:7,borderRadius:"50%",background:ledgerOnline===null?C.orange:ledgerOnline?C.green:C.red+"80",animation:ledgerOnline?"pulseG 2s infinite":"none"}}/>
            <span style={{fontSize:9,color:mut,fontFamily:"JetBrains Mono"}}>{ledgerOnline===null?"...":ledgerOnline?"LEDGER":"OFFLINE"}</span>
          </div>
          <button onClick={()=>setTheme(n?"klar":"noir")} style={{background:"transparent",border:`1px solid ${bdr}`,borderRadius:6,padding:"4px 12px",color:mut,fontSize:10,cursor:"pointer"}}>
            {n?"\u2600\uFE0F Klar":"\u{1F319} Noir"}
          </button>
        </div>
      </div>

      {/* TOAST */}
      {toast&&(
        <div style={{position:"fixed",top:60,right:20,background:card,border:`1px solid ${C.green}40`,borderRadius:10,padding:"14px 18px",zIndex:100,animation:"fadeIn .3s",boxShadow:"0 4px 20px rgba(0,0,0,.3)",maxWidth:340}}>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
            <span style={{fontSize:18}}>{"\u2705"}</span>
            <div>
              <div style={{fontSize:12,fontWeight:600}}>{toast.name} erstellt</div>
              <div style={{fontSize:10,color:mut,fontFamily:"JetBrains Mono"}}>{toast.id}</div>
            </div>
          </div>
          <div style={{fontSize:9,fontFamily:"JetBrains Mono",color:mut,borderTop:`1px solid ${bdr}`,paddingTop:6,marginTop:2}}>
            <div>SHA-256: {toast.hash}</div>
            <div style={{color:toast.sealed?C.green:C.orange,marginTop:2}}>
              {toast.sealed?"\u{1F512} Virtue Receipt im Forensic Ledger versiegelt":"\u26A0 Nur lokal — Ledger offline"}
            </div>
          </div>
        </div>
      )}

      {view==="gallery"?(
        <div style={{maxWidth:900,margin:"0 auto",padding:"30px 20px"}}>
          <h1 style={{fontSize:24,fontWeight:300,fontFamily:"Bricolage Grotesque",marginBottom:8}}>
            {greet()}. <span style={{color:mut}}>Was m\u00F6chten Sie erstellen?</span>
          </h1>

          {/* Stats bar */}
          {stats&&stats.total_documents>0&&(
            <div style={{display:"flex",gap:16,marginBottom:24,flexWrap:"wrap",animation:"slideUp .4s"}}>
              {[
                {label:"Receipts",val:stats.total_documents,c:C.gold},
                ...(stats.by_type?Object.entries(stats.by_type).map(([k,v])=>({label:typeConf[k]?.l||k.toUpperCase(),val:v,c:typeConf[k]?.c||C.gold})):[]),
                ...(stats.by_governance_level?Object.entries(stats.by_governance_level).map(([k,v])=>({label:k,val:v,c:govColor(k)})):[]),
              ].map((s,i)=>(
                <div key={i} style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:16,fontWeight:700,color:s.c,fontFamily:"JetBrains Mono"}}>{s.val}</span>
                  <span style={{fontSize:10,color:mut}}>{s.label}</span>
                </div>
              ))}
            </div>
          )}

          {/* Tabs */}
          <div style={{display:"flex",gap:2,marginBottom:24,borderBottom:`1px solid ${bdr}`}}>
            {tabItems.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"10px 20px",background:"transparent",border:"none",borderBottom:tab===t.id?`2px solid ${C.gold}`:"2px solid transparent",color:tab===t.id?C.gold:mut,fontSize:13,fontWeight:tab===t.id?600:400,cursor:"pointer",display:"flex",alignItems:"center",gap:6}}>
                {t.icon} {t.label}
              </button>
            ))}
          </div>

          {/* Template Cards */}
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(200px, 1fr))",gap:14}}>
            {TEMPLATES[tab].map(t=>(
              <div key={t.id} onClick={()=>openTemplate(t)}
                style={{background:card,border:`1px solid ${bdr}`,borderRadius:12,padding:22,cursor:"pointer",transition:"all .25s"}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor=C.gold;e.currentTarget.style.transform="translateY(-3px)";}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor=bdr;e.currentTarget.style.transform="none";}}>
                <div style={{fontSize:32,marginBottom:12}}>{t.icon}</div>
                <div style={{fontWeight:600,fontSize:15}}>{t.label}</div>
                <div style={{fontSize:11,color:mut,marginTop:4}}>{t.sub}</div>
                <div style={{marginTop:8}}>
                  <span style={{fontSize:9,fontFamily:"JetBrains Mono",color:govColor(t.gov),background:govColor(t.gov)+"15",padding:"2px 6px",borderRadius:3}}>{t.gov}</span>
                </div>
              </div>
            ))}
          </div>

          {/* ★ VIRTUE RECEIPTS — Forensic Ledger ★ */}
          {loading?(
            <div style={{marginTop:36,textAlign:"center",padding:24}}>
              <div style={{fontSize:24,color:C.gold,animation:"p 1.5s infinite"}}>{"\u25C6"}</div>
              <div style={{fontSize:11,color:mut,marginTop:8}}>Lade Forensic Ledger...</div>
            </div>
          ):docs.length>0?(
            <div style={{marginTop:36,animation:"slideUp .4s"}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
                <h3 style={{fontSize:11,color:mut,letterSpacing:2}}>
                  VIRTUE RECEIPTS
                  {ledgerOnline&&<span style={{color:C.green,marginLeft:8,letterSpacing:0}}>{"\u25CF"} persistent</span>}
                </h3>
                <span style={{fontSize:9,color:mut,fontFamily:"JetBrains Mono"}}>{docs.length} Eintr{docs.length!==1?"\u00E4ge":"ag"}</span>
              </div>
              <div style={{background:card,border:`1px solid ${bdr}`,borderRadius:10,overflow:"hidden"}}>
                {docs.slice(0,20).map((d,i)=>(
                  <div key={d.id} style={{padding:"12px 16px",borderBottom:i<Math.min(docs.length,20)-1?`1px solid ${bdr}`:"none",display:"flex",alignItems:"center",gap:10,fontSize:12,animation:`slideUp ${0.1+i*0.04}s`}}>
                    <span style={{background:typeConf[d.type]?.c+"18",color:typeConf[d.type]?.c,padding:"3px 8px",borderRadius:4,fontSize:9,fontWeight:700,fontFamily:"JetBrains Mono",minWidth:40,textAlign:"center"}}>{typeConf[d.type]?.l||"?"}</span>
                    <span style={{fontFamily:"JetBrains Mono",fontSize:8,color:C.gold,minWidth:110}}>{d.id}</span>
                    <span style={{flex:1,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.name}</span>
                    <span style={{fontSize:8,fontFamily:"JetBrains Mono",color:govColor(d.gov),background:govColor(d.gov)+"12",padding:"2px 6px",borderRadius:3}}>{d.gov}</span>
                    <span style={{fontFamily:"JetBrains Mono",fontSize:8,color:mut,minWidth:48,textAlign:"right"}}>SGE {d.sge}</span>
                    {d.hash&&<span style={{fontFamily:"JetBrains Mono",fontSize:7,color:mut+"99",minWidth:60}} title={`SHA-256: ${d.hash}`}>{d.hash.substring(0,10)}...</span>}
                    <span style={{fontSize:9,color:mut,minWidth:70,textAlign:"right"}}>{d.createdAt?relTime(d.createdAt):""}</span>
                    <span style={{color:C.green,fontSize:9,display:"flex",alignItems:"center",gap:2}}>
                      {"\u{1F512}"}
                      {d.fromServer&&<span title="Im Forensic Ledger" style={{color:C.gold,fontSize:8}}>{"\u25C6"}</span>}
                    </span>
                  </div>
                ))}
              </div>
              {docs.length>20&&<div style={{textAlign:"center",padding:10,fontSize:10,color:mut}}>+ {docs.length-20} weitere Receipts im Ledger</div>}
            </div>
          ):(
            <div style={{marginTop:48,textAlign:"center",padding:32}}>
              <div style={{fontSize:40,marginBottom:12,opacity:0.3}}>{"\u25C6"}</div>
              <div style={{fontSize:13,color:mut}}>Noch keine Dokumente erstellt.</div>
              <div style={{fontSize:11,color:mut,marginTop:4}}>Wählen Sie oben eine Vorlage, um zu beginnen.</div>
            </div>
          )}
        </div>
      ):(
        /* EDITOR VIEW */
        <div style={{maxWidth:860,margin:"0 auto",padding:"20px"}}>
          <button onClick={()=>{setView("gallery");setTpl(null);}} style={{background:"transparent",border:"none",color:C.gold,fontSize:12,cursor:"pointer",marginBottom:16,padding:0}}>{"\u2190"} Vorlagen</button>
          <div style={{background:card,border:`1px solid ${bdr}`,borderRadius:12,overflow:"hidden"}}>
            <div style={{padding:"16px 22px",borderBottom:`1px solid ${bdr}`,display:"flex",alignItems:"center",gap:12}}>
              <span style={{fontSize:22}}>{tpl.icon}</span>
              {tpl.type==="doc"?(
                <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Titel eingeben..." style={{flex:1,background:"transparent",border:"none",fontSize:18,fontWeight:600,color:txt,fontFamily:"Bricolage Grotesque"}}/>
              ):(
                <div><div style={{fontSize:16,fontWeight:600}}>{tpl.label}</div><div style={{fontSize:11,color:mut}}>{tpl.sub}</div></div>
              )}
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:9,fontFamily:"JetBrains Mono",color:govColor(tpl.gov),background:govColor(tpl.gov)+"15",padding:"3px 8px",borderRadius:4}}>{tpl.gov}</span>
                <button onClick={generate} disabled={busy} style={{background:busy?C.gold+"66":C.gold,color:"#000",border:"none",borderRadius:8,padding:"10px 24px",fontSize:13,fontWeight:700,cursor:busy?"wait":"pointer",whiteSpace:"nowrap"}}>
                  {busy?"\u23F3 Versiegelt...":"\u2B07\uFE0F Herunterladen"}
                </button>
              </div>
            </div>
            <div>
              {tpl.type==="doc"&&(
                <textarea ref={edRef} value={body} onChange={e=>setBody(e.target.value)} placeholder="Beginnen Sie zu schreiben..."
                  style={{width:"100%",minHeight:500,background:n?"#0d0d14":"#FAFAF8",border:"none",padding:"22px 28px",color:txt,fontSize:13,fontFamily:"Calibri, Outfit, sans-serif",lineHeight:1.9,resize:"vertical"}}/>
              )}
              {tpl.type==="xlsx"&&(
                <div style={{overflowX:"auto"}}>
                  <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
                    <thead><tr>
                      {tpl.columns.map((col,j)=><th key={j} style={{padding:"10px 12px",borderBottom:`2px solid ${C.gold}`,textAlign:"left",fontWeight:600,fontSize:11,color:C.gold,background:n?"#0d0d14":"#f5f5f0",whiteSpace:"nowrap"}}>{col}</th>)}
                      <th style={{width:40,background:n?"#0d0d14":"#f5f5f0"}}></th>
                    </tr></thead>
                    <tbody>
                      {xlsxRows.map((row,i)=><tr key={i}>
                        {row.map((cell,j)=><td key={j} style={{padding:0,borderBottom:`1px solid ${bdr}`}}>
                          <input value={cell} onChange={e=>{const nr=xlsxRows.map(r=>[...r]);nr[i][j]=e.target.value;setXlsxRows(nr);}}
                            style={{width:"100%",background:"transparent",border:"none",padding:"8px 12px",color:txt,fontSize:12,fontFamily:"inherit"}}/>
                        </td>)}
                        <td style={{borderBottom:`1px solid ${bdr}`,textAlign:"center"}}>
                          <button onClick={()=>setXlsxRows(p=>p.filter((_,idx)=>idx!==i))} style={{background:"transparent",border:"none",color:mut,cursor:"pointer",fontSize:14}}>{"\u00D7"}</button>
                        </td>
                      </tr>)}
                    </tbody>
                  </table>
                  <button onClick={()=>setXlsxRows(p=>[...p,tpl.columns.map(()=>"")])} style={{width:"100%",padding:10,background:"transparent",border:"none",borderTop:`1px solid ${bdr}`,color:C.gold,fontSize:12,cursor:"pointer"}}>+ Zeile hinzuf\u00FCgen</button>
                </div>
              )}
              {tpl.type==="pptx"&&(
                <div style={{padding:22}}>
                  {pptxSlides.map((slide,i)=>(
                    <div key={i} style={{background:n?"#0d0d14":"#f5f5f0",border:`1px solid ${bdr}`,borderRadius:8,padding:18,marginBottom:12}}>
                      <div style={{fontSize:10,color:mut,marginBottom:8}}>Folie {i+1} \u2014 {slide.type==="title"?"Titelfolie":slide.type==="risks"?"Risiken":slide.type==="actions"?"Ma\u00DFnahmen":slide.type==="dashboard"?"Dashboard":"Inhalt"}</div>
                      {slide.type==="title"&&<>
                        <input value={slide.title} onChange={e=>{const ns=[...pptxSlides];ns[i]={...ns[i],title:e.target.value};setPptxSlides(ns);}} placeholder="Titel..." style={{width:"100%",background:"transparent",border:`1px solid ${bdr}`,borderRadius:5,padding:"8px 12px",color:txt,fontSize:16,fontWeight:600,marginBottom:8,fontFamily:"inherit"}}/>
                        <input value={slide.subtitle||""} onChange={e=>{const ns=[...pptxSlides];ns[i]={...ns[i],subtitle:e.target.value};setPptxSlides(ns);}} placeholder="Untertitel..." style={{width:"100%",background:"transparent",border:`1px solid ${bdr}`,borderRadius:5,padding:"8px 12px",color:txt,fontSize:13,fontFamily:"inherit"}}/>
                      </>}
                      {slide.type==="content"&&<>
                        <input value={slide.heading} onChange={e=>{const ns=[...pptxSlides];ns[i]={...ns[i],heading:e.target.value};setPptxSlides(ns);}} style={{width:"100%",background:"transparent",border:`1px solid ${bdr}`,borderRadius:5,padding:"8px 12px",color:txt,fontSize:14,fontWeight:600,marginBottom:8,fontFamily:"inherit"}}/>
                        <textarea value={slide.body} onChange={e=>{const ns=[...pptxSlides];ns[i]={...ns[i],body:e.target.value};setPptxSlides(ns);}} rows={4} style={{width:"100%",background:"transparent",border:`1px solid ${bdr}`,borderRadius:5,padding:"8px 12px",color:txt,fontSize:13,fontFamily:"inherit",resize:"vertical",lineHeight:1.7}}/>
                      </>}
                      {(slide.type==="risks"||slide.type==="actions")&&<>
                        <input value={slide.heading} onChange={e=>{const ns=[...pptxSlides];ns[i]={...ns[i],heading:e.target.value};setPptxSlides(ns);}} style={{width:"100%",background:"transparent",border:`1px solid ${bdr}`,borderRadius:5,padding:"8px 12px",color:txt,fontSize:14,fontWeight:600,marginBottom:8,fontFamily:"inherit"}}/>
                        {slide.items.map((item,j)=>(
                          <div key={j} style={{display:"flex",gap:6,marginBottom:4}}>
                            <span style={{color:slide.type==="risks"?C.red:C.green,fontWeight:600,minWidth:24,paddingTop:8}}>{slide.type==="risks"?`R${j+1}`:`${j+1}.`}</span>
                            <input value={item} onChange={e=>{const ns=pptxSlides.map((s,si)=>si===i?{...s,items:s.items.map((it,ji)=>ji===j?e.target.value:it)}:s);setPptxSlides(ns);}}
                              style={{flex:1,background:"transparent",border:`1px solid ${bdr}`,borderRadius:5,padding:"6px 10px",color:txt,fontSize:12,fontFamily:"inherit"}}/>
                          </div>
                        ))}
                        <button onClick={()=>{const ns=pptxSlides.map((s,si)=>si===i?{...s,items:[...s.items,""]}:s);setPptxSlides(ns);}} style={{background:"transparent",border:"none",color:C.gold,fontSize:11,cursor:"pointer",marginTop:4}}>+ Eintrag</button>
                      </>}
                      {slide.type==="dashboard"&&<div style={{fontSize:12,color:mut}}>Dashboard wird automatisch generiert.</div>}
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      )}

      {/* FOOTER */}
      <div style={{borderTop:`1px solid ${bdr}`,padding:"14px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",marginTop:30,fontSize:10,color:mut}}>
        <span><span style={{color:C.gold,fontWeight:600}}>{"\u25C6"} WINDI</span> Publishing House \u2014 Pre-AI Governance Layer</span>
        <span style={{fontFamily:"JetBrains Mono",fontSize:9}}>
          Suite v2.1 \u2014 Forensic Ledger
          {ledgerOnline&&<span style={{color:C.green,marginLeft:6}}>{"\u25CF"} Sealed</span>}
        </span>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
