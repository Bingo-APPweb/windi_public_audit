# ── INVESTOR RELATIONS (static HTML) ────────────────────
# Add this block BEFORE the catch-all "location / {" in /etc/nginx/sites-enabled/windi

location /investor-relations/ {
    alias /opt/windi/investor-relations/;
    index i9-stress-test.html;
    add_header Cache-Control "no-cache" always;
    add_header X-WINDI-Component "Investor-Relations-v1.0" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
}

# Then run:
#   sudo nginx -t && sudo systemctl reload nginx
