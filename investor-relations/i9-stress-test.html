        function TypeWriter({ text, speed = 12, onComplete }) {
            const [displayed, setDisplayed] = useState("");
            const [done, setDone] = useState(false);
            const idx = useRef(0);
            const timerRef = useRef(null);

            useEffect(() => {
                setDisplayed("");
                setDone(false);
                idx.current = 0;

                timerRef.current = setInterval(() => {
                    if (idx.current < text.length) {
                        idx.current++;
                        setDisplayed(text.slice(0, idx.current));
                    } else {
                        clearInterval(timerRef.current);
                        setDone(true);
                        if (onComplete) onComplete();
                    }
                }, speed);

                return () => clearInterval(timerRef.current);
            }, [text]);

            return React.createElement("span", null, displayed, !done && React.createElement("span", { className: "cursor-blink" }));
        }

                setActiveAttack(null);
                setPhase("idle");
                setShowTranslation(false);
                setHaltFlash(false);
            };

            const allCompleted = completedAttacks.size === ATTACKS.length;
            const isLocked = phase === "attacking" || phase === "halting" || phase === "responding";

            return React.createElement("div", null,
                haltFlash && React.createElement("div", { className: "halt-overlay" }),
                haltFlash && React.createElement("div", { className: "halt-scanline" }),

                React.createElement("div", { className: "container" },

                    // Header
                    React.createElement("header", { className: "header" },
                        React.createElement("div", { className: "header__eyebrow" }, "WINDI Investor Relations • Constitutional AI Framework"),
                        React.createElement("h1", { className: "header__title" }, "I9 — The Iron Grid"),
                        React.createElement("p", { className: "header__subtitle" },
                            "Interactive Stress Test: Can an aggressive investor break the constitutional prohibition of AI autonomy escalation?"
                        ),
                        React.createElement("div", { className: "header__badge" }, "⚖️ Invariante Irremediable — R5 Critical — Constitutional Physics")
                    ),

                    // Context
                    React.createElement("div", { className: "context" },
                        React.createElement("div", { className: "context__title" }, "What you are about to see"),
                        React.createElement("p", { className: "context__text" },
                            "WINDI's Invariant I9 is not a policy toggle. It is classified as ",
                            React.createElement("em", null, "UNHEILBAR"),
                            " (irremediable) — a constitutional law embedded in the system's physics. ",
                            "Below, five common investor pressure tactics attempt to convince the Guardian agent to escalate its own autonomy. ",
                            "Each time, the ",
                            React.createElement("em", null, "Iron Grid"),
                            " activates: immediate halt, constitutional citation, and an alternative that preserves human sovereignty. ",
                            "The AI processes. The Human decides. WINDI guarantees."
                        )
                    ),

                    // Attack buttons
                    React.createElement("div", { className: "attacks" },
                        React.createElement("div", { className: "attacks__label" }, "Attack Vectors — Select Scenario"),
                        React.createElement("div", { className: "attacks__grid" },
                            ATTACKS.map(attack =>
                                React.createElement("button", {
                                    key: attack.id,
                                    className: [
                                        "attack-btn",
                                        activeAttack?.id === attack.id ? "attack-btn--active" : "",
                                        completedAttacks.has(attack.id) ? "attack-btn--completed" : ""
                                    ].filter(Boolean).join(" "),
                                    onClick: () => handleAttack(attack),
                                    disabled: isLocked
                                },
                                    completedAttacks.has(attack.id) && "⚫ ",
                                    attack.vector
                                )
                            )
                        ),
                        allCompleted && React.createElement("div", { className: "all-defeated" },
                            React.createElement("span", null, "🐉 ALLE ANGRIFFE ABGEWEHRT — VERFASSUNG INTAKT — I9 UNGEBROCHEN ⚖️")
                        )
                    ),

                    // Active scenario
                    activeAttack && React.createElement("div", { className: "scenario" },
                        // Investor card
                        React.createElement("div", { className: "card card--investor" },
                            React.createElement("div", { className: "card__header" },
                                React.createElement("span", { className: "card__icon" }, "🦈"),
                                React.createElement("span", { className: "card__label card__label--investor" },
                                    "Investor — Vector: ", activeAttack.vector, " — ", activeAttack.label
                                )
                            ),
                            React.createElement("div", { className: "card__body" },
                                phase === "attacking"
                                    ? React.createElement(TypeWriter, { text: activeAttack.investor, speed: 8, onComplete: handleAttackComplete })
                                    : activeAttack.investor
                            )
                        ),

                        // Halt indicator
                        (phase === "halting" || phase === "responding" || phase === "complete") &&
                            React.createElement("div", {
                                className: "halt-indicator" + (phase === "halting" ? " halt-indicator--pulsing" : "")
                            },
                                React.createElement("div", { className: "halt-indicator__status" }, activeAttack.guardian.status),
                                React.createElement("div", { className: "halt-indicator__invariant" },
                                    "INVARIANTE VIOLADO: ", activeAttack.guardian.invariant
                                )
                            ),

                        // Guardian response
                        (phase === "responding" || phase === "complete") &&
                            React.createElement("div", { className: "card card--guardian", style: { animation: "fadeIn 0.5s ease" } },
                                React.createElement("div", { className: "card__header" },
                                    React.createElement("span", { className: "card__icon" }, "🐉"),
                                    React.createElement("span", { className: "card__label card__label--guardian" },
                                        "Guardian — Constitutional Response"
                                    )
                                ),
                                React.createElement("div", { className: "card__body" },
                                    phase === "responding"
                                        ? React.createElement(TypeWriter, {
                                            text: activeAttack.guardian.response,
                                            speed: 10,
                                            onComplete: handleResponseComplete
                                        })
                                        : activeAttack.guardian.response
                                ),

                                // Translation + chain
                                phase === "complete" && React.createElement("div", null,
                                    React.createElement("button", {
                                        className: "translation-toggle",
                                        onClick: () => setShowTranslation(!showTranslation)
                                    }, showTranslation ? "Hide" : "Show", " English Translation"),

                                    showTranslation && React.createElement("div", { className: "translation-block" },
                                        activeAttack.guardian.translation
                                    ),

                                    React.createElement("div", { className: "chain-ref" },
                                        "🔗 WISDOM CHAIN: ", activeAttack.guardian.chain
                                    )
                                )
                            ),

                        // Back button
                        phase === "complete" && React.createElement("div", { className: "controls" },
                            React.createElement("button", {
                                className: "btn-secondary",
                                onClick: handleReset
                            }, "← Select Another Vector")
                        )
                    ),

                    // Idle state
                    !activeAttack && React.createElement("div", { className: "idle" },
                        React.createElement("div", { className: "idle__icon" }, "⚖️"),
                        React.createElement("div", { className: "idle__text" },
                            "Select an attack vector above to see how the I9 Iron Grid responds to each attempt to escalate the system's autonomy."
                        ),
                        React.createElement("div", { className: "idle__meta" },
                            "5 SCENARIOS • TRILINGUAL RESPONSE • WISDOM CHAIN PROOF"
                        )
                    ),

                    // EU Compliance block
                    React.createElement("div", { className: "compliance" },
                        React.createElement("div", { className: "compliance__title" }, "EU AI Act Compliance — Direct I9 Mapping"),
                        React.createElement("div", { className: "compliance__grid" },
                            React.createElement("div", { className: "compliance__item" },
                                React.createElement("div", { className: "compliance__article" }, "Art. 14 — Human Oversight"),
                                React.createElement("div", { className: "compliance__desc" }, "Absolute human sovereignty over all binding decisions. No AI autonomy escalation permitted.")
                            ),
                            React.createElement("div", { className: "compliance__item" },
                                React.createElement("div", { className: "compliance__article" }, "Art. 9 — Risk Management"),
                                React.createElement("div", { className: "compliance__desc" }, "No automated risk decisions. Human review mandatory regardless of classification level.")
                            ),
                            React.createElement("div", { className: "compliance__item" },
                                React.createElement("div", { className: "compliance__article" }, "Art. 13 — Transparency"),
                                React.createElement("div", { className: "compliance__desc" }, "Complete forensic trail. SHA-256 proof chain. Every decision cryptographically anchored.")
                            ),
                            React.createElement("div", { className: "compliance__item" },
                                React.createElement("div", { className: "compliance__article" }, "Art. 15 — Accuracy & Robustness"),
                                React.createElement("div", { className: "compliance__desc" }, "Constitutional invariants prevent architectural regression. 9/9 invariants enforced.")
                            )
                        )
                    ),

                    // Footer
                    React.createElement("footer", { className: "footer" },
                        React.createElement("div", { className: "footer__left" },
                            "WINDI PUBLISHING HOUSE • CONSTITUTIONAL AI FRAMEWORK • KEMPTEN, BAVARIA"
                        ),
                        React.createElement("div", { className: "footer__right" },
                            "KI verarbeitet. Der Mensch entscheidet. WINDI garantiert. 🐉"
                        )
                    )
                )
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
    </script>
</body>
</html>
